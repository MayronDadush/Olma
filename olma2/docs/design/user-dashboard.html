    row.innerHTML = apps.map(function(a){

        (n ? '<span class="appbadge" aria-label="'+esc(t("apps.badge",{n:n}))+'">'+n+'</span>' : '')+
        '</span><b>'+esc(t("apps."+a.id))+'</b></button>';

  (function(){
    var row = $("#appsRow");
    if(!row) return;
    row.addEventListener("click", function(e){
      var b = e.target.closest(".appbtn");
      if(!b || b.getAttribute("aria-busy") === "true" || !LIVE) return;
      b.setAttribute("aria-busy","true");
      var fail = function(){ b.removeAttribute("aria-busy"); toast(t("apps.fail"), null, true); };
      fetch("/me/act", {
        method:"POST", credentials:"same-origin",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({action:"openApp", payload:{app:b.getAttribute("data-app")}})
      }).then(function(r){ return r.json().catch(function(){ return null; }); })
        .then(function(body){
          var url = body && body.ok && body.data && body.data.url;
          if(!url) return fail();
          /* Same tab: inside the installed app this keeps them in it, and the
             page they land on draws its own way back (".olmaback"). */
          b.removeAttribute("aria-busy");
          location.href = url;
        })
        .catch(fail);
    });
  })();
  /* A tap on either button is the outcome the invite experiment counts
     (domain/experiments.js). keepalive, because "send" leaves for WhatsApp in
     the same tap and the page may not live to see the answer. */
  function inviteShared(how){ API.send("inviteShared", {how:how}, null, true); }
  (function(){
    var send = $("#inviteSend");
    if(send) send.addEventListener("click", function(){ if(INVITE) inviteShared("send"); });
    var btn = $("#inviteCopy");
    if(!btn) return;
    btn.addEventListener("click", function(){
      if(!INVITE) return;
      inviteShared("copy");
      var text = INVITE.share;
      /* The old way, for a webview that refuses the clipboard API: a hidden
         field, selected and copied inside the same tap. */
      function legacy(){
        var ta = document.createElement("textarea");
        ta.value = text; ta.setAttribute("readonly", "");
        ta.style.cssText = "position:fixed;top:0;opacity:0";
        document.body.appendChild(ta); ta.select();
        var done = false;
        try{ done = document.execCommand("copy"); }catch(e){ done = false; }
        ta.remove();
        toast(done ? t("invite.copied") : t("invite.copyFail"), null, !done);
      }
      try{
        navigator.clipboard.writeText(text).then(function(){ toast(t("invite.copied")); }, legacy);
      }catch(e){ legacy(); }
    });
  })();
  function renderHome(){
    /* renderTasks can run before the meetings seed further down the script
       has been assigned, so an unassigned list counts as none */
    if(!$("#homeTasksN")) return;
    /* Counted off the same rows the tasks page draws: an appointment that is
       over, or one only Google needs to hold, is not "open" and never "late". */
    var shown = (open || []).filter(function(x){ return !leftToGoogle(x); });
    var nT = shown.length, nM = (MEETS || []).length;
    var due = shown.filter(function(x){ var b = bucketFor(x.d); return x.d && (b === "late" || b === "today"); });
    var dueNow = due.length;
    rollText($("#homeTasksN"), String(nT));
    rollText($("#homeMeetsN"), String(nM));
    homeZero($("#homeTasksN"), !nT, "addTask");
    homeZero($("#homeMeetsN"), !nM, "mtNew");

    $("#homeMeetsL").textContent = nM ? pl("home.meets", nM) : t("home.meetsStart");

    ts.textContent = !nT ? t("home.tasksStartSub") : dueNow ? t("home.tasksToday", {n:dueNow}) : t("home.tasksGo");

      : waiting.length ? t("home.meetsYou", {n:waiting.length}) : t("home.meetsGo");

  /* The meetings still waiting on an answer from you — one list, read by the
     heading and by the card, so the two numbers cannot disagree. */
  function homeWaiting(){
    return (MEETS || []).filter(function(m){
      return !m.settled && m.opts.some(function(o){ return !mtAns(m, 0, o.id); });
    });
  }
  /* The top of the home page. Somebody with nothing yet — a first visit —
     still gets the welcome, because "nothing today" means nothing to them;
     anybody with a list gets their day, as one line of counts. */
  function renderToday(due, anything){
    var waiting = homeWaiting();
    if(!anything){
      $("#toolsH").textContent = brandTag(myGender());
      $("#homeP").textContent = t("home.p");
      return;
    }
    $("#toolsH").textContent = t("home.todayH");
    var parts = [];
    if(due.length) parts.push(pl("home.due", due.length));
    if(waiting.length) parts.push(pl("home.waiting", waiting.length));

  /* An empty card names the control that starts one — the same button the
     tab's own empty state presses, so there is no second way to add a task. */
  function homeZero(numEl, zero, start){
    var card = numEl.closest(".homecard");
    card.classList.toggle("zero", zero);
    if(zero) card.dataset.start = start; else delete card.dataset.start;
  }
  function renderTools(){
    $("#toolsStack").innerHTML =
      chanGroup() +
      provGroup("accounts", "tools.accounts", "tools.accountsHint", 2) +
      (SHOW_WORK_TOOLS ? provGroup("work", "tools.work", null, 3) : "");

  /* ONE service changed, so exactly one cell is touched. Rebuilding the
     whole fold re-ran every other row's opening animation at once — three
     controls flashing because a fourth switch moved, all of them a beat
     behind the switch that caused it. */
  function refreshService(p, i, on){
    var cell = $('[data-ctl="' + p.id + ":" + i + '"]');
    /* Immediately, in both directions. It used to wait out the closing
       animation before touching the glyph strip, so turning something OFF
       dimmed its glyph half a second after the switch had already moved —
       two gestures where the person made one. */
    afterFold(p);
    if(!cell) return refreshFold(p.id);
    if(on){
      cell.classList.remove("shutting");
      cell.innerHTML = ctlFor(p, p.svc[i], i);
    } else if(cell.firstChild){
      cell.classList.add("shutting");
      setTimeout(function(){
        cell.classList.remove("shutting");
        cell.innerHTML = "";
      }, SW_MS);
    }
  }
  /* the parts of the card that describe the account as a whole */
  function afterFold(p){
    var sub2 = $('[data-prov="' + p.id + '"] .row-sub');
    if(sub2) sub2.textContent = p.needsReauth ? t("prov.reauth")
      : p.account + " · " + pl("svcOn", onCount(p));
    $$('[data-prov="' + p.id + '"] .glyphs span').forEach(function(el){
      var g = p.svc.some(function(x){ return x.k === el.dataset.cat && x.on; });
      el.classList.toggle("off", !g);
      el.title = t("cat." + el.dataset.cat) + (g ? "" : " · " + t("cat.off"));
    });
  }
  /* full redraw, for when the account itself changed rather than one row */
  function refreshFold(id){
    var p = prov(id), host = $('[data-pfold="' + id + '"] .foldpad');
    if(!p || !host) return;
    host.innerHTML = foldBody(p);
    var sub = $('[data-prov="' + id + '"] .row-sub');
    if(sub) sub.textContent = p.account + " · " + pl("svcOn", onCount(p));
    /* Toggle the classes on the glyphs that are already there — replacing
       the strip would restart them from nothing, and a CSS transition needs
       the same element on both sides of the change to have anything to
       animate between. */
    $$('[data-prov="' + id + '"] .glyphs span').forEach(function(el){
      var on = p.svc.some(function(x){ return x.k === el.dataset.cat && x.on; });
      el.classList.toggle("off", !on);
      el.title = t("cat." + el.dataset.cat) + (on ? "" : " · " + t("cat.off"));
    });
  }

  /* ───────── switches, chips, connect, navigation ───────── */
  document.addEventListener("click", function(e){
    var sw = e.target.closest(".switch");
    if(sw){
      var on = sw.getAttribute("aria-checked") !== "true";
      /* The old 480ms cut a 620ms animation off part-way, which is what made
         the knob snap back mid-travel. animationend would be the honest fix,
         but a pseudo-element's animation events do not reach the element in
         every engine (they do not here), so the duration is READ OUT of the
         stylesheet instead — one number, still impossible to drift. */
      sw.classList.remove("moving"); void sw.offsetWidth; sw.classList.add("moving");
      setTimeout(function(){ sw.classList.remove("moving"); }, SW_MS + 20);
      sw.setAttribute("aria-checked", on ? "true" : "false");
      if(sw.dataset.svc){
        var parts = sw.dataset.svc.split(":"), p = prov(parts[0]), si = +parts[1];
        /* Turning a service ON is a grant, and a grant happens at Google — so
           the switch cannot be the thing that decides it. It leaves for the
           consent screen and the answer arrives on the way back. Turning one
           OFF is ours to do, and waits for the server before the row moves;
           the switch has already flipped under the finger, so a refusal has to
           put it back. */
        if(LIVE){
          if(parts[0] !== "google"){
            sw.setAttribute("aria-checked", on ? "false" : "true");
            toast(t("toast.provSoon", {name:p.name}));
            return;
          }
          var key = p.svc[si].k, want = {};
          if(on){
            if(key === "cal") want.calendarAccess = "read_write";
            else if(key === "contacts") want.contacts = true;
            API.send("startGoogle", want, function(data){
              if(data && data.url){ window.location.href = data.url; return; }
              sw.setAttribute("aria-checked", "false");
              if(!data) toast(t("toast.provFailed"));
            });
            return;
          }
          API.send("stopGoogleService", {service:key}, function(data){
            if(!data){ sw.setAttribute("aria-checked", "true"); return; }
            p.svc[si].on = false;
            refreshService(p, si, false);
            toast(t("toast.off"));
          });
          return;
        }
        p.svc[si].on = on;
        /* Redrawing straight away would delete the control mid-thought.
           Turning OFF plays the closing half first and redraws after it;
           turning ON redraws now so the opening half has something to run
           on. Either way the movement belongs to the switch that caused it. */
        refreshService(p, si, on);
        toast(t(on ? "toast.on" : "toast.off"));
      }
      if(sw.dataset.f){
        var f = FRIENDS.filter(function(x){ return x.id === +sw.dataset.f; })[0];
        f.p[sw.dataset.p] = on;
        API.setFriendPermission(f.id, sw.dataset.p, on);
        $('[data-fs="' + f.id + '"]').textContent = permsLine(f);
        var pact = PERMACT[sw.dataset.p];
        if(pact) refreshPermAction(pact.attr, f.id, on);
      }
      if(sw.id === "holidaySwitch" || sw.id === "digestSwitch" || sw.id === "taskCalSwitch"){ meSwitch(sw, on); return; }
      if(sw.id === "sRemind"){ $("#sRemindFold").classList.toggle("open", on); commit(); }
      if(sw.id === "sAllDay" || sw.id === "sCal") commit();
      return;
    }

    var md = e.target.closest("[data-mode]");
    if(md){
      var mp = md.dataset.mode.split(":");
      /* Read-only and read-and-write are two different Google grants, so this
         is the same round trip as connecting — not a setting we hold. The
         chip is deliberately NOT moved first: it would be claiming a
         permission nobody has agreed to yet, and the reload after consent is
         what moves it. */
      if(LIVE){
        var mprov = prov(mp[0]);
        if(mp[0] !== "google" || mprov.svc[+mp[1]].k !== "cal"){
          toast(t("toast.provSoon", {name:mprov.name}));
          return;
        }
        API.send("startGoogle", {calendarAccess: mp[2] === "write" ? "read_write" : "read_only"},
          function(data){
            if(data && data.url){ window.location.href = data.url; return; }
            if(!data) toast(t("toast.provFailed"));
          });
        return;
      }
      prov(mp[0]).svc[+mp[1]].mode = mp[2];
      $$("button", md.parentNode).forEach(function(b){ b.setAttribute("aria-pressed", b === md ? "true" : "false"); });
      /* the mark is the sentence now: write means read AND write */
      md.parentNode.classList.toggle("both", mp[2] === "write");
      API.setServiceMode(mp[0], +mp[1], mp[2]);
      toast(t(mp[2] === "write" ? "toast.rw" : "toast.ro", {name:svcLabel(prov(mp[0]).svc[+mp[1]])}));
      return;
    }

    var chip = e.target.closest(".chip");
    if(chip){
      /* A listener closer to the target (mtWhenChips, mtPerDayList, …) may
         already have handled this click and redrawn its container via
         innerHTML — which detaches `chip` before the event reaches here.
         `chip.parentNode` is then null, and `(r||document)` in $$ would
         silently fall back to the WHOLE document, wiping aria-pressed off
         every chip on the page instead of the handful in this group. */
      if(!chip.isConnected) return;
      /* The reminder's offsets are a SET (owner, 2026-10-05): each chip
         toggles, and the last one lit stays lit — a reminder that is on is
         at least on time, and an empty set would be a switch saying on over
         nothing. */
      if(chip.dataset.remoff !== undefined && chip.closest("#sOffset")){
        var lit = $$("#sOffset .chip").filter(function(c){ return c.getAttribute("aria-pressed") === "true"; });
        var on = chip.getAttribute("aria-pressed") === "true";
        if(on && lit.length === 1) return;
        chip.setAttribute("aria-pressed", on ? "false" : "true");
        if(chip.closest("#sheet")) commit();
        return;
      }
      $$(".chip", chip.parentNode).forEach(function(c){ c.setAttribute("aria-pressed", c === chip ? "true" : "false"); });
      if(chip.closest("#sheet")) commit();
      return;
    }

    /* a live channel hands you to that app, in your own thread with Olma */
    var df = e.target.closest("[data-def]");
    if(df){
      if(df.getAttribute("aria-pressed") === "true") return;
      defaultChannel = df.dataset.def;
      $$("[data-def]").forEach(function(b){ b.setAttribute("aria-pressed", b === df ? "true" : "false"); });
      markDefaultCard();
      API.setDefaultChannel(defaultChannel);
      swapWord($("#defWord"), chanName(defaultChannel));
      toast(t("toast.default", {name:chanName(defaultChannel)}));
      return;
    }
    var ch = e.target.closest("[data-chan]");
    if(ch){
      var c = CHANNELS.filter(function(x){ return x.id === ch.dataset.chan; })[0];
      if(c.on){ toast(t("toast.open", {name:c.name})); }
      /* Switching a channel on is a real identity being linked to this account
         — a second row in user_channels — and there is no path here that does
         that. Flipping the tile locally would show somebody a connected
         iMessage they do not have, and then send every reminder to WhatsApp
         anyway. */
      else if(LIVE){ toast(t("toast.chanSoon", {name:c.name})); }
      else { c.on = true; renderTools(); toast(t("toast.chanOn", {name:c.name})); }
      return;
    }
    var cl = e.target.closest("[data-call]");
    if(cl){ (cl.dataset.call === "more" ? pressRequestMore : pressCall)(cl); return; }

    var head = e.target.closest("[data-prov]");
    if(head){
      var hid = head.dataset.prov;

         row that opens as though a grant had happened. On a real page that is
         not a button that does nothing — it is a button that says it worked,
         which is the one thing this product does not do. So a live page never
         reaches it.

         Google goes to Google: the server hands back a consent URL and the
         browser leaves for it. Nothing is connected when we get there — the
         scopes are listed on Google's own screen and the tick only ever
         appears after the callback, on the reload. Everything else has no
         connection behind it yet and says exactly that. */
      if(LIVE){
        if(cid !== "google"){ toast(t("toast.provSoon", {name:prov(cid).name})); return; }
        cbtn.setAttribute("data-busy", "1");
        cbtn.textContent = t("connecting");
        /* Calendar and contacts — the only two services Olma connects. */
        API.send("startGoogle", {calendarAccess:"read_write", contacts:true}, function(data){
          if(data && data.url){ window.location.href = data.url; return; }
          /* the refusal toast, if there was one, has already been shown */
          cbtn.removeAttribute("data-busy");
          cbtn.textContent = t("connect");
          if(!data) toast(t("toast.provFailed"));
        });
        return;
      }
      cbtn.setAttribute("data-busy", "1");
      cbtn.textContent = t("connecting");
      /* the tick is the moment it worked; the row only opens after it */
      setTimeout(function(){
        cbtn.classList.add("ok");
        cbtn.removeAttribute("data-busy");
        cbtn.innerHTML = '<svg viewBox="0 0 20 20"><path d="M4 10.6 8 14.6 16 5.8"/></svg>';
        setTimeout(function(){ cbtn.classList.add("leaving"); }, 310);
      }, 310);
      setTimeout(function(){
        var p2 = prov(cid);
        p2.connected = true;
        expanded[cid] = false;
        renderTools();
        var rs = $('[data-rowset="' + cid + '"]');
        if(rs) rs.classList.add("arriving");
        /* opened on the next frame, so the fold animates rather than
           appearing already open the instant the row is replaced */
        requestAnimationFrame(function(){
          expanded[cid] = true;
          var fold = $('[data-pfold="' + cid + '"]'), hd = $('[data-prov="' + cid + '"]');
          if(fold) fold.classList.add("open");
          if(hd) hd.setAttribute("aria-expanded", "true");
        });
        toast(t("toast.connected", {name:p2.name}));
        /* and the little what-is-on strip arrives one glyph at a time */
        var gs = $('[data-prov="' + cid + '"] .glyphs');
        if(gs) gs.classList.add("fresh");
      }, 720);
      return;
    }

    var dbtn = e.target.closest("[data-disconnect]");
    if(dbtn){
      var did = dbtn.dataset.disconnect, dp = prov(did);
      /* Same rule as connecting, the other way round: the row must not go
         quiet until the account really is gone. Ending Google ends calendar
         and contacts together, because that is the one account this page
         draws — so this waits for the server before it redraws anything. */
      if(LIVE){
        if(did !== "google"){ toast(t("toast.provSoon", {name:dp.name})); return; }
        API.send("stopGoogle", {}, function(data){
          if(!data) return; /* refused, and already said so */
          $('[data-pfold="' + did + '"]').classList.remove("open");
          dp.connected = false;
          dp.account = "";
          dp.needsReauth = false;
          dp.svc.forEach(function(sv){ sv.on = false; });
          delete expanded[did];
          renderTools();
          toast(t("toast.disconnected", {name:dp.name}));
        });
        return;
      }
      $('[data-pfold="' + did + '"]').classList.remove("open");
      setTimeout(function(){
        dp.connected = false;
        delete expanded[did];
        renderTools();
        toast(t("toast.disconnected", {name:dp.name}));
      }, 150);
      return;
    }

    var nav = e.target.closest("[data-go]");
    if(nav){ go(nav.dataset.go); return; }
    /* `data-toast` used to be here: one attribute that answered a click with a
       sentence and nothing else. Its last user was the remove-connection
       button, which said the connection was gone while it was still there — so
       the attribute goes with it rather than waiting to be reached for again. A
       control that reports a change makes the change first. */
  });

  /* ───────── tasks ───────── */
  /* What sits beside the permissions is their birthday, and only for somebody
     who set one — it replaced the date the friendship started, which told the
     reader nothing they would act on (the owner, 2026-09-26). */
  /* The permissions are NAMED, not counted (2026-09-30): "3 הרשאות פעילות"
     sent you into the row to learn which three. */
  function permsLine(f){
    var bd = bdayLabel(f.bd);
    var on = PKEYS.filter(function(k){ return f.p[k]; });
    var words = on.length ? on.map(function(k){ return t("fr.w." + k); }).join(" · ") : t("fr.w.none");

    lockRow($("#sCalRow"), dated && !calTarget(), t("sheet.inCalNone"));
    /* ── repeat ── A repeat is a property of the REMINDER —
       task_reminders.repeat_rule is the only place the system stores one — so
       with no reminder there is nothing for "every week" to be attached to.
       That lock is applied in syncSheetSource below, together with the
       source's own limit on the same row, because two lockRow calls on one
       row leave only the last. */
    /* The nudge is offered on every task: with no date it is the three-day
       kind, so it no longer goes with the date (it did while it was "every
       day until the date"). */
    var chosen = $$("#sRepeat .chip").filter(function(c){ return c.getAttribute("aria-pressed") === "true"; })[0];
    var chosenRep = x.rep === "until" ? "until" : (chosen ? chosen.dataset.rep : "none");
    /* A nudge has its own rhythm, so the repeat row goes while it is chosen. */
    $("#sRepeatRow").hidden = chosenRep === "until" || !(chosenRep !== "none" || shown.rep || x.erep);
    /* A repeating EVENT shows its own rhythm here, read-only (syncSheetSource
       locks the row): the chips below are a reminder's repeat, and offering
       them on the event would be offering the wrong thing. */
    var repLab = $("#sRepeatRow .slab");
    /* On a repeating event this row is where the next one falls, since the
       rhythm itself is already drawn under "מתי". */
    repLab.textContent = t(x.erep ? "erep.nextLong" : "sheet.repeat");
    $("#sErepDots").innerHTML = erepDots(x);
    if(x.erep) sayText($("#sRepeatVal"), new Date(x.d + "T00:00:00").toLocaleDateString(loc(), {weekday:"long"}) + ", " + longDate(x.d));
    else sayText($("#sRepeatVal"), chosenRep === "until" ? nagText(x)
      : t("rep." + ({none:"once", day:"day", week:"week", month:"month"}[chosenRep] || "once")));
    /* ── reminder ── one sentence: who writes, where, and the part that is a
       choice. The fold under it asks one question or the other, never both:
       how long before a moment there is, or what hour when there is none. A
       chase asks neither — its hour is the one they already hear from Olma,
       and the fold says so instead of offering chips the server would
       ignore. */
    var chasing = chosenRep === "until";
    $("#sRemSay").hidden = !x.rem;
    $("#sRemOff").hidden = !!x.rem;
    $("#sRemInlVal").textContent = chasing ? nagText(x)
      : dated ? remOffs(x).map(function(o){ return t(OFFSET_KEY[o] || "off.at"); }).join(", ")
      : t("sheet.remAtShort", {time:x.remAt || remDefaultAt()});
    $("#sRemInl").setAttribute("aria-expanded", String($("#sRemindFold").classList.contains("open")));
    $("#sOffset").hidden = !dated || chasing;
    $("#sKindWrap").hidden = !x.rem;
    $$("#sKind .chip").forEach(function(c){ c.setAttribute("aria-pressed", (c.dataset.kind === "nag") === chasing ? "true" : "false"); });
    /* The kind card already says "נודניק": the inline choice after the
       channel would only say it again. */
    $("#sRemInl").hidden = chasing;
    $("#sChaseSub").hidden = !chasing;
    if(chasing) $("#sChaseSub").textContent = t({Cap:"sheet.nagCap", Near:"sheet.nagNear", Far:"sheet.nagFar"}[nagShape(x)]);
    /* A nudge's hour is the server's, like its shape — offering a clock under
       it would be offering a choice that is thrown away. */
    $("#sRemindAtSeg").hidden = dated || chasing;
    $("#sRemindAtVal").textContent = t("sheet.remindAtVal", {time:x.remAt || remDefaultAt()});
    /* ── category ── Olma's guess says so until the person overrules it — an
       automatic choice that looks hand-made is one nobody thinks to correct. */
    var ck = x.cat || "none";
    $("#sCatVal").textContent = t("tcat." + ck);
    $("#sCatDot").style.background = (TASKCATS.filter(function(c){ return c.k === ck; })[0] || TASKCATS[TASKCATS.length - 1]).c;
    $("#sCatAuto").hidden = !x.catAuto || ck === "none";
    $$("#sCat .chip").forEach(function(c){
      c.setAttribute("aria-pressed", c.dataset.cat === ck ? "true" : "false");
    });
    /* ── the rows that begin as tiles ── */
    $("#sListGroup").hidden = !(items || shown.list);
    $("#sShareGroup").hidden = !(who.length || shown.share);
    var tiles = {
      list:  !items && !shown.list && canEdit(x, "items"),
      rep:   chosenRep === "none" && !shown.rep && !x.erep && canEdit(x, "rep"),
      share: !who.length && !shown.share && canEdit(x, "who"),
      cal:   dated && !!calTarget() && !x.cal && !shown.cal
    }, n = 0;
    $$("#sAlsoTiles [data-also]").forEach(function(b){
      var on = !!tiles[b.dataset.also];
      b.hidden = !on;
      if(on) n++;
    });
    $("#sAlso").hidden = !n;
    /* four tiles are two rows of two, never three and one left alone */
    $("#sAlsoTiles").style.setProperty("--n", n === 4 ? 2 : Math.max(n, 1));
    syncSheetSource();
    paintDetailsSum();
  }
  /* What the folded rows hold, in one line, for a list opened on its items.
     Says the unset ones too ("no date", "no reminder") — a summary that only
     lists what is there cannot be told apart from one that forgot something.
     The category is not in it: its tag stays in view above. */
  function paintDetailsSum(){
    if(!editing) return;
    var parts = [], who = editing.who || [];
    parts.push(whenSay(editing));
    parts.push(t(editing.rem ? "sheet.sum.rem" : "sheet.sum.noRem"));
    if(who.length) parts.push(t("sheet.sum.with", {names:sharedNames(who)}));
    $("#sDetailsSub").textContent = parts.join(" · ");
  }
  /* Which calendar "add to calendar" actually writes to. The first connected
     provider whose calendar service is on and writable — the same one the
     agent would use — named out loud rather than left to be discovered after
     the event fails to appear. */
  function calTarget(){
    return PROV.filter(function(p){
      if(!p.connected) return false;
      return p.svc.some(function(sv){ return sv.k === "cal" && sv.on && sv.mode === "write"; });
    })[0] || null;
  }
  function calTargetName(){
    var p = calTarget();
    if(!p) return t("sheet.inCalNone");
    var sv = p.svc.filter(function(x){ return x.k === "cal"; })[0];
    return t("sheet.inCalTo", {name:t(sv.sub), account:p.account});
  }

  /* the category chips are built once from the closed set */
  function buildCatChips(){
    $("#sCat").innerHTML = TASKCATS.map(function(c){
      return '<button class="chip mini cat" aria-pressed="false" data-cat="' + c.k + '">' +
        '<i class="cdot" style="background:' + c.c + '"></i>' + esc(t("tcat." + c.k)) + "</button>";
    }).join("");
  }

  /* ── the list inside the editor ──
     Items are written straight onto the task rather than through commit():
     ticking something off is not editing a field, it is doing the thing. */
  function renderSheetList(freshIdx){
    if(!editing) return;
    var items = editing.items || [], n = items.length, dn = itemsDone(editing);
    $("#sList").innerHTML = items.map(function(it, i){
      return '<div class="litem' + (it.done ? " on" : "") + (i === freshIdx ? " fresh" : "") + '">' +
        '<button class="lbox" data-titem="' + i + '" aria-pressed="' + !!it.done +
        '" aria-label="' + esc(L(it.t)) + '"><svg><use href="#i-check"/></svg></button>' +
        '<span class="ltext"><i>' + esc(L(it.t)) + "</i></span>" +
        '<button class="lrm" data-ritem="' + i + '" aria-label="' + esc(t("sheet.itemRm")) +

    }).join("") +
      '<div class="scuehold"><div class="scue" id="listCue"><i></i></div></div>';
    paintCue($("#sList"), $("#listCue"));
    fitList();
    paintListMeta();
  }
  /* The subtitle and the little progress pill, separately from the rows —
     because ticking an item must NOT rebuild the rows. `.litem.on` carries a
     check that scales in and a strike that draws across the words, and every
     tick threw the row away and drew a new one already ticked, so the one
     animation on this list has never been seen. */
  function paintListMeta(){
    if(!editing) return;
    var n = (editing.items || []).length, dn = itemsDone(editing);
    $("#sListSub").textContent = n ? t("sheet.listSub.nN", {done:dn, n:n}) : t("sheet.listSub.n0");
    /* an empty list asks for its first thing; after that it is just "add" */
    $("#sAddItem").placeholder = t(n ? "sheet.addItem" : "sheet.firstItem");
    var pill = $("#sListCount");
    pill.hidden = !n;
    if(!n) return;
    pill.textContent = dn + "/" + n;
    pill.style.setProperty("--p", Math.round(dn / n * 100) + "%");
    var was = pill.classList.contains("full"), full = dn === n;
    pill.classList.toggle("full", full);
    /* …and the last one closing the list is worth a beat of its own. */
    if(full && !was){
      pill.classList.remove("pop");
      void pill.offsetWidth;
      pill.classList.add("pop");
    }
  }
  /* Items are rows of their own (tasks.parent_id), written through the same
     actions a task is: add with a parentId, tick is completeTask, un-tick is
     restoreTask, remove is archiveTask. On a task somebody shared with me
     too: the server writes them as the person who opened the list. */
  function itemWritable(){ return !!editing; }
  function addItem(){
    var el = $("#sAddItem"), v = el.value.trim();
    if(!v || !editing) return;
    if(!editing.items) editing.items = [];
    var item = {t:both(v), done:false};
    editing.items.push(item);
    el.value = "";
    renderSheetList(editing.items.length - 1);
    renderTasks();
    /* The first item is the moment a task becomes a list, and the sheet
       becomes the one a list opens on: the items on top, the rest behind
       "details". It happens under the finger that asked for it, so it is
       said out loud (owner, 2026-09-30). */
    var becameList = editing.items.length === 1 && !$("#sheet").classList.contains("listmode");
    if(becameList) enterListMode();
    /* An item on a task that has no name yet has nothing to hang off: the
       parent does not exist on the server, so this item cannot either. It is
       kept on screen and sent by commit() the moment the task is saved — and
       until then the sheet says what is missing instead of flashing "saved" at
       somebody whose list is about to be thrown away. */
    if(itemWritable() && !serverKnows(editing) && !adding[String(editing.id)]){
      toast(t("toast.needTitle"));
      $("#sTitle").focus();
      return;
    }
    if(becameList) toast(t("toast.nowList"));
    flashSaved();
    if(itemWritable()) sendItem(item);
  }
  function enterListMode(){
    $("#sheet").classList.add("listmode");
    $("#sheet").classList.remove("details");
    $("#sDetailsRow").setAttribute("aria-expanded", "false");
    $("#sListFold").classList.add("open");
    $("#sListRow").setAttribute("aria-expanded", "true");
    syncSheetRows();
    updateSheetCue();
  }
  /* One item, once it has a parent with a real id. */
  function sendItem(item){
    if(!editing || item.id || item.sending) return;
    var v = L(item.t);
    item.sending = true;
    whenSaved(editing, function(pid){
      API.send("addTask", {title:v, parentId:pid}, function(data){
        item.sending = false;
        if(data && data.task){ item.id = data.task.id; SERVER_IDS[String(data.task.id)] = true; }
      });
    });
  }
  $("#sAddItem").addEventListener("keydown", function(e){ if(e.key === "Enter"){ e.preventDefault(); addItem(); } });
  /* typed and then tapped away is still typed — the same promise the title
     field makes, so a half-added item is never silently thrown out */
  $("#sAddItem").addEventListener("blur", addItem);
  $("#sList").addEventListener("click", function(e){
    var tg = e.target.closest("[data-titem]");
    if(tg){
      var it = editing.items[+tg.dataset.titem];
      it.done = !it.done;
      tg.closest(".litem").classList.toggle("on", it.done);
      tg.setAttribute("aria-pressed", it.done ? "true" : "false");
      paintListMeta();
      renderTasks(); flashSaved();
      /* the whole list, not one item: said here, before the server answers,
         so the burst leaves the item the finger is still on */
      var full = it.done && editing.items.every(function(x){ return x.done; });
      if(full) confetti(tg, 26, 70);
      if(it.id && itemWritable()){
        var list = editing;
        API.send(it.done ? "completeTask" : "restoreTask", {taskId:it.id}, function(data){
          /* the last item ticked finishes the list itself (completeParentIfDrained):
             the list is in the archive now, and a re-read is what says so —
             a beat later, so the last tick and its confetti are seen, and
             only if that same sheet is still the one open */
          if(data && data.parentCompleted){
            setTimeout(function(){
              if(editing === list) closeSheets();
              API.reload();
            }, full && !REDUCED ? 650 : 0);
          }
        });
      }
      return;
    }
    var rm = e.target.closest("[data-ritem]");
    if(rm){
      var idx = +rm.dataset.ritem, gone = editing.items[idx];
      if(!gone || gone.leaving) return;
      gone.leaving = true;
      /* Spliced only once the row has finished folding: the indexes every
         other row is addressed by shift the moment the array does. */
      foldAway(rm.closest(".litem"), function(){
        if(!editing || !editing.items) return;
        var at = editing.items.indexOf(gone);
        if(at > -1) editing.items.splice(at, 1);
        if(gone.id && itemWritable()) API.send("archiveTask", {taskId:gone.id});
        if(!editing.items.length) delete editing.items;
        renderSheetList();
        renderTasks(); flashSaved();
      });
    }
  });

  /* ── who else has it ──
     Leaving and deleting are different things and the panel says so: the
     list of people, then what leaving actually does, then the action. */
  /* Adding and removing people is the OWNER's call. On a task somebody else
     opened, the only thing available is leaving it — which is exactly what the
     task_shares rows would allow, so the UI refuses what the server would
     refuse rather than drawing a button that comes back with an error. */
  /* Everybody on a task manages its guest list — adding and removing people
     is the last thing that was the opener's alone, and it stopped being that
     on 2026-09-19 ("כולם שווים גם כאן"). Kept as a named function rather than
     inlined `true`: this is a rule, and a rule that can change wants one
     place to change it. */
  function canManageShare(){
    return true;
  }
  function renderSheetShare(){
    if(!editing) return;
    var who = (editing.who || []).slice(), shared = who.length > 0, mine = canManageShare();
    $("#sShareSub").textContent = shared ? sharedLine(editing) : t("sheet.notShared");
    $("#sShareFaces").innerHTML = shared ? faceStack(who) : "";
    var rows = "";
    if(shared){
      rows = '<div class="sperson"><span class="face">' + avatarSVG(myAvatar, {g:myGender()}) + "</span>" +
        "<b>" + esc(t("share.you")) + "</b>" +
        (editing.owner === 0 ? "<u>" + esc(t("share.ownerMe")) + "</u>" : "") + "</div>";
      who.forEach(function(id){
        var f = friendById(id);
        if(!f) return;
        rows += '<div class="sperson"><span class="face">' + avatarSVG(f.av, {g:f.g}) + "</span>" +
          "<b>" + esc(L(f.n)) + "</b>" +
          (editing.owner === id ? "<u>" + esc(t(f.g === "f" ? "share.ownerF" : "share.ownerM")) + "</u>" : "") +
          /* taking somebody off happens where they are named */
          (mine ? '<button class="spx" data-off="' + f.id + '" aria-label="' + esc(t("share.remove")) +
            '" title="' + esc(t("share.remove")) + '"><svg><use href="#i-x"/></svg></button>' : "") +
          "</div>";
      });
    }
    $("#sSharePeople").innerHTML = rows;
    $("#sAddRow").hidden = !mine;
    $("#sAddCount").textContent = t("fr.count", {n:FRIENDS.length});
    if(!mine){
      $("#sAddFold").classList.remove("open");
      $("#sAddRow").setAttribute("aria-expanded", "false");
    }
    renderPeoplePick();
    /* only a task somebody else is on can be left, and leaving is not a
       thing you do to a task that is only yours */
    $("#sLeave").hidden = !shared;
    $("#sLeaveNote").hidden = !shared;
    paintDetailsSum();
  }
  /* Every friend is a chip and the pressed ones are on the task, so sharing
     and un-sharing are one gesture rather than two screens. */
  var PICK_SEARCH_AT = 12, pickQ = "";
  function renderPeoplePick(){
    var who = (editing && editing.who) || [];
    /* Search earns its place at twelve — three rows of faces is where the eye
       stops recognising and starts hunting. Below that a permanent field is
       one more thing to read for no tap saved. */
    var show = FRIENDS.length > PICK_SEARCH_AT;
    $("#pickSearch").hidden = !show;
    var q = show ? pickQ.trim().toLowerCase() : "";
    var list = !q ? FRIENDS : FRIENDS.filter(function(f){
      return searchText(f.n).toLowerCase().indexOf(q) > -1;
    });
    $("#pickEmpty").hidden = !!list.length;
    $("#pickEmpty").textContent = list.length ? "" : t("sheet.pickNone", {q:pickQ.trim()});
    $("#sPeople").innerHTML = list.map(function(f){
      var on = who.indexOf(f.id) > -1;
      return '<button class="pchip" aria-pressed="' + on + '" data-add="' + f.id + '">' +
        '<span class="face">' + avatarSVG(f.av, {g:f.g}) + "</span>" + esc(L(f.n)) + "</button>";
    }).join("");
  }
  /* One writer for both directions, because they are one question: is this
     person on the task. The last person leaving takes the sharing with them —
     no owner, no faces, nothing left to leave — so the task is an ordinary
     one again rather than a shared task that happens to have nobody in it. */
  function togglePerson(id){
    if(!editing) return;
    var f = friendById(id), name = L(editing.t) || t("sheet.untitled");
    if(!editing.who) editing.who = [];
    var i = editing.who.indexOf(id), removing = i > -1;
    if(removing){
      editing.who.splice(i, 1);
      API.unshareTask(editing.id, id);
      if(!editing.who.length){ delete editing.who; delete editing.owner; }
    } else {
      editing.who.push(id);
      /* the first person turns a private task into a shared one, and from then
         on it is clear who started it */
      if(editing.owner === undefined) editing.owner = 0;
      /* Only the person just added. Sending the whole list re-offered every
         share that already exists, and each of those came back a duplicate —
         one refusal toast and one full reload per face already on the task. */
      API.shareTask(editing, [id]);
    }
    renderSheetShare();
    renderTasks(); flashSaved();
    var left = (editing.who || []).length;
    toast(removing
      ? (left ? t("toast.tookOff", {who:f ? L(f.n) : ""}) : t("toast.unshared", {name:name}))
      : t("toast.shared", {name:name, who:sharedNames(editing.who)}));
  }
  $("#sPeople").addEventListener("click", function(e){
    var c = e.target.closest("[data-add]");
    if(c) togglePerson(+c.dataset.add);
  });
  $("#sSharePeople").addEventListener("click", function(e){
    var x = e.target.closest("[data-off]");
    if(x) togglePerson(+x.dataset.off);
  });
  $("#sAddRow").addEventListener("click", function(){
    var on = !$("#sAddFold").classList.contains("open");
    $("#sAddFold").classList.toggle("open", on);
    this.setAttribute("aria-expanded", on ? "true" : "false");
    if(on && !$("#pickSearch").hidden) setTimeout(function(){ $("#pickQ").focus(); }, 140);
    updateSheetCue();
  });
  $("#pickQ").addEventListener("input", function(){
    pickQ = this.value;
    $("#pickQClear").hidden = !pickQ;
    renderPeoplePick();
  });
  $("#pickQClear").addEventListener("click", function(){
    pickQ = ""; $("#pickQ").value = ""; this.hidden = true;
    renderPeoplePick(); $("#pickQ").focus();
  });
  function sharedNames(ids){
    var names = ids.map(function(id){ var f = friendById(id); return f ? L(f.n) : ""; }).filter(Boolean);
    if(names.length <= 2) return names.join(D.and);
    return names.slice(0, 2).join(D.and) + t("share.andMore", {n:names.length - 2});
  }
  $("#sListRow").addEventListener("click", function(){
    var on = !$("#sListFold").classList.contains("open");
    $("#sListFold").classList.toggle("open", on);
    this.setAttribute("aria-expanded", on ? "true" : "false");

  });
  $("#sDetailsRow").addEventListener("click", function(){
    var on = !$("#sheet").classList.contains("details");
    $("#sheet").classList.toggle("details", on);
    this.setAttribute("aria-expanded", on ? "true" : "false");
    fitListSoon();
    updateSheetCue();
  });
  $("#sShareRow").addEventListener("click", function(){
    var on = !$("#sShareFold").classList.contains("open");
    $("#sShareFold").classList.toggle("open", on);
    this.setAttribute("aria-expanded", on ? "true" : "false");
    updateSheetCue();
  });
  /* leaving is not deleting: the row goes from MY list and the task itself
     carries on with everyone else, which is what the toast says out loud */
  $("#sLeave").addEventListener("click", function(){
    var id = editing.id;
    closeSheets();
    leaveTaskRow(id);
  });
  /* The sheet's button and the swipe on a shared row are one act. */
  function leaveTaskRow(id){
    var x = taskById(id), name = (x && L(x.t)) || t("sheet.untitled");
    var wrap = $('.taskwrap[data-id="' + id + '"]');
    if(wrap) wrap.classList.add("gone");
    setTimeout(function(){
      var i = open.findIndex(function(o){ return o.id === id; });
      /* Into the archive, not into nothing. Leaving is the one action here
         that feels destructive, and it is the one the person is most likely
         to want back — so it is recoverable by exactly the same button as
         everything else that left the list. */
      if(i > -1){
        archived.unshift({id:id, t:open[i].t, task:open[i], left:true,
                          done:{he:T.he["tasks.leftAt"], en:T.en["tasks.leftAt"]}});
        open.splice(i, 1);
      }
      API.leaveTask(id);
      renderTasks(); renderStrip(selDay); toast(t("toast.left", {name:name}));
    }, 230);
  }

  /* `preset` is how a new task can arrive with somebody already on it — the
     shared-task button in Contacts is the only caller, and it hands over the
     one field it knows: who this is with. */
  var lastWhenKey = "";
  function openSheet(id, preset){
    var x = id ? open.filter(function(o){ return o.id === id; })[0] : null;
    isNew = !x;
    editing = x || {id:++seq, d:"", tm:"", all:false, t:both(""), rem:false, rep:"none",
                    remOffs:[0], remAt:"", cal:false, cat:"none"};
    if(!x && preset) Object.keys(preset).forEach(function(k){ editing[k] = preset[k]; });
    /* What "when" was when this sheet opened. commit() compares against it so
       a reminder is only rewritten when the moment it points at actually
       moved — every other keystroke leaves the existing row alone. */
    lastWhenKey = String(editing.d) + "|" + String(editing.tm) + "|" + String(editing.all);
    editingShown = !leftToGoogle(editing);
    pickQ = ""; $("#pickQ").value = ""; $("#pickQClear").hidden = true;
    $("#sAddFold").classList.remove("open");
    $("#sAddRow").setAttribute("aria-expanded", "false");
    $("#sTitle").value = x ? L(x.t) : "";
    $("#sTime").value = editing.tm || "";
    $("#sEnd").value = editing.tmEnd || "";
    $("#sDateRow").dataset.val = editing.d || "";
    /* A task other people are on is not one person's to delete — the server
       refuses it (archiveTask, reason `shared`) and the sheet offers "leave"
       instead, two rows further up, to the one who opened it as much as to
       everybody else. Only the last person left on a task sees delete. */
    $("#sDelete").hidden = isNew || (editing.who || []).length > 0;
    $("#sCal").setAttribute("aria-checked", editing.cal ? "true" : "false");

     of each one whether they can be there. The overlap is arithmetic: no
     negotiation round trip, no model, no guessing.

     meant something different on each press. The grid was compact and nobody
     found the second press, so an option is now a row that carries its own

     a list of one, a whole-day meeting stops needing an hours axis it has no

     which is the distinction the settle gate turns on.

  /* What taking this card off the list means (owner, 2026-09-23). Nobody

  function mtVerb(m){

  function mtNames(ids){ return nameList(ids.map(mtName)); }

       "תיאומים שנסגרו ושיצאת מהם", three days before they happen (the owner,

    var live = MEETS;

       already reduced to a title and the words of the slot. Capped at the same
       eight as the task archive, and it SAYS it is capped rather than quietly
       truncating, because an archive that silently drops the ninth row is a
       safety net with a hole nobody can see. */
    var arc = MTLEFT.map(function(m){ return {html:mtLeftHTML(m)}; });
    $("#mtArchive").hidden = !arc.length;

  $("#mtHowBtn").addEventListener("click", function(){

  /* Putting yourself back is a real call, not a row reappearing in a browser:
     the others were told you left, so they are told you are back. The server
     refuses what it should — a coordination that closed when you left cannot
     be reopened by one person — and the row only leaves the archive once the
     call has come back ok. */
  function mtRejoin(id){
    var i = MTLEFT.findIndex(function(x){ return x.id === id; });
    if(i < 0) return;
    var entry = MTLEFT[i];
    if(!LIVE){
      MTLEFT.splice(i, 1);
      renderMeets();
      toast(t("toast.mtBack", {name:L(entry.t)}));
      return;
    }
    API.call("rejoinMeeting", {meeting_id:id});
    API.send("rejoinMeeting", {meetingId:id}, function(data){
      if(!data) return;
      MTLEFT.splice(MTLEFT.findIndex(function(x){ return x.id === id; }), 1);
      renderMeets();
      toast(t("toast.mtBack", {name:L(entry.t)}));

         now — which only the server knows. */

  }
  function mtListClick(e){
    var back = e.target.closest("[data-mtback]");
    if(back){ mtRejoin(+back.dataset.mtback); return; }
    /* the two leave controls are checked first: both sit inside the row the
       open handler would otherwise claim */
    var go = e.target.closest("[data-mtleavego]");
    if(go){ var gm = mtById(+go.dataset.mtleavego); if(gm) mtLeave(gm); return; }
    if(e.target.closest("[data-mtleaveno]")){ mtLeaving = null; renderMeets(); return; }
    var b = e.target.closest("[data-mt]");
    if(b){ mtLeaving = null; openMeet(+b.dataset.mt); }
  }
  $("#mtList").addEventListener("click", mtListClick);
  $("#mtDone").addEventListener("click", mtListClick);
  /* Pressing the red asks first, in the card itself — it always has: leaving
     takes your answers off everybody's tally, and deleting tells the other
     person. The one thing worse than a list you cannot clear is a list that
     clears itself. */
  swipeList($("#mtList"), function(row){
    mtLeaving = +row.dataset.sw.slice(1);
    renderMeets();
  });

  /* ── the answer row ──
     Two buttons that say what they do, instead of one target that means a
     different thing on each press. A three-state tap is compact and nobody
     discovers the third state; pressing the button you are already on clears
     it, which is the same idea people already have about a selected chip. */
  /* Who is missing, named. "Not everyone can" and "not everyone has answered"
     are different sentences and the second is the commoner mistake, so the
     confirmation says which one it is and whose name is on it.

     I am counted but never named: I am the one reading the question, and
     "settle without you" is not a sentence anybody says. My own absence gets
     its own clause instead. */
  function mtGap(m, o){
    var no = [], wait = [], me = "";
    mtActive(m).forEach(function(pid){
      var a = mtAns(m, pid, o.id);
      if(a === "y") return;
      if(pid === 0){ me = a === "n" ? "no" : "wait"; return; }
      (a === "n" ? no : wait).push(mtName(pid));
    });
    return {no:no, wait:wait, me:me};
  }
  /* ── what she already knows about your day ──
     Somebody else picked these times and cannot see your calendar. Saying "I
     can" while a thing already sits there is not a decision anybody made — it
     is one nobody was shown. So the row says it, at the moment of answering,
     and says WHAT rather than just "you are busy": half the hits are things
     you would happily move, and you can only tell which by name. */
  function mtMins(hhmm){
    var a = String(hhmm || "").split(":");
    return a.length === 2 ? (+a[0]) * 60 + (+a[1]) : -1;
  }
  function mtPartOf(hhmm){
    var mm = mtMins(hhmm);
    if(mm < 0) return "";
    return mm < 720 ? "morning" : mm < 1020 ? "noon" : mm < 1320 ? "evening" : "night";
  }
  function mtClash(m, o){
    var evs = agendaFor(o.day).filter(function(e){ return e.meet !== m.id; });
    if(!evs.length) return null;
    /* a whole day collides with anything already in it */
    if(m.allDay) return evs[0];
    return evs.filter(function(e){
      if(e.allDay) return false;                 /* an all-day marker is not an hour */
      if(o.time && e.time) return Math.abs(mtMins(o.time) - mtMins(e.time)) < 90;
      return mtPartOf(e.time) === (o.part || mtPartOf(o.time));
    })[0] || null;
  }
  /* ── the ring ──
     Two arcs on one circle: the yeses from the top, the noes continuing from
     where they stop, and the remainder left as track. Silence is the gap, not
     a third arc — it is the absence of an opinion and drawing it as one reads
     as a vote against.

     `full` is nobody outstanding and nobody against; `min` is the
     coordination's own minimum met and NOT everybody. They are exclusive and
     in that order, because unanimity is also above any minimum and only one of
     them may claim the ring. */
  var RING_R = 17, RING_C = 2 * Math.PI * RING_R;
  function mtRingState(m, o){
    var total = mtActive(m).length;
    if(!total) return "";

    if(y === total) return "full";
    if(m.quorumMin && y >= m.quorumMin) return "min";
    return "";
  }
  function mtRingHTML(m, o){
    var total = Math.max(1, mtActive(m).length);
    var y = mtN(m, o, "y"), no = mtN(m, o, "n");
    var yLen = y / total * RING_C, nLen = no / total * RING_C;

      return len <= 0 ? "" : '<circle class="' + cls + '" cx="19" cy="19" r="' + RING_R +
        '" fill="none" stroke-width="3.5" stroke-dasharray="' + len.toFixed(1) + " " +
        (RING_C - len).toFixed(1) + '" stroke-dashoffset="' + (-offset).toFixed(1) + '"/>';
    };
    return '<div class="mtring ' + mtRingState(m, o) + '"><svg width="38" height="38" aria-hidden="true">' +
      '<circle class="track" cx="19" cy="19" r="' + RING_R + '" fill="none" stroke-width="3.5"/>' +
      arc("yes", yLen, 0) + arc("no", nLen, yLen) +
      "</svg><b>" + y + "/" + mtActive(m).length + "</b></div>";
  }
  /* day · when · date. Three fixed columns rather than a sentence, so four
     rows can be read down a column. The date is the one thing never abbreviated
     away: two Thursdays in one coordination is ordinary. */
  function mtFormulaHTML(m, o){
    var d = mtDate(o.day);
    var day = o.day === 0 ? t("cal.today") : o.day === 1 ? t("cal.tomorrow") : D.full[d.getDay()];
    var state = mtRingState(m, o);

      : state === "full" ? '<svg class="mk" viewBox="0 0 24 24"><use href="#m-crown"/></svg>'
        : state === "min" ? '<svg class="mk" viewBox="0 0 24 24"><use href="#m-cards"/></svg>' : "";
    return '<p class="mtformula"><span class="f-day">' + esc(day) + "</span>" +
      '<span class="f-sep">·</span><span class="f-when">' + esc(mtWhen(m, o)) + "</span>" +
      '<span class="f-dt"><span class="f-sep">·</span><span class="f-date">' +
      d.getDate() + "." + (d.getMonth() + 1) + "</span></span>" +
      mark + "</p>";
  }
  /* Whole or not at all (see `.mtformula.nodate`). Measured with the date in:

     before it is shown. */
  function mtFitDates(){
    $$("#mtOpts .mtformula").forEach(function(p){

  }
  window.addEventListener("resize", function(){ if(mtOpen) mtFitDates(); });
  /* The one line under the formula. It leads with whichever of the two marks

  function mtSumHTML(m, o){
    var total = mtActive(m).length;
    var y = mtN(m, o, "y"), no = mtN(m, o, "n"), wait = total - y - no;

    if(m.settled === o.id) return '<p class="mtsum">' + esc(t("mt.settledTag")) + "</p>";
    if(state === "full") bits.push('<span class="gold">' + esc(t("mt.allFree")) + "</span>");
    else if(state === "min") bits.push('<span class="grn">' + esc(t("mt.quorumMet")) + "</span>");
    else if(y) bits.push(esc(pl("mtY", y)));

    if(wait > 0) bits.push(esc(pl("mtW", wait)));

  /* Who said what, opened by a tap on the row. Only people who ANSWERED are

  function mtVotesHTML(m, o){
    var yes = [], nos = [], wait = [];
    mtActive(m).forEach(function(pid){
      var a = mtAns(m, pid, o.id);
      if(a === "y" || a === "n") (a === "y" ? yes : nos).push({n:mtName(pid), w:mtSaidOn(m, pid, o.id)});

    var grp = function(cls, label, people){

  function mtOptHTML(m, o){
    var isBest = !m.settled && mtBest(m) === o && m.opts.length > 1;
    var settled = m.settled === o.id;
    var mineAns = mtAns(m, 0, o.id);

    /* Your own answer is a two-state segment rather than two buttons that can
       both be off-looking: one of them is always pressed once you have said
       anything, and pressing the pressed one takes the answer back. */
    var act = settled ? ""
      : mtPickMode && (!LIVE || m.canSettle)
      ? '<button class="mtpick' + (mtSettling === o.id ? " arm" : "") + '" data-settle>' +

    var confirm = "";

    var counting = !settled && m.settleIn !== null && m.settleIn !== undefined
      && String(m.settlingOpt) === String(o.id);

      ? '<div class="mosettling"><svg><use href="#i-clock"/></svg><span>' +
        esc(m.settleIn > 0 ? t("mt.settlingIn", {n:m.settleIn}) : t("mt.settlingNow")) +

      : "";
    var clash = settled ? null : mtClash(m, o);
    var warn = clash
      ? '<div class="moclash"><svg><use href="#i-clock"/></svg><span>' +
        esc(t("mt.clash", {what:clash.title + (clash.time ? " · " + clash.time : "")})) +
        "</span></div>"
      : "";

       settle. The trash is not among them on a phone: it lives under the row,
       reached by the swipe, which is what leaves the width for two buttons
       that say what they do rather than two icons that hint. */
    var row = '<div class="mtopt' + (mtRingState(m, o) === "full" && !settled ? " crown" : "") + '">' +

      act +

        'aria-label="' + esc(t(mtArmedDel === o.id ? "mt.removeConfirm" : "mt.remove")) + '">' +

       coordination, which is a different action with a message behind it. */
    return '<div class="mtswipe' + (settled ? " locked" : "") + (isBest ? " best" : "") +

  function renderMeet(){
    var m = mtOpen;
    if(!m) return;
    /* The heading and the participant line live HERE, not in openMeet: written
       once at open they would keep the language they were opened in, and a
       language switch with the sheet up would leave a Hebrew subtitle under an
       English list. Anything a re-render must fix belongs in the re-render. */
    $("#mtTitle").textContent = L(m.t);
    /* Not rewritten under a finger, for the same reason as the place. */
    var ti = $("#mtTitleIn");
    if(document.activeElement !== ti) ti.value = L(m.t);

    $("#mtCat").setAttribute("aria-expanded", mtCatOpen ? "true" : "false");
    $("#mtCatPick").hidden = !mtCatOpen;
    $("#mtCatPick").innerHTML = mtCatOpen ? MEETCATS.map(function(c){
      return '<button class="chip mini cat" aria-pressed="' + (!!m.catChosen && m.cat === c.k) + '" data-mtcat="' + c.k + '">' +

      : m.opts.length === 1 ? "mt.askOne" : "mt.ask");

      var gone = mtGone(m, pid), said = mtAnswered(m, pid), words = mtSaid(m, pid);
      var f = pid === 0 ? null : friendById(pid);
      return '<span class="mtface' + (gone ? " gone" : said ? " said" : "") + '"' +
        (words ? ' title="' + esc(words) + '"' : "") + ">" +
        '<span class="face">' + avatarSVG(pid === 0 ? myAvatar : f.av, {g:pid === 0 ? myGender() : f.g}) + "</span>" +
        esc(mtName(pid)) +
        (gone ? " · " + t("mt.gone") : words ? ' · <span class="mtwords">' + esc(words) + "</span>" : said ? "" : " · " + t("mt.waiting")) +
        "</span>";
    }).join("");

    /* The coordination's own minimum, above the table it applies to. It is a
       statement about this coordination and not about any one time, which is
       why it sits over the list rather than on a row — and why it is drawn

    var mn = $("#mtMin");
    mn.hidden = !!m.settled;

        ? esc(t("mt.minSet")).replace("{n}", "<b>" + m.quorumMin + "</b>")
          .replace("{of}", String(mtActive(m).length))
        : esc(t("mt.minNone")));

      ? '<div class="group">' + m.opts.map(function(o){ return mtOptHTML(m, o); }).join("") + "</div>"

    pk.querySelector("span").textContent = t(mtPickMode ? "sheet.cancel" : "mt.pickMode");

       no more say over the table than anybody else in it. At the cap the
       button stays alive and the press asks what it replaces, which is why the

    $("#mtAddWrap").hidden = !!m.settled;
    $("#mtAddOptLbl").textContent = t("mt.addOpt");
    $("#mtAddNote").textContent = m.settled || m.opts.length < MEET_CAP ? ""

       the same day once there is one — without reopening, which would ask
       everybody again and take the event off the calendar (the owner's
       Padel Gang, 2026-10-03). A settled row with no moment at all is a
       text-only legacy one the server cannot move, so it gets no button.
       The place field is not rewritten while somebody is typing in it — a
       reload landing mid-word would take the word away. */

  function parseWhen(str){

     never shows an empty list, and it never invents contacts. */
  function contactsSource(){
    for(var i = 0; i < PROV.length; i++){
      var p = PROV[i];
      if(!p.connected) continue;
      for(var j = 0; j < p.svc.length; j++){

       sides, every contact matched a friend, and the list came back empty for
       anybody who had made a single connection — the one screen where that
       looks exactly like "you have no contacts". */
    var known = FRIENDS.map(nameOf).filter(Boolean);

       - coming back after a real absence reads the page again, once;
       - pulling the page down from the top reads it now (#ptr), because an

  var hiddenAt = 0, lastWriteAt = 0, DATA_SIG = "", sigAt = 0;

    if(Date.now() - lastWriteAt < NEWS_QUIET_MS) return;
    var seqAt = dataSeq;

      .then(function(r){ return r.ok ? r.json() : null; })

           the new baseline, silently, and never offered back to them as
           news. (A change from elsewhere in the same minute waits for the

  /* Pull to refresh. Only from the very top of the page, only downward, and
     never from inside a sheet, a sideways swipe or a task being dragged. The

  (function(){

    document.addEventListener("touchstart", function(e){
      /* Only in the installed app: a browser tab has its own pull, which
         reloads the page, and two of them on one gesture is one too many. */
      if(!document.documentElement.classList.contains("is-app")) return;
      if(busy || e.touches.length !== 1 || window.scrollY > 0) return;
      if(!e.target.closest("main") || e.target.closest(".sheet,.swr.dragging,input,textarea")) return;

     and then sits there reads as broken — it is a countdown or it is nothing.
     So the page counts the seconds down itself and asks the server ONE
     question when it reaches zero: what happened. It never settles anything
     locally, because it does not know whether somebody changed their mind in
     the last second — only that the answer is now worth re-reading.
     The sweep runs on its own minute, so the first re-read can still find the
     meeting negotiating; `settleAsked` is per meeting-and-moment, which lets
     the next tick ask again without turning the page into a poller. */
  var settleAsked = {}, SETTLE_RETRY_MS = 20000;

         The sweep that actually settles a meeting runs on its own minute, so
         the read at zero can perfectly well come back still negotiating — and
         with a permanent latch the countdown then sat on "settling now" for
         as long as the page stayed open, which the comment above already
         claimed it did not. */
      var now = Date.now();

         confirmed, or still negotiating because somebody said no in time. */

  /* Which seven days the strip is showing, counted in weeks from the one that

  var weekOff = 0, WEEK_MIN = -2, WEEK_MAX = 3;
  function dayAt(i){ return new Date(base.getFullYear(), base.getMonth(), base.getDate() + i); }
  function dayISO(i){ return ymd(dayAt(i)); }

  function dayOffset(v){ return Math.round((new Date(v + "T12:00:00") - base) / 86400000); }
  /* Dated tasks stand in the day next to the real events, in time order,

     they open the very same editor the list does, never a copy of it. */
  function agendaFor(i){
    var iso = dayISO(i);
    /* The same thing twice (owner, 2026-10-01, on Miron's account). A task
       the sync wrote out, a settled coordination on their calendar, an event
       Olma created — each is ALSO one of Google's events, so the day drew it
       once from /me/events and once as itself. Olma's row wins, because it
       is the one that opens the editor and carries the reminder; Google's
       copy is dropped by its id when we know it (`gid`), and otherwise by
       the same title at the same time on the same day — the event
       `create_calendar_event` wrote with no task behind it, or one written
       under an id we did not keep. */
    var ownIds = {}, ownKeys = {};
    var sameKey = function(title, time){
      return String(title || "").replace(/\s+/g, " ").trim().toLowerCase() + "|" + (time || "");
    };
    open.forEach(function(x){
      if(x.d !== iso && !erepOn(x, iso)) return;
      if(x.gid) ownIds[x.gid] = 1;
      ownKeys[sameKey(L(x.t), x.all ? "" : x.tm)] = 1;
    });
    MEETS.forEach(function(m){
      if(!m.settled) return;
      var o = mtOptById(m, m.settled);
      if(!o || o.day !== i) return;
      if(m.gid) ownIds[m.gid] = 1;
      ownKeys[sameKey(L(m.t), m.allDay ? "" : o.time)] = 1;
    });
    var evs = (EVENTS[i] || []).filter(function(v){
      return !(v.id && ownIds[v.id]) && !ownKeys[sameKey(L(v.n), v.all ? "" : v.t)];
    }).map(function(v){

         treats it as filling the whole of one. The seed has no all-day rows,
         which is exactly why this was easy to leave out. */
      return {time:v.t, end:v.e, allDay:!!v.all, title:L(v.n), sub:L(v.s), c:v.c};
    });

         written out to Google. `x.cal` is an EXPORT switch — "put this in the
         calendar app on my phone too" — and it was being read here as a
         DISPLAY switch, which meant somebody with no Google connection saw an
         empty week while holding six dated tasks. That was Maya, on the day
         this was found: one flag doing two jobs, and the wrong one won. */
      /* …and a repeating event stands in every day its rule falls on. */
      if(x.d !== iso && !erepOn(x, iso)) return;

                sub:x.kind === "event" && x.loc ? x.loc

                  : t(x.rem ? "cal.taskRem" : "cal.taskSub", {name:chanName(defaultChannel)}),

       the day. It carries a mark saying where it came from and its own
       "remove from my calendar" — which is a private act, and deliberately
       not the same control, or the same word, as leaving the meeting. */

       movement instead of growing into it. Both are physical values — offsetLeft
       is physical, so this is right in Hebrew and in English without a branch. */

       which is why "Version/" below matters: only Safari itself carries it
       (Chrome, Firefox and Edge for iOS, and the in-app browsers, do not). */
    var ios = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
    return ios && /Version\/[\d.]+.*Safari\//.test(ua) && !/Chrome|Android|CriOS|FxiOS|EdgiOS|OPiOS|GSA\/|FBAN|FBAV|Instagram|Line\/|WhatsApp/.test(ua);
  })();
  var installEvt = null;
  window.addEventListener("beforeinstallprompt", function(e){
    e.preventDefault();
    installEvt = e;
    renderInstall();
  });
  window.addEventListener("appinstalled", function(){ installEvt = null; instDismiss(); });
  function instDismissed(){
    try{ return localStorage.getItem("olma.installDismissed") === "1"; }catch(e){ return false; }
  }
  function instDismiss(){
    try{ localStorage.setItem("olma.installDismissed", "1"); }catch(e){}
    $("#inst").hidden = true;
  }
  /* "prompt", "ios" or null. On the design page, ?install=prompt|ios draws
     either one, since neither can happen there for real. */
  function installMode(){
    if(NEWUSER || STANDALONE) return null;
    var served = document.documentElement.hasAttribute("data-served");
    if(!served){
      var q = new URLSearchParams(location.search).get("install");
      return q === "prompt" || q === "ios" ? q : null;
    }
    if(instDismissed()) return null;
    if(installEvt) return "prompt";
    return IOS_SAFARI ? "ios" : null;
  }
  function renderInstall(){
    var box = $("#inst"), mode = installMode();
    if(!box) return;
    box.hidden = !mode;
    if(!mode) return;
    $("#instMark").innerHTML = '<img src="/icons/apple-touch-icon.png" alt="" width="44" height="44">';
    $("#instP").textContent = t(mode === "ios" ? "inst.pIos" : "inst.p");
    var steps = $("#instSteps");
    steps.hidden = mode !== "ios";
    steps.innerHTML = mode !== "ios" ? "" : ["inst.ios1", "inst.ios2", "inst.ios3"].map(function(k){
      return "<li><span>" + esc(t(k)).split("{share}").join('<svg aria-hidden="true"><use href="#i-share"/></svg>') + "</span></li>";
    }).join("");
    /* On an iPhone the page cannot do the installing, so the one button is
       the acknowledgement; where the browser can, it is the whole point. */
    $("#instYes").textContent = t(mode === "ios" ? "inst.ok" : "inst.btn");
    $("#instNo").textContent = t("inst.later");
    $("#instNo").hidden = mode === "ios";
  }
  $("#instYes").addEventListener("click", function(){
    if(!installEvt){ instDismiss(); return; }
    var e = installEvt;
    installEvt = null;
    e.prompt();
    if(e.userChoice) e.userChoice.then(function(c){
      if(c && c.outcome === "accepted") instDismiss(); else renderInstall();
    });
  });
  $("#instNo").addEventListener("click", instDismiss);

  /* ---- signing into the installed app with a code ---- */
  /* The digits out of whatever was pasted: the whole WhatsApp message is
     fine, and so is "1234 5678", "1234-5678" or a bare 12345678. Bold marks
     and direction marks that ride a copied message are dropped first. */
  function codeOf(v){
    var m = String(v || "").replace(/[\u200e\u200f\u2066-\u2069*]/g, "")
      .match(/(?:^|\D)(\d{4})[\s\u00a0-]?(\d{4})(?!\d)/);
    return m ? m[1] + m[2] : null;
  }
  function paintCodeDoor(){
    var wa = CHANNELS.filter(function(c){ return c.id === "wa"; })[0];
    var link = (wa && wa.link) || "https://wa.me/972559347282";
    $("#wCodeGet").href = link + (link.indexOf("?") < 0 ? "?" : "&") + "text=" + encodeURIComponent(t("code.waText"));
    $("#wCodeGet").innerHTML = tileFor("wa", "i-wa") + "<span>" + esc(t("code.get")) + "</span>";
    /* Inside the installed app the code IS the way in, so it is the screen;
       in a browser it waits behind "I have a code". */
    if(STANDALONE){
      $("#wCode").hidden = false;
      $("#wTag").textContent = t("code.h");
    }
  }
  var codeBusy = false;
  function codeInput(){
    var c = codeOf($("#wCodeIn").value);
    $("#wCodeGo").disabled = !c || codeBusy;
    return c;
  }
  function codeSubmit(){
    var c = codeInput();
    if(!c || codeBusy) return;
    codeBusy = true;
    $("#wCodeGo").disabled = true;
    $("#wCodeIn").value = c.slice(0, 4) + " " + c.slice(4);
    fetch("/me/code", {
      method:"POST", credentials:"same-origin",
      headers:{"Content-Type":"application/json", Accept:"application/json"},
      body:JSON.stringify({code:c})
    }).then(function(r){
      if(r.ok){ location.replace("/me"); return; }
      codeBusy = false;
      $("#wCodeErr").textContent = t(r.status === 429 ? "code.slow" : "code.bad");
      codeInput();
    }).catch(function(){
      codeBusy = false;
      $("#wCodeErr").textContent = t("code.net");
      codeInput();
    });
  }
  /* typing again is starting again, so the last refusal goes with it */
  $("#wCodeIn").addEventListener("input", function(){ $("#wCodeErr").textContent = ""; codeInput(); });
  /* A paste that carries a whole code is the person saying "this one" —
     going on without a second tap is the point of pasting. */
  $("#wCodeIn").addEventListener("paste", function(){ setTimeout(function(){ if(codeInput()) codeSubmit(); }, 0); });
  $("#wCode").addEventListener("submit", function(e){ e.preventDefault(); codeSubmit(); });
  $("#wCodeHave").addEventListener("click", function(){
    this.hidden = true;
    $("#wCode").hidden = false;
    $("#wCodeIn").focus();
  });

  /* One or the other, never both: the intro stages the APP, and
     a stranger is not being shown the app. */
  /* a deep link skips the intro entirely — see openFromHash */
  if(/^#(meeting=|tasks$|new-task$|new-meeting$)/.test(location.hash || "")) markIntroSeen();
  if(NEWUSER) startWelcome(); else { startIntro(); navHint(); }
  /* the seed page only: on a served page the seed MEETS are placeholders and
     the real ones arrive with hydrate(), which calls this itself */
  if(!document.documentElement.hasAttribute("data-served")) openFromHash();
  $("#newTog").addEventListener("click", function(){
    NEWUSER = !NEWUSER;
    document.documentElement.classList.toggle("is-new", NEWUSER);
    $("#welcome").hidden = !NEWUSER;
    lockApp(NEWUSER);
    if(NEWUSER) renderWelcome();
  });
  $("#introTog").addEventListener("click", function(){
    try{ sessionStorage.removeItem("olma-intro"); localStorage.removeItem("olma-navhint"); }catch(e){}
    navHint();
    go("tools");
    startIntro();
  });

  /* preview only: L flips the language, standing in for the person
     having switched languages mid-conversation. Not product UI. */
  function setLocale(v){
    if(v === LOCALE) return;
    LOCALE = v; D = T[LOCALE];
    $$("#langTog span").forEach(function(el, i){ el.classList.toggle("on", (i ? "en" : "he") === LOCALE); });
    renderAll();
  }
  $$("#langTog span").forEach(function(el, i){ el.classList.toggle("on", (i ? "en" : "he") === LOCALE); });
  $("#langTog").addEventListener("click", function(){ setLocale(LOCALE === "he" ? "en" : "he"); });

  /* preview only: forces one theme, standing in for a phone set that way.
     Starts on neither — un-stamped is the real default, where the OS decides
     — and from the first press it alternates, so both are one tap apart. */
  $("#themeTog").addEventListener("click", function(){
    var root = document.documentElement, now = root.getAttribute("data-theme");
    var dark = now ? now === "light"
      : !(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
    root.setAttribute("data-theme", dark ? "dark" : "light");
    this.innerHTML = dark ? "&#9788;" : "&#9789;";
  });
  /* The four buttons above are hidden by CSS on a served page, which takes
     their clicks with them. This shortcut has no button to hide, so it is
     asked separately — otherwise a stray L in somebody's real dashboard
     silently translates their whole list. */
  if(!document.documentElement.hasAttribute("data-served")){
    document.addEventListener("keydown", function(e){
      if(e.key !== "l" && e.key !== "L" && e.key !== "ל") return;
      if(e.target && e.target.closest && e.target.closest("input, textarea")) return;
      setLocale(LOCALE === "he" ? "en" : "he");
    });
  }
})();
</script>
