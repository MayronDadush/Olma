<div class="app">

  <header class="topbar">
    <button class="brand" id="brandBtn" data-go="me">
      <div class="avatar" id="miniAvatar"></div>
      <div class="brand-txt">
        <div class="brand-hi" data-i18n="greet"></div>
        <div class="brand-name" id="brandName"></div>
      </div>
    </button>
    <button class="topclock" id="topClock" data-i18n-label="city.title"></button>
    <div class="live"><span class="dot"></span><span id="olmaLive"></span></div>
  </header>

  <main>
  <!-- ══════════════  connections  ══════════════ -->
  <section class="view active" data-view="tools">
    <div class="title" style="--i:0">
      <h1 data-i18n="tools.h"></h1>
      <p data-i18n="tools.p"></p>
    </div>
    <div class="stack" style="--i:1" id="toolsStack"></div>
  </section>

  <!-- ══════════════  tasks  ══════════════ -->
  <section class="view" data-view="tasks">
    <div class="title" style="--i:0">
      <h1 data-i18n="tasks.h"></h1>
      <p id="taskCount"></p>
    </div>
    <!-- two ways to read the same list, and nothing else on the row -->
    <div class="viewrow" style="--i:1">
      <div class="seg mini" id="taskView">
        <button aria-pressed="true"  data-view-by="time" data-i18n="cat.byTime"></button>
        <button aria-pressed="false" data-view-by="cat"  data-i18n="cat.byCat"></button>
      </div>
    </div>
    <div style="--i:2">
      <div class="stack" id="taskStack"></div>
    </div>
    <div class="archive" id="archive" style="--i:3">
      <button class="arcbtn" id="arcBtn" aria-expanded="false">
        <svg class="chev"><use href="#i-chev"/></svg>
        <span data-i18n="tasks.archive"></span>
        <span id="arcCount" style="margin-inline-start:auto;font-weight:500"></span>
      </button>
      <div class="fold" id="arcFold"><div>
        <div class="group" id="arcGroup" style="box-shadow:none;background:var(--surface-2)"></div>
        <p class="arcnote" id="arcNote" hidden></p>
      </div></div>
    </div>
  </section>

  <!-- ══════════════  calendar  ══════════════ -->
  <section class="view" data-view="cal">
    <div class="title" style="--i:0">
      <h1 data-i18n="cal.h"></h1>
      <p id="calSub"></p>
    </div>
    <!-- Two modes, not two pages. Reading the week and arranging something in
         it are the same subject, and the same segment control the task list
         already uses says so. -->
    <div class="viewrow" style="--i:1">
      <div class="seg mini" id="calMode">
        <button aria-pressed="true"  data-calmode="cal"  data-i18n="cal.modeRead"></button>
        <button aria-pressed="false" data-calmode="meet" data-i18n="cal.modeMeet"></button>
      </div>
    </div>

    <div id="calRead">
      <div style="--i:2">
        <div class="group">
          <div class="stripmonth"><span id="stripMonth"></span><span id="stripYear"></span></div>
          <div class="daystrip" id="daystrip"></div>
        </div>
      </div>
      <div style="--i:3;margin-top:24px">
        <div class="glabel"><span id="agendaLabel"></span></div>
        <div class="group" id="agenda"></div>
      </div>
      <div style="--i:4;margin-top:20px">
        <button class="bigbtn" data-toast="toast.calOpen">
          <svg><use href="#i-out"/></svg><span data-i18n="cal.open"></span>
        </button>
      </div>
    </div>

    <div id="calMeet" hidden>
      <div style="--i:2">
        <div class="glabel"><span data-i18n="mt.open"></span><span class="hint" id="mtCount"></span></div>
        <div class="stack" id="mtList"></div>
      </div>
      <div style="--i:3;margin-top:20px">
        <div class="group">
          <button class="addrow" id="mtNew">
            <span class="plus"><svg><use href="#i-plus"/></svg></span><span data-i18n="mt.new"></span>
          </button>
        </div>
      </div>
      <p class="note" style="padding:14px 14px 0" data-i18n="mt.note"></p>
    </div>
  </section>

  <!-- ══════════════  friends  ══════════════ -->
  <section class="view" data-view="friends">
    <div class="title" style="--i:0">
      <h1 data-i18n="fr.h"></h1>
      <p data-i18n="fr.p"></p>
    </div>
    <!-- Adding somebody comes BEFORE the list of people already added: this
         page is where you come to grow that list, and the action you came for
         should not be below everything you already have. -->
    <div style="--i:1">
      <div class="group">
        <button class="addrow" id="addFriend">
          <span class="plus"><svg><use href="#i-plus"/></svg></span><span data-i18n="fr.invite"></span>
        </button>
      </div>
    </div>
    <div style="--i:2;margin-top:24px">
      <div class="glabel"><span data-i18n="fr.connected"></span><span class="hint" id="friendCount"></span></div>
      <div class="searchwrap" id="friendSearch" hidden>
        <svg class="sicon"><use href="#i-search"/></svg>
        <input id="friendQ" type="search" autocomplete="off" data-i18n-ph="fr.search" data-i18n-label="fr.search">
        <button class="sclear" id="friendQClear" hidden data-i18n-label="fr.clear">&#10005;</button>
      </div>
      <div class="group" id="friendGroup"></div>
      <p class="note" id="friendEmpty" style="padding:0 14px" hidden></p>
    </div>
  </section>

  <!-- ══════════════  profile  ══════════════ -->
  <section class="view" data-view="me">
    <div class="hero-profile" style="--i:0">
      <div class="avatar" id="bigAvatar"></div>
      <div class="who"><b id="whoName"></b><span data-i18n="me.since"></span></div>
      <button class="linkbtn" id="shuffleAvatar" data-i18n="me.avatar"></button>
    </div>
    <div class="stack" style="--i:1">
      <div>
        <div class="glabel"><span data-i18n="me.personal"></span></div>
        <div class="group fpad">
          <div class="fgrid">
            <div class="ffield"><label for="fname" data-i18n="me.first"></label><input id="fname" type="text" autocomplete="given-name"></div>
            <div class="ffield"><label for="lname" data-i18n="me.last"></label><input id="lname" type="text" autocomplete="family-name"></div>
            <div class="ffield"><label for="bday" data-i18n="me.bday"></label><button class="dateval" id="bday" data-cal="bday" data-val="1994-03-16"></button></div>
            <div class="ffield">
              <label id="genderLabel" data-i18n="me.form"></label>
              <div class="seg" id="genderSeg" role="group" aria-labelledby="genderLabel">
                <button aria-pressed="true" data-g="m" data-i18n="me.masc"></button>
                <button aria-pressed="false" data-g="f" data-i18n="me.fem"></button>
              </div>
            </div>
          </div>
        </div>
        <p class="note" style="padding:0 14px" data-i18n="me.formNote"></p>
      </div>
      <div>
        <div class="glabel"><span data-i18n="me.setup"></span></div>
        <div class="group">
          <button class="row no-icon" id="cityRow">
            <div class="row-txt"><div class="row-title" data-i18n="me.where"></div></div>
            <span class="row-val" id="cityName"></span>
            <span class="row-end" id="cityClock"></span>
            <svg class="chev"><use href="#i-chev"/></svg>
          </button>
          <div class="row no-icon">
            <label class="row-title" for="oname" data-i18n="me.calledBy"></label>
            <input class="row-input" id="oname" type="text" maxlength="18" data-i18n-label="me.calledBy">
          </div>
        </div>
        <p class="note" style="padding:0 14px" id="setupNote"></p>
      </div>
      <div class="pausewrap">
        <button class="pausebtn" id="pauseBtn" aria-pressed="false">
          <svg id="pauseIcon"><use href="#i-pause"/></svg><span id="pauseLabel"></span>
        </button>
        <p class="note" id="pauseNote"></p>
      </div>
    </div>
  </section>
  </main>
</div>

<nav class="tabbar" role="tablist">
  <span class="tabpill" id="tabpill" aria-hidden="true"></span>
  <button class="tab" role="tab" aria-selected="true" data-go="tools"><svg><use href="#i-tools"/></svg><span data-i18n="tab.tools"></span></button>
  <button class="tab" role="tab" aria-selected="false" data-go="tasks"><svg><use href="#i-list"/></svg><span data-i18n="tab.tasks"></span></button>
  <button class="tab" role="tab" aria-selected="false" data-go="cal"><svg><use href="#i-cal24"/></svg><span data-i18n="tab.cal"></span></button>
  <button class="tab" role="tab" aria-selected="false" data-go="friends"><svg><use href="#i-people"/></svg><span data-i18n="tab.friends"></span></button>
  <button class="tab" role="tab" aria-selected="false" data-go="me"><svg><use href="#i-user24"/></svg><span data-i18n="tab.me"></span></button>
</nav>

<!-- preview scaffolding, not product UI: lets the design be checked in
     both languages and both text directions without reloading. -->
<div class="calscrim" id="calScrim" hidden></div>
<div class="calpop" id="calPop" role="dialog" aria-modal="true" hidden></div>

<button class="langtog" id="langTog" title="preview only"><span>HE</span><span>EN</span></button>
<!-- preview only: replay the first-visit intro, which otherwise happens once
     per tab and would be impossible to look at twice. -->
<button class="introtog" id="introTog" title="preview only: replay first visit">&#8635;</button>

<div class="scrim" id="scrim"></div>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sTitle">
  <div class="sgrab"><i class="grabber"></i></div>
  <input class="stitle" id="sTitle" type="text" data-i18n-ph="sheet.taskPh" data-i18n-label="sheet.task" autocomplete="off">
  <!-- Where it came from, said once at the top, so the greyed rows further
       down do not each have to explain themselves. -->
  <div class="srcline" id="sSrc" hidden>
    <span class="srcmark"><svg id="sSrcIcon"><use href="#i-monday"/></svg></span>
    <span id="sSrcTxt"></span>
  </div>
  <div class="group">
    <!-- A list is what the task IS, so it heads the group, above every
         question about when. Folded by default: the row already carries the
         count, and an open list would push the editor past one screen —
         which is the one rule this sheet has. -->
    <button class="row no-icon" id="sListRow" aria-expanded="false">
      <div class="row-txt"><div class="row-title" data-i18n="sheet.list"></div>
        <div class="row-sub" id="sListSub"></div></div>
      <span class="tcount" id="sListCount" hidden></span>
      <svg class="chev"><use href="#i-chev"/></svg>
    </button>
    <div class="fold" id="sListFold"><div>
      <div class="listbox" id="sList"></div>
      <div class="row no-icon additemrow">
        <input class="row-input additem" id="sAddItem" type="text" maxlength="60"
               data-i18n-ph="sheet.addItem" data-i18n-label="sheet.addItem" autocomplete="off">
      </div>
    </div></div>
    <!-- Date, time and all-day were three rows asking one question. They are
         one row of values now: each is its own target, and the ones that do
         not apply yet simply are not there. -->
    <div class="row no-icon whenrow">
      <div class="row-title" data-i18n="sheet.when"></div>
      <div class="whenvals">
        <button class="vchip" id="sDateRow" data-cal="task" data-quick="1"><span id="sDateVal"></span></button>
        <button class="vchip" id="sTimeChip"><span id="sTimeVal"></span></button>
        <button class="vchip toggle" id="sAllDay" role="switch" aria-checked="false"
                data-i18n="sheet.allDay" data-i18n-label="sheet.allDay"></button>
      </div>
      <input id="sTime" type="time" tabindex="-1" aria-hidden="true"
             style="position:absolute;opacity:0;pointer-events:none;width:1px;height:1px">
    </div>
    <button class="row no-icon" id="sCatRow" aria-expanded="false">
      <div class="row-txt"><div class="row-title" data-i18n="cat.h"></div></div>
      <span class="row-val" id="sCatVal"></span>
      <span class="autotag" id="sCatAuto" hidden data-i18n="cat.auto"></span>
      <svg class="chev"><use href="#i-chev"/></svg>
    </button>
    <div class="fold" id="sCatFold"><div><div class="foldpad tight">
      <div class="chips" id="sCat"></div>
    </div></div></div>
    <button class="row no-icon" id="sRepeatRow" aria-expanded="false">
      <div class="row-txt"><div class="row-title" data-i18n="sheet.repeat"></div></div>
      <span class="row-val" id="sRepeatVal"></span>
      <svg class="chev"><use href="#i-chev"/></svg>
    </button>
    <div class="fold" id="sRepeatFold"><div><div class="foldpad tight">
      <div class="chips" id="sRepeat">
        <button class="chip mini" aria-pressed="true" data-rep="none" data-i18n="rep.once"></button>
        <button class="chip mini" aria-pressed="false" data-rep="day" data-i18n="rep.day"></button>
        <button class="chip mini" aria-pressed="false" data-rep="week" data-i18n="rep.week"></button>
        <button class="chip mini" aria-pressed="false" data-rep="month" data-i18n="rep.month"></button>
        <button class="chip mini" aria-pressed="false" data-rep="year" data-i18n="rep.year"></button>
      </div>
    </div></div></div>
    <div class="row no-icon">
      <div class="row-txt"><div class="row-title" data-i18n="sheet.remind"></div><div class="row-sub" data-i18n="sheet.remindSub"></div></div>
      <button class="switch" role="switch" aria-checked="false" id="sRemind" data-i18n-label="sheet.remind"></button>
    </div>
    <div class="fold" id="sRemindFold"><div><div class="foldpad tight">
      <div class="chips" id="sOffset">
        <button class="chip mini" aria-pressed="true" data-i18n="off.at"></button>
        <button class="chip mini" aria-pressed="false" data-i18n="off.m10"></button>
        <button class="chip mini" aria-pressed="false" data-i18n="off.h1"></button>
        <button class="chip mini" aria-pressed="false" data-i18n="off.d1"></button>
      </div>
    </div></div></div>
    <div class="row no-icon" id="sCalRow" hidden>
      <div class="row-txt"><div class="row-title" data-i18n="sheet.inCal"></div></div>
      <button class="switch" role="switch" aria-checked="false" id="sCal" data-i18n-label="sheet.inCal"></button>
    </div>
  </div>

  <!-- who else has this task. Hidden entirely when nobody else does. -->
  <div class="group" id="sShareGroup" style="margin-top:12px">
    <button class="row no-icon" id="sShareRow" aria-expanded="false">
      <div class="row-txt"><div class="row-title" data-i18n="sheet.shared"></div>
        <div class="row-sub" id="sShareSub"></div></div>
      <span id="sShareFaces"></span>
      <svg class="chev"><use href="#i-chev"/></svg>
    </button>
    <div class="fold" id="sShareFold"><div><div class="foldpad tight">
      <div id="sSharePeople"></div>
      <!-- The picker is a window inside this one. Thirteen faces open by
           default would be most of the sheet, and they are only wanted in the
           moment somebody is being added — so it opens and shuts on the same
           chevron row as everything else, one level in. -->
      <button class="subrow" id="sAddRow" aria-expanded="false">
        <span class="row-title" data-i18n="sheet.addPeople"></span>
        <span class="row-val" id="sAddCount"></span>
        <svg class="chev"><use href="#i-chev"/></svg>
      </button>
      <div class="fold" id="sAddFold"><div><div class="subpad">
        <div class="searchwrap" id="pickSearch" hidden>
          <svg class="sicon"><use href="#i-search"/></svg>
          <input id="pickQ" type="search" autocomplete="off"
                 data-i18n-ph="sheet.pickSearch" data-i18n-label="sheet.pickSearch">
          <button class="sclear" id="pickQClear" hidden data-i18n-label="fr.clear">&#10005;</button>
        </div>
        <p class="note" style="padding:0 0 8px" data-i18n="sheet.sharePick"></p>
        <div class="peoplepick" id="sPeople"></div>
        <p class="note" id="pickEmpty" style="padding:9px 0 0" hidden></p>
      </div></div></div>
      <p class="note" id="sLeaveNote" style="padding:10px 0 0" data-i18n="sheet.leaveSub" hidden></p>
      <button class="linkbtn danger" id="sLeave" style="margin-top:10px;display:block" data-i18n="sheet.leave" hidden></button>
    </div></div></div>
  </div>

  <p class="savedline" id="sSaved"></p>
  <div class="sfoot"><button class="linkbtn danger" id="sDelete" hidden data-i18n="sheet.delete"></button></div>
  <div class="scuehold deep"><div class="scue" id="sheetCue"><i></i></div></div>
</div>

<div class="sheet" id="citySheet" role="dialog" aria-modal="true" aria-labelledby="cityTitle">
  <div class="sgrab"><i class="grabber"></i></div>
  <h2 id="cityTitle" data-i18n="city.title"></h2>
  <div class="group">
    <div class="field"><input id="citySearch" type="search" data-i18n-ph="city.search" autocomplete="off"></div>
  </div>
  <div class="group citylist" id="cityList" style="margin-top:12px"></div>
  <div class="sheetbtns">

<!-- ══════════════  meeting coordination  ══════════════
     The grid is the whole idea: rows are the candidate days, columns are the
     four parts of a day, and one tap says "this suits me". Everyone else's
     answers show as a count inside the same cell — so you are marking your own
     availability and reading the group's at once, in one object, rather than
     submitting a form and waiting to be told.

     The four parts tile the day exactly and "all day" is their union, which is
     why ticking all four collapses into it rather than sitting beside it: the
     same sentence, said shorter. -->

  /* ONE service changed, so exactly one cell is touched. Rebuilding the

       dimmed its glyph half a second after the switch had already moved —
       two gestures where the person made one. */

     the whole point of dragging rather than closing. Past a third of its own
     height, or on a quick flick however short, letting go finishes the

  var DRAG_FRACTION = .3, FLICK_V = .55;

    function move(e){

      var dt = e.timeStamp - lastT;
      if(dt > 0) v = (e.clientY - lastY) / dt;
      lastY = e.clientY; lastT = e.timeStamp;
      sheet.style.transform = "translateY(" + dy.toFixed(1) + "px)";
      $("#scrim").style.opacity =
        Math.max(0, 1 - Math.max(0, dy) / sheet.offsetHeight * 1.25).toFixed(3);
    }
    function end(){
      if(!dragging) return;
      dragging = false;
      sheet.classList.remove("dragging");
      $("#scrim").classList.remove("dragging");
      if(!(dy > sheet.offsetHeight * DRAG_FRACTION || v > FLICK_V)){
        sheet.style.transform = "";
        $("#scrim").style.opacity = "";
        return;
      }
      sheet.classList.add("flick");
      sheet.style.transform = "translateY(" + (sheet.offsetHeight + 48) + "px)";
      $("#scrim").style.opacity = "0";
      /* The inline values are cleared only AFTER .show is gone, never before:
         for one frame in between, a sheet with .show and no inline transform
         snaps back into place — the flash of a thing returning right as it
         leaves. */
      setTimeout(function(){
        closeSheets();
        requestAnimationFrame(function(){
          sheet.classList.remove("flick");
          sheet.style.transform = "";
          $("#scrim").style.opacity = "";
        });
      }, 300);
    }
    grab.addEventListener("pointerdown", function(e){
      if(e.button) return;
      dragging = true; y0 = lastY = e.clientY; lastT = e.timeStamp; dy = 0; v = 0;
      sheet.classList.add("dragging");
      $("#scrim").classList.add("dragging");
      try{ grab.setPointerCapture(e.pointerId); }catch(err){}
      e.preventDefault();
    });
    grab.addEventListener("pointermove", move);
    grab.addEventListener("pointerup", end);
    grab.addEventListener("pointercancel", end);
  }
  makeDismissable($("#sheet"));
  makeDismissable($("#citySheet"));
  makeDismissable($("#cnSheet"));
  makeDismissable($("#mtSheet"));
  makeDismissable($("#mtNewSheet"));

  /* ── the scroll line ──
     Two scrollers ask the same question — is there more, and where am I in it
     — so they get the same answer in the same shape. Measured, never inferred
     from an item count: a cue drawn from a guess is wrong in both directions,
     and this one is the only thing telling somebody there is anything below. */
  function paintCue(el, cue){
    if(!el || !cue) return;
    var max = el.scrollHeight - el.clientHeight, on = max > 4;
    cue.classList.toggle("on", on);
    if(!on) return;
    var bar = cue.querySelector("i"), frac = Math.max(.18, el.clientHeight / el.scrollHeight);
    bar.style.setProperty("--w", (frac * 100).toFixed(1) + "%");
    bar.style.setProperty("--o", ((1 - frac) * (el.scrollTop / max) * 100).toFixed(1) + "%");
  }
  /* after a fold has finished opening, not while it is: the sheet's height is
     still changing until then, so measuring now measures a number that is
     about to be wrong */
  function updateSheetCue(){
    paintCue($("#sheet"), $("#sheetCue"));
    setTimeout(function(){ paintCue($("#sheet"), $("#sheetCue")); }, 580);
  }
  $("#sheet").addEventListener("scroll", function(){ paintCue($("#sheet"), $("#sheetCue")); });
  $("#sList").addEventListener("scroll", function(){ paintCue($("#sList"), $("#listCue")); });
  window.addEventListener("resize", updateSheetCue);
  document.addEventListener("keydown", function(e){
    if(e.key !== "Escape") return;
    if(!$("#calPop").hidden){ closeCal(); return; }
    closeSheets();
  });

  /* ───────── the task editor: no Save, no Cancel ─────────
     Every control writes straight through to the task and the list behind
     the sheet redraws as it happens, so the sheet has nothing left to
     confirm. A Save button here would only be a second way to do what the
     typing already did, and it was most of the height that made this
     scroll. Closing is the whole gesture: scrim, grabber, or Escape. */
  var editing = null, isNew = false, savedTimer = null, jumpAfterSheet = null;

  function bucketFor(dateStr){
    if(!dateStr) return "later";
    var n = new Date(), t0 = new Date(n.getFullYear(), n.getMonth(), n.getDate());
    var d = new Date(dateStr + "T00:00:00");
    var days = Math.round((d - t0) / 86400000);
    if(days < 0) return "late";
    if(days === 0) return "today";
    if(days === 1) return "tomorrow";
    return "later";
  }
  /* The row shows the smallest thing that still locates the task: inside
     the section it already sits under, the clock alone says everything. */
  function labelFor(x){
    var d = x.d, tm = x.all ? "" : x.tm, b = bucketFor(d);
    if(!d) return tm || null;
    if(x.all && (b === "today" || b === "tomorrow")) return t("cal.allDay");
    if(tm && (b === "today" || b === "tomorrow")) return tm;
    if(b === "late" && d === isoAt(-1)) return t("cal.yesterday") + (tm ? " " + tm : "");
    var sep = LOCALE === "en" ? "/" : ".";
    return +d.slice(8) + sep + +d.slice(5,7) + (tm ? " " + tm : "");
  }
  function dateLabel(d){ return d ? longDate(d) : t("sheet.noDate"); }
  function both(v){ return {he:v, en:v}; }

  function flashSaved(){
    var el = $("#sSaved");
    el.textContent = t("sheet.saved"); el.classList.add("flash");
    clearTimeout(savedTimer);
    savedTimer = setTimeout(function(){
      el.textContent = t("sheet.autosave"); el.classList.remove("flash");
    }, 1300);
  }
  /* One writer for every control in the sheet. A new task only joins the
     list once it has a name — an empty row appearing the moment somebody
     opened the editor would be a task nobody asked for. */
  function commit(){
    if(!editing) return;
    var title = $("#sTitle").value.trim();
    editing.t = both(title);
    editing.tm = $("#sTime").value;
    editing.all = $("#sAllDay").getAttribute("aria-checked") === "true";
    var pick = $$("#sCat .chip").filter(function(c){ return c.getAttribute("aria-pressed") === "true"; })[0];
    if(pick) editing.cat = pick.dataset.cat;
    editing.rem = $("#sRemind").getAttribute("aria-checked") === "true";
    editing.cal = $("#sCal").getAttribute("aria-checked") === "true";
    var chosen = $$("#sRepeat .chip").filter(function(c){ return c.getAttribute("aria-pressed") === "true"; })[0];
    editing.rep = chosen ? chosen.dataset.rep : "none";
    syncSheetRows();
    if(isNew){
      if(!title) return;
      open.push(editing); isNew = false;
      $("#sDelete").hidden = false;
    }
    API.saveTask(editing);
    renderTasks(); renderStrip(selDay); flashSaved();
  }
  /* Three controls only make sense once a day has been chosen — an all-day
     switch, a clock, and a calendar entry are all answers to "when", and
     offering them before that question has one is offering nothing. */
  /* Greying is applied to the ROW, not to the control inside it: the label has
     to dim too, or a live-looking label sits above a dead control. `inert`
     removes it from the tab order and from pointer events in one attribute,
     which is the only way to be sure a nested button is genuinely unreachable
     rather than merely styled as if it were. */
  function lockRow(row, on, why){
    if(!row) return;
    row.classList.toggle("locked", on);
    if(on){ row.setAttribute("inert", ""); row.title = why || ""; }
    else { row.removeAttribute("inert"); row.removeAttribute("title"); }
  }
  function syncSheetSource(){
    var sc = srcOf(editing);
    $("#sSrc").hidden = !sc;
    if(sc){
      $("#sSrcIcon").innerHTML = '<use href="#' + sc.icon + '"/>';
      $("#sSrcTxt").textContent = t("sheet.fromApp", {name:sc.name});
    }
    var why = sc ? t("sheet.noField", {name:sc.name}) : "";
    /* Every field WE have is checked against what the source can hold. A task
       written here has no source, so nothing is ever locked on it. */
    lockRow($("#sCatRow"),    !canEdit(editing, "cat"),  why);
    lockRow($("#sRepeatRow"), !canEdit(editing, "rep"),  why);
    lockRow($("#sListRow"),   !canEdit(editing, "items"),why);
    lockRow($("#sShareRow"),  !canEdit(editing, "who"),  why);
    lockRow($("#sTimeChip"),  !canEdit(editing, "time"), why);
    /* the reminder and the calendar copy are OURS, not theirs — an imported
       task can still be reminded about, so these are never locked */
  }
  function syncSheetRows(){
    var dated = !!editing.d;
    $("#sDateVal").textContent = dateLabel(editing.d);
    $("#sDateRow").classList.toggle("set", dated);
    /* a clock and an all-day switch are both answers to a question that has
       not been asked yet when there is no date, so neither is offered */
    $("#sAllDay").hidden = !dated;
    $("#sAllDay").setAttribute("aria-checked", editing.all ? "true" : "false");
    $("#sAllDay").classList.toggle("on", !!editing.all);
    $("#sTimeChip").hidden = !dated || !!editing.all;
    $("#sTimeVal").textContent = editing.tm || t("sheet.pickTime");
    $("#sTimeChip").classList.toggle("set", !!editing.tm);
    $("#sCalRow").hidden = !dated;
    var chosen = $$("#sRepeat .chip").filter(function(c){ return c.getAttribute("aria-pressed") === "true"; })[0];
    $("#sRepeatVal").textContent = t("rep." + ({none:"once", day:"day", week:"week", month:"month", year:"year"}[chosen ? chosen.dataset.rep : "none"]));
    var ck = editing.cat || "none";
    $("#sCatVal").textContent = t("tcat." + ck);
    /* Olma's guess says so until the person overrules it — an automatic
       choice that looks hand-made is one nobody thinks to correct. */
    $("#sCatAuto").hidden = !editing.catAuto || ck === "none";
    $$("#sCat .chip").forEach(function(c){
      c.setAttribute("aria-pressed", c.dataset.cat === ck ? "true" : "false");
    });
    syncSheetSource();
  }
  /* the category chips are built once from the closed set */
  function buildCatChips(){
    $("#sCat").innerHTML = TASKCATS.map(function(c){
      return '<button class="chip mini cat" aria-pressed="false" data-cat="' + c.k + '">' +
        '<i class="cdot" style="background:' + c.c + '"></i>' + esc(t("tcat." + c.k)) + "</button>";
    }).join("");
  }

  /* ── the list inside the editor ──
     Items are written straight onto the task rather than through commit():
     ticking something off is not editing a field, it is doing the thing. */
  function renderSheetList(freshIdx){
    if(!editing) return;
    var items = editing.items || [], n = items.length, dn = itemsDone(editing);
    $("#sList").innerHTML = items.map(function(it, i){
      return '<div class="litem' + (it.done ? " on" : "") + (i === freshIdx ? " fresh" : "") + '">' +
        '<button class="lbox" data-titem="' + i + '" aria-pressed="' + !!it.done +
        '" aria-label="' + esc(L(it.t)) + '"><svg><use href="#i-check"/></svg></button>' +
        '<span class="ltext"><i>' + esc(L(it.t)) + "</i></span>" +
        '<button class="lrm" data-ritem="' + i + '" aria-label="' + esc(t("sheet.itemRm")) +
        '"><svg><use href="#i-x"/></svg></button></div>';
    }).join("") +
      '<div class="scuehold"><div class="scue" id="listCue"><i></i></div></div>';
    paintCue($("#sList"), $("#listCue"));
    $("#sListSub").textContent = n ? t("sheet.listSub.nN", {done:dn, n:n}) : t("sheet.listSub.n0");
    var pill = $("#sListCount");
    pill.hidden = !n;
    if(n){
      pill.textContent = dn + "/" + n;
      pill.style.setProperty("--p", Math.round(dn / n * 100) + "%");
      pill.classList.toggle("full", dn === n);

  function addItem(){
    var el = $("#sAddItem"), v = el.value.trim();
    if(!v || !editing) return;
    if(!editing.items) editing.items = [];
    editing.items.push({t:both(v), done:false});
    el.value = "";
    renderSheetList(editing.items.length - 1);
    renderTasks(); flashSaved();
  }
  $("#sAddItem").addEventListener("keydown", function(e){ if(e.key === "Enter"){ e.preventDefault(); addItem(); } });
  /* typed and then tapped away is still typed — the same promise the title
     field makes, so a half-added item is never silently thrown out */
  $("#sAddItem").addEventListener("blur", addItem);
  $("#sList").addEventListener("click", function(e){
    var tg = e.target.closest("[data-titem]");
    if(tg){
      var it = editing.items[+tg.dataset.titem];
      it.done = !it.done;
      tg.closest(".litem").classList.toggle("on", it.done);
      renderSheetList();
      renderTasks(); flashSaved();
      return;
    }
    var rm = e.target.closest("[data-ritem]");
    if(rm){
      editing.items.splice(+rm.dataset.ritem, 1);
      if(!editing.items.length) delete editing.items;
      renderSheetList();
      renderTasks(); flashSaved();
    }
  });

  /* ── who else has it ──
     Leaving and deleting are different things and the panel says so: the
     list of people, then what leaving actually does, then the action. */
  /* Adding and removing people is the OWNER's call. On a task somebody else
     opened, the only thing available is leaving it — which is exactly what the
     task_shares rows would allow, so the UI refuses what the server would
     refuse rather than drawing a button that comes back with an error. */
  function canManageShare(){
    return !editing || editing.owner === undefined || editing.owner === 0;
  }
  function renderSheetShare(){
    if(!editing) return;
    var who = (editing.who || []).slice(), shared = who.length > 0, mine = canManageShare();
    $("#sShareSub").textContent = shared ? sharedLine(editing) : t("sheet.notShared");
    $("#sShareFaces").innerHTML = shared ? faceStack(who) : "";
    var rows = "";
    if(shared){
      rows = '<div class="sperson"><span class="face">' + avatarSVG(myAvatar, {g:myGender()}) + "</span>" +
        "<b>" + esc(t("share.you")) + "</b>" +
        (editing.owner === 0 ? "<u>" + esc(t("share.ownerMe")) + "</u>" : "") + "</div>";
      who.forEach(function(id){
        var f = friendById(id);
        if(!f) return;
        rows += '<div class="sperson"><span class="face">' + avatarSVG(f.av, {g:f.g}) + "</span>" +
          "<b>" + esc(L(f.n)) + "</b>" +
          (editing.owner === id ? "<u>" + esc(t(f.g === "f" ? "share.ownerF" : "share.ownerM")) + "</u>" : "") +
          /* taking somebody off happens where they are named */
          (mine ? '<button class="spx" data-off="' + f.id + '" aria-label="' + esc(t("share.remove")) +
            '" title="' + esc(t("share.remove")) + '"><svg><use href="#i-x"/></svg></button>' : "") +
          "</div>";
      });
    }
    $("#sSharePeople").innerHTML = rows;
    $("#sAddRow").hidden = !mine;
    $("#sAddCount").textContent = t("fr.count", {n:FRIENDS.length});
    if(!mine){
      $("#sAddFold").classList.remove("open");
      $("#sAddRow").setAttribute("aria-expanded", "false");
    }
    renderPeoplePick();
    /* only a task somebody else is on can be left, and leaving is not a
       thing you do to a task that is only yours */
    $("#sLeave").hidden = !shared;
    $("#sLeaveNote").hidden = !shared;
  }
  /* Every friend is a chip and the pressed ones are on the task, so sharing
     and un-sharing are one gesture rather than two screens. */
  var PICK_SEARCH_AT = 12, pickQ = "";
  function renderPeoplePick(){
    var who = (editing && editing.who) || [];
    /* Search earns its place at twelve — three rows of faces is where the eye
       stops recognising and starts hunting. Below that a permanent field is
       one more thing to read for no tap saved. */
    var show = FRIENDS.length > PICK_SEARCH_AT;
    $("#pickSearch").hidden = !show;
    var q = show ? pickQ.trim().toLowerCase() : "";
    var list = !q ? FRIENDS : FRIENDS.filter(function(f){
      return (L(f.n) + " " + f.n.he + " " + f.n.en).toLowerCase().indexOf(q) > -1;
    });
    $("#pickEmpty").hidden = !!list.length;
    $("#pickEmpty").textContent = list.length ? "" : t("sheet.pickNone", {q:pickQ.trim()});
    $("#sPeople").innerHTML = list.map(function(f){
      var on = who.indexOf(f.id) > -1;
      return '<button class="pchip" aria-pressed="' + on + '" data-add="' + f.id + '">' +
        '<span class="face">' + avatarSVG(f.av, {g:f.g}) + "</span>" + esc(L(f.n)) + "</button>";
    }).join("");
  }
  /* One writer for both directions, because they are one question: is this
     person on the task. The last person leaving takes the sharing with them —
     no owner, no faces, nothing left to leave — so the task is an ordinary
     one again rather than a shared task that happens to have nobody in it. */
  function togglePerson(id){
    if(!editing) return;
    var f = friendById(id), name = L(editing.t) || t("sheet.untitled");
    if(!editing.who) editing.who = [];
    var i = editing.who.indexOf(id), removing = i > -1;
    if(removing){
      editing.who.splice(i, 1);
      API.unshareTask(editing.id, id);
      if(!editing.who.length){ delete editing.who; delete editing.owner; }
    } else {
      editing.who.push(id);
      /* the first person turns a private task into a shared one, and from then
         on it is clear who started it */
      if(editing.owner === undefined) editing.owner = 0;
      API.shareTask(editing.id, editing.who.slice());
    }
    renderSheetShare();
    renderTasks(); flashSaved();
    var left = (editing.who || []).length;
    toast(removing
      ? (left ? t("toast.tookOff", {who:f ? L(f.n) : ""}) : t("toast.unshared", {name:name}))
      : t("toast.shared", {name:name, who:sharedNames(editing.who)}));
  }
  $("#sPeople").addEventListener("click", function(e){
    var c = e.target.closest("[data-add]");

  $("#sSharePeople").addEventListener("click", function(e){

  $("#sAddRow").addEventListener("click", function(){

    renderPeoplePick(); $("#pickQ").focus();
  });
  function sharedNames(ids){
    var names = ids.map(function(id){ var f = friendById(id); return f ? L(f.n) : ""; }).filter(Boolean);
    if(names.length <= 2) return names.join(D.and);
    return names.slice(0, 2).join(D.and) + t("share.andMore", {n:names.length - 2});
  }
  $("#sListRow").addEventListener("click", function(){
    var on = !$("#sListFold").classList.contains("open");

  });
  $("#sShareRow").addEventListener("click", function(){
    var on = !$("#sShareFold").classList.contains("open");
    $("#sShareFold").classList.toggle("open", on);
    this.setAttribute("aria-expanded", on ? "true" : "false");
    updateSheetCue();
  });
  /* leaving is not deleting: the row goes from MY list and the task itself
     carries on with everyone else, which is what the toast says out loud */
  $("#sLeave").addEventListener("click", function(){
    var id = editing.id, name = L(editing.t) || t("sheet.untitled");
    var wrap = $('.taskwrap[data-id="' + id + '"]');
    closeSheets();
    if(wrap) wrap.classList.add("gone");
    setTimeout(function(){
      var i = open.findIndex(function(o){ return o.id === id; });
      /* Into the archive, not into nothing. Leaving is the one action here
         that feels destructive, and it is the one the person is most likely
         to want back — so it is recoverable by exactly the same button as
         everything else that left the list. */
      if(i > -1){

                          done:{he:T.he["tasks.leftAt"], en:T.en["tasks.leftAt"]}});
        open.splice(i, 1);

      API.leaveTask(id);
      renderTasks(); renderStrip(selDay); toast(t("toast.left", {name:name}));
    }, 460);
  });

  /* `preset` is how a new task can arrive with somebody already on it — the
     shared-task button in Contacts is the only caller, and it hands over the
     one field it knows: who this is with. */
  function openSheet(id, preset){
    var x = id ? open.filter(function(o){ return o.id === id; })[0] : null;
    isNew = !x;

    setTimeout(function(){ if(isNew) $("#sTitle").focus(); }, 380);
  }

  $("#sRepeatRow").addEventListener("click", function(){
    var on = !$("#sRepeatFold").classList.contains("open");
    $("#sRepeatFold").classList.toggle("open", on);
    this.setAttribute("aria-expanded", on ? "true" : "false");
    updateSheetCue();
  });
  $("#sTitle").addEventListener("input", commit);
  $("#sTime").addEventListener("change", commit);
  /* the visible chip is the target; the real <input type=time> is offscreen
     and exists only to raise the platform's own picker */
  $("#sTimeChip").addEventListener("click", function(){
    $("#sTime").focus();
    try{ $("#sTime").showPicker(); }catch(err){}
  });
  $("#sAllDay").addEventListener("click", function(){

  $("#sCatRow").addEventListener("click", function(){
    var on = !$("#sCatFold").classList.contains("open");

  });
  $("#sCat").addEventListener("click", function(e){
    var c = e.target.closest("[data-cat]");
    if(!c) return;
    editing.cat = c.dataset.cat;
    /* choosing one is what retires the "Olma picked this" note — it is now

    editing.catAuto = false;

  });
  $("#sDelete").addEventListener("click", function(){
    var id = editing.id, wrap = $('.taskwrap[data-id="' + id + '"]');
    closeSheets();

     Chrome's own calendar arrives at desktop size in its own colours and

  var calAnchor = null, calY = 0, calM = 0, calPane = "days";
  function ymd(d){
    return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");

    });

      '<button class="calttl" data-calpane="1">' +
        (calPane === "days"
          ? esc(new Date(calY, calM, 1).toLocaleDateString(loc(), {month:"long", year:"numeric"}))
          : esc(String(calY))) +
      "</button>" +
      '<button class="calnav" data-calnav="1" aria-label="next"><svg viewBox="0 0 16 16"><path d="M6 2l6 6-6 6"/></svg></button>' +

      return head + '<div class="calmg">' + monthNames().map(function(n, m){

      }).join("") + "</div>";
    }
    var first = new Date(calY, calM, 1), start = new Date(calY, calM, 1 - first.getDay());
    var cells = "";
    for(var k = 0; k < 42; k++){
      var d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + k), v = ymd(d);

    return head +
      '<div class="calgrid">' + dowNames().map(function(n){ return '<div class="caldow">' + esc(n) + "</div>"; }).join("") + "</div>" +
      '<div class="calgrid">' + cells + "</div>" + quick;

    var below = r.bottom + 10 + h <= window.innerHeight - 8;
    var top = below ? r.bottom + 10 : Math.max(8, r.top - 10 - h);
    pop.style.left = left + "px"; pop.style.top = top + "px";
    pop.style.setProperty("--calo", (r.left + r.width / 2 - left) + "px " + (below ? "0%" : "100%"));
  }

  /* ══════════════════════════════════════════════════════════════
     MEETING COORDINATION
     Several people, one question: when. Each of them marks the parts of a day
     that suit them, and the overlap is arithmetic — no negotiation round trip,
     no model, no guessing. What makes it usable rather than a spreadsheet is
     that the marking surface and the answer are the same object: you see the
     group's density in the cell you are tapping.

     Two rules carried over from the real availability picker, and both matter:
     the four parts TILE the day exactly, so "all day" is their union and
     collapses into them rather than sitting beside them; and a mark is
     availability, never agreement — confirming is a separate, deliberate act,
     which is why the ranked list has its own button and the grid has none.
     ══════════════════════════════════════════════════════════════ */
  var PARTS = ["morning","noon","evening","night"];
  var MEETS = [
    {id:1, t:{he:"פוקר",en:"Poker"}, who:[3,7,10], days:[1,2,3], status:"open",
     marks:{
       0:{},
       3:{1:["evening","night"], 2:["night"], 3:["evening"]},
       7:{1:["evening"], 3:["noon","evening"]}
     }},
    {id:2, t:{he:"קפה עם גלי",en:"Coffee with Gali"}, who:[1], days:[0,1], status:"open",
     marks:{0:{0:["morning"]}, 1:{0:["morning","noon"], 1:["noon"]}}}
  ];
  var mtSeq = 100, mtOpen = null, mtConfirmed = {};

  /* "א, ב ו־ג", never "א ו־ב ו־ג". D.and is the conjunction before the LAST
     name only; everything before it is separated by a comma. Same shape in
     both languages, which is why this is one function and not two. */
  function nameList(names){
    names = names.filter(Boolean);
    if(names.length <= 1) return names[0] || "";
    return names.slice(0, -1).join(", ") + D.and + names[names.length - 1];
  }
  function mtParticipants(m){ return [0].concat(m.who); }
  function mtName(pid){ return pid === 0 ? t("mt.me") : (friendById(pid) ? L(friendById(pid).n) : ""); }
  function mtAnswered(m, pid){
    var mk = m.marks[pid];
    if(!mk) return false;
    for(var k in mk) if(mk[k] && mk[k].length) return true;
    return false;
  }
  function mtMarks(m, pid, day){
    return (m.marks[pid] && m.marks[pid][day]) || [];
  }
  /* How many of us are free at one (day, part). A participant who has not
     answered at all counts as neither free nor busy — they are simply absent
     from the tally, and the "waiting on N" line is what says so. Counting
     silence as availability would produce a confident best option nobody
     agreed to. */
  function mtCount(m, day, part){
    return mtParticipants(m).filter(function(pid){
      return mtMarks(m, pid, day).indexOf(part) > -1;
    }).length;
  }
  function mtAnsweredCount(m){
    return mtParticipants(m).filter(function(pid){ return mtAnswered(m, pid); }).length;
  }
  /* Ranked by how many of us fit, then by soonest, then by the natural order of
     the day — so two equally good options resolve the same way every time
     rather than by whatever order the loop happened to run in. */
  function mtRank(m){
    var out = [];
    m.days.forEach(function(day){
      PARTS.forEach(function(part, pi){
        var n = mtCount(m, day, part);
        if(!n) return;
        out.push({day:day, part:part, n:n, pi:pi});
      });
    });
    out.sort(function(a, b){
      return b.n - a.n || a.day - b.day || a.pi - b.pi;
    });
    return out;
  }
  function mtIsFull(m, o){ return o.n === mtParticipants(m).length; }
  function mtKey(m, o){ return m.id + ":" + o.day + ":" + o.part; }

  function mtCardHTML(m){
    var total = mtParticipants(m).length, said = mtAnsweredCount(m);
    var best = mtRank(m)[0];

      ? t("mt.confirmedAs", {when:mtWhenLabel(mtConfirmed["m" + m.id])})
      : ready ? t("mt.stateReady", {when:mtWhenLabel(best)})
      : said < total ? t("mt.stateWaiting", {n:total - said})
      : best ? t("mt.statePartial", {n:best.n, of:total})
      : t("mt.stateNone");
    return '<div class="group" style="margin-bottom:10px"><button class="mtcard" data-mt="' + m.id + '">' +
      faceStack(m.who) +
      '<span class="mtbody"><span class="mtname">' + esc(L(m.t)) + "</span>" +

        esc(mtIsFull(m, o) ? t("mt.allFree") : t("mt.freeN", {n:o.n, of:total})) + "</span></span>" +
        '<button class="mtgo" data-pick="' + o.day + ":" + o.part + '">' +
        esc(t(isConf ? "mt.picked" : "mt.pick")) + "</button></div>";
    }).join("")
      /* No overlap is a real answer and gets said plainly, rather than an empty
         box that reads as something still loading. */
      : '<div class="empty">' + esc(t(mtAnsweredCount(m) < 2 ? "mt.needMore" : "mt.noWindow")) + "</div>";

  /* ── adding a friend ──
     The question this answers is "who do I already know", and the only honest
     source for that is an address book the person has actually connected. So
     the sheet has two shapes and the state of the integration picks one: it
     never shows an empty list, and it never invents contacts. */
  function contactsSource(){
    for(var i = 0; i < PROV.length; i++){
      var p = PROV[i];
      if(!p.connected) continue;
      for(var j = 0; j < p.svc.length; j++){
        if(p.svc[j].k === "contacts" && p.svc[j].on) return p;
      }
    }
    return null;
  }
  var cnQ = "";
  function renderContacts(){
    var src = contactsSource();
    var has = !!src;
    $("#cnSearchWrap").hidden = !has;
    $("#cnList").hidden = !has;
    $("#cnNone").hidden = has;
    $("#cnFrom").hidden = !has;
    if(!has) return;
    $("#cnFrom").textContent = t("cn.from", {name:src.name});
    /* people already on Olma are not offered again — they are in the list
       above, and inviting an existing friend is the one action here that
       could not possibly be what somebody meant */
    var known = FRIENDS.map(function(f){ return f.n.en; });
    var q = cnQ.trim().toLowerCase();
    var list = CONTACTS.filter(function(c){

      var dx = (pointerXY.x - (r.left + r.width / 2)) / (r.width / 2);
      var dy = (pointerXY.y - (r.top + r.height / 2)) / (r.height / 2);

    });

  /* ───────── tabs ───────── */
  var pill = $("#tabpill"), tabs = $$(".tab");
  pill.style.left = "0px";
  var pillT, sweepT, relaxT;
  function placePill(el, silent){
    /* stretch in proportion to how far it has to go, capped — a jump across
       the whole bar should look elastic, a nudge to the next tab should not */
    var prevX = parseFloat(pill.dataset.x || 0);
    var dist = Math.abs(el.offsetLeft - prevX);
    var fwd = el.offsetLeft >= prevX;
    pill.style.setProperty("--sd", fwd ? 1 : -1);
    /* The origin is the edge going FIRST, so the stretch trails behind the
       movement instead of growing into it. Both are physical values — offsetLeft
       is physical, so this is right in Hebrew and in English without a branch. */
    pill.style.setProperty("--tox", fwd ? "100%" : "0%");
    pill.dataset.x = el.offsetLeft;
    pill.style.width = el.offsetWidth + "px";
    pill.style.transform = "translateX(" + el.offsetLeft + "px)";
    if(dist > 4 && !silent){
      pill.style.setProperty("--sx", (1 + Math.min(dist / 480, .16)).toFixed(3));
      pill.classList.add("travel", "relax");
      pill.classList.remove("sweep"); void pill.offsetWidth; pill.classList.add("sweep");
      clearTimeout(pillT);
      /* the stretch is released well before the travel ends, so the pill is
         already back to its own shape by the time it arrives — and the origin is
         only let go once that relaxation is over, never during it */
      pillT = setTimeout(function(){ pill.classList.remove("travel"); }, 200);
      clearTimeout(relaxT);
      relaxT = setTimeout(function(){ pill.classList.remove("relax"); }, 200 + 440);
      clearTimeout(sweepT);
      sweepT = setTimeout(function(){ pill.classList.remove("sweep"); }, 640);
    }
  }

    try{ sessionStorage.setItem("olma-intro", "1"); }catch(e){}
  }
  /* Where the channels group has to move so it sits in the middle of the
     screen. Measured, not assumed: the same offset is wrong on every phone
     but one, and this has to look deliberate on all of them. */
  function introOffset(){
    var g = $('#toolsStack [data-stage="1"]');
    if(!g) return 0;
    var vh = window.innerHeight || document.documentElement.clientHeight || 0;
    /* No trustworthy viewport height means no centring — the group stays where
       it is and the later stages still do their work. A guessed offset would
       put the one element this stage is about somewhere arbitrary. */
    if(vh < 320) return 0;
    var r = g.getBoundingClientRect();
    var want = vh / 2 - (r.top + r.height / 2);
    /* only ever DOWNWARD: pulling the group up would slide the header off the
       top of the screen, which reads as broken rather than as staged */
    return Math.max(0, Math.round(want));
  }
  /* `arm` false paints the stage without starting its clock. Stage 1 is armed
     that way at load: the very first frame the person sees is already the
     staged composition, and the three seconds only begin once the page is
     genuinely up. Without that split the page appears complete, sits there for
     however long the fonts take, and THEN collapses into stage 1 — which on a
     slow connection is the one thing this must never look like. */
  function introGo(stage, arm){
    if(introDone) return;
    clearTimeout(introT);
    introStage = stage;
    var root = document.documentElement;
    root.classList.remove("intro-1", "intro-2", "intro-3");
    if(stage > INTRO_STAGES){ introFinish(); return; }
    root.classList.add("intro", "intro-" + stage);
    if(stage === 1) root.style.setProperty("--introY", introOffset() + "px");
    if(arm === false) return;
    introT = setTimeout(function(){ introGo(stage + 1); }, INTRO_HOLD);
  }
  function introFinish(){
    if(introDone) return;
    introDone = true;
    clearTimeout(introT);
    var root = document.documentElement;
    root.classList.remove("intro-1", "intro-2", "intro-3");
    /* `intro` comes off one frame later so the last transition can finish
       against the same rules it started under — dropping it in the same tick
       restores the stagger animation mid-move and the page jumps. */
    requestAnimationFrame(function(){
      setTimeout(function(){
        root.classList.remove("intro");
        root.classList.add("intro-settled");
        root.style.removeProperty("--introY");
      }, 700);
    });
    markIntroSeen();
    introUnbind();
  }
  /* Any real intent skips ahead. A tap that also DOES something (choosing a
     channel, opening an account) is both an answer and a skip — it is not
     swallowed, because the listener is on the capture phase of a separate
     handler and never calls preventDefault. */
  var INTRO_EVENTS = ["pointerdown", "keydown", "wheel", "touchstart"];
  function introNudge(){
    if(introDone) return;
    introGo(introStage + 1);
  }
  function introUnbind(){
    INTRO_EVENTS.forEach(function(ev){
      document.removeEventListener(ev, introNudge, {capture:true});
    });
  }
  function startIntro(){
    if(introSeen()) return;
    if(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches){
      markIntroSeen();
      return;
    }
    /* stage 1 is painted NOW, unarmed — see introGo */
    introGo(1, false);
    INTRO_EVENTS.forEach(function(ev){
      document.addEventListener(ev, introNudge, {capture:true, passive:true});
    });
    /* The clock starts when the PAGE is ready, not when the script parses.
       document.fonts.ready is the honest signal — the layout this animation
       measures is not final until the real face is in — and it is raced
       against a ceiling so a font that never arrives cannot hold the intro
       open forever. Then one frame, so the first stage is painted before its
       three seconds begin counting. */
    var started = false;
    function begin(){
      if(started || introDone) return;
      started = true;
      /* re-measure before arming: the offset taken at load was measured against
         a layout the real font had not landed in yet */
      requestAnimationFrame(function(){ if(introStage === 1) introGo(1); });
    }
    if(document.fonts && document.fonts.ready) document.fonts.ready.then(begin);
    setTimeout(begin, 2500);
  }
  startIntro();
  $("#introTog").addEventListener("click", function(){
    try{ sessionStorage.removeItem("olma-intro"); }catch(e){}
    document.documentElement.classList.remove("intro-settled");
    introDone = false; introStage = 0;
    go("tools");
    startIntro();
    introGo(1);
  });

  /* preview only: L flips the language, standing in for the person
     having switched languages mid-conversation. Not product UI. */
  function setLocale(v){
    if(v === LOCALE) return;
    LOCALE = v; D = T[LOCALE];
    $$("#langTog span").forEach(function(el, i){ el.classList.toggle("on", (i ? "en" : "he") === LOCALE); });
    renderAll();
  }
  $$("#langTog span").forEach(function(el, i){ el.classList.toggle("on", (i ? "en" : "he") === LOCALE); });
  $("#langTog").addEventListener("click", function(){ setLocale(LOCALE === "he" ? "en" : "he"); });
  document.addEventListener("keydown", function(e){
    if(e.key !== "l" && e.key !== "L" && e.key !== "ל") return;
    if(e.target && e.target.closest && e.target.closest("input, textarea")) return;
    setLocale(LOCALE === "he" ? "en" : "he");
  });
})();
</script>
