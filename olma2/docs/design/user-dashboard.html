.fact .fdel{flex:none;width:28px;height:28px;border-radius:50%;color:var(--text-3);display:grid;place-items:center;font-size:13px}
.fact .fdel:active{background:var(--bg-tint);color:var(--danger)}
.factwrap.gone{grid-template-rows:0fr;opacity:0;pointer-events:none}
.factwrap.arriving{grid-template-rows:0fr}
.fact.fresh{background:var(--accent-soft)}
/* the answer on its way from the card into the list */
.factfly{
  position:fixed;z-index:90;pointer-events:none;margin:0;
  padding:7px 13px;border-radius:999px;background:var(--action);color:var(--on-action);
  font-size:13.5px;font-weight:600;white-space:nowrap;max-width:80vw;overflow:hidden;text-overflow:ellipsis;
  box-shadow:var(--shadow-m);
}

/* ─────────────────────────  tab bar  ───────────────────────── */
.tabbar{
  position:fixed;bottom:18px;inset-inline:0;margin-inline:auto;
  width:max-content;max-width:calc(100% - 24px);
  /* ~8% larger than it was first drawn: at 22px icons the bar read as a
     caption strip rather than as the app's main control. Every number in the
     bar moves together — icon, label, padding, radius and the pill's inset —
     because scaling one of them alone is what makes a control look stretched
     rather than bigger. */
  display:flex;gap:2px;padding:7px;border-radius:26px;z-index:60;
  background:var(--bar);border:.5px solid var(--glass-line);
  /* Its own lens, not the shared one: LESS blur and MORE saturation than a
     card, which is what makes the bar answer to whatever scrolls under it —
     colours and shapes stay recognisable through it instead of being ground
     down into an even wash. */
  -webkit-backdrop-filter:var(--lens-bar);
  backdrop-filter:var(--lens-bar);
  box-shadow:var(--shadow-m),var(--rim-soft);
}
/* The pill travelled at a constant shape, which reads as a rectangle being
   moved. Stretching it along its direction of travel and letting it settle
   is what makes it read as one liquid thing following your finger. */
.tabpill{
  position:absolute;top:7px;height:calc(100% - 14px);border-radius:19px;overflow:hidden;
  background:var(--accent-soft);z-index:0;
  box-shadow:0 2px 10px rgba(0,0,0,.10),var(--rim-soft);
  transform-origin:50% 50%;
  transition:transform .58s var(--ease-io),width .58s var(--ease-io),
             scale .42s var(--ease-io),transform-origin 0s;
}
/* Two things made one direction read as a hop backwards. The stretch was
   centred, so half of it grew AGAINST the travel; and it relaxed on --squash,
   an overshoot curve, so the trailing edge shot past its mark and came back —
   which is exactly what a bounce looks like. Now the origin is pinned to the
   LEADING edge, so the pill only ever smears out behind itself, and it
   relaxes on the same ease it travels with. */
.tabpill.travel{scale:var(--sx,1.12) .92;transform-origin:var(--tox,50%) 50%}
/* The origin has to outlive the stretch. Drop it the moment `.travel` goes and
   the origin snaps back to centre while `scale` is still on its way home — which
   moves the painted box by half the leftover stretch, instantly, mid-travel.
   That is a hop, and it is the one you can see. `.relax` holds the origin until
   the scale is genuinely 1, where moving it costs nothing. */
.tabpill.relax{transform-origin:var(--tox,50%) 50%}
/* Light sliding across the lens as it moves. This is the one thing that
   makes the pill read as glass rather than as a coloured rectangle that
   changed position, so it gets its own class and its own clock — the
   stretch settles early on purpose, the light does not. */
.tabpill::after{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(105deg,transparent 34%,rgba(255,255,255,.55) 50%,transparent 66%);
  opacity:0;
}

/* ─────────────────────────  sheet  ───────────────────────── */
.scrim{
  position:fixed;inset:0;z-index:80;background:rgba(12,11,17,.42);
  -webkit-backdrop-filter:blur(9px) saturate(140%);backdrop-filter:blur(9px) saturate(140%);

  -webkit-backdrop-filter:var(--lens);backdrop-filter:var(--lens);
  padding:10px 18px calc(24px + env(safe-area-inset-bottom));

   so it is not one more sheet in the layer — it is the top of it, and it has
   to beat the bumped ones too. It sat at 82 beside #mtOptSheet, lost that tie
   to DOM order (later markup wins), and opened UNDERNEATH the sheet whose chip
   had just been tapped: the tap read as doing nothing at all, and what showed
   was a strip of the hidden picker above the sheet (the owner, 2026-09-22).

   above the title is the grab area. `touch-action:none` or the browser
   scrolls the sheet's contents instead of moving the sheet. */

  touch-action:none;-webkit-tap-highlight-color:transparent;
}

  transition:background var(--sw-t) var(--ease-io),width var(--sw-t) var(--ease-io);

/* ── the way out ──
   A zero-height sticky hold, like the scroll cue at the bottom: the X stays
   in the corner however far the sheet has scrolled, and takes no layout. It
   sits at the END side — the left in Hebrew — which is where iOS puts it in
   a right-to-left language. */

  position:absolute;top:-4px;inset-inline-end:-6px;width:32px;height:32px;border-radius:50%;

   A sheet and the checklist inside it can each outgrow their box, and a hard
   edge at the cut reads as a rendering fault rather than as a list carrying
   on. One line answers it in both places: it lights up only when there is
   somewhere to scroll, and the bright part is how much of the whole you are
   looking at, and where. It rides a zero-height sticky element, so it stays

<div class="app">

  <header class="topbar">
    <button class="brand" id="brandBtn" data-go="me">
      <!-- The mark came back on 2026-09-28 (the owner), after being taken
           out on 2026-09-26 with the old logo. -->
      <svg class="bmark" aria-hidden="true"><use href="#i-logo"/></svg>
      <div class="brand-txt">
        <div class="brand-hi" id="brandHi"></div>
        <div class="brand-name" id="brandName"></div>
      </div>
    </button>
    <div class="hdrend">
      <button class="topclock" id="topClock" data-i18n-label="city.title"></button>
      <button class="daynight" id="dayNight" type="button"><svg aria-hidden="true"><use href="#i-moon"/></svg></button>
    </div>
  </header>

  <main>
  <!-- ══════════════  connections  ══════════════ -->
  <section class="view active" data-view="tools">
    <div class="title" style="--i:0">
      <h1 id="toolsH"></h1>
      <p id="homeP"></p>
    </div>
    <!-- The home page used to list today's rows and the coordinations waiting
         on YOU here, above the cards (2026-09-27). The owner took it out a day
         later as too busy: the title line still says how many of each, and the
         cards are one tap from both. -->
    <!-- The home cards: what she is holding for you, one tap from its page.
         A new person used to land on a grid of services, see nothing of their
         own and leave without finding the tab bar (the owner, 2026-09-26). -->
    <!-- The invitation to install (see .inst): drawn by installMaybe(), only
         where installing can work, and never inside the installed app. -->
    <div class="inst" id="inst" role="region" hidden>
      <span class="inst-mark" id="instMark" aria-hidden="true"></span>
      <b data-i18n="inst.h"></b>
      <p id="instP"></p>
      <ol class="inst-steps" id="instSteps" hidden></ol>
      <div class="inst-acts">

    </div>
    <div class="homecards" data-stage="0">
      <button class="homecard" data-go="tasks">
        <svg class="homeicon"><use href="#i-list"/></svg>
        <span class="homenum" id="homeTasksN">0</span>
        <span class="homeplus" aria-hidden="true"><svg><use href="#i-plus"/></svg></span>

      <button class="homecard" data-go="cal">

        <span class="homeplus" aria-hidden="true"><svg><use href="#i-plus"/></svg></span>
        <b id="homeMeetsL"></b>
        <i id="homeMeetsSub"></i>
        <svg class="chev homechev"><use href="#i-chev"/></svg>
      </button>

    <!-- The apps they hold (see .apps): food, game nights. Drawn by
         renderApps() from the server's `apps`, and where there is one the

    <div class="apps" id="apps" role="region" hidden>
      <h2 class="appsh" data-i18n="apps.h"></h2>
      <div class="appsrow" id="appsRow"></div>
    </div>
    <div class="invite" id="invite" role="region" hidden>

    <div class="stack" style="--i:1" id="toolsStack"></div>
  </section>

  <!-- ══════════════  tasks  ══════════════ -->
  <section class="view" data-view="tasks">
    <div class="title" style="--i:0">
      <h1 data-i18n="tasks.h"></h1>
      <p id="taskCount"></p>
    </div>
    <!-- two ways to read the same list, and nothing else on the row -->
    <div class="viewrow" style="--i:1">
      <div class="seg mini" id="taskView">
        <button aria-pressed="true"  data-view-by="time" data-i18n="cat.byTime"></button>
        <button aria-pressed="false" data-view-by="cat"  data-i18n="cat.byCat"></button>
      </div>
      <button class="addmini" id="addTask"><svg><use href="#i-plus"/></svg><span data-i18n="tasks.new"></span></button>
    </div>
    <div style="--i:2">
      <div id="suggWrap"></div>
      <div class="swhint" id="taskHint" aria-live="polite"><div><p><svg><use href="#i-swipe"/></svg><span></span></p></div></div>
      <div class="stack" id="taskStack"></div>
    </div>
    <div class="archive" id="archive" style="--i:3">
      <button class="arcbtn" id="arcBtn" aria-expanded="false">
        <svg class="chev"><use href="#i-chev"/></svg>
        <span data-i18n="tasks.archive"></span>
        <span id="arcCount" style="margin-inline-start:auto;font-weight:500"></span>
      </button>
      <div class="fold" id="arcFold"><div>
        <div class="group" id="arcGroup" style="box-shadow:none;background:var(--surface-2)"></div>
        <button class="arcnote" id="arcNote" hidden></button>
      </div></div>
    </div>
  </section>

  <!-- ══════════════  calendar  ══════════════ -->
  <section class="view" data-view="cal">
    <div class="title" style="--i:0">
      <h1 data-i18n="cal.h"></h1>
      <p id="calSub"></p>
    </div>
    <!-- Two modes, not two pages. Reading the week and arranging something in
         it are the same subject, and the same segment control the task list
         already uses says so. Coordination comes FIRST and is where the tab
         opens (owner, 2026-09-15): the week is on the phone's own calendar
         already, and arranging something with other people is the part only
         this page does. -->
    <div class="viewrow" style="--i:1">
      <div class="seg mini" id="calMode">
        <button aria-pressed="true"  data-calmode="meet" data-i18n="cal.modeMeet"></button>
        <button aria-pressed="false" data-calmode="cal"  data-i18n="cal.modeRead"></button>
      </div>
      <!-- Starting one is the first thing you might want here, so it sits at
           the top with the control that got you to this mode — not at the far
           end of however many coordinations you already have. -->
      <button class="addmini" id="mtNew"><svg><use href="#i-plus"/></svg><span data-i18n="mt.new"></span></button>
    </div>

    <div id="calRead" hidden>
      <div style="--i:2">
        <div class="group">
          <!-- A week strip that could only ever show the next seven days was
               a calendar you could not look ahead in. The arrows page a week
               at a time and stop exactly where the data does: /me/events
               fetches two weeks back and four forward, so paging past that
               would show empty days that are empty only because nobody
               asked Google about them. -->
          <div class="stripmonth">
            <button class="calnav wknav" data-wk="-1" id="wkPrev"><svg viewBox="0 0 16 16"><path d="M10 2 4 8l6 6"/></svg></button>
            <!-- The label is also the way to a far day: it opens the same date
                 popover every other date on this page does, bounded to the
                 same window the arrows are. -->
            <button class="stripttl" id="stripTtl" data-cal="jump"><span id="stripMonth"></span><span id="stripYear"></span></button>
            <button class="wkback" id="wkToday" hidden data-i18n="cal.thisWeek"></button>
            <button class="calnav wknav" data-wk="1" id="wkNext"><svg viewBox="0 0 16 16"><path d="M6 2l6 6-6 6"/></svg></button>
          </div>
          <div class="daystrip" id="daystrip"></div>
        </div>
      </div>
      <div style="--i:3;margin-top:24px">
        <div class="glabel"><span id="agendaLabel"></span></div>
        <div class="group" id="agenda"></div>
      </div>
      <div style="--i:4;margin-top:20px">
        <!-- This was a button that showed "opening your default calendar" and
             opened nothing (reported 2026-09-15). A web page cannot reliably
             reach the phone's own calendar app — the schemes are blocked in
             WhatsApp's browser and a failure is invisible — so it opens the
             calendar Olma actually reads, on the day on screen, and is not
             offered at all to someone with no Google calendar connected. -->
        <a class="bigbtn" id="calOpen" target="_blank" rel="noopener" hidden>
          <svg><use href="#i-out"/></svg><span data-i18n="cal.open"></span>
        </a>
      </div>
    </div>

    <div id="calMeet">
      <div style="--i:2">
        <div class="swhint" id="mtHint" aria-live="polite"><div><p><svg><use href="#i-swipe"/></svg><span></span></p></div></div>
        <div class="stack" id="mtList"></div>
      </div>
      <!-- The same archive the task list has, for the same reason. Settled
           ones leave the active list — they are calendar entries now, not
           questions — and so do the ones you left, which used to vanish
           outright. Leaving is one tap and its commonest cause is a mis-tap,
           so it needs a way back; ↺ on a row you left puts you back in and
           tells the others, because they were told when you went. -->
      <div class="archive" id="mtArchive" style="--i:3;margin-top:20px" hidden>
        <button class="arcbtn" id="mtArcBtn" aria-expanded="false">
          <svg class="chev"><use href="#i-chev"/></svg>
          <span data-i18n="mt.done"></span>
          <span id="mtArcCount" style="margin-inline-start:auto;font-weight:500"></span>
        </button>
        <div class="fold" id="mtArcFold"><div>
          <div class="stack" id="mtDone"></div>
          <p class="arcnote" id="mtArcNote" hidden></p>
        </div></div>
      </div>
      <div class="archive mthow" id="mtHow" style="--i:3;margin-top:8px">
        <button class="arcbtn" id="mtHowBtn" aria-expanded="false">
          <svg class="chev"><use href="#i-chev"/></svg>
          <span data-i18n="mt.how"></span>
        </button>
        <div class="fold" id="mtHowFold"><div>
          <p class="note" data-i18n="mt.note"></p>
        </div></div>
      </div>
    </div>
  </section>

  <!-- ══════════════  friends  ══════════════ -->
  <section class="view" data-view="friends">
    <div class="title" style="--i:0">
      <h1 data-i18n="fr.h"></h1>
    </div>
    <!-- Adding somebody comes BEFORE the lists: this page is where you come
         to grow them, and the action you came for should not be below
         everything you already have. Both actions share one row because they
         are the same question asked at two sizes — one person, or a set of
         them you will reach for again. -->
    <div class="viewrow pair" style="--i:1">
      <button class="addmini" id="addFriend"><svg><use href="#i-plus"/></svg><span data-i18n="fr.invite"></span></button>
      <button class="addmini ghost groupsblock" id="addGroup"><svg><use href="#i-plus"/></svg><span data-i18n="gr.new"></span></button>
    </div>
    <div style="--i:2" class="groupsblock">
      <div class="glabel grlab"><span data-i18n="gr.h"></span><span class="hint" data-i18n="gr.hint"></span></div>
      <div class="searchwrap" id="groupSearch" hidden>
        <svg class="sicon"><use href="#i-search"/></svg>
        <input id="groupQ" type="search" autocomplete="off" data-i18n-ph="gr.search" data-i18n-label="gr.search">
        <button class="sclear" id="groupQClear" hidden data-i18n-label="fr.clear">&#10005;</button>
      </div>
      <div class="grscroll" id="groupScroll"><div class="group" id="groupGroup"></div></div>
      <p class="note" id="groupEmpty" style="padding:0 14px" hidden></p>
    </div>
    <div style="--i:3;margin-top:24px">
      <div class="glabel"><span data-i18n="fr.connected"></span><span class="hint" id="friendCount"></span></div>
      <div class="searchwrap" id="friendSearch" hidden>
        <svg class="sicon"><use href="#i-search"/></svg>
        <input id="friendQ" type="search" autocomplete="off" data-i18n-ph="fr.search" data-i18n-label="fr.search">
        <button class="sclear" id="friendQClear" hidden data-i18n-label="fr.clear">&#10005;</button>
      </div>
      <div class="group" id="friendGroup"></div>
      <p class="note" id="friendEmpty" style="padding:0 14px" hidden></p>
    </div>
  </section>

  <!-- ══════════════  profile  ══════════════
       Six rows, in the order a person reaches for them: who I am, when she
       may write, the summary she sends, who she is to me, my tasks, and what
       she knows.
       Every control here saves as it changes — there is no save button, and
       the row label's quiet "saved" is the only receipt, because a form that
       asks you to confirm your own hours is asking twice. -->
  <section class="view" data-view="me">
    <div class="hero-profile" style="--i:0">
      <div class="avatar" id="bigAvatar"></div>
      <div class="who">
        <b id="whoName"></b>
        <button class="linkbtn" id="shuffleAvatar" data-i18n="me.avatar"></button>
      </div>
    </div>
    <div class="stack" style="--i:1">
      <!-- Six rows, each saying what is set right now; a tap opens that
           card's own controls in place (the owner, 2026-09-30). Every control
           keeps its id, so the handlers below never learned about the rows. -->
      <div class="group profrows" id="profRows">
        <button class="srow prow" aria-expanded="false" aria-controls="pfAbout">
          <span class="stile st-cal"><svg><use href="#i-person"/></svg></span>
          <span class="stx"><span class="slab" data-i18n="me.personal"></span><span class="sval" id="pvAbout"></span></span>
          <svg class="chev"><use href="#i-chev"/></svg>
        </button>
        <div class="fold" id="pfAbout"><div><div class="pfin">
          <div class="pfpad">
            <div class="fgrid">
              <div class="ffield"><label for="fname" data-i18n="me.first"></label><input id="fname" type="text" maxlength="40" autocomplete="given-name"></div>
              <div class="ffield"><label for="lname" data-i18n="me.last"></label><input id="lname" type="text" maxlength="40" autocomplete="family-name"></div>
              <div class="ffield"><label for="bday" data-i18n="me.bday"></label><button class="dateval" id="bday" data-cal="bday" data-calstart="1990-06-15" data-calmin="1900-01-01" data-val=""></button></div>
              <div class="ffield">
                <label id="genderLabel" data-i18n="me.form"></label>
                <div class="seg" id="genderSeg" role="group" aria-labelledby="genderLabel">
                  <button aria-pressed="false" data-g="m" data-i18n="me.masc"></button>
                  <button aria-pressed="false" data-g="f" data-i18n="me.fem"></button>
                </div>
              </div>
            </div>
          </div>
          <p class="note pnote" data-i18n="me.formNote"></p>
        </div></div></div>

        <!-- When she may start a conversation. Hours, days, and chagim are one
             question — "when do you not want to hear from me" — so they are one
             row, and the note under it says what still gets through. -->
        <button class="srow prow" aria-expanded="false" aria-controls="pfWhen">
          <span class="stile st-sea"><svg><use href="#i-moon"/></svg></span>
          <span class="stx"><span class="slab"><span data-i18n="me.when"></span><span class="savedmark" id="whenSaved" data-i18n="me.saved"></span></span><span class="sval" id="pvWhen"></span></span>
          <svg class="chev"><use href="#i-chev"/></svg>
        </button>
        <div class="fold" id="pfWhen"><div><div class="pfin">
          <div class="row no-icon whenrow">
            <div class="row-txt">
              <div class="row-title" data-i18n="me.hours"></div>
              <div class="row-sub" id="hoursSub"></div>
            </div>
            <div class="whenvals hoursvals">
              <button class="vchip set" id="hoursFrom"></button>
              <span class="hoursdash" aria-hidden="true">–</span>
              <button class="vchip set" id="hoursTo"></button>
            </div>
          </div>
          <div class="row no-icon stackrow">
            <div class="rowline">
              <div class="row-txt">
                <div class="row-title" data-i18n="me.quietDays"></div>
                <div class="row-sub" id="quietSub"></div>
              </div>
            </div>
            <div class="daypick" id="quietDays" role="group" data-i18n-label="me.quietDays"></div>
          </div>
          <div class="row no-icon">
            <div class="row-txt">
              <div class="row-title" data-i18n="me.holidays"></div>
              <div class="row-sub" id="holidaySub"></div>
            </div>
            <button class="switch" role="switch" aria-checked="false" id="holidaySwitch" data-i18n-label="me.holidays"></button>
          </div>
          <div class="row no-icon stackrow">
            <div class="rowline"><div class="row-title" data-i18n="me.calendar"></div></div>
            <div class="seg" id="calendarSeg" role="group" data-i18n-label="me.calendar">
              <button aria-pressed="false" data-calkind="jewish" data-i18n="me.cal.jewish"></button>
              <button aria-pressed="false" data-calkind="christian" data-i18n="me.cal.christian"></button>
              <button aria-pressed="false" data-calkind="muslim" data-i18n="me.cal.muslim"></button>
            </div>
          </div>
          <p class="note pnote" id="whenNote"></p>
        </div></div></div>

        <!-- The daily summary. Off is a real answer, so the switch leads and the
             times only unfold once there is a summary to time. -->
        <button class="srow prow" aria-expanded="false" aria-controls="pfDigest">
          <span class="stile st-gold"><svg><use href="#i-sun"/></svg></span>
          <span class="stx"><span class="slab"><span data-i18n="me.digest"></span><span class="savedmark" id="digestSaved" data-i18n="me.saved"></span></span><span class="sval" id="pvDigest"></span></span>
          <svg class="chev"><use href="#i-chev"/></svg>
        </button>
        <div class="fold" id="pfDigest"><div><div class="pfin">
          <div class="row no-icon">
            <div class="row-txt">
              <div class="row-title" data-i18n="me.digestOn"></div>
              <div class="row-sub" id="digestSub"></div>
            </div>
            <button class="switch" role="switch" aria-checked="false" id="digestSwitch" data-i18n-label="me.digestOn"></button>
          </div>
          <div class="fold" id="digestFold"><div><div class="foldpad tight">
            <div class="flabel" data-i18n="me.digestTimes"></div>
            <div class="digestvals"><button class="vchip set" id="digestTime"></button></div>
            <div class="flabel" data-i18n="me.digestScope"></div>
            <div class="seg" id="digestScope" role="group" data-i18n-label="me.digestScope">
              <button aria-pressed="false" data-scope="today" data-i18n="me.scope.today"></button>
              <button aria-pressed="false" data-scope="summary" data-i18n="me.scope.summary"></button>
              <button aria-pressed="false" data-scope="full" data-i18n="me.scope.full"></button>
            </div>
          </div></div></div>
        </div></div></div>

        <button class="srow prow" aria-expanded="false" aria-controls="pfSetup">
          <span class="stile st-share"><svg><use href="#i-bubble"/></svg></span>
          <span class="stx"><span class="slab" data-i18n="me.setup"></span><span class="sval" id="pvSetup"></span></span>
          <svg class="chev"><use href="#i-chev"/></svg>
        </button>
        <div class="fold" id="pfSetup"><div><div class="pfin">
          <div class="pfpad">
            <div class="fgrid">
              <div class="ffield">
                <label data-i18n="me.where"></label>
                <button class="dateval cityval" id="cityRow"><span id="cityName"></span><span class="row-end" id="cityClock"></span></button>
              </div>
              <div class="ffield">
                <label for="oname" data-i18n="me.calledBy"></label>
                <input id="oname" type="text" maxlength="18" autocomplete="off" data-i18n-label="me.calledBy">
              </div>
            </div>
          </div>
          <p class="note pnote" id="setupNote"></p>
          <div class="row no-icon stackrow">
            <div class="rowline"><div class="row-title" data-i18n="me.language"></div></div>
            <div class="chips" id="langChips" role="group" data-i18n-label="me.language"></div>
          </div>
          <!-- Light, dark or the phone's own setting. It sat beside the clock on
               every tab, three unlabelled icons for a choice made once (the
               owner, 2026-09-27); here it has words. -->
          <div class="row no-icon stackrow">
            <div class="rowline"><div class="row-title" id="themeLabel" data-i18n="me.appearance"></div></div>
            <div class="seg themeseg" id="themeIcons" role="group" aria-labelledby="themeLabel">
              <button data-theme-opt="light" aria-pressed="false"><svg><use href="#i-sun"/></svg><span data-i18n="me.themeLight"></span></button>
              <button data-theme-opt="dark" aria-pressed="false"><svg><use href="#i-moon"/></svg><span data-i18n="me.themeDark"></span></button>
              <button data-theme-opt="auto" aria-pressed="true"><svg><use href="#i-auto"/></svg><span data-i18n="me.themeAuto"></span></button>
            </div>
          </div>
        </div></div></div>

        <button class="srow prow" aria-expanded="false" aria-controls="pfTasks">
          <span class="stile st-cal"><svg><use href="#i-list"/></svg></span>
          <span class="stx"><span class="slab" data-i18n="me.tasksRow"></span><span class="sval" id="pvTasks"></span></span>
          <svg class="chev"><use href="#i-chev"/></svg>
        </button>
        <div class="fold" id="pfTasks"><div><div class="pfin">
          <div class="row no-icon">
            <div class="row-txt">
              <div class="row-title" data-i18n="me.taskCal"></div>
              <div class="row-sub" data-i18n="me.taskCalSub"></div>
            </div>
            <button class="switch" role="switch" aria-checked="false" id="taskCalSwitch" data-i18n-label="me.taskCal"></button>
          </div>
          <!-- "לנדנד לי", the standing switch, is gone (owner, 2026-10-03): the
               nudge is chosen per task now ("🔁 נודניק" in the sheet), and two
               things called nudging on one page read as one. Nobody had it on;
               users.reminder_nudge and its write stay for the chat. -->
        </div></div></div>

        <!-- What she knows. Closed by default like every row here: it is a list
             that grows. Open, it leads with three questions — each saved one
             leaves, lands in the list below, and the next takes its place. -->
        <button class="srow prow" id="factsRow" aria-expanded="false" aria-controls="factsFold">
          <span class="stile st-sea"><svg><use href="#i-note"/></svg></span>
          <span class="stx"><span class="slab" data-i18n="me.knows"></span><span class="sval" id="factsSub"></span></span>
          <svg class="chev"><use href="#i-chev"/></svg>
        </button>
        <div class="fold" id="factsFold"><div><div class="foldpad tight">
          <div class="fqhead" id="fqHead">
            <b data-i18n="me.fqTitle"></b>
            <span data-i18n="me.fqHint"></span>
          </div>
          <div class="fqlist" id="factQs"></div>
          <div class="flabel factshead" id="factsHead" data-i18n="me.factsList"></div>
          <div class="factlist" id="factList"></div>
          <p class="note" id="factsEmpty" hidden data-i18n="me.factsEmpty"></p>
        </div></div></div>
      </div>

      <div class="pausewrap">
        <button class="pausebtn" id="pauseBtn" aria-pressed="false">
          <svg id="pauseIcon"><use href="#i-pause"/></svg><span id="pauseLabel"></span>
        </button>
        <p class="note" id="pauseNote"></p>
      </div>
      <div class="delwrap">
        <button class="linkbtn danger" id="delAcctBtn" data-i18n="me.deleteAll"></button>
      </div>

      <!-- The three public pages, last thing on the settings tab: the place a
           person goes looking for "the fine print", and nowhere else, so no
           other tab grows a footer above the tab bar. Plain same-host links,
           so they open the page itself rather than anything this script
           draws. The class prefix `legalfoot` is used nowhere else. -->
      <nav class="legalfoot" data-i18n-label="legal.nav">
        <a class="legalfoot-a" href="/privacy" data-i18n="legal.privacy"></a>
        <span class="legalfoot-dot" aria-hidden="true">·</span>
        <a class="legalfoot-a" href="/terms" data-i18n="legal.terms"></a>
        <span class="legalfoot-dot" aria-hidden="true">·</span>
        <a class="legalfoot-a" href="/accessibility" data-i18n="legal.a11y"></a>
      </nav>
    </div>
  </section>
  </main>
</div>

<!-- While she is paused, this is the page: the rest sits blurred behind it. -->
<div class="pausegate" id="pauseGate" role="dialog" aria-modal="true" aria-labelledby="pgTitle">
  <div class="pgcard">
    <span class="pgicon" aria-hidden="true"><svg><use href="#i-pause"/></svg></span>

     the first sentence has to be theirs, in their own language, because it is
     what tells her which language to speak. -->

    <p class="wlede" id="wTag"></p>

         back is a link from her, one message away, so that leads. -->

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sTitle">
  <div class="sgrab"><i class="grabber"></i></div>
  <div class="sxhold"><button class="sx" type="button" data-sx data-i18n-label="sheet.close"><svg><use href="#i-x"/></svg></button></div>
  <!-- The heading of a sheet is not usually typeable, so it needs to say that
       it is: a pencil while editing, and on a brand-new task a field with a
       check beside it. The check with no name asks for one; a task CLOSED
       after something was chosen is saved as "משימה ללא שם 1", never thrown
       away. Everything below still saves as you type. -->
  <div class="stitlewrap">
    <input class="stitle" id="sTitle" type="text" data-i18n-ph="sheet.taskPh" data-i18n-label="sheet.task" autocomplete="off">
    <span class="stedit" id="sTitleEdit" aria-hidden="true"><svg><use href="#i-pencil"/></svg></span>
    <button class="stgo" id="sTitleGo" hidden><svg><use href="#i-check"/></svg></button>
  </div>
  <p class="sneed" id="sNeed" role="status" hidden></p>
  <!-- The category is the least interesting thing about a task (owner,
       2026-09-30), so it is not a row any more: a tag under the title, with
       its colour, and "Olma picked this" beside it until the person answers.
       It stays visible in listmode — it is one line, and it is what the
       by-category view sorts on. -->
  <div class="catline" id="sCatLine">
    <button class="catchip" id="sCatRow" aria-expanded="false" data-i18n-label="cat.h">
      <i class="cdot" id="sCatDot"></i><span id="sCatVal"></span>
      <small id="sCatAuto" hidden>· <span data-i18n="cat.auto"></span></small>
    </button>
    <div class="catfold" id="sCatFold"><div>
      <div class="chips" id="sCat"></div>
    </div></div>
  </div>
  <!-- Where it came from, said once at the top, so the greyed rows further
       down do not each have to explain themselves. -->
  <div class="srcline" id="sSrc" hidden>
    <span class="srcmark"><svg id="sSrcIcon"><use href="#i-monday"/></svg></span>
    <span id="sSrcTxt"></span>
  </div>
  <!-- The list is what the task IS, so when it has one it heads the sheet.
       A task with no items shows no list row at all: the "list" tile below
       opens it, and the first item typed turns the whole sheet into
       listmode — the items on top, everything else behind one "details"
       row (owner, 2026-09-30: "when I open a list it doesn't open straight
       away and I see all the settings"). -->
  <div class="group" id="sListGroup" hidden>
    <button class="row no-icon" id="sListRow" aria-expanded="false">
      <div class="row-txt"><div class="row-title" data-i18n="sheet.list"></div>
        <div class="row-sub" id="sListSub"></div></div>
      <span class="tcount" id="sListCount" hidden></span>
      <svg class="chev"><use href="#i-chev"/></svg>
    </button>
    <div class="fold" id="sListFold"><div>
      <div class="listbox" id="sList"></div>
      <div class="row no-icon additemrow">

               data-i18n-ph="sheet.addItem" data-i18n-label="sheet.addItem" autocomplete="off">
      </div>
    </div></div>
    <!-- Only in listmode: everything below, said in one line. -->
    <button class="row no-icon" id="sDetailsRow" aria-expanded="false">
      <div class="row-txt"><div class="row-title" data-i18n="sheet.details"></div>
        <div class="row-sub" id="sDetailsSub"></div></div>
      <svg class="chev"><use href="#i-chev"/></svg>
    </button>
  </div>
  <!-- Every row is a sentence: a small label saying what the row is, and the
       value said the way a person would say it ("tomorrow, 09:00"). Rows that
       hold nothing are not here; they wait as tiles under "you can also". -->
  <div class="group lfold" id="sMainGroup">
    <button class="srow" id="sWhenRow" aria-expanded="false">
      <span class="stile st-cal"><svg><use href="#i-cal"/></svg></span>
      <span class="stx"><span class="slab" data-i18n="sheet.when"></span><span class="sval" id="sWhenSay"></span><span id="sErepDots"></span><span class="sval slock"><svg><use href="#i-lock"/></svg><span data-i18n="sheet.afterName"></span></span></span>
      <svg class="chev"><use href="#i-chev"/></svg>
    </button>
    <!-- "When" opens in place, as two short lines: the day, then the hour.
         The week strip and the four hours are only the common answers — "more"
         is the page's own calendar and "other" its own clock wheel, the same
         two every other date and time on the page opens. -->
    <div class="fold" id="sWhenFold"><div><div class="wpad">
      <div class="wline"><span class="wkey" data-i18n="sheet.day"></span>
        <span class="wpk" id="sDayPk">

      <div class="wweekwrap" id="sWeekWrap" hidden>

        <button class="wmore" id="sDateRow" data-cal="task" data-quick="1" data-i18n="sheet.moreDates"></button>
      </div>
      <!-- An hour is an answer to a question there is no day for yet, so the
           line waits for a date. -->
      <div class="wline" id="sHourLine"><span class="wkey" data-i18n="sheet.addTime"></span>
        <span class="wpk" id="sHourPk">

          <button data-hour="12:00">12:00</button>
          <button data-hour="16:00">16:00</button>
          <button data-hour="20:00">20:00</button>
          <button id="sTimeChip"><svg><use href="#i-clock"/></svg><span id="sTimeVal"></span></button>
          <button class="quiet" id="sAllDay" role="switch" aria-checked="false" data-i18n="sheet.allDay"></button>
        </span></div>
      <!-- Where it STOPS: a shift used to be a title with its hours typed
           into it — `משמרת - ראשון 12:00-19:00` — because there was nowhere
           else to put them. Offered once there is a start, because an end
           with nothing to end is not a time. -->
      <span class="endline" id="sEndLine">
        <button class="endlink" id="sEndChip"><span id="sEndVal"></span></button>
        <button class="endx" id="sEndClear" hidden data-i18n-label="sheet.endClear"><svg><use href="#i-x"/></svg></button>
      </span>
      <input id="sTime" type="time" tabindex="-1" aria-hidden="true"
             style="position:absolute;opacity:0;pointer-events:none;width:1px;height:1px">
      <input id="sEnd" type="time" tabindex="-1" aria-hidden="true"
             style="position:absolute;opacity:0;pointer-events:none;width:1px;height:1px">
    </div></div></div>
    <div class="srow" id="sRemindRow">
      <span class="stile st-bell"><svg><use href="#i-bell"/></svg></span>
      <span class="stx"><span class="slab" data-i18n="sheet.remind"></span>
        <span class="sval" id="sRemSay"><span id="remindSub"></span>
          <button class="sinl" id="sRemInl" aria-expanded="false"><span id="sRemInlVal"></span><svg><use href="#i-chev"/></svg></button></span>
        <span class="sval off" id="sRemOff" data-i18n="sheet.sum.noRem"></span>

    </div>
    <!-- Which KIND of reminder (owner, 2026-10-03, option ב): a regular one,

         kind of repeat — under "חזרה" it read as one more rhythm. Shown only

    <div class="nagkind" id="sKindWrap" hidden>
      <div class="chips nagk-row" id="sKind">
        <button class="chip nagk" aria-pressed="true" data-kind="plain">

      <span class="vseg" id="sRemindAtSeg" hidden>
        <button class="vseg-b set" id="sRemindAtChip" data-i18n-label="sheet.remindAt">

    <button class="srow" id="sRepeatRow" aria-expanded="false" hidden>

    <!-- "Add to calendar" is a promise about a specific calendar, and with

<!-- ══════════════  meeting coordination  ══════════════
     The grid is the whole idea: rows are the candidate days, columns are the
     four parts of a day, and one tap says "this suits me". Everyone else's
     answers show as a count inside the same cell — so you are marking your own
     availability and reading the group's at once, in one object, rather than
     submitting a form and waiting to be told.

     The four parts tile the day exactly and "all day" is their union, which is
     why ticking all four collapses into it rather than sitting beside it: the
     same sentence, said shorter. -->
<div class="sheet" id="mtSheet" role="dialog" aria-modal="true" aria-labelledby="mtTitle">
  <div class="sgrab"><i class="grabber"></i></div>
  <div class="sxhold"><button class="sx" type="button" data-sx data-i18n-label="sheet.close"><svg><use href="#i-x"/></svg></button></div>
  <!-- The name is editable in place, the same way a task's is (owner,
       2026-10-04): anybody in it may rename it, as in the chat. The h2 stays
       as the dialog's accessible name. -->
  <h2 id="mtTitle" hidden></h2>
  <div class="stitlewrap">
    <input class="stitle" id="mtTitleIn" type="text" maxlength="120" enterkeyhint="done" data-i18n-label="mt.name" autocomplete="off">
    <span class="stedit" aria-hidden="true"><svg><use href="#i-pencil"/></svg></span>
  </div>
  <!-- Its category, from a list of its own — work, family, friends, sport,

<script>
(function(){
  "use strict";
  /* No zoom, iOS edition. Safari ignores user-scalable=no on purpose, so the
     pinch is cancelled where it starts: Safari's own gesture events, and any
     move with two fingers down. Nothing on this page is a two-finger control. */
  ["gesturestart", "gesturechange", "gestureend"].forEach(function(ev){
    document.addEventListener(ev, function(e){ e.preventDefault(); }, {passive:false});
  });
  document.addEventListener("touchmove", function(e){
    if(e.touches.length > 1) e.preventDefault();
  }, {passive:false});
  var $  = function(s,r){ return (r||document).querySelector(s); };
  var $$ = function(s,r){ return Array.prototype.slice.call((r||document).querySelectorAll(s)); };
  /* A value written into an input only when the person is not standing in
     it — every repaint on this page can land while somebody is typing. */
  function setField(el, v){ if(el && el !== document.activeElement) el.value = v; }

  /* Appearance: which of the two palettes the stylesheet already defines is
     showing. Stored on THIS DEVICE only (localStorage) — it is how the page
     looks, never something Allma reads or a fact about the person, so it
     never touches /me/act. "Auto" is not a third value to apply — it is the
     ABSENCE of data-theme, which is what the CSS already follows on its own
     via prefers-color-scheme, live, with no JS. Read first thing, before
     anything paints, so a stored choice never flashes the wrong palette. */
  var THEME_KEY = "olma.theme";
  function applyTheme(v){
    if(v === "light" || v === "dark") document.documentElement.setAttribute("data-theme", v);
    else document.documentElement.removeAttribute("data-theme");
  }
  var THEME = (function(){
    try{
      var v = localStorage.getItem(THEME_KEY);
      return (v === "light" || v === "dark") ? v : "auto";
    }catch(err){ return "auto"; }
  })();
  applyTheme(THEME);
  /* What is showing NOW, whoever decided it: a stored choice, or the phone. */
  var DARK_MQ = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null;
  function showingDark(){ return THEME === "dark" || (THEME === "auto" && !!(DARK_MQ && DARK_MQ.matches)); }
  function renderTheme(){
    $$("#themeIcons button").forEach(function(b){
      b.setAttribute("aria-pressed", b.dataset.themeOpt === THEME ? "true" : "false");
    });
    /* the band's button shows where a tap goes: a moon by day, a sun by night */
    var dn = $("#dayNight"), dark = showingDark();
    dn.querySelector("use").setAttribute("href", dark ? "#i-sun" : "#i-moon");
    /* the words wait for the strings, which are defined further down */
    if(D) dn.setAttribute("aria-label", t(dark ? "home.toDay" : "home.toNight"));
  }
  function setTheme(v){
    THEME = v;
    try{
      if(THEME === "auto") localStorage.removeItem(THEME_KEY);
      else localStorage.setItem(THEME_KEY, THEME);
    }catch(err){ /* private mode or storage blocked — still applies for this visit */ }
    applyTheme(THEME);
    renderTheme();
  }
  $("#dayNight").addEventListener("click", function(){ setTheme(showingDark() ? "light" : "dark"); });
  if(DARK_MQ && DARK_MQ.addEventListener) DARK_MQ.addEventListener("change", renderTheme);
  $("#themeIcons").addEventListener("click", function(e){
    var b = e.target.closest("[data-theme-opt]");
    if(!b || b.dataset.themeOpt === THEME) return;
    setTheme(b.dataset.themeOpt);
  });
  renderTheme();

  /* ══════════════════════════════════════════════════════════════
     THE SEAM — where this becomes the real dashboard
     ──────────────────────────────────────────────────────────────
     Every state change in this page is local: an array is edited and the
     view is redrawn. That is deliberate — the interaction design is what
     this file is for. But nothing here has to be re-thought to wire it up,
     because every mutation ALSO reports itself through one object. Replace
     these bodies with `fetch('/api/…')` (or with the MCP tool of the same
     name) and the UI does not change a line.

     Where each thing lives in the real system:

       open / archived   →  tasks            (owner_id, title, due_at, status,
                                              category, parent_id, archived_at)
       x.items           →  tasks.parent_id, one row per line — the same
                            self-referential nesting projects already use, so
                            a checklist needs no new table
       x.who / x.owner   →  task_shares      (owner_id, viewer_id, scope,
                                              status) — `owner` is the row's
                            owner_id, `who` is every active viewer_id, and
                            that is exactly why leaving and deleting are two
                            different actions in the UI
       FRIENDS[].p       →  connection_feature_grants (sharing | meetings |
                            messages), one row per side per feature
       PROVIDERS[].svc   →  integrations     (provider, scope 'read_only' |
                                              'read_write', status)
       defaultChannel    →  users.digest_scope / the outbox channel
       TASKCATS          →  tasks.category — a CLOSED set here because the
                            server validates it as one (like
                            KNOWN_CONNECTION_FEATURES), not a free-text field
       x.src / SOURCES   →  the per-platform import. `caps` is the honest
                            intersection with OUR columns; a field the source
                            cannot hold is greyed here and must stay
                            unwritable there, or the next sync silently
                            discards a change the person made
       MEETS             →  meetings + meeting_participants. An answer is
                            availability; settling one is the confirm gate —
                            status only becomes 'confirmed' when somebody
                            deliberately settles it, and where not everyone
                            agreed that takes a second, differently-worded
                            press naming who is being left out
       MEETS[].opts      →  the candidate slots. Each is a real moment: a
                            date plus either a canonicalPart or an exact
                            time, or neither when the meeting is all_day.
                            Everybody sees the same table and anybody in the
                            coordination may add to it or take from it — five
                            places, no proposal waiting on anyone's approval
       MEETS[].ans       →  meeting_availability, one row per person per
                            option, 'y' or 'n'. ABSENT is a third value and
                            has to stay one: folding "has not answered" into
                            "cannot" would let the confirm gate read silence
                            as a refusal
       MEETS[].left      →  meeting_participants.left_at. They are still
                            shown and counted in nothing — the group has to
                            be able to see why the tally dropped
       MEETS[].inCal     →  whether the settled slot sits on THIS person's
                            calendar. Private, and not the same thing as
                            being in the meeting — which is why they are two
                            controls, in two places, with two different words
       CONTACTS          →  the connected contacts integration, read-only —
                            never a table of ours, and never browsed unasked
       MEETS[].settled   →  meetings.confirmed_start_at

     The vocabulary is already the server's: `read`/`write` are `read_only`/
     `read_write`, ids are integers, and a person is a user id everywhere —
     never a phone number, which is what the real schema does too.
     ══════════════════════════════════════════════════════════════ */
  /* Every entry logs the REAL name the server knows the action by — the MCP
     tool where one exists, the table where it is an operator action. Naming
     them anything else would mean wiring this up twice: once to make the UI
     work, and once to find out what each of these was supposed to have been.

     The four marked NO TOOL YET are real gaps, not oversights in this file: the
     agent has no way to perform them today and the dashboard does them by
     direct write. They are named here as what they would be called, so the gap
     is visible rather than discovered during wiring. */
  var TOOL = {
    saveTask:            "add_task",                  /* an edit is the same call with an id */
    /* An imported task is not ours to create, and writing one back through
       add_task would be the second copy of somebody else's row. It goes to the
       source's own import path — which is also the place that must refuse a
       field the source cannot hold, exactly as the greyed rows promise. */
    saveImportedTask:    "update_imported_task",        /* NO TOOL YET — per-source import */
    deleteTask:          "delete_task",               /* NO TOOL YET — dashboard only; the chat archives */
    completeTask:        "complete_task",
    restoreTask:         "restore_task",              /* NO TOOL YET — list_my_archive only reads */
    snoozeTask:          "snooze_task",
    setReminder:         "set_task_reminder",
    shareTask:           "share_task_with",
    unshareTask:         "revoke_share",
    leaveTask:           "leave_task",                /* NO TOOL YET — dashboard only */
    setCategory:         "set_task_category",         /* NO TOOL YET — tasks.category */
    setServiceMode:      "start_calendar_connection", /* integrations.scope, per service */
    setFriendPermission: "set_connection_feature",    /* on=false when off */
    setDefaultChannel:   "set_primary_channel",       /* NO TOOL YET — dashboard only, users.setPrimaryChannel */
    setTimezone:         "set_my_timezone",
    inviteContact:       "request_connection",
    removeFriend:        "revoke_connection",
    startMeeting:        "start_meeting_coordination",
    setAvailability:     null,                        /* the /pick/ page is retired; this page IS the picker now */
    confirmSlot:         "respond_to_meeting_slot",   /* propose_meeting_slot proposes it */
    leaveMeeting:        "leave_meeting",              /* NO TOOL YET — meeting_participants.left_at */
    cancelMeeting:       "cancel_meeting",             /* the page offers it only between two people */
    rejoinMeeting:       "rejoin_meeting",             /* NO TOOL YET — dashboard only */
    reopenMeeting:       "reopen_meeting",             /* a settled time back on the table */
    setMeetingPlace:     "set_meeting_place",
    setMeetingTitle:     "set_meeting_title",
    setMeetingCategory:  "set_meeting_title",         /* its optional `category` */
    setMeetingTime:      "propose_meeting_slot",       /* on a settled one it sets the hour */
    pause:               "pause_olma",
    resume:              "resume_olma",
    setName:             "set_my_name",
    setPersonal:         null,                        /* dashboard only — users.gender / birth_date */
    setAssistant:        "set_assistant_persona",
    setLocale:           "set_my_language",
    setAvailability:     "remember_preference",       /* key "availability" */
    setQuietDays:        "remember_preference",       /* keys "quiet_days" + "holiday_calendar" */
    setDigest:           "set_digest_preferences",
    setCalendarSync:     "set_calendar_task_sync",
    setReminderNudge:    "set_task_reminder",          /* per reminder in chat; this switch is the standing one */
    forgetFact:          "forget_fact",
    answerFactPrompt:    "remember_fact"               /* composed server-side from a question */
  };
  /* The server's own action names (domain/user-dashboard-write.js). Where a
     seam has no entry there is genuinely nothing to call yet, and it is left
     to log rather than given a plausible-looking name — a wired-looking call
     that lands nowhere is worse than an obvious gap. */
  var ACT = {
    addTask:"addTask", editTask:"editTask", completeTask:"completeTask",
    archiveTask:"archiveTask", deleteTask:"deleteTask", restoreTask:"restoreTask",
    setReminder:"setReminder", cancelReminder:"cancelReminder",
    setTaskReminder:"setTaskReminder", setTaskCalendar:"setTaskCalendar",
    shareTask:"shareTask", revokeShare:"revokeShare", leaveTask:"leaveTask", setTaskPin:"setTaskPin",
    setTaskOrder:"setTaskOrder", nestTask:"nestTask", unnestTask:"unnestTask",
    grantFeature:"grantFeature", revokeFeature:"revokeFeature", revokeConnection:"revokeConnection",
    setTimezone:"setTimezone", setDefaultChannel:"setDefaultChannel",
    pause:"pause", resume:"resume", callMe:"callMe", deleteAccount:"deleteAccount",
    requestMoreCalls:"requestMoreCalls",
    inviteContact:"inviteContact", inviteShared:"inviteShared",
    respondToMeeting:"respondToMeeting", leaveMeeting:"leaveMeeting", cancelMeeting:"cancelMeeting",
    rejoinMeeting:"rejoinMeeting", reopenMeeting:"reopenMeeting",
    setMeetingPlace:"setMeetingPlace", setMeetingTime:"setMeetingTime", setMeetingTitle:"setMeetingTitle",
    setMeetingCategory:"setMeetingCategory",
    startMeeting:"startMeeting", addOption:"addOption", answerOption:"answerOption",
    settleMeeting:"settleMeeting",
    removeOption:"removeOption", swapOption:"swapOption", setQuorum:"setQuorum",
    startGoogle:"startGoogle", stopGoogle:"stopGoogle",

     CHARACTERS — flat illustration, not a cartoon sticker. Three
     things keep the set adult rather than childish, and all three are
     constraints rather than decoration:
       · a CLOSED palette (three circle tones, six coats, one ink) —
         nothing here picks a colour freely;
       · flat fills only — no gradient, no gloss, no catchlight;
       · the classic long shadow, cast at 45° in a darker tone of the
         circle it falls on, which is what gives a flat face depth.
     One shared face rig sits under every species, so blinking,
     eye-tracking and the sleep state work on anything added later.
     ══════════════════════════════════════════════════════════════ */

  function n2(v){ return (Math.round(v * 100) / 100); }
  function roundPoly(pts, r, f){
    var n = pts.length, d = "";

  /* The sentence is built AROUND the name rather than with it: the template is
     split on its own {name} placeholder, so the wording stays one string in one
     place and only the word inside the slot ever moves. */
  function defSentenceHTML(){
    var parts = t("ch.defSub", {name:"\u0000"}).split("\u0000"), w = chanName(defaultChannel);
    return esc(parts[0]) + '<span class="wordslot" id="defWord">' +
      '<i class="wghost">' + esc(w) + '</i><i class="wnow">' + esc(w) + "</i></span>" +
      esc(parts[1] || "");
  }
  /* Out downward, in from above, on the switch's clock. The hidden twin takes
     the new word FIRST, so the slot is already the right width before anything
     starts moving — otherwise the sentence around it reflows mid-animation. */
  function swapWord(slot, text){
    if(!slot) return;
    var cur = slot.querySelector("i.wnow");
    if(!cur || cur.textContent === text) return;
    slot.querySelector("i.wghost").textContent = text;
    var nw = document.createElement("i");
    nw.className = "wnow win";
    nw.textContent = text;
    cur.className = "wout";
    slot.appendChild(nw);
    setTimeout(function(){
      if(cur.parentNode) cur.parentNode.removeChild(cur);
      nw.classList.remove("win");
    }, SW_MS);
  }
  /* A count that changes ROLLS to its new value instead of blinking into it.
     The slot is built the first time a counter is written, so the page's own
     markup stays a plain <p>/<span> and nothing has to be kept in sync — and
     the first paint, which has nothing to roll from, simply sets the text. */
  /* An empty state with a way out of it. `go` names a control that is already
     on the page — pressing this presses that one, so there is no second code
     path to keep in step with the first. */
  function emptyBig(text, go, label, icon){
    return '<div class="empty emptybig"><p>' + esc(text) + "</p>" +
      '<button class="emptygo" data-emptygo="' + go + '">' +
      '<svg><use href="#' + (icon || "i-plus") + '"/></svg>' + esc(label) + "</button></div>";
  }
  function rollText(el, text){
    if(!el) return;
    var slot = el.firstElementChild;
    if(slot && slot.className === "wordslot"){ swapWord(slot, text); return; }
    el.textContent = "";
    slot = document.createElement("span");
    slot.className = "wordslot";
    slot.innerHTML = '<i class="wghost"></i><i class="wnow"></i>';
    slot.firstChild.textContent = text;
    slot.lastChild.textContent = text;
    el.appendChild(slot);
  }
  /* A row leaving a list folds instead of blinking out — measured, because
     max-height only animates between two real numbers and none of these rows
     has a height anybody wrote down. `done` runs when the fold is over, so a
     caller can splice and redraw behind it. Under reduced motion the whole
     transition is a millisecond and the callback still lands, in order. */
  var FOLD_MS = 240;
  function foldAway(el, done){
    if(!el){ if(done) done(); return; }
    el.style.maxHeight = el.scrollHeight + "px";
    el.style.overflow = "hidden";
    void el.offsetWidth;
    el.classList.add("folding");
    el.style.maxHeight = "0px";
    el.style.opacity = "0";
    el.style.pointerEvents = "none";
    if(done) setTimeout(done, FOLD_MS);
  }
  /* Somebody who has asked their system for less movement. The stylesheet
     honours it on its own; these are the two places JS decides to move
     something and CSS never sees the decision. */
  var REDUCED = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  /* The owner's pick (2026-09-30): finishing something throws a little
     confetti from where it was ticked — a small burst for a task, a bigger
     one for a list that just got its last item. Once per tick, never looping,
     gone in under a second, and nothing at all for REDUCED. */
  function confetti(from, n, spread){
    if(REDUCED || !from || !document.body.animate) return;
    var r = from.getBoundingClientRect(), cs = getComputedStyle(document.documentElement);
    if(!r.width) return;  /* nothing on screen to throw it from */
    var x = r.left + r.width / 2, y = r.top + r.height / 2;
    var cols = ["--gold-arc", "--accent", "--drop-line", "--no-arc"].map(function(v){ return cs.getPropertyValue(v).trim(); });
    for(var i = 0; i < n; i++){
      var p = document.createElement("i");
      var w = Math.random() < .5 ? 7 : 5, h = Math.random() < .5 ? w : 11;
      p.className = "conf";
      p.style.cssText = "left:" + (x - w / 2) + "px;top:" + (y - h / 2) + "px;width:" + w + "px;height:" + h + "px;background:" + cols[i % 4] + (h === w ? ";border-radius:50%" : "");
      document.body.appendChild(p);
      var a = Math.random() * Math.PI * 2, d = spread + Math.random() * spread;
      var dx = Math.cos(a) * d, dy = Math.sin(a) * d - 18;
      p.animate([
        {transform:"translate(0,0) rotate(0) scale(.6)", opacity:1},
        {transform:"translate(" + dx * .8 + "px," + dy * .8 + "px) rotate(" + (Math.random() * 200 - 100) + "deg) scale(1)", opacity:1, offset:.55},
        {transform:"translate(" + dx + "px," + (dy + 34) + "px) rotate(" + (Math.random() * 360 - 180) + "deg) scale(.8)", opacity:0}
      ], {duration:620 + Math.random() * 260, easing:"cubic-bezier(.2,.7,.3,1)"}).onfinish = p.remove.bind(p);
    }
  }

  /* ───────── swipe to delete, on every list ─────────
     The tasks list and the coordinations list take a row off the same way the
     times inside a coordination always have (mtOpts, below): slide it, the red
     underneath names what will happen, press the red. With a mouse there is
     no slide, so the trash sits on the row and takes two clicks. The latch and
     the armed trash are STATE, not classes left on nodes, because every write
     on this page ends in a redraw — each row's HTML asks swClass/swDel. */
  var SW = {open:null, armed:null};
  var SW_OPEN = 104, SW_LATCH = .34;
  /* Which way a row slides to show its red: towards the END of the line, so
     the red appears at the START, where its word is. -1 is leftwards (Hebrew).
     The other way used to open it too, and showed a red strip on the far side
     with no word on it — a rim of red that meant nothing (owner, 2026-09-23).
     That way now gives a small give and no red at all (swPull). */
  function swSign(){ return document.documentElement.getAttribute("dir") === "ltr" ? 1 : -1; }
  function swPull(mx, lim){
    var s = swSign(), along = mx * s;
    return along >= 0 ? s * Math.min(lim, along) : s * Math.max(-10, along / 4);
  }
  /* The red, cut to the strip a row dragged `dx` px has uncovered — and none
     when it went the other way. */
  function swClip(back, dx){
    if(!back) return;
    if(dx !== null && dx * swSign() <= 0) dx = 0;
    back.style.clipPath = dx === null ? "" : dx === 0 ? (swSign() < 0 ? "inset(0 0 0 100%)" : "inset(0 100% 0 0)") : dx < 0
      ? "inset(0 0 0 calc(100% - " + (-dx) + "px))" : "inset(0 calc(100% - " + dx + "px) 0 0)";
  }
  function swClass(key){ return (SW.open === key ? " open" : "") + (SW.armed === key ? " armed" : ""); }
  function swBack(verb){
    return '<button type="button" class="swback" data-swgo tabindex="-1"><svg><use href="#' +
      (verb === "leave" ? "i-out" : "i-trash") + '"/></svg>' + esc(t("sw." + verb)) + "</button>";
  }
  function swDel(key, verb){
    var on = SW.armed === key, lbl = t(on ? (verb === "leave" ? "sw.againLeave" : "sw.again") : "sw." + verb);
    return '<button type="button" class="swdel' + (on ? " arm" : "") + '" data-swdel aria-label="' + esc(lbl) +
      '" title="' + esc(lbl) + '"><svg><use href="#' + (verb === "leave" ? "i-out" : "i-trash") + '"/></svg></button>';
  }
  /* Stands a latched row or an armed trash down without a redraw, so the row
     slides home under its own transition instead of snapping. */
  function swRest(){
    if(SW.open == null && SW.armed == null) return false;
    SW.open = SW.armed = null;
    $$(".swr.open,.swr.armed").forEach(function(r){ r.classList.remove("open", "armed"); });
    $$(".swdel.arm").forEach(function(b){ b.classList.remove("arm"); });
    return true;
  }
  /* One list, wired once. `act(row)` is what pressing the red (or the armed
     trash) does; `refuse(row)` is said when a locked row is slid. */
  function swipeList(box, act, refuse){
    var sw = null, x0 = 0, y0 = 0, dx = 0, axis = "", swallow = false;
    box.addEventListener("pointerdown", function(e){
      swallow = false;
      if(e.pointerType === "mouse") return;
      var el = e.target.closest(".swr");
      if(!el || e.target.closest(".swback")) return;
      sw = el; x0 = e.clientX; y0 = e.clientY; dx = 0; axis = "";
    });
    box.addEventListener("pointermove", function(e){
      if(!sw) return;
      /* A long press already lifted this task to move it: that gesture owns
         the finger now, and a row sliding sideways under it would be two
         things happening at once. */
      if(document.documentElement.classList.contains("dragging-task")){ sw.classList.remove("dragging"); sw = null; return; }
      var mx = e.clientX - x0, my = e.clientY - y0;
      if(!axis){
        if(Math.abs(mx) < 6 && Math.abs(my) < 6) return;
        axis = Math.abs(mx) > Math.abs(my) ? "x" : "y";
        if(axis === "x"){ sw.classList.add("dragging"); swHintDone(); }
      }
      if(axis !== "x") return;
      var lim = sw.classList.contains("locked") ? 14 : SW_OPEN;
      dx = swPull(mx, lim);
      var front = sw.querySelector(".swfront");
      if(front) front.style.transform = "translateX(" + dx + "px)";
      swClip(sw.querySelector(".swback"), dx);
    });
    var end = function(){
      if(!sw) return;
      var el = sw, moved = dx * swSign(), dragged = axis === "x", front = el.querySelector(".swfront");
      sw = null; axis = ""; dx = 0;
      el.classList.remove("dragging");
      if(front) front.style.transform = "";
      swClip(el.querySelector(".swback"), null);
      /* A press that never became a slide is a press, and is left alone. */
      if(!dragged) return;
      swallow = true;
      if(el.classList.contains("locked")){
        el.classList.remove("nope"); void el.offsetWidth; el.classList.add("nope");
        if(refuse) refuse(el);
        return;
      }
      var key = moved > SW_OPEN * SW_LATCH ? el.dataset.sw : null;
      SW.open = key; SW.armed = null;
      $$(".swr").forEach(function(r){ r.classList.toggle("open", r.dataset.sw === key); r.classList.remove("armed"); });
      $$(".swdel.arm").forEach(function(b){ b.classList.remove("arm"); });
    };
    box.addEventListener("pointerup", end);
    box.addEventListener("pointercancel", end);
    /* Capture, so this runs before the list's own click handler: a slide is
       not a tap, the red and the trash are this module's, and a tap anywhere
       while a row sits open is the answer "no" — it closes the row and does
       nothing else. */
    box.addEventListener("click", function(e){
      if(swallow){ swallow = false; e.stopPropagation(); e.preventDefault(); return; }
      var row = e.target.closest(".swr");
      if(e.target.closest("[data-swgo]") && row){ e.stopPropagation(); swRest(); act(row); return; }
      var del = e.target.closest("[data-swdel]");
      if(del && row){
        e.stopPropagation();
        if(SW.armed === row.dataset.sw){ swRest(); act(row); return; }
        swRest();
        SW.armed = row.dataset.sw;
        row.classList.add("armed");
        del.classList.add("arm");
        del.setAttribute("aria-label", del.title = t(row.dataset.verb === "leave" ? "sw.againLeave" : "sw.again"));
        return;
      }
      if(swRest()){ e.stopPropagation(); e.preventDefault(); }
    }, true);
  }
  /* Anywhere else on the page stands them down too. */
  document.addEventListener("click", function(e){ if(!e.target.closest(".swr")) swRest(); });

  /* ── the first time, the page shows it ──
     A gesture nobody can see is a feature nobody has, so the first time each
     list is on screen with something in it, its first row slides part of the
     way by itself, shows the red, and comes back — with one line saying what
     that was. Once per list per device (owner, 2026-09-23), only on a touch
     screen (a mouse has its trash on the row), and never over an empty list:
     there is nothing to show. */
  var SW_SEEN_KEY = "olma.swipeSeen", swSeenNow = {}, swHintT = null;
  function swSeen(list){
    if(swSeenNow[list]) return true;
    try{ return (localStorage.getItem(SW_SEEN_KEY) || "").split(",").indexOf(list) > -1; }catch(err){ return false; }
  }
  function swMarkSeen(list){
    swSeenNow[list] = true;
    try{
      var had = (localStorage.getItem(SW_SEEN_KEY) || "").split(",").filter(Boolean);
      if(had.indexOf(list) < 0) had.push(list);
      localStorage.setItem(SW_SEEN_KEY, had.join(","));
    }catch(err){}
  }
  function swHintDone(){
    clearTimeout(swHintT);
    $$(".swhint.on").forEach(function(h){ h.classList.remove("on"); });
  }
  function swPeek(list, box, hint){
    if(swSeen(list) || !box || !window.matchMedia || !window.matchMedia("(hover:none)").matches) return;
    if(!box.getClientRects().length) return;                 /* not on screen */
    /* The row that shows what the line under it says — delete on the tasks,
       leave on the coordinations — and any row that can move, failing that. */
    var row = box.querySelector('.swr[data-verb="' + (list === "tasks" ? "delete" : "leave") + '"]') ||
      box.querySelector(".swr:not(.locked)");
    if(!row) return;                                          /* nothing to show */
    var r = row.getBoundingClientRect();
    if(r.top < 0 || r.bottom > innerHeight) return;           /* would play unseen */
    swMarkSeen(list);
    $("p span", hint).textContent = t(list === "tasks" ? "sw.hintTasks" : "sw.hintMeets");
    hint.classList.add("on");
    clearTimeout(swHintT);
    swHintT = setTimeout(swHintDone, 6000);
    if(REDUCED) return;
    setTimeout(function(){
      if(!document.body.contains(row) || SW.open) return;
      row.classList.add("peek");
      setTimeout(function(){ row.classList.remove("peek"); }, 950);
    }, 780);                     /* once the line has settled, not under it */
  }
  /* Asked after the view shows and after the data lands; it is a no-op every
     time after the first, so asking often is free. */
  function swMaybePeek(){
    setTimeout(function(){
      var v = document.documentElement.getAttribute("data-v");
      if(v === "tasks") swPeek("tasks", $("#taskStack"), $("#taskHint"));
      else if(v === "cal" && !$("#calMeet").hidden) swPeek("meets", $("#mtList"), $("#mtHint"));
    }, 650);
  }

  function defaultPicker(){
    /* A call is not a place a reminder can wait — this choice is about where
       WRITING arrives, so it offers the written channels and nothing else,
       whether or not the phone tile is switched on.
       On a real account it offers only the channels that EXIST. Today that is
       WhatsApp and nothing else, so there is no choice to make and the picker
       does not appear: a segmented control with one live option and one that
       cannot be reached is a decision presented to somebody who has none. */
    var live = CHANNELS.filter(function(c){ return !c.call && (!LIVE || c.on); });
    if(live.length < 2) return "";
    return '<div class="group defrow" data-stage="1b" style="margin-top:12px">' +
      '<div class="row no-icon defhead">' +
      '<div class="row-txt"><div class="row-title">' + esc(t("ch.defH")) + "</div>" +
      '<div class="row-sub" id="defSentence">' + defSentenceHTML() + "</div></div>" +
      "</div>" +
      '<div class="row no-icon defpick"><div class="seg defseg">' + live.map(function(c){
        return '<button aria-pressed="' + (c.id === defaultChannel) + '" data-def="' + c.id + '">' +
          '<svg><use href="#' + c.icon + '"/></svg>' +
          "<span>" + esc(c.name || t("ch.call")) + "</span></button>";
      }).join("") + "</div></div></div>";
  }

  /* ── a call is armed before it rings ──
     A minute of voice costs about a hundred times what a message does, so this
     is the one control in the app that must not fire on a pocket tap. The
     first press only ARMS it, and says so; the second one rings. The armed
     state disarms itself after eight seconds, because a button left loaded is
     the same accident one screen later.

     Arming is not instant either, and that is honest rather than theatrical:
     the bridge really does have to be brought up before a call can be placed.
     The wait is where that happens. */
  var CALL_ARM_MS = 700, CALL_HOLD_MS = 4000, callT = null, callHoldT = null;
  function setCallState(el, st){
    el.dataset.state = st;
    el.querySelector("i").textContent = t({
      idle:"ch.callSub", arming:"ch.callArm", ready:"ch.callReady", ringing:"ch.calling"
    }[st]);
  }
  function pressCall(el){
    var st = el.dataset.state || "idle";
    if(st === "arming" || st === "ringing") return;
    clearTimeout(callT); clearTimeout(callHoldT);
    if(st === "idle"){
      setCallState(el, "arming");
      callT = setTimeout(function(){
        setCallState(el, "ready");
        /* it disarms on its own — never silently, since the caption is what
           told them it was loaded in the first place */
        callHoldT = setTimeout(function(){ setCallState(el, "idle"); }, CALL_HOLD_MS);
      }, CALL_ARM_MS);
      return;
    }
    setCallState(el, "ringing");
    el.classList.add("ringing");
    toast(t("toast.calling"));
    /* The one action on this page whose failure cannot be left to the silent
       reload: nothing on screen changed, so a refusal that says nothing reads
       as a phone that is about to ring and never does. */
    if(LIVE) API.send("callMe", {}, function(data){
      if(!data){ clearTimeout(callT); el.classList.remove("ringing"); setCallState(el, "idle"); toast(t("toast.callFailed")); }
    });
    callT = setTimeout(function(){
      el.classList.remove("ringing");
      setCallState(el, "idle");
    }, 1600);
  }
  /* Once both calls are used the same tile asks for more, once. It just
     records the ask for later manual review — nothing on screen implies the
     phone is about to ring again — so the only thing that changes is the
     tile settling into its "sent" state. */
  function pressRequestMore(el){
    if(el.classList.contains("requested")) return;
    API.send("requestMoreCalls", {}, function(data){
      if(!data) return; /* refused or offline: nothing on screen claims it worked */
      el.classList.add("requested");
      el.setAttribute("inert", "");
      var i = el.querySelector("i");
      if(i) i.textContent = t("ch.callRequested");
      toast(t("toast.moreRequested"));
    });
  }

  /* ── one row per account, opening where it stands ── */
  function glyphs(p){
    var mine = CATS.filter(function(c){
      return p.svc.some(function(x){ return x.k === c.k; });
    });
    if(!mine.length) return "";
    return '<div class="glyphs">' + mine.map(function(c, i){
      var on = p.svc.some(function(x){ return x.k === c.k && x.on; });
      return '<span style="--i:' + i + '" class="' + (on ? "" : "off") + '" data-cat="' + c.k +
        '" title="' + esc(t("cat." + c.k)) + (on ? "" : " · " + esc(t("cat.off"))) +
        '"><svg><use href="#' + c.icon + '"/></svg></span>';
    }).join("") + "</div>";
  }
  /* The whole service list is ONE grid rather than a row of separate flex
     rows: an `auto` column sizes itself to the widest access control in the
     account, so every one of them lands on the same axis without a single
     hard-coded width. */
  function ctlFor(p, sv, i){
    if(!sv.on) return "";
    if(!sv.w) return '<em class="readonly">' + esc(t("acc.readOnly")) + "</em>";
    /* The ampersand is decorative, so the write button's own label carries in
       words what a sighted reader gets from watching the mark appear. */
    return '<div class="accseg' + (sv.mode === "write" ? " both" : "") +
      '" role="group" aria-label="' + esc(svcLabel(sv)) + '">' +
      '<button class="mread" aria-pressed="' + (sv.mode === "read") + '" data-mode="' + p.id + ":" + i +
        ':read">' + esc(t("acc.read")) + "</button>" +
      '<span class="amp" aria-hidden="true">&amp;</span>' +
      '<button class="mwrite" aria-pressed="' + (sv.mode === "write") + '" data-mode="' + p.id + ":" + i +
        ':write" aria-label="' + esc(t("acc.writeA11y")) + '">' + esc(t("acc.write")) + "</button>" +
      "</div>";
  }
  function foldBody(p){
    return '<div class="permgrid">' + p.svc.map(function(sv, i){
      var ok2 = svcReady(p, sv);
      /* the index stays the service's own: data-svc and data-mode address
         p.svc[i], so a skipped row must not renumber the ones after it */
      if(hideSoon(ok2)) return "";
      return '<div class="permtxt' + (ok2 ? "" : " soon") + '"><b>' + esc(svcLabel(sv)) + "</b>" +
        (sv.sub ? "<span>" + esc(t(sv.sub)) + "</span>" : "") + "</div>" +
        '<div class="permctl" data-ctl="' + p.id + ":" + i + '">' +
          (ok2 ? ctlFor(p, sv, i) : '<span class="soonpill">' + esc(t("soon")) + "</span>") + "</div>" +
        '<div class="permsw"' + (ok2 ? "" : ' inert') + '><button class="switch' + (ok2 ? "" : " soon") +
        '" role="switch" aria-checked="' + sv.on + '" data-svc="' + p.id + ":" + i +
        '" aria-label="' + esc(svcLabel(sv)) + '"></button></div>';
    }).join("") + "</div>" +
      '<button class="linkbtn danger" data-disconnect="' + p.id + '" style="margin-top:14px;display:block">' +
      esc(t("disconnect")) + "</button>";
  }
  /* The row names what connecting gives you, so with "soon" hidden it names
     only what is live — Drive and Keep are not something to connect for. */
  function offKey(p){
    if(p.id !== "google" || !hideSoon(false)) return "off." + p.id;
    return "off.googleLive";
  }
  function provRow(p){
    if(!p.connected){
      var ready = provReady(p.id);
      return '<div class="rowset" data-rowset="' + p.id + '"><div class="row' +
        (ready ? "" : " soon") + '"' + (ready ? "" : " inert") + ">" +
        tileFor(p.tile, p.icon) +
        '<div class="row-txt"><div class="row-title">' + esc(p.name) + "</div>" +
        '<div class="row-sub">' + esc(t(offKey(p))) + "</div></div>" +
        (ready
          ? '<button class="connect" data-connect="' + p.id + '">' + esc(t("connect")) + "</button>"
          : '<span class="soonpill">' + esc(t("soon")) + "</span>") +
        "</div></div>";
    }
    var isOpen = !!expanded[p.id];
    /* Connected but broken — Google has withdrawn the grant, usually because
       the password changed. The server has said so since the integrations
       route was written (`needs_reauth`) and the page drew it as an ordinary
       healthy account, so the calendar simply stopped filling in and nothing
       on screen explained why. */
    var sub = p.needsReauth ? t("prov.reauth") : p.account + " · " + pl("svcOn", onCount(p));
    return '<div class="rowset" data-rowset="' + p.id + '">' +
      '<button class="row" data-prov="' + p.id + '" aria-expanded="' + isOpen + '">' + tileFor(p.tile, p.icon) +
      '<div class="row-txt"><div class="row-title">' + esc(p.name) + "</div>" +
      '<div class="row-sub' + (p.needsReauth ? " warn" : " on") + '">' + esc(sub) + "</div>" +
      glyphs(p) + "</div>" +
      '<svg class="chev"><use href="#i-chev"/></svg></button>' +
      '<div class="fold' + (isOpen ? " open" : "") + '" data-pfold="' + p.id + '"><div><div class="foldpad">' +
      foldBody(p) + "</div></div></div></div>";
  }
  /* monday.com, Slack and Notion are drawn and wired here, and NOTHING routes
     to any of them — v2's cutover never got Monday back and the other two were
     never built. A row that says "בקרוב" is still an offer, and five of them
     under a heading called "עבודה" reads as a section that is nearly ready.
     So the group is not rendered at all. The rows stay in PROV, the copy stays
     in both dictionaries and the tiles stay in the sprite: the day one of them
     has a domain module behind it, this flips to true and the section is back
     in one line. Do not delete the rows to "clean up" — rebuilding them is the
     expensive half. */
  var SHOW_WORK_TOOLS = false;
  function provGroup(grp, labelKey, hintKey, stage){
    var list = PROV.filter(function(p){
      return p.grp === grp && !hideSoon(p.connected || provReady(p.id));
    });
    if(!list.length) return "";

    /* "one sign-in per provider" says nothing when there is one provider */
    if(list.length < 2) hintKey = null;
    return '<div' + (stage ? ' data-stage="' + stage + '"' : "") +
      '><div class="glabel"><span>' + esc(t(labelKey)) + "</span>" +
      (hintKey ? '<span class="hint">' + esc(t(hintKey)) + "</span>" : "") +
      '</div><div class="group">' + rows + "</div></div>";
  }
  /* the chosen card says so itself, so the answer is visible from the tiles

  /* ── home: the two counts, each a door to its own tab ──
     Called from renderTasks and renderMeets, which already run on every
     change and every pushed event, so the numbers can never lag the lists
     they count. Both counts are the SAME arrays those tabs draw — the server
     already decided what is open and what is active; nothing is re-cut here. */
  /* The invitation to a friend. Everything in it is the server's — the text
     and the link carry their code (domain/referral.js) — so without an
     `invite` in the payload there is nothing to draw, and the card stays
     hidden, the design preview included. */
  var INVITE = null;
  function renderInvite(inv){
    var box = $("#invite");

     the home screen has room for one of the two. */
  var APP_ICON = {food:"i-app-food", games:"i-app-games"};
  function renderApps(list){
    var box = $("#apps"), row = $("#appsRow");
    if(!box || !row) return;
    var apps = (list || []).filter(function(a){ return a && APP_ICON[a.id]; });
    box.hidden = !apps.length;
