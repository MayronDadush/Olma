  /* ══════════════════════════════════════════════════════════════
     MEETING COORDINATION
     Several people, one question: when. A coordination proposes up to four
     MOMENTS — a date, and an hour or a part of the day — and everybody says
     of each one whether they can be there. The overlap is arithmetic: no
     negotiation round trip, no model, no guessing.

     It used to be a grid: days down, four parts across, and one target that
     meant something different on each press. The grid was compact and nobody
     found the second press, so an option is now a row that carries its own
     two labelled buttons. Three things fell out of that, and all three were
     problems: a coordination whose date and hour are ALREADY fixed is simply
     a list of one, a whole-day meeting stops needing an hours axis it has no
     hours for, and "has not answered" stays visibly separate from "cannot" —
     which is the distinction the settle gate turns on.

     A mark is availability, never agreement. Settling is a separate,
     deliberate act, and when not everyone can make it, it takes two presses
     and names who is being left out.
     ══════════════════════════════════════════════════════════════ */
  /* ── the model ──
     An option is a real moment, not a cell on a grid. That single change is
     what the rest of this file rests on: the day parts stop needing an axis
     of their own (a time is a property of the option), a coordination that
     already HAS a date and an hour is simply a list of one, and answering
     stops being a gesture somebody has to be taught — every option carries
     its own "I can" and "I can't", written on the buttons.

     `by` names the creator, and 0 is me. `who` is everybody else, so
     participants are still [0].concat(who) whoever opened it. `ans` is one
     answer per person per option; absent is "has not answered", which is a
     third thing and never folded into "cannot". */
  var MEET_CAP = 4;
  var PARTS = ["morning","noon","evening","night"];
  /* Coordinations this person left. Its own array rather than a flag on MEETS,
     because a left one carries only a title and an id — that is all the server
     sends and all putting yourself back needs. */
  var MTLEFT = [];
  var MEETS = [
    /* mine, mid-flight: three real options, one objection, one person who
       left, and a fourth option somebody else proposed that only I can see. */
    {id:1, t:{he:"פוקר",en:"Poker"}, by:0, who:[3,7,10], allDay:false,
     opts:[{id:11, day:1, part:"evening"}, {id:12, day:3, part:"evening"},
           {id:13, day:5, time:"21:00"}, {id:14, day:2, part:"noon", pending:true, by:7}],
     ans:{0:{11:"y", 12:"y"}, 3:{11:"y", 12:"y", 13:"n"}, 7:{11:"y", 13:"y"}},
     left:[10], settled:null, inCal:false},

    /* somebody else's, and the option I proposed is waiting on them */
    {id:2, t:{he:"קפה עם גלי",en:"Coffee with Gali"}, by:1, who:[1], allDay:false,
     opts:[{id:21, day:0, part:"morning"}, {id:22, day:1, part:"noon"},
           {id:23, day:2, time:"17:30", pending:true, by:0}],
     ans:{0:{21:"y"}, 1:{21:"y", 22:"y"}},
     left:[], settled:null, inCal:false},

    /* the case where nothing is being coordinated at all: the date and the
       hour are already decided and the only question anybody is asked is
       whether they can be there. One option, two buttons, nothing else. */
    {id:3, t:{he:"יום ההולדת של שרה",en:"Sarah's birthday"}, by:4, who:[4,9,11], allDay:false,
     opts:[{id:31, day:2, time:"20:00"}],
     ans:{4:{31:"y"}, 9:{31:"y"}, 11:{31:"n"}},
     left:[], settled:null, inCal:false},

    /* whole days, which is a property of the MEETING and not an answer
       anybody gives — there are no hours to be flexible about. */
    {id:4, t:{he:"טיול משפחתי",en:"Family trip"}, by:0, who:[2,12], allDay:true,
     opts:[{id:41, day:6}, {id:42, day:13}],
     ans:{0:{41:"y", 42:"y"}, 2:{42:"y"}},
     left:[], settled:null, inCal:false},

    /* settled, and therefore in the calendar rather than here */
    {id:5, t:{he:"פגישה עם רון",en:"Meeting with Ron"}, by:8, who:[8], allDay:false,
     opts:[{id:51, day:1, time:"11:00"}],
     ans:{0:{51:"y"}, 8:{51:"y"}},
     left:[], settled:51, inCal:true}
  ];
  var mtSeq = 100, mtOptSeq = 500, mtOpen = null, mtSettling = null, mtLeaving = null;

  /* "א, ב ו־ג", never "א ו־ב ו־ג". D.and is the conjunction before the LAST
     name only; everything before it is separated by a comma. Same shape in
     both languages, which is why this is one function and not two. */
  function nameList(names){
    names = names.filter(Boolean);
    if(names.length <= 1) return names[0] || "";
    return names.slice(0, -1).join(", ") + D.and + names[names.length - 1];
  }
  function mtPeople(m){ return [0].concat(m.who); }
  /* Somebody who left is still SHOWN — the group needs to know why the count
     dropped — but is counted in nothing. Those are two different questions
     and every tally below asks the second one. */
  function mtActive(m){
    return mtPeople(m).filter(function(p){ return m.left.indexOf(p) < 0; });
  }
  function mtGone(m, pid){ return m.left.indexOf(pid) > -1; }
  function mtName(pid){ return pid === 0 ? t("mt.me") : (friendById(pid) ? L(friendById(pid).n) : ""); }
  function mtMine(m){ return m.by === 0; }
  function mtOptById(m, id){
    return m.opts.filter(function(o){ return o.id === id; })[0] || null;
  }
  function mtAns(m, pid, oid){ return (m.ans[pid] || {})[oid] || ""; }
  function mtSetAns(m, pid, oid, v){
    var row = m.ans[pid] || (m.ans[pid] = {});
    if(v) row[oid] = v; else delete row[oid];
  }
  function mtN(m, o, v){
    return mtActive(m).filter(function(p){ return mtAns(m, p, o.id) === v; }).length;
  }
  function mtAnswered(m, pid){
    var row = m.ans[pid];
    if(!row) return false;
    for(var k in row) if(row[k]) return true;
    return false;
  }
  function mtLive(m){ return m.opts.filter(function(o){ return !o.pending; }); }
  /* A pending option is the creator's decision to make, so nobody else is
     shown one — an option that might vanish is worse than one that arrives
     late, and somebody who voted on a disappearing option has had their
     answer thrown away. The one exception is the person who proposed it,
     who otherwise cannot tell whether it was sent at all and proposes again. */
  function mtVisible(m){
    return m.opts.filter(function(o){ return !o.pending || mtMine(m) || o.by === 0; });
  }
  function mtPendingMine(m){
    return m.opts.filter(function(o){ return o.pending && o.by === 0; }).length > 0;
  }
  function mtBest(m){
    var r = mtLive(m).slice().sort(function(a, b){
      /* Most people, then fewest objections — two slots that fit the same
         number are not equally good if somebody has already said no to one. */
      return mtN(m, b, "y") - mtN(m, a, "y") || mtN(m, a, "n") - mtN(m, b, "n");
    })[0];
    return r && mtN(m, r, "y") ? r : null;
  }
  function mtDate(off){ var d = new Date(base); d.setDate(d.getDate() + off); return d; }
  /* A weekday alone names one day only inside this week, and a coordination
     that offers two Thursdays is ordinary. Only today and tomorrow have names
     of their own; everything else carries its date. */
  function mtDayLabel(off){
    var d = mtDate(off);
    if(off === 0) return t("cal.today");
    if(off === 1) return t("cal.tomorrow");
    return t("cal.dayPrefix") + D.full[d.getDay()] + ", " + d.getDate() + " " + D.months[d.getMonth()];
  }
  /* The three shapes an option can take, said in one place so a whole-day
     coordination can never accidentally print an hour. */
  function mtWhen(m, o){
    if(m.allDay) return t("mt.allDayWhen");
    if(o.time) return o.time;
    return t("mt.part." + (o.part || "evening"));
  }
  function mtOptLabel(m, o){ return mtDayLabel(o.day) + " · " + mtWhen(m, o); }

  /* ── the card, before you open it ── */
  /* Scanning a list of coordinations is asking one question — which of these
     still needs something from anybody — and a sentence is the slow way to
     answer it. The chip carries the category, in its own colour; the line
     after it carries only what the chip cannot say. */
  function mtStatus(m){
    if(m.settled) return "settled";
    var b = mtBest(m), total = mtActive(m).length;
    if(!b) return mtLive(m).length ? "waiting" : "empty";
    var y = mtN(m, b, "y"), wait = total - y - mtN(m, b, "n");
    return y === total ? "ready" : wait ? "waiting" : "stuck";
  }
  function mtState(m){
    if(m.settled){
      var s = mtOptById(m, m.settled);
      return s ? mtOptLabel(m, s) : (m.slotText ? t("mt.settledAs", {when:m.slotText}) : t("mt.stateNone"));
    }
    var b = mtBest(m), total = mtActive(m).length;
    if(!b) return mtLive(m).length ? t("mt.stateNone") : (m.slotText || t("mt.stateNoOpts"));
    var y = mtN(m, b, "y"), no = mtN(m, b, "n"), wait = total - y - no;
    if(y === total) return mtOptLabel(m, b);
    if(wait) return pl("mtW", wait);
    return t("mt.stateBlocked", {n:y, of:total, no:pl("mtN", no)});
  }
  function mtCardHTML(m){
    var st = mtStatus(m);
    var mine = mtLive(m).filter(function(o){ return !mtAns(m, 0, o.id); }).length;
    /* Leaving is offered here, on the row, because the reason to leave is
       usually "this should stop appearing in my list" — which is a thought you
       have while looking AT the list, not one that survives two taps into the
       coordination. It asks first: the one thing worse than a list you cannot
       clear is a list that clears itself. */
    if(mtLeaving === m.id){
      return '<div class="group" style="margin-bottom:10px"><div class="mtconfirm">' +
        "<p>" + esc(t("mt.leaveAsk", {name:L(m.t)})) + "</p>" +
        '<div class="moact"><button class="mobtn warn" data-mtleavego="' + m.id + '">' +
        esc(t("mt.leave")) + "</button>" +
        '<button class="mobtn" data-mtleaveno>' + esc(t("sheet.cancel")) + "</button></div></div></div>";
    }
    return '<div class="group" style="margin-bottom:10px"><div class="mtrow">' +
      '<button class="mtcard" data-mt="' + m.id + '">' +
      faceStack(m.who) +
      '<span class="mtbody"><span class="mtname">' + esc(L(m.t)) +
      /* An unanswered coordination is the one thing on this page that is
         waiting on YOU, so it says so on the card and not two taps in. */
      (!m.settled && mine ? '<i class="mtdot"></i>' : "") + "</span>" +
      '<span class="mtstate"><em class="mtpill ' + st + '">' + esc(t("mt.pill." + st)) + "</em>" +
      esc(mtState(m)) + "</span></span>" +
      '<svg class="chev"><use href="#i-chev"/></svg></button>' +
      '<button class="mtx" data-mtleave="' + m.id + '" aria-label="' + esc(t("mt.leave")) + '">' +
      '<svg><use href="#i-x"/></svg></button></div></div>';
  }
  /* A coordination you left, reduced to what putting yourself back in needs:
     a title and an id. Deliberately NOT a card — a card shows the tally, and
     watching the others answer a coordination you stepped out of is not
     something to offer. The server takes the same view and sends only these
     two fields (`meetingsLeft`, domain/user-dashboard.js). */
  function mtLeftHTML(m){
    /* Two kinds of row share this list: one you left (a way back in) and one
       that settled and happened (nothing to do — it is over). */
    var settled = !!m.settled;
    return '<div class="group" style="margin-bottom:10px"><div class="mtrow">' +
      '<span class="mtcard" style="cursor:default"><span class="mtbody">' +
      '<span class="mtname">' + esc(L(m.t)) + "</span>" +
      '<span class="mtstate">' + esc(settled ? t("mt.settledAs", {when:m.slot || ""}) : t("mt.youLeft")) + "</span></span></span>" +
      (settled ? "" :
      '<button class="tundo" data-mtback="' + m.id + '" aria-label="' +
      esc(t("mt.rejoin")) + '" title="' + esc(t("mt.rejoin")) +
      '"><svg><use href="#i-undo"/></svg></button>') + '</div></div>';
  }
  function renderMeets(){
    /* Settled coordinations are not "active" any more — they are calendar
       entries, and leaving them here would make the list a permanent archive
       of every meeting ever arranged. */
    var live = MEETS.filter(function(m){ return !m.settled; });
    var done = MEETS.filter(function(m){ return m.settled; });
    $("#mtList").innerHTML = live.length
      ? live.map(mtCardHTML).join("")
      : '<div class="group"><div class="empty">' +
        esc(t("mt.empty")) + "</div></div>";
    $("#mtCount").textContent = live.length ? pl("mt", live.length) : "";
    /* Settled first, then the ones you left — the same ordering rule the task
       archive uses (most recently out of the list, first). Capped at the same
       eight, and it SAYS it is capped rather than quietly truncating, because
       an archive that silently drops the ninth row is a safety net with a hole
       nobody can see. */
    var arc = done.map(function(m){ return {html:mtCardHTML(m)}; })
      .concat(MTLEFT.map(function(m){ return {html:mtLeftHTML(m)}; }));
    $("#mtArchive").hidden = !arc.length;
    $("#mtArcCount").textContent = arc.length;
    $("#mtDone").innerHTML = arc.slice(0, ARCHIVE_MAX).map(function(x){ return x.html; }).join("");
    $("#mtArcNote").hidden = arc.length <= ARCHIVE_MAX;
    $("#mtArcNote").textContent = t("tasks.arcShown", {n:ARCHIVE_MAX, all:arc.length});
  }
  $("#mtArcBtn").addEventListener("click", function(){
    var a = $("#mtArchive"), on = !a.classList.contains("open");
    a.classList.toggle("open", on);
    $("#mtArcFold").classList.toggle("open", on);
    this.setAttribute("aria-expanded", on ? "true" : "false");
  });
  /* Putting yourself back is a real call, not a row reappearing in a browser:
     the others were told you left, so they are told you are back. The server
     refuses what it should — a coordination that closed when you left cannot
     be reopened by one person — and the row only leaves the archive once the
     call has come back ok. */
  function mtRejoin(id){
    var i = MTLEFT.findIndex(function(x){ return x.id === id; });
    if(i < 0) return;
    var entry = MTLEFT[i];
    if(!LIVE){
      MTLEFT.splice(i, 1);
      renderMeets();
      toast(t("toast.mtBack", {name:L(entry.t)}));
      return;
    }
    API.call("rejoinMeeting", {meeting_id:id});
    API.send("rejoinMeeting", {meetingId:id}, function(data){
      if(!data) return;
      MTLEFT.splice(MTLEFT.findIndex(function(x){ return x.id === id; }), 1);
      renderMeets();
      toast(t("toast.mtBack", {name:L(entry.t)}));
      /* Back in means back in the active list, with the tally as it stands
         now — which only the server knows. */
      API.reload();
    });
  }
  function mtListClick(e){
    var back = e.target.closest("[data-mtback]");
    if(back){ mtRejoin(+back.dataset.mtback); return; }
    /* the two leave controls are checked first: both sit inside the row the
       open handler would otherwise claim */
    var go = e.target.closest("[data-mtleavego]");
    if(go){ var gm = mtById(+go.dataset.mtleavego); if(gm) mtLeave(gm); return; }
    if(e.target.closest("[data-mtleaveno]")){ mtLeaving = null; renderMeets(); return; }
    var x = e.target.closest("[data-mtleave]");
    if(x){ mtLeaving = +x.dataset.mtleave; renderMeets(); return; }
    var b = e.target.closest("[data-mt]");
    if(b){ mtLeaving = null; openMeet(+b.dataset.mt); }
  }
  $("#mtList").addEventListener("click", mtListClick);
  $("#mtDone").addEventListener("click", mtListClick);

  /* ── the answer row ──
     Two buttons that say what they do, instead of one target that means a
     different thing on each press. A three-state tap is compact and nobody
     discovers the third state; pressing the button you are already on clears
     it, which is the same idea people already have about a selected chip. */
  function mtFacesFor(m, o){
    return mtActive(m).map(function(pid){
      var f = pid === 0 ? null : friendById(pid);
      var a = mtAns(m, pid, o.id);
      var st = a === "y" ? "y" : a === "n" ? "n" : "w";
      var label = mtName(pid) + " · " + t(st === "y" ? "mt.canDo" : st === "n" ? "mt.cant" : "mt.noAnswer");
      return '<u class="' + st + '" title="' + esc(label) + '" aria-label="' + esc(label) + '"><span>' +
        avatarSVG(pid === 0 ? myAvatar : f.av, {g:pid === 0 ? myGender() : f.g}) + "</span></u>";
    }).join("");
  }
  function mtTallyFor(m, o){
    var total = mtActive(m).length;
    var y = mtN(m, o, "y"), no = mtN(m, o, "n"), wait = total - y - no;
    if(y === total) return '<em class="y">' + esc(t("mt.allFree")) + "</em>";
    var bits = [];
    if(y) bits.push('<em class="y">' + esc(pl("mtY", y)) + "</em>");
    if(no) bits.push('<em class="n">' + esc(pl("mtN", no)) + "</em>");
    if(wait > 0) bits.push("<em>" + esc(pl("mtW", wait)) + "</em>");
    return bits.join(" · ");
  }
  /* Who is missing, named. "Not everyone can" and "not everyone has answered"
     are different sentences and the second is the commoner mistake, so the
     confirmation says which one it is and whose name is on it.

     I am counted but never named: I am the one reading the question, and
     "settle without you" is not a sentence anybody says. My own absence gets
     its own clause instead. */
  function mtGap(m, o){
    var no = [], wait = [], me = "";
    mtActive(m).forEach(function(pid){
      var a = mtAns(m, pid, o.id);
      if(a === "y") return;
      if(pid === 0){ me = a === "n" ? "no" : "wait"; return; }
      (a === "n" ? no : wait).push(mtName(pid));
    });
    return {no:no, wait:wait, me:me};
  }
  /* ── what she already knows about your day ──
     Somebody else picked these times and cannot see your calendar. Saying "I
     can" while a thing already sits there is not a decision anybody made — it
     is one nobody was shown. So the row says it, at the moment of answering,
     and says WHAT rather than just "you are busy": half the hits are things
     you would happily move, and you can only tell which by name. */
  function mtMins(hhmm){
    var a = String(hhmm || "").split(":");
    return a.length === 2 ? (+a[0]) * 60 + (+a[1]) : -1;
  }
  function mtPartOf(hhmm){
    var mm = mtMins(hhmm);
    if(mm < 0) return "";
    return mm < 720 ? "morning" : mm < 1020 ? "noon" : mm < 1320 ? "evening" : "night";
  }
  function mtClash(m, o){
    var evs = agendaFor(o.day).filter(function(e){ return e.meet !== m.id; });
    if(!evs.length) return null;
    /* a whole day collides with anything already in it */
    if(m.allDay) return evs[0];
    return evs.filter(function(e){
      if(e.allDay) return false;                 /* an all-day marker is not an hour */
      if(o.time && e.time) return Math.abs(mtMins(o.time) - mtMins(e.time)) < 90;
      return mtPartOf(e.time) === (o.part || mtPartOf(o.time));
    })[0] || null;
  }
  function mtOptHTML(m, o){
    var total = mtActive(m).length;
    var y = mtN(m, o, "y"), no = mtN(m, o, "n");
    var isBest = !m.settled && mtBest(m) === o && mtLive(m).length > 1;
    var settled = m.settled === o.id;
    var mineAns = mtAns(m, 0, o.id);
    var head = '<div class="mohead"><b>' + esc(mtOptLabel(m, o)) + "</b>" +
      (settled ? '<span class="mochip done"><svg><use href="#i-check"/></svg>' + esc(t("mt.settledTag")) + "</span>"
       : isBest ? '<span class="mochip best">' + esc(t("mt.bestTag")) + "</span>" : "") + "</div>";

    if(o.pending){
      /* Two audiences, one row. The creator gets a decision; the person who
         proposed it gets a receipt, so they do not propose it again. */
      return '<div class="group mopt pending" data-opt="' + o.id + '">' + head +
        '<div class="mopend">' +
        (mtMine(m)
          ? '<span class="mochip pend">' + esc(t("mt.proposedBy", {name:mtName(o.by)})) + "</span>" +
            '<div class="moact"><button class="mobtn ok" data-approve><svg><use href="#i-check"/></svg>' +
            esc(t("mt.approve")) + '</button><button class="mobtn" data-reject>' + esc(t("mt.reject")) + "</button></div>"
          : '<span class="mochip pend">' + esc(t("mt.sentToCreator", {name:mtName(m.by)})) + "</span>")
        + "</div></div>";
    }

    var bar = '<span class="mtbar">' +
      '<i class="y" style="--w:' + (y / Math.max(1,total) * 100).toFixed(1) + '%"></i>' +
      '<i class="n" style="--w:' + (no / Math.max(1,total) * 100).toFixed(1) + '%"></i></span>';

    var act = settled ? ""
      : '<div class="moact">' +
        '<button class="mobtn yes" data-a="y" aria-pressed="' + (mineAns === "y") + '">' +
        '<svg><use href="#i-check"/></svg>' + esc(t("mt.iCan")) + "</button>" +
        '<button class="mobtn no" data-a="n" aria-pressed="' + (mineAns === "n") + '">' +
        '<svg><use href="#i-x"/></svg>' + esc(t("mt.iCant")) + "</button>" +
        /* Settling is somebody deciding between several candidate times. A
           real meeting confirms itself the moment the last person says yes —
           there is no decision left to take and no call that takes it — so on
           a live account the button is not there. */
        (LIVE ? "" : '<button class="mobtn settle" data-settle>' + esc(t("mt.pick")) + "</button>") +
        "</div>";

    var confirm = "";
    if(mtSettling === o.id){
      var g = mtGap(m, o);
      var others = g.no.length ? g.no : g.wait;
      var msg = g.no.length ? t("mt.gapNo", {list:nameList(g.no)})
        : g.wait.length ? t("mt.gapWait", {list:nameList(g.wait)})
        : g.me === "no" ? t("mt.gapMeNo") : t("mt.gapMeWait");
      confirm = '<div class="moconfirm"><p>' + esc(msg) + "</p>" +
        '<div class="moact"><button class="mobtn warn" data-force>' +
        esc(others.length ? t("mt.settleAnyway", {list:nameList(others)}) : t("mt.settleMe")) +
        "</button>" +
        '<button class="mobtn" data-cancelsettle>' + esc(t("sheet.cancel")) + "</button></div></div>";
    }
    var clash = settled ? null : mtClash(m, o);
    var warn = clash
      ? '<div class="moclash"><svg><use href="#i-clock"/></svg><span>' +
        esc(t("mt.clash", {what:clash.title + (clash.time ? " · " + clash.time : "")})) +
        "</span></div>"
      : "";
    return '<div class="group mopt' + (isBest ? " best" : "") + (settled ? " settled" : "") +
      '" data-opt="' + o.id + '">' + head + bar +
      '<div class="motally">' + mtTallyFor(m, o) + "</div>" +
      '<div class="mtppl">' + mtFacesFor(m, o) + "</div>" + warn + act + confirm + "</div>";
  }

  function renderMeet(){
    var m = mtOpen;
    if(!m) return;
    /* The heading and the participant line live HERE, not in openMeet: written
       once at open they would keep the language they were opened in, and a
       language switch with the sheet up would leave a Hebrew subtitle under an
       English list. Anything a re-render must fix belongs in the re-render. */
    $("#mtTitle").textContent = L(m.t);
    $("#mtWho").textContent = t("mt.withList", {list:nameList(m.who.map(mtName))});
    $("#mtAskLbl").textContent = t(m.settled ? "mt.settledLbl"
      : mtLive(m).length === 1 ? "mt.askOne" : "mt.ask");

    $("#mtFaces").innerHTML = mtPeople(m).map(function(pid){
      var gone = mtGone(m, pid), said = mtAnswered(m, pid);
      var f = pid === 0 ? null : friendById(pid);
      return '<span class="mtface' + (gone ? " gone" : said ? " said" : "") + '">' +
        '<span class="face">' + avatarSVG(pid === 0 ? myAvatar : f.av, {g:pid === 0 ? myGender() : f.g}) + "</span>" +
        esc(mtName(pid)) + (gone ? " · " + t("mt.gone") : said ? "" : " · " + t("mt.waiting")) + "</span>";
    }).join("");

    $("#mtOpts").innerHTML = mtVisible(m).map(function(o){ return mtOptHTML(m, o); }).join("")
      || '<div class="group"><div class="empty">' + esc(t("mt.stateNoOpts")) + "</div></div>";

    /* Adding is capped, and a non-creator gets exactly one proposal — so the
       row disappears rather than failing on press, and the note says why.

       On a real account it is hidden outright. The system negotiates one slot
       at a time and there is no call that adds a second candidate, so the
       button could only ever add a row this browser could see — offering a
       time the other people are never shown is worse than not offering it. */
    var full = mtLive(m).length >= MEET_CAP;
    var spent = !mtMine(m) && mtPendingMine(m);
    $("#mtAddWrap").hidden = !!m.settled || spent;
    $("#mtAddOptLbl").textContent = t(mtMine(m) ? "mt.addOpt" : "mt.proposeOpt");
    $("#mtAddNote").textContent = m.settled ? ""
      : spent ? t("mt.proposeSpent")
      : full && mtMine(m) ? t("mt.capFull", {n:MEET_CAP})
      : mtMine(m) ? "" : t("mt.proposeNote", {name:mtName(m.by)});
    $("#mtAddNote").hidden = !$("#mtAddNote").textContent;

    /* Two different exits, and they must never read alike: one clears your
       own calendar, the other tells four people you are not coming.
       Whether a settled meeting sits on THIS person's calendar is not recorded
       per participant, so on a real account the control has no state to show
       and no call to make. Their own agent offers this in chat, where it can
       actually find the event. */
    $("#mtCal").hidden = LIVE || !m.settled;
    $("#mtCal").textContent = t(m.inCal ? "mt.calRemove" : "mt.calAdd");
    $("#mtLeave").textContent = t("mt.leave");
    $("#mtLeave").hidden = false;
    paintCue($("#mtSheet"), $("#mtCue"));
  }
  function mtById(id){ return MEETS.filter(function(m){ return m.id === id; })[0] || null; }
  function openMeet(id){
    mtOpen = mtById(id);
    if(!mtOpen) return;
    mtSettling = null;
    renderMeet();
    showSheet($("#mtSheet"));
  }
  $("#mtClose").addEventListener("click", closeSheets);
  $("#mtSheet").addEventListener("scroll", function(){ paintCue($("#mtSheet"), $("#mtCue")); });

  $("#mtOpts").addEventListener("click", function(e){
    var m = mtOpen;
    if(!m) return;
    var row = e.target.closest("[data-opt]");
    if(!row) return;
    var o = mtOptById(m, +row.dataset.opt);
    if(!o) return;

    var ans = e.target.closest("[data-a]");
    if(ans){
      var want = ans.dataset.a, had = mtAns(m, 0, o.id);
      /* Pressing the answer you are already on clears it — the third state
         without a third gesture. On a real meeting there is nowhere to put
         "never mind": the system knows awaiting, yes and no, and there is no
         call that walks an answer back to awaiting. Rather than clear it on
         screen and leave the server holding the old one, the press does
         nothing and says so. */
      if(had === want){
        if(LIVE){ toast(t("toast.mtNoUnanswer")); return; }
        mtSetAns(m, 0, o.id, "");
        API.call("setAvailability", {meeting_id:m.id, option_id:o.id, answer:null});
        mtSettling = null; renderMeet(); renderMeets();
        return;
      }
      mtSetAns(m, 0, o.id, want);
      API.call("setAvailability", {meeting_id:m.id, option_id:o.id, answer:want});
      /* One answer to ONE option — the server confirms the meeting itself the
         moment an option is unanimous, and the reload shows it. */
      API.send("answerOption", {meetingId:m.id, optionId:o.id, answer:want}, function(){ API.reload(); });
      mtSettling = null;
      renderMeet(); renderMeets();
      return;
    }
    if(e.target.closest("[data-approve]")){
      if(LIVE && mtLive(m).length >= MEET_CAP){
        /* Four already on the table: approving means naming the one it
           replaces, and the swap sheet is exactly that question. */
        swapApprove = o; swapNew = o;
        closeSheets();
        setTimeout(function(){ renderSwap(); showSheet($("#mtSwapSheet")); }, 260);
        return;
      }
      delete o.pending; delete o.by;
      API.call("startMeeting", {meeting_id:m.id, approve_option:o.id});
      API.send("approveOption", {meetingId:m.id, optionId:o.id}, function(){ API.reload(); });
      renderMeet(); renderMeets();
      toast(t("toast.mtApproved", {when:mtOptLabel(m, o)}));
      return;
    }
    if(e.target.closest("[data-reject]")){
      m.opts = m.opts.filter(function(x){ return x !== o; });
      API.send("rejectOption", {meetingId:m.id, optionId:o.id}, function(){ API.reload(); });
      renderMeet(); renderMeets();
      toast(t("toast.mtRejected"));
      return;
    }
    if(e.target.closest("[data-settle]")){
      var total = mtActive(m).length;
      /* Everybody can make it: no question to ask, so none is asked. */
      if(mtN(m, o, "y") === total){ mtSettle(o); return; }
      mtSettling = o.id;
      renderMeet();
      return;
    }
    if(e.target.closest("[data-force]")){ mtSettle(o); return; }
    if(e.target.closest("[data-cancelsettle]")){ mtSettling = null; renderMeet(); }
  });
  function mtSettle(o){
    var m = mtOpen;
    m.settled = o.id;
    m.inCal = true;
    mtSettling = null;
    API.call("confirmSlot", {meeting_id:m.id, option_id:o.id});
    renderMeet(); renderMeets(); renderStrip(selDay);
    toast(t("toast.mtConfirmed", {when:mtOptLabel(m, o)}));
  }
  /* Removing it from MY calendar is not leaving the meeting, and the label
     says so — the two live in different places for the same reason. */
  $("#mtCal").addEventListener("click", function(){
    if(!mtOpen) return;
    mtOpen.inCal = !mtOpen.inCal;
    renderMeet(); renderStrip(selDay);
    toast(t(mtOpen.inCal ? "toast.mtCalAdd" : "toast.mtCalGone"));
  });
  /* Leaving is one act with two doors — the sheet and the list row — so it is
     one function. The answers stop counting; the name does not disappear. The
     group has to be able to see why the tally dropped, and it stays greyed for
     them until somebody invites them back. */
  function mtLeave(m){
    if(m.left.indexOf(0) < 0) m.left.push(0);
    delete m.ans[0];
    API.call("leaveMeeting", {meeting_id:m.id});
    API.send("leaveMeeting", {meetingId:m.id});
    MEETS = MEETS.filter(function(x){ return x !== m; });
    /* It goes to the archive rather than out of existence. Newest first, the
       way the task archive orders it. */
    MTLEFT.unshift({id:m.id, t:m.t});
    mtLeaving = null;
    renderMeets(); renderStrip(selDay);
    toast(t("toast.mtLeft", {name:L(m.t)}));
  }
  $("#mtLeave").addEventListener("click", function(){
    if(!mtOpen) return;
    var m = mtOpen;
    closeSheets();
    mtLeave(m);
  });

  /* ── proposing one more moment ──
     One date, one time. The same two controls the creation screen uses, which
     is why they are functions rather than markup written twice. */
  var optDay = 1, optPart = "evening", optExact = "";
  /* ── the shared day picker ──
     Two weeks at a time, paged. Three weeks was chosen so nobody would have to
     page, and it cost the sheet a third of its height for a row most people
     never reach — a picker that fits above the fold is worth a chevron. The
     grid always starts on the Sunday of the week today falls in, not on today:
     a calendar whose first column is "in four days" is not a calendar, and
     recognising one is the only reason to use a grid at all. Days behind us
     are drawn and inert, because dropping them would slide every weekday one
     column over.

     DGPAGE is per host, so the two pickers do not share a position. */
  var dgPage = {}, dgRedraw = {};
  function dayGridHTML(host, labelHost, sel, multi){
    var page = dgPage[host] || 0;
    var start = new Date(base);
    start.setDate(start.getDate() - start.getDay() + page * 14);
    var html = "", months = [];
    for(var i = 0; i < 7; i++) html += '<div class="dgh">' + esc(D.days[i]) + "</div>";
    for(var k = 0; k < 14; k++){
      var d = new Date(start); d.setDate(d.getDate() + k);
      var off = Math.round((d - base) / 86400000);
      var past = off < 0;
      if(!past && months.indexOf(d.getMonth()) < 0) months.push(d.getMonth());
      var on = multi ? sel.indexOf(off) > -1 : sel === off;
      /* A day you already have something on is not disqualified — it is a fact
         you would want before proposing it, and the alternative is finding out
         from whoever answers. */
      var busy = !past && agendaFor(off).length > 0;
      html += '<button class="dgc' + (past ? " past" : "") + (on ? " on" : "") +
        (off === 0 ? " now" : "") + (busy ? " busy" : "") + '"' + (past ? " disabled" : "") +
        ' data-day="' + off + '" aria-pressed="' + on + '" aria-label="' +

  /* ── writing when, instead of tapping it ──
     Allma already reads dates out of a sentence, and this is the one screen
     where that saves real work: "next week" is one line and eight taps. The
     rule it obeys is the file's oldest — never assert a reading that was not
     performed. What it understood comes back as dates on the grid, editable,
     BEFORE any of it becomes an option; what it did not understand says so
     and leaves the grid exactly as it was. */
  function parseWhen(str){
    var s = String(str).trim().toLowerCase();
    if(!s) return null;
    var dow = null, out = [];
    function push(off){ if(off >= 0 && off <= 20 && out.indexOf(off) < 0) out.push(off); }
    function nextDow(n){
      var off = (n - base.getDay() + 7) % 7;
      return off === 0 ? 7 : off;
    }
    if(/(^|\s)(היום|today)(\s|$)/.test(s)) push(0);
    if(/(^|\s)(מחר|tomorrow)(\s|$)/.test(s)) push(1);
    if(/(^|\s)(מחרתיים|day after tomorrow)(\s|$)/.test(s)) push(2);
    if(/(השבוע הבא|שבוע הבא|next week)/.test(s)){
      var sun = nextDow(0);
      for(var i = 0; i < 7; i++) push(sun + i);
    }
    if(/(סוף השבוע|סופ״ש|weekend)/.test(s)){
      if(base.getDay() === 6) push(0);          /* asked on Saturday: it is today */
      else { var fri = (5 - base.getDay() + 7) % 7; push(fri); push(fri + 1); }
    }
    /* a day-of-month range, with or without a month name: "15-22", "15–22 בספטמבר" */
    var mon = -1;
    D.monthsBare.forEach(function(nm, i){ if(s.indexOf(nm.toLowerCase()) > -1) mon = i; });
    var range = s.match(/(\d{1,2})\s*[-–—]\s*(\d{1,2})/);
    var single = s.match(/(?:^|\s)(\d{1,2})(?:\s|$|\/)/);
    function offOfDate(dd, mm){
      var y = base.getFullYear();
      var d = new Date(y, mm < 0 ? base.getMonth() : mm, dd, 12, 0, 0);
      if(d < base) d = new Date(y + (mm < 0 ? 0 : 1), mm < 0 ? base.getMonth() + 1 : mm, dd, 12, 0, 0);
      return Math.round((d - base) / 86400000);
    }
    if(range){
      var a = offOfDate(+range[1], mon), z = offOfDate(+range[2], mon);
      for(var k = a; k <= z && k - a < 21; k++) push(k);
    } else if(single && !dow){
      push(offOfDate(+single[1], mon));
    }
    out.sort(function(x, y2){ return x - y2; });
    return out.length ? out : null;
  }

  /* ── adding a friend ──
     The question this answers is "who do I already know", and the only honest
     source for that is an address book the person has actually connected. So
     the sheet has two shapes and the state of the integration picks one: it
     never shows an empty list, and it never invents contacts. */
  function contactsSource(){
    for(var i = 0; i < PROV.length; i++){
      var p = PROV[i];
      if(!p.connected) continue;
      for(var j = 0; j < p.svc.length; j++){
        if(p.svc[j].k === "contacts" && p.svc[j].on) return p;
      }
    }
    return null;
  }
  var cnQ = "";
  function renderContacts(){
    var src = contactsSource();
    var has = !!src;
    $("#cnSearchWrap").hidden = !has;
    $("#cnList").hidden = !has;
    $("#cnNone").hidden = has;
    $("#cnFrom").hidden = !has;
    if(!has) return;
    $("#cnFrom").textContent = t("cn.from", {name:src.name});
    /* people already on Olma are not offered again — they are in the list
       above, and inviting an existing friend is the one action here that
       could not possibly be what somebody meant */
    var known = FRIENDS.map(function(f){ return f.n.en; });
    var q = cnQ.trim().toLowerCase();
    var list = CONTACTS.filter(function(c){
      if(known.indexOf(c.n.en) > -1) return false;
      if(!q) return true;

  /* ───────── calendar ───────── */
  /* Which seven days the strip is showing, counted in weeks from the one that
     starts today. The bounds are not a taste decision: they are exactly the
     window /me/events fetches (domain/user-dashboard-events.js, DAYS_BACK 14
     / DAYS_AHEAD 28), so the last day the arrows can reach is the last day we
     actually asked Google about. An arrow that pages into an unfetched week
     would draw it empty, and empty is the same picture as "nothing on". */
  var weekOff = 0, WEEK_MIN = -2, WEEK_MAX = 3;
  function dayAt(i){ return new Date(base.getFullYear(), base.getMonth(), base.getDate() + i); }
  function dayISO(i){ return ymd(dayAt(i)); }
  /* Dated tasks stand in the day next to the real events, in time order,
     because that is where a person looks to ask what the day holds — and
     they open the very same editor the list does, never a copy of it. */
  function agendaFor(i){
    var iso = dayISO(i);
    var evs = (EVENTS[i] || []).map(function(v){
      /* `all` travels: an all-day entry heads the day, and the clash check
         treats it as filling the whole of one. The seed has no all-day rows,
         which is exactly why this was easy to leave out. */
      return {time:v.t, end:v.e, allDay:!!v.all, title:L(v.n), sub:L(v.s), c:v.c};
    });
    open.forEach(function(x){
      /* EVERY dated task stands in its day, whether or not it is also being
         written out to Google. `x.cal` is an EXPORT switch — "put this in the
         calendar app on my phone too" — and it was being read here as a
         DISPLAY switch, which meant somebody with no Google connection saw an
         empty week while holding six dated tasks. That was Maya, on the day
         this was found: one flag doing two jobs, and the wrong one won. */
      if(x.d !== iso) return;
      evs.push({time:x.all ? "" : (x.tm || ""), allDay:x.all,
                end:x.all ? "" : (x.tmEnd || ""),
                title:L(x.t) || t("sheet.untitled"),
                sub:t(x.rem ? "cal.taskRem" : "cal.taskSub", {name:chanName(defaultChannel)}),
                c:"var(--accent)", task:x.id});
    });
    /* A settled coordination stops being a question and becomes a thing in
       the day. It carries a mark saying where it came from and its own
       "remove from my calendar" — which is a private act, and deliberately
       not the same control, or the same word, as leaving the meeting. */
    MEETS.forEach(function(m){
      if(!m.settled || !m.inCal) return;
      var o = mtOptById(m, m.settled);
      if(!o || o.day !== i) return;
      evs.push({time:m.allDay ? "" : (o.time || ""), allDay:m.allDay, end:"",
                part:m.allDay ? "" : (o.time ? "" : t("mt.part." + (o.part || "evening"))),
                title:L(m.t), sub:t("cal.fromMeet"), c:"var(--accent)", meet:m.id});
    });
    /* an all-day entry heads the day, the way every calendar shows it */
    return evs.sort(function(a, b){
      return (a.allDay ? "" : (a.time || "99:99")).localeCompare(b.allDay ? "" : (b.time || "99:99"));
    });
  }
  function renderStrip(sel){
    selDay = sel;

    $("#daystrip").innerHTML = [0,1,2,3,4,5,6].map(function(k){
      var i = wk0 + k;
      var d = dayAt(i), n = agendaFor(i).length, dots = "";
      for(var k = 0; k < Math.min(n,3); k++) dots += "<i></i>";
      /* The strip always starts on today, but "the first one" is a rule you
         have to know. A mark beside the number is one you can see. */
      return '<button class="day' + (i === 0 ? " today" : "") + '" data-d="' + i +
        '" aria-selected="' + (i === sel) + '">' +
        '<div class="dn' + (i === 0 ? " isnow" : "") + '">' +
        (i === 0 ? esc(t("cal.today")) : D.days[d.getDay()]) + "</div>" +
        '<div class="dd">' + d.getDate() + "</div>" +
        '<div class="dots">' + dots + "</div></button>";
    }).join("");
    /* the strip can straddle two months, and then it has to say both */
    var a = dayAt(wk0), z = dayAt(wk0 + 6);
    $("#stripMonth").textContent = a.getMonth() === z.getMonth()
      ? D.monthsBare[a.getMonth()]
      : D.monthsBare[a.getMonth()] + "–" + D.monthsBare[z.getMonth()];
    $("#stripYear").textContent = a.getFullYear() === z.getFullYear()
      ? a.getFullYear() : a.getFullYear() + "–" + z.getFullYear();
    /* Disabled rather than hidden: an arrow that disappears at the edge moves
       the label under the finger that was reaching for it. */
    $("#wkPrev").disabled = weekOff <= WEEK_MIN;
    $("#wkNext").disabled = weekOff >= WEEK_MAX;
    $("#wkToday").hidden = weekOff === 0;
    var d2 = dayAt(sel);
    /* `cal.todayPre` carries its own separator and is a different string from
       the bare `cal.today` on the date chip — they were one key, and the second
       definition quietly won, which cost this heading its separator. */
    $("#agendaLabel").textContent = (sel === 0 ? t("cal.todayPre") : "") +
      t("cal.dayPrefix") + D.full[d2.getDay()] + ", " + d2.getDate() + " " + D.months[d2.getMonth()];

    $("#agenda").innerHTML = list.length ? list.map(function(v){
      return '<div class="ev"' +

        '<div class="evbar" style="background:' + v.c + '"></div>' +

        (v.meet ? '<span class="evtag">' + esc(t("cal.meetTag")) + "</span>" : "") +
        '</div><div class="evsub">' + esc(v.sub) + "</div></div>" +
        (v.meet ? '<button class="evdrop" data-uncal="' + v.meet + '" title="' +
          esc(t("mt.calRemove")) + '" aria-label="' + esc(t("mt.calRemove")) +
          '"><svg><use href="#i-x"/></svg></button>' : "") + "</div>";
    }).join("") : '<div class="empty">' + esc(t("cal.empty")) + "</div>";
  }

  /* It opens and shuts on the switch's own clock, the same clip-path movement

  function refreshShareAction(fid, on){

  var pupilRaf = 0, pointerXY = null;
  function trackPupils(){
    if(!pointerXY) return;
    $$(".avaPupils").forEach(function(g){

    SERVER_IDS = {};
    (d.tasks || []).concat(d.archived || []).forEach(function(x){ SERVER_IDS[String(x.id)] = true; });
    archived = (d.archived || []).map(function(x){
      return {id:x.id, t:x.title, done:whenLabel(x.completedAt)};
    });
    FRIENDS = (d.friends || []).map(liveFriend);
    /* Google is the only provider with a connection behind it, and Gmail
       inside it is allowlisted per person, so the server is the only thing
       that can answer that half. Everything not named here is greyed. */
    AVAIL.prov = {google:true};
    AVAIL.mail = !!(d.available && d.available.mail);
    hydrateProviders(d.integrations);
    hydrateChannels(d.channels);
    /* The address book behind "add a friend" — their own `user_contacts`,
       with everyone they are already connected to (or have already asked)
       filtered out server-side. An empty one is the RIGHT state to land in
       rather than a failure: it is what routes somebody to connecting an
       account first, which is exactly the flow this screen was designed for.

       `invited` is per-session state about who has been asked from this
       screen, and the seeded contacts it referred to are gone. */
    CONTACTS = (d.contacts || []).map(liveContact);
    invited = {};
    /* The days are NOT here. Every event is fetched from Google, so they come
       from /me/events on their own request — see loadDays() below, which fills
       them in after the page is already on screen. Until it answers, an empty
       day is the only honest thing: a real person must never be shown a poker
       game that does not exist. */
    EVENTS = {};
    PEOPLE = {};
    var openId = mtOpen ? mtOpen.id : null;
    MEETS = (d.meetings || []).map(liveMeet);
    MTLEFT = (d.meetingsLeft || []).map(function(m){ return {id:m.id, t:m.title || "", settled:!!m.settled, slot:m.slot || ""}; });
    mtOpen = openId ? (mtById(openId) || null) : null;
    LIVE = true;
    renderAll();
    if(mtOpen) renderMeet();
    loadDays();
  }
  /* On the seam rather than inside the closure, for the same reason the seam
     exists at all: this is the function that turns a payload into a page, so
     it has to be drivable from outside — to try a shape without a server, and
     to see what a given payload actually renders as. */
  API.hydrate = hydrate;

  /* One request, at boot, and nothing retries it. A dashboard that silently
     reloads itself is a dashboard that can change under somebody's finger. */
  (function(){
    /* Only from the one path the live page is served at. A protocol check was
       not enough: published as a design, this file sits on somebody else's
       https host, where it would fire a pointless cross-origin request and get
       a 404 for its trouble. Asking "am I the served page" is the actual
       question. */
    if(location.pathname !== "/me") return;
    /* A stranger has nothing to fetch and no session to fetch it with — the
       call could only ever come back 401. */
    if(NEWUSER) return;
    fetch("/me/data", {credentials:"same-origin", headers:{Accept:"application/json"}})
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(body){ if(body && body.ok && body.data) hydrate(body.data); })
      .catch(function(){ /* keep the seed; see the note above */ });
  })();

  /* silent, so the very first placement is not read as a move from x=0 — an
     unseeded prevX would hand the first real tap a direction computed against
     a position the pill was never at */
  requestAnimationFrame(function(){ placePill(tabs[0], true); });
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(repositionPill);

  /* ══════════════════════════════════════════════════════════════
     THE FIRST VISIT
     Three stages, each ending on whichever comes first: the person doing
     something, or three seconds. Acting always wins — the timer is the floor
     for somebody who is just watching, never a wait imposed on somebody who
     already knows what they want.
     ══════════════════════════════════════════════════════════════ */
  /* Two seconds, not three: three was long enough that a person who had
     already read the screen was waiting on it. Four beats now instead of
     three, so the whole thing is a second shorter than it was AND says more. */
  var INTRO_HOLD = 2000, INTRO_STAGES = 4;
  var introStage = 0, introT = null, introDone = false;

  function introSeen(){
    /* sessionStorage throws outright in some sandboxes (a data: document has
       an opaque origin), and a design that cannot be previewed is worse than
       one that repeats its intro — so a throw means "not seen" and the intro
       simply runs. */
    try{ return sessionStorage.getItem("olma-intro") === "1"; }catch(e){ return false; }
  }
  function markIntroSeen(){
    try{ sessionStorage.setItem("olma-intro", "1"); }catch(e){}
  }
  /* Where the channels group has to move so it sits in the middle of the
     screen. Measured, not assumed: the same offset is wrong on every phone
     but one, and this has to look deliberate on all of them. */
  function introOffset(){
    var g = $('#toolsStack [data-stage="1"]');
    if(!g) return 0;
    var vh = window.innerHeight || document.documentElement.clientHeight || 0;
    /* No trustworthy viewport height means no centring — the group stays where
       it is and the later stages still do their work. A guessed offset would
       put the one element this stage is about somewhere arbitrary. */
    if(vh < 320) return 0;
    var r = g.getBoundingClientRect();
    var want = vh / 2 - (r.top + r.height / 2);
    /* only ever DOWNWARD: pulling the group up would slide the header off the
       top of the screen, which reads as broken rather than as staged */
    return Math.max(0, Math.round(want));
  }
  /* `arm` false paints the stage without starting its clock. Stage 1 is armed
     that way at load: the very first frame the person sees is already the
     staged composition, and the three seconds only begin once the page is
     genuinely up. Without that split the page appears complete, sits there for
     however long the fonts take, and THEN collapses into stage 1 — which on a
     slow connection is the one thing this must never look like. */
  function introGo(stage, arm){
    if(introDone) return;
    clearTimeout(introT);
    introStage = stage;
    var root = document.documentElement;
    root.classList.remove("intro-1", "intro-2", "intro-3", "intro-4");
    if(stage > INTRO_STAGES){ introFinish(); return; }
    root.classList.add("intro", "intro-" + stage);
    if(stage === 1) root.style.setProperty("--introY", introOffset() + "px");
    if(arm === false) return;
    introT = setTimeout(function(){ introGo(stage + 1); }, INTRO_HOLD);
  }
  function introFinish(){
    if(introDone) return;
    introDone = true;
    clearTimeout(introT);
    var root = document.documentElement;
    root.classList.remove("intro-1", "intro-2", "intro-3", "intro-4");
    /* `intro` comes off one frame later so the last transition can finish
       against the same rules it started under — dropping it in the same tick
       restores the stagger animation mid-move and the page jumps. */
    requestAnimationFrame(function(){
      setTimeout(function(){
        root.classList.remove("intro");
        root.classList.add("intro-settled");
        root.style.removeProperty("--introY");
      }, 700);
    });
    markIntroSeen();
    introUnbind();
  }
  /* Any real intent skips ahead. A tap that also DOES something (choosing a
     channel, opening an account) is both an answer and a skip — it is not
     swallowed, because the listener is on the capture phase of a separate
     handler and never calls preventDefault. */
  var INTRO_EVENTS = ["pointerdown", "keydown", "wheel", "touchstart"];
  function introNudge(){
    if(introDone) return;
    introGo(introStage + 1);
  }
  function introUnbind(){
    INTRO_EVENTS.forEach(function(ev){
      document.removeEventListener(ev, introNudge, {capture:true});
    });
  }
  function startIntro(){
    if(introSeen()) return;
    if(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches){
      markIntroSeen();
      return;
    }
    /* stage 1 is painted NOW, unarmed — see introGo */
    introGo(1, false);
    INTRO_EVENTS.forEach(function(ev){
      document.addEventListener(ev, introNudge, {capture:true, passive:true});
    });
    /* The clock starts when the PAGE is ready, not when the script parses.
       document.fonts.ready is the honest signal — the layout this animation
       measures is not final until the real face is in — and it is raced
       against a ceiling so a font that never arrives cannot hold the intro
       open forever. Then one frame, so the first stage is painted before its
       three seconds begin counting. */
    var started = false;
    function begin(){
      if(started || introDone) return;
      started = true;
      /* re-measure before arming: the offset taken at load was measured against
         a layout the real font had not landed in yet */
      requestAnimationFrame(function(){ if(introStage === 1) introGo(1); });
    }
    if(document.fonts && document.fonts.ready) document.fonts.ready.then(begin);
    setTimeout(begin, 2500);
  }
  /* One or the other, never both: the three-stage intro stages the APP, and
     a stranger is not being shown the app. */
  if(NEWUSER) startWelcome(); else startIntro();
  $("#newTog").addEventListener("click", function(){
    NEWUSER = !NEWUSER;
    document.documentElement.classList.toggle("is-new", NEWUSER);
    $("#welcome").hidden = !NEWUSER;
    if(NEWUSER) renderWelcome();
  });
  $("#introTog").addEventListener("click", function(){
    try{ sessionStorage.removeItem("olma-intro"); }catch(e){}
    document.documentElement.classList.remove("intro-settled");
    introDone = false; introStage = 0;
    go("tools");
    startIntro();
    introGo(1);
  });

  /* preview only: L flips the language, standing in for the person
     having switched languages mid-conversation. Not product UI. */
  function setLocale(v){
    if(v === LOCALE) return;
    LOCALE = v; D = T[LOCALE];
    $$("#langTog span").forEach(function(el, i){ el.classList.toggle("on", (i ? "en" : "he") === LOCALE); });
    renderAll();
  }
  $$("#langTog span").forEach(function(el, i){ el.classList.toggle("on", (i ? "en" : "he") === LOCALE); });
  $("#langTog").addEventListener("click", function(){ setLocale(LOCALE === "he" ? "en" : "he"); });

  /* preview only: forces one theme, standing in for a phone set that way.
     Starts on neither — un-stamped is the real default, where the OS decides
     — and from the first press it alternates, so both are one tap apart. */
  $("#themeTog").addEventListener("click", function(){
    var root = document.documentElement, now = root.getAttribute("data-theme");
    var dark = now ? now === "light"
      : !(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
    root.setAttribute("data-theme", dark ? "dark" : "light");
    this.innerHTML = dark ? "&#9788;" : "&#9789;";
  });
  /* The four buttons above are hidden by CSS on a served page, which takes
     their clicks with them. This shortcut has no button to hide, so it is
     asked separately — otherwise a stray L in somebody's real dashboard
     silently translates their whole list. */
  if(!document.documentElement.hasAttribute("data-served")){
    document.addEventListener("keydown", function(e){
      if(e.key !== "l" && e.key !== "L" && e.key !== "ל") return;
      if(e.target && e.target.closest && e.target.closest("input, textarea")) return;
      setLocale(LOCALE === "he" ? "en" : "he");
    });
  }
})();
</script>
