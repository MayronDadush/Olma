  <symbol id="i-notion" viewBox="0 0 20 20"><path d="M4.1 3.6 13 3a1.4 1.4 0 0 1 1 .3l2.2 1.6c.3.2.4.5.4.8v9.5c0 .6-.4 1-1 1.1l-9.9.6a1.4 1.4 0 0 1-1.3-.7L3.6 15a1.4 1.4 0 0 1-.2-.8V4.7c0-.6.3-1 .7-1.1Z" fill="none" stroke="#141322" stroke-width="1.3" stroke-linejoin="round"/><path d="M7.1 7.1v5.6M7.1 7.1l4.4 5.4M11.5 7v5.5" fill="none" stroke="#141322" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-slack" viewBox="0 0 20 20"><rect x="8.6" y="2.2" width="3" height="8" rx="1.5" fill="#36C5F0"/><rect x="2.2" y="8.6" width="8" height="3" rx="1.5" fill="#2EB67D"/><rect x="8.4" y="9.8" width="3" height="8" rx="1.5" fill="#ECB22E"/><rect x="9.8" y="8.4" width="8" height="3" rx="1.5" fill="#E01E5A"/></symbol>
  <symbol id="i-tools" viewBox="0 0 24 24"><path d="M4 7h9M17.5 7H20M4 17h3M11.5 17H20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/><circle cx="15.3" cy="7" r="2.5" fill="none" stroke="currentColor" stroke-width="1.9"/><circle cx="9.3" cy="17" r="2.5" fill="none" stroke="currentColor" stroke-width="1.9"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><path d="M4 6.6 5.7 8.4 9 5M4 16.6l1.7 1.8L9 15M12.5 7h7.5M12.5 17H20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-cal24" viewBox="0 0 24 24"><rect x="3.2" y="4.8" width="17.6" height="16" rx="4" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M3.2 9.6h17.6M8 3v3.2M16 3v3.2" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></symbol>
  <symbol id="i-people" viewBox="0 0 24 24"><circle cx="9.2" cy="8.4" r="3.4" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M2.8 19.4c.6-3.3 3.2-5.2 6.4-5.2s5.8 1.9 6.4 5.2" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/><path d="M16 5.4a3.2 3.2 0 0 1 0 6.1M17.6 14.6c2.1.5 3.4 2.2 3.8 4.4" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></symbol>
  <symbol id="i-user24" viewBox="0 0 24 24"><circle cx="12" cy="8.2" r="4" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M4.4 20.2c.8-3.9 3.9-6 7.6-6s6.8 2.1 7.6 6" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></symbol>
  <symbol id="i-pause" viewBox="0 0 16 16"><path d="M5.6 3v10M10.4 3v10" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
  <symbol id="i-play" viewBox="0 0 16 16"><path d="M4.6 3.2 12.6 8l-8 4.8Z" fill="currentColor" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></symbol>
  <symbol id="i-undo" viewBox="0 0 16 16"><path d="M3.4 6.2h6.3a3.6 3.6 0 0 1 0 7.2H6.1" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 2.9 2.9 6.2 6 9.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-x" viewBox="0 0 12 12"><path d="M2 2l8 8M10 2l-8 8" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></symbol>
  <symbol id="i-search" viewBox="0 0 20 20"><circle cx="8.8" cy="8.8" r="5.6" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m13.1 13.1 3.7 3.7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
  <symbol id="i-phone" viewBox="0 0 20 20"><path d="M5.3 3h1.42c.63 0 1.2.4 1.4 1l.78 2.05c.21.57.03 1.2-.44 1.58l-.7.55a8.7 8.7 0 0 0 3.06 3.06l.55-.7c.38-.47 1.01-.65 1.58-.44l2.05.78c.6.2 1 .77 1 1.4v1.42a2.1 2.1 0 0 1-2.28 2.1C8.5 15.3 4.7 11.5 3.2 5.28A2.1 2.1 0 0 1 5.3 3Z" fill="currentColor"/></symbol>
  <symbol id="i-note" viewBox="0 0 20 20"><path d="M4.4 2.6h11.2v10.2l-4 4.6H4.4Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M15.6 12.6h-4v4.8M7.2 6.4h5.6M7.2 9.4h4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-folder" viewBox="0 0 20 20"><path d="M2.6 5.6a2 2 0 0 1 2-2h2.9l2 2.4h6a2 2 0 0 1 2 2v6.4a2 2 0 0 1-2 2h-10.9a2 2 0 0 1-2-2Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></symbol>
  <symbol id="i-arrdown" viewBox="0 0 16 16"><path d="M2.9 5.3h10.2L8 12.4Z" fill="currentColor" stroke="currentColor" stroke-width="2.1" stroke-linejoin="round"/></symbol>
  <!-- The mark. A globe that talks: the meridian and the horizon say עולם,
       the tail makes it something you speak to. Its gradient lives here in
       the sheet's own <defs> rather than inside the symbol — a <use> clone
       resolves url(#…) against THIS document, so one definition serves every
       copy, but a gradient declared in another file would silently render
       black. -->
  <linearGradient id="i-logo-g" x1="18" y1="10" x2="80" y2="86" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#9C7BF8"/><stop offset=".55" stop-color="#5B2FD6"/><stop offset="1" stop-color="#3A1A90"/>
  </linearGradient>
  <clipPath id="i-logo-c"><circle cx="46" cy="44" r="32"/></clipPath>
  <symbol id="i-logo" viewBox="0 0 96 96">
    <path d="M46 12a32 32 0 0 1 32 32 32 32 0 0 1-32 32c-3.6 0-7-.6-10.2-1.7l-13.4 6a2.4 2.4 0 0 1-3.3-2.7l2.3-11.2A32 32 0 0 1 46 12Z" fill="url(#i-logo-g)"/>
    <g clip-path="url(#i-logo-c)" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round">
      <path d="M14 44h64" opacity=".5"/><ellipse cx="46" cy="44" rx="14.5" ry="32" opacity=".55"/>
    </g>
    <circle cx="70" cy="22" r="5.2" fill="#fff" opacity=".9"/>
  </symbol>
</defs></svg>

<div class="app">

  <header class="topbar">
    <button class="brand" id="brandBtn" data-go="me">
      <!-- The mark, not the person: their own face is the hero of the
           profile page, and repeating it here said nothing the rest of the
           screen was not already about them. -->
      <span class="brandmark" aria-hidden="true"><svg><use href="#i-logo"/></svg></span>
      <div class="brand-txt">
        <div class="brand-hi" id="brandHi"></div>
        <div class="brand-name" id="brandName"></div>
      </div>
    </button>
    <button class="topclock" id="topClock" data-i18n-label="city.title"></button>
    <div class="live"><span class="dot"></span><span id="olmaLive"></span></div>
  </header>

  <main>
  <!-- ══════════════  connections  ══════════════ -->
  <section class="view active" data-view="tools">
    <div class="title" style="--i:0">
      <h1 id="toolsH"></h1>
      <p data-i18n="tools.p"></p>
    </div>
    <div class="stack" style="--i:1" id="toolsStack"></div>
  </section>

  <!-- ══════════════  tasks  ══════════════ -->
  <section class="view" data-view="tasks">
    <div class="title" style="--i:0">
      <h1 data-i18n="tasks.h"></h1>
      <p id="taskCount"></p>
    </div>
    <!-- two ways to read the same list, and nothing else on the row -->
    <div class="viewrow" style="--i:1">
      <div class="seg mini" id="taskView">
        <button aria-pressed="true"  data-view-by="time" data-i18n="cat.byTime"></button>
        <button aria-pressed="false" data-view-by="cat"  data-i18n="cat.byCat"></button>
      </div>
      <button class="addmini" id="addTask"><svg><use href="#i-plus"/></svg><span data-i18n="tasks.new"></span></button>
    </div>
    <div style="--i:2">
      <div class="stack" id="taskStack"></div>
    </div>
    <div class="archive" id="archive" style="--i:3">
      <button class="arcbtn" id="arcBtn" aria-expanded="false">
        <svg class="chev"><use href="#i-chev"/></svg>
        <span data-i18n="tasks.archive"></span>
        <span id="arcCount" style="margin-inline-start:auto;font-weight:500"></span>
      </button>
      <div class="fold" id="arcFold"><div>
        <div class="group" id="arcGroup" style="box-shadow:none;background:var(--surface-2)"></div>
        <p class="arcnote" id="arcNote" hidden></p>
      </div></div>
    </div>
  </section>

  <!-- ══════════════  calendar  ══════════════ -->
  <section class="view" data-view="cal">
    <div class="title" style="--i:0">
      <h1 data-i18n="cal.h"></h1>
      <p id="calSub"></p>
    </div>
    <!-- Two modes, not two pages. Reading the week and arranging something in
         it are the same subject, and the same segment control the task list
         already uses says so. -->
    <div class="viewrow" style="--i:1">
      <div class="seg mini" id="calMode">
        <button aria-pressed="true"  data-calmode="cal"  data-i18n="cal.modeRead"></button>
        <button aria-pressed="false" data-calmode="meet" data-i18n="cal.modeMeet"></button>
      </div>
      <!-- Starting one is the first thing you might want here, so it sits at
           the top with the control that got you to this mode — not at the far
           end of however many coordinations you already have. -->
      <button class="addmini" id="mtNew" hidden><svg><use href="#i-plus"/></svg><span data-i18n="mt.new"></span></button>
    </div>

    <div id="calRead">
      <div style="--i:2">
        <div class="group">
          <!-- A week strip that could only ever show the next seven days was
               a calendar you could not look ahead in. The arrows page a week
               at a time and stop exactly where the data does: /me/events
               fetches two weeks back and four forward, so paging past that
               would show empty days that are empty only because nobody
               asked Google about them. -->
          <div class="stripmonth">
            <button class="calnav wknav" data-wk="-1" id="wkPrev"><svg viewBox="0 0 16 16"><path d="M10 2 4 8l6 6"/></svg></button>
            <span id="stripMonth"></span><span id="stripYear"></span>
            <button class="wkback" id="wkToday" hidden data-i18n="cal.thisWeek"></button>
            <button class="calnav wknav" data-wk="1" id="wkNext"><svg viewBox="0 0 16 16"><path d="M6 2l6 6-6 6"/></svg></button>
          </div>
          <div class="daystrip" id="daystrip"></div>
        </div>
      </div>
      <div style="--i:3;margin-top:24px">
        <div class="glabel"><span id="agendaLabel"></span></div>
        <div class="group" id="agenda"></div>
      </div>
      <div style="--i:4;margin-top:20px">
        <button class="bigbtn" data-toast="toast.calOpen">
          <svg><use href="#i-out"/></svg><span data-i18n="cal.open"></span>
        </button>
      </div>
    </div>

    <div id="calMeet" hidden>
      <div style="--i:2">
        <div class="glabel"><span data-i18n="mt.open"></span><span class="hint" id="mtCount"></span></div>
        <div class="stack" id="mtList"></div>
      </div>
      <!-- The same archive the task list has, for the same reason. Settled
           ones leave the active list — they are calendar entries now, not
           questions — and so do the ones you left, which used to vanish
           outright. Leaving is one tap and its commonest cause is a mis-tap,
           so it needs a way back; ↺ on a row you left puts you back in and
           tells the others, because they were told when you went. -->
      <div class="archive" id="mtArchive" style="--i:3;margin-top:20px" hidden>
        <button class="arcbtn" id="mtArcBtn" aria-expanded="false">
          <svg class="chev"><use href="#i-chev"/></svg>
          <span data-i18n="mt.done"></span>
          <span id="mtArcCount" style="margin-inline-start:auto;font-weight:500"></span>
        </button>
        <div class="fold" id="mtArcFold"><div>
          <div class="stack" id="mtDone"></div>
          <p class="arcnote" id="mtArcNote" hidden></p>
        </div></div>
      </div>
      <p class="note" style="padding:14px 14px 0" data-i18n="mt.note"></p>
    </div>
  </section>

  <!-- ══════════════  friends  ══════════════ -->
  <section class="view" data-view="friends">
    <div class="title" style="--i:0">
      <h1 data-i18n="fr.h"></h1>
      <p data-i18n="fr.p"></p>
    </div>
    <!-- Adding somebody comes BEFORE the lists: this page is where you come
         to grow them, and the action you came for should not be below
         everything you already have. Both actions share one row because they
         are the same question asked at two sizes — one person, or a set of
         them you will reach for again. -->
    <div class="viewrow pair" style="--i:1">
      <button class="addmini" id="addFriend"><svg><use href="#i-plus"/></svg><span data-i18n="fr.invite"></span></button>
      <button class="addmini ghost" id="addGroup"><svg><use href="#i-plus"/></svg><span data-i18n="gr.new"></span></button>
    </div>
    <div style="--i:2">
      <div class="glabel"><span data-i18n="gr.h"></span><span class="hint" data-i18n="gr.hint"></span></div>
      <div class="searchwrap" id="groupSearch" hidden>
        <svg class="sicon"><use href="#i-search"/></svg>
        <input id="groupQ" type="search" autocomplete="off" data-i18n-ph="gr.search" data-i18n-label="gr.search">
        <button class="sclear" id="groupQClear" hidden data-i18n-label="fr.clear">&#10005;</button>
      </div>
      <div class="grscroll" id="groupScroll"><div class="group" id="groupGroup"></div></div>
      <p class="note" id="groupEmpty" style="padding:0 14px" hidden></p>
    </div>
    <div style="--i:3;margin-top:24px">
      <div class="glabel"><span data-i18n="fr.connected"></span><span class="hint" id="friendCount"></span></div>
      <div class="searchwrap" id="friendSearch" hidden>
        <svg class="sicon"><use href="#i-search"/></svg>
        <input id="friendQ" type="search" autocomplete="off" data-i18n-ph="fr.search" data-i18n-label="fr.search">
        <button class="sclear" id="friendQClear" hidden data-i18n-label="fr.clear">&#10005;</button>
      </div>
      <div class="group" id="friendGroup"></div>
      <p class="note" id="friendEmpty" style="padding:0 14px" hidden></p>
    </div>
  </section>

  <!-- ══════════════  profile  ══════════════ -->
  <section class="view" data-view="me">
    <div class="hero-profile" style="--i:0">
      <div class="avatar" id="bigAvatar"></div>
      <div class="who"><b id="whoName"></b><span data-i18n="me.since"></span></div>
      <button class="linkbtn" id="shuffleAvatar" data-i18n="me.avatar"></button>
    </div>
    <div class="stack" style="--i:1">
      <div>
        <div class="glabel"><span data-i18n="me.personal"></span></div>
        <div class="group fpad">
          <div class="fgrid">
            <div class="ffield"><label for="fname" data-i18n="me.first"></label><input id="fname" type="text" autocomplete="given-name"></div>
            <div class="ffield"><label for="lname" data-i18n="me.last"></label><input id="lname" type="text" autocomplete="family-name"></div>
            <div class="ffield"><label for="bday" data-i18n="me.bday"></label><button class="dateval" id="bday" data-cal="bday" data-val="1994-03-16"></button></div>
            <div class="ffield">
              <label id="genderLabel" data-i18n="me.form"></label>
              <div class="seg" id="genderSeg" role="group" aria-labelledby="genderLabel">
                <button aria-pressed="true" data-g="m" data-i18n="me.masc"></button>
                <button aria-pressed="false" data-g="f" data-i18n="me.fem"></button>
              </div>
            </div>
          </div>
        </div>
        <p class="note" style="padding:0 14px" data-i18n="me.formNote"></p>
      </div>
      <div>
        <div class="glabel"><span data-i18n="me.setup"></span></div>
        <div class="group">
          <button class="row no-icon" id="cityRow">
            <div class="row-txt"><div class="row-title" data-i18n="me.where"></div></div>
            <span class="row-val" id="cityName"></span>
            <span class="row-end" id="cityClock"></span>
            <svg class="chev"><use href="#i-chev"/></svg>
          </button>
          <div class="row no-icon">
            <label class="row-title" for="oname" data-i18n="me.calledBy"></label>
            <input class="row-input" id="oname" type="text" maxlength="18" data-i18n-label="me.calledBy">
          </div>
        </div>
        <p class="note" style="padding:0 14px" id="setupNote"></p>
      </div>
      <div class="pausewrap">
        <button class="pausebtn" id="pauseBtn" aria-pressed="false">
          <svg id="pauseIcon"><use href="#i-pause"/></svg><span id="pauseLabel"></span>
        </button>
        <p class="note" id="pauseNote"></p>
      </div>
    </div>
  </section>
  </main>
</div>

<nav class="tabbar" role="tablist">
  <span class="tabpill" id="tabpill" aria-hidden="true"></span>
  <button class="tab" role="tab" aria-selected="true" data-go="tools"><svg><use href="#i-tools"/></svg><span data-i18n="tab.tools"></span></button>
  <button class="tab" role="tab" aria-selected="false" data-go="tasks"><svg><use href="#i-list"/></svg><span data-i18n="tab.tasks"></span></button>
  <button class="tab" role="tab" aria-selected="false" data-go="cal"><svg><use href="#i-cal24"/></svg><span data-i18n="tab.cal"></span></button>
  <button class="tab" role="tab" aria-selected="false" data-go="friends"><svg><use href="#i-people"/></svg><span data-i18n="tab.friends"></span></button>
  <button class="tab" role="tab" aria-selected="false" data-go="me"><svg><use href="#i-user24"/></svg><span data-i18n="tab.me"></span></button>
</nav>

<!-- ══════════════  the first screen  ══════════════
     Shown instead of the app to somebody with no account yet. It offers
     exactly two things, because they are the only two that would work: the
     doors into a conversation with her. Both are real deep links — they open
     that app on the thread with her, with nothing typed, which is the point:
     the first sentence has to be theirs, in their own language, because it is
     what tells her which language to speak. -->
<div class="welcome" id="welcome" hidden>
  <div class="wcard">
    <div class="wmark" aria-hidden="true"><svg><use href="#i-logo"/></svg></div>
    <h1 class="wword" id="wWord"></h1>
    <p class="wlede" id="wTag"></p>
    <div class="whint">
      <b data-i18n="w.hint"></b>
      <span class="warrow" aria-hidden="true"><svg><use href="#i-arrdown"/></svg></span>
    </div>
    <div class="wrow" id="wRow"></div>
    <p class="wfoot" data-i18n="w.foot"></p>
  </div>
</div>

<!-- preview scaffolding, not product UI: lets the design be checked in
     both languages and both text directions without reloading. -->
<div class="calscrim" id="calScrim" hidden></div>
<div class="calpop" id="calPop" role="dialog" aria-modal="true" hidden></div>

<button class="langtog" id="langTog" title="preview only"><span>HE</span><span>EN</span></button>
<!-- preview only: replay the first-visit intro, which otherwise happens once
     per tab and would be impossible to look at twice. -->
<button class="introtog" id="introTog" title="preview only: replay first visit">&#8635;</button>
<!-- preview only: the screen a stranger gets. The real page is put into
     this state by the server (data-new) or by ?new=1 on the link. -->
<button class="newtog" id="newTog" title="preview only: the first screen">&#10022;</button>
<!-- preview only: the real page has no theme control — it follows the phone,
     exactly as the language follows what they write to her in. -->
<button class="themetog" id="themeTog" title="preview only: light / dark">&#9789;</button>

<div class="scrim" id="scrim"></div>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sTitle">
  <div class="sgrab"><i class="grabber"></i></div>
  <!-- The heading of a sheet is not usually typeable, so it needs to say that
       it is: a pencil while editing, and on a brand-new task a check, because
       the title is the one field that has to exist before anything else here
       means anything. Everything below still saves as you type. -->
  <div class="stitlewrap">
    <input class="stitle" id="sTitle" type="text" data-i18n-ph="sheet.taskPh" data-i18n-label="sheet.task" autocomplete="off">
    <span class="stedit" id="sTitleEdit" aria-hidden="true"><svg><use href="#i-pencil"/></svg></span>
    <button class="stgo" id="sTitleGo" hidden><svg><use href="#i-check"/></svg></button>
  </div>
  <!-- Where it came from, said once at the top, so the greyed rows further
       down do not each have to explain themselves. -->
  <div class="srcline" id="sSrc" hidden>
    <span class="srcmark"><svg id="sSrcIcon"><use href="#i-monday"/></svg></span>
    <span id="sSrcTxt"></span>
  </div>
  <div class="group">
    <!-- A list is what the task IS, so it heads the group, above every
         question about when. Folded by default: the row already carries the
         count, and an open list would push the editor past one screen —
         which is the one rule this sheet has. -->
    <button class="row no-icon" id="sListRow" aria-expanded="false">
      <div class="row-txt"><div class="row-title" data-i18n="sheet.list"></div>
        <div class="row-sub" id="sListSub"></div></div>
      <span class="tcount" id="sListCount" hidden></span>
      <svg class="chev"><use href="#i-chev"/></svg>
    </button>
    <div class="fold" id="sListFold"><div>
      <div class="listbox" id="sList"></div>
      <div class="row no-icon additemrow">
        <input class="row-input additem" id="sAddItem" type="text" maxlength="60"
               data-i18n-ph="sheet.addItem" data-i18n-label="sheet.addItem" autocomplete="off">
      </div>
    </div></div>
    <!-- Date, time and all-day were three rows asking one question. They are
         one row of values now: each is its own target, and the ones that do
         not apply yet simply are not there. -->
    <div class="row no-icon whenrow">
      <div class="row-title" data-i18n="sheet.when"></div>
      <div class="whenvals">
        <button class="vchip" id="sDateRow" data-cal="task" data-quick="1"><span id="sDateVal"></span></button>
        <button class="vchip" id="sTimeChip"><span id="sTimeVal"></span></button>
        <!-- Where it STOPS. A shift used to be a title with its hours typed
             into it — `משמרת - ראשון 12:00-19:00` — because there was nowhere

<script>
(function(){
  "use strict";
  var $  = function(s,r){ return (r||document).querySelector(s); };
  var $$ = function(s,r){ return Array.prototype.slice.call((r||document).querySelectorAll(s)); };

  /* ══════════════════════════════════════════════════════════════
     THE SEAM — where this becomes the real dashboard
     ──────────────────────────────────────────────────────────────
     Every state change in this page is local: an array is edited and the
     view is redrawn. That is deliberate — the interaction design is what
     this file is for. But nothing here has to be re-thought to wire it up,
     because every mutation ALSO reports itself through one object. Replace
     these bodies with `fetch('/api/…')` (or with the MCP tool of the same
     name) and the UI does not change a line.

     Where each thing lives in the real system:

       open / archived   →  tasks            (owner_id, title, due_at, status,
                                              category, parent_id, archived_at)
       x.items           →  tasks.parent_id, one row per line — the same
                            self-referential nesting projects already use, so
                            a checklist needs no new table
       x.who / x.owner   →  task_shares      (owner_id, viewer_id, scope,
                                              status) — `owner` is the row's
                            owner_id, `who` is every active viewer_id, and
                            that is exactly why leaving and deleting are two
                            different actions in the UI
       FRIENDS[].p       →  connection_feature_grants (sharing | meetings |
                            messages), one row per side per feature
       PROVIDERS[].svc   →  integrations     (provider, scope 'read_only' |
                                              'read_write', status)
       defaultChannel    →  users.digest_scope / the outbox channel
       TASKCATS          →  tasks.category — a CLOSED set here because the
                            server validates it as one (like
                            KNOWN_CONNECTION_FEATURES), not a free-text field
       x.src / SOURCES   →  the per-platform import. `caps` is the honest
                            intersection with OUR columns; a field the source
                            cannot hold is greyed here and must stay
                            unwritable there, or the next sync silently
                            discards a change the person made
       MEETS             →  meetings + meeting_participants. An answer is
                            availability; settling one is the confirm gate —
                            status only becomes 'confirmed' when somebody
                            deliberately settles it, and where not everyone
                            agreed that takes a second, differently-worded
                            press naming who is being left out
       MEETS[].opts      →  the candidate slots. Each is a real moment: a
                            date plus either a canonicalPart or an exact
                            time, or neither when the meeting is all_day. A
                            pending one is a proposal from somebody who did
                            not open the coordination, and is visible to
                            nobody but the creator and its own author
       MEETS[].ans       →  meeting_availability, one row per person per
                            option, 'y' or 'n'. ABSENT is a third value and
                            has to stay one: folding "has not answered" into
                            "cannot" would let the confirm gate read silence
                            as a refusal
       MEETS[].left      →  meeting_participants.left_at. They are still
                            shown and counted in nothing — the group has to
                            be able to see why the tally dropped
       MEETS[].inCal     →  whether the settled slot sits on THIS person's
                            calendar. Private, and not the same thing as
                            being in the meeting — which is why they are two
                            controls, in two places, with two different words
       CONTACTS          →  the connected contacts integration, read-only —
                            never a table of ours, and never browsed unasked
       MEETS[].settled   →  meetings.confirmed_start_at

     The vocabulary is already the server's: `read`/`write` are `read_only`/
     `read_write`, ids are integers, and a person is a user id everywhere —
     never a phone number, which is what the real schema does too.
     ══════════════════════════════════════════════════════════════ */
  /* Every entry logs the REAL name the server knows the action by — the MCP
     tool where one exists, the table where it is an operator action. Naming
     them anything else would mean wiring this up twice: once to make the UI
     work, and once to find out what each of these was supposed to have been.

     The four marked NO TOOL YET are real gaps, not oversights in this file: the
     agent has no way to perform them today and the dashboard does them by
     direct write. They are named here as what they would be called, so the gap
     is visible rather than discovered during wiring. */
  var TOOL = {
    saveTask:            "add_task",                  /* an edit is the same call with an id */
    /* An imported task is not ours to create, and writing one back through
       add_task would be the second copy of somebody else's row. It goes to the
       source's own import path — which is also the place that must refuse a
       field the source cannot hold, exactly as the greyed rows promise. */
    saveImportedTask:    "update_imported_task",        /* NO TOOL YET — per-source import */
    deleteTask:          "delete_task",               /* NO TOOL YET — dashboard only */
    completeTask:        "complete_task",
    restoreTask:         "restore_task",              /* NO TOOL YET — list_my_archive only reads */
    snoozeTask:          "snooze_task",
    setReminder:         "set_task_reminder",
    shareTask:           "share_task_with",
    unshareTask:         "revoke_share",
    leaveTask:           "revoke_share",              /* leaving IS revoking your own view */
    setCategory:         "set_task_category",         /* NO TOOL YET — tasks.category */
    setServiceMode:      "start_calendar_connection", /* integrations.scope, per service */
    setFriendPermission: "grant_connection_feature",  /* revoke_connection_feature when off */
    setDefaultChannel:   "set_digest_preferences",
    setTimezone:         "set_my_timezone",
    inviteContact:       "request_connection",
    startMeeting:        "start_meeting_coordination",
    setAvailability:     "send_availability_picker",  /* the picker's own POST, per option */
    confirmSlot:         "respond_to_meeting_slot",   /* propose_meeting_slot proposes it */
    leaveMeeting:        "leave_meeting",              /* NO TOOL YET — meeting_participants.left_at */
    rejoinMeeting:       "rejoin_meeting",             /* NO TOOL YET — dashboard only */
    pause:               "pause_olma",
    resume:              "resume_olma"
  };
  /* The server's own action names (domain/user-dashboard-write.js). Where a
     seam has no entry there is genuinely nothing to call yet, and it is left
     to log rather than given a plausible-looking name — a wired-looking call
     that lands nowhere is worse than an obvious gap. */
  var ACT = {
    addTask:"addTask", editTask:"editTask", completeTask:"completeTask",
    archiveTask:"archiveTask", restoreTask:"restoreTask",
    setReminder:"setReminder", cancelReminder:"cancelReminder",
    setTaskReminder:"setTaskReminder", setTaskCalendar:"setTaskCalendar",
    shareTask:"shareTask", revokeShare:"revokeShare",
    grantFeature:"grantFeature", revokeFeature:"revokeFeature",
    setTimezone:"setTimezone", pause:"pause", resume:"resume",
    inviteContact:"inviteContact",
    respondToMeeting:"respondToMeeting", leaveMeeting:"leaveMeeting",
    rejoinMeeting:"rejoinMeeting",
    startMeeting:"startMeeting", addOption:"addOption", answerOption:"answerOption",
    approveOption:"approveOption", rejectOption:"rejectOption", swapOption:"swapOption",
    startGoogle:"startGoogle", stopGoogle:"stopGoogle",
    stopGoogleService:"stopGoogleService"
  };
  /* Ids the server has actually seen. It is what decides whether saving a task
     creates one or edits one — the page numbers its own new rows from a local
     counter, and asking "is this id one of ours" is the only honest test. */
  var SERVER_IDS = {};
  /* This person's own user id, once the server has said what it is. Needed for
     exactly one thing: leaving a shared task means revoking MY share row, and
     the row is keyed by the real id even though the page calls me 0. */
  var MY_ID = null;

  /* The offset in force in the person's own zone ON THAT DATE — not today's.
     A reminder set in summer for a date in autumn is otherwise an hour out,
     and a bare local time is refused by the server anyway (add_task has
     required an offset since a shift said as 15:00 was stored as 15:00Z). */
  function zoneOffset(tz, at){
    try{
      var parts = new Intl.DateTimeFormat("en-US", {timeZone:tz, timeZoneName:"longOffset"})
        .formatToParts(at);
      var name = parts.filter(function(x){ return x.type === "timeZoneName"; })[0];
      var m = String(name && name.value || "").match(/GMT([+-])(\d{1,2}):?(\d{2})?/);
      if(!m) return "+00:00";                       /* bare "GMT" is UTC */
      return m[1] + String(m[2]).padStart(2,"0") + ":" + (m[3] || "00");
    }catch(err){ return "+00:00"; }
  }
  function dueIso(x){
    if(!x || !x.d) return null;
    var tz = CITIES[cityIdx] ? CITIES[cityIdx].tz : "UTC";
    var time = (x.all || !x.tm) ? "00:00" : x.tm;
    return x.d + "T" + time + ":00" + zoneOffset(tz, new Date(x.d + "T" + time + ":00Z"));
  }

  /* The far end of the range, in the same shape and the same zone as the
     start. Null whenever there is no range to state, which is also how a range
     is REMOVED: editTask reads null as "clear it". */
  function endIso(x){
    if(!x || !x.d || x.all || !x.tm || !x.tmEnd) return null;

  var NEWUSER = (function(){
    var q = new URLSearchParams(location.search).get("new");

    var q = new URLSearchParams(location.search).get("lang") || "";

       actually saying something about language, or "new" resolves to "ne" and
       quietly wins the choice below */
    var raw = (location.hash || "").replace(/^#/, "");
    var h = /^lang=/i.test(raw) ? raw.slice(5) : (/^(he|en)$/i.test(raw) ? raw : "");

  /* ══════════════════════════════════════════════════════════════
     CHARACTERS — flat illustration, not a cartoon sticker. Three
     things keep the set adult rather than childish, and all three are
     constraints rather than decoration:
       · a CLOSED palette (three circle tones, six coats, one ink) —
         nothing here picks a colour freely;
       · flat fills only — no gradient, no gloss, no catchlight;
       · the classic long shadow, cast at 45° in a darker tone of the
         circle it falls on, which is what gives a flat face depth.
     One shared face rig sits under every species, so blinking,
     eye-tracking and the sleep state work on anything added later.
     ══════════════════════════════════════════════════════════════ */
  var PAL = {

    ink:"#3B3B3B",
    cream:"#F7EFE5", white:"#FBF7F1", peach:"#F3C69E", peachD:"#DDA475",
    ice:"#A9DDE3", iceD:"#8AC7D0", grey:"#9C9C9C", greyD:"#7F7F7F",
    tan:"#E9A96A", tanD:"#CE8B4C", moss:"#5AA79B", rose:"#E08A85"

  var INK = PAL.ink;

     flat colour — a lighter blob clipped to the circle, the way the reference
     sheet does it. Night gets the same treatment against the navy. */
  var BG2 = { teal:"#2A9C93", orange:"#F4A863", slate:"#85837C" };
  var NIGHT2 = "#3B4A57";

  function ell(cx,cy,rx,ry,f){ return '<ellipse cx="'+cx+'" cy="'+cy+'" rx="'+rx+'" ry="'+ry+'" fill="'+f+'"/>'; }
  function ellS(cx,cy,rx,ry,f,sw){ return '<ellipse cx="'+cx+'" cy="'+cy+'" rx="'+rx+'" ry="'+ry+'" fill="'+f+'" stroke="'+INK+'" stroke-width="'+sw+'"/>'; }
  function circ(cx,cy,r,f){ return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+f+'"/>'; }
  /* Every corner in the set is softened here rather than at 40 call sites.
     The radius is clamped to half the shorter edge, so a small triangle (a
     nose) rounds proportionally instead of collapsing. */
  function n2(v){ return (Math.round(v * 100) / 100); }
  function roundPoly(pts, r, f){
    var n = pts.length, d = "";
    for(var i = 0; i < n; i++){
      var p0 = pts[(i - 1 + n) % n], p1 = pts[i], p2 = pts[(i + 1) % n];
      var ax = p0[0] - p1[0], ay = p0[1] - p1[1], bx = p2[0] - p1[0], by = p2[1] - p1[1];
      var la = Math.hypot(ax, ay) || 1, lb = Math.hypot(bx, by) || 1;
      var ra = Math.min(r, la / 2), rb = Math.min(r, lb / 2);
      var sx = p1[0] + ax / la * ra, sy = p1[1] + ay / la * ra;
      var ex = p1[0] + bx / lb * rb, ey = p1[1] + by / lb * rb;
      d += (i === 0 ? "M" : "L") + n2(sx) + " " + n2(sy) +

         became part of the patch's silhouette: the old rect was wider than
         the circle above y≈46 and reached the ear, which is what squared the
         patches off into a band. 32.6..45.4 x 45.5..60 fits within the circle
         throughout, so the patch reads as a plain circle whatever the lid does. */
      return ellS(39,53.4,5.7,6.3,PAL.white,1.3) + ellS(61,53.4,5.7,6.3,PAL.white,1.3) +

          circ(40.2,52.8,1.15,PAL.white) + circ(62.2,52.8,1.15,PAL.white) +

      return '<g class="avaPupils">' +

  /* ── channels, side by side and first ── */
  function chanGroup(){
    var cells = CHANNELS.map(function(c, i){
      /* A tile with nothing behind it is greyed and says so, rather than
         staying live and apologising after the tap. Linking a second identity
         to an account (a real user_channels row) has no path from here, and

         waiting, and only the channel somebody actually arrived on is open. */
      if(c.call){
        var callReady = !LIVE;

          esc(callReady ? t("ch.callSub") : t("soon")) + "</i></button>";
      }
      var chanReady = c.on || !LIVE;
      return '<button class="chan' + (c.on ? " on" : "") + (chanReady ? "" : " soon") +
        '" data-chan="' + c.id + '"' + (chanReady ? "" : " inert") +
        ' style="--ci:' + i + '">' +
        tileFor(c.tile, c.icon) + "<b>" + esc(c.name) + "</b><i>" +
        esc(c.on ? t("ch.open") : (chanReady ? t("ch.add") : t("soon"))) + "</i></button>";
    }).join("");
    /* no hint line here on purpose: each tile already says what it does, and
       one caption cannot describe both "open the chat" and "have Olma ring you". */
    return '<div data-stage="1"><div class="glabel"><span>' + esc(t("ch.h")) + "</span></div>" +
      '<div class="chanrow">' + cells + "</div>" + defaultPicker() + "</div>";

  /* Which of them Olma uses when SHE starts — a reminder, an update. The
     cards above are where you go to her; this is where she comes to you,
     and those are different questions, so it is its own row rather than a
     fourth state crammed onto the tiles. Only live channels are offered:
     defaulting to something not connected would fail silently. */
  function chanName(id){
    var c = CHANNELS.filter(function(x){ return x.id === id; })[0];
    return c ? (c.name || t("ch.call")) : "";

  /* The answer is written out in a sentence, not left to be inferred from
     which chip happens to be lit. A highlighted button says "this one is
     selected"; it does not say WHAT was selected, and with three lookalike
     bubble icons on the cards above, that is exactly the thing to spell out. */
  /* The sentence is built AROUND the name rather than with it: the template is
     split on its own {name} placeholder, so the wording stays one string in one
     place and only the word inside the slot ever moves. */
  function defSentenceHTML(){
    var parts = t("ch.defSub", {name:"\u0000"}).split("\u0000"), w = chanName(defaultChannel);
    return esc(parts[0]) + '<span class="wordslot" id="defWord">' +
      '<i class="wghost">' + esc(w) + '</i><i class="wnow">' + esc(w) + "</i></span>" +
      esc(parts[1] || "");
  }
  /* Out downward, in from above, on the switch's clock. The hidden twin takes
     the new word FIRST, so the slot is already the right width before anything
     starts moving — otherwise the sentence around it reflows mid-animation. */
  function swapWord(slot, text){
    if(!slot) return;
    var cur = slot.querySelector("i.wnow");
    if(!cur || cur.textContent === text) return;
    slot.querySelector("i.wghost").textContent = text;
    var nw = document.createElement("i");
    nw.className = "wnow win";
    nw.textContent = text;
    cur.className = "wout";
    slot.appendChild(nw);
    setTimeout(function(){
      if(cur.parentNode) cur.parentNode.removeChild(cur);
      nw.classList.remove("win");
    }, SW_MS);
  }
  function defaultPicker(){
    /* A call is not a place a reminder can wait — this choice is about where
       WRITING arrives, so it offers the written channels and nothing else,
       whether or not the phone tile is switched on.
       On a real account it offers only the channels that EXIST. Today that is
       WhatsApp and nothing else, so there is no choice to make and the picker
       does not appear: a segmented control with one live option and one that
       cannot be reached is a decision presented to somebody who has none. */
    var live = CHANNELS.filter(function(c){ return !c.call && (!LIVE || c.on); });
    if(live.length < 2) return "";
    return '<div class="group defrow" data-stage="1b" style="margin-top:12px">' +
      '<div class="row no-icon defhead">' +
      '<div class="row-txt"><div class="row-title">' + esc(t("ch.defH")) + "</div>" +

      "</div>" +

  /* ── a call is armed before it rings ──
     A minute of voice costs about a hundred times what a message does, so this
     is the one control in the app that must not fire on a pocket tap. The
     first press only ARMS it, and says so; the second one rings. The armed
     state disarms itself after eight seconds, because a button left loaded is
     the same accident one screen later.

     Arming is not instant either, and that is honest rather than theatrical:
     the bridge really does have to be brought up before a call can be placed.
     The wait is where that happens. */
  var CALL_ARM_MS = 1400, CALL_HOLD_MS = 8000, callT = null, callHoldT = null;
  function setCallState(el, st){
    el.dataset.state = st;
    el.querySelector("i").textContent = t({
      idle:"ch.callSub", arming:"ch.callArm", ready:"ch.callReady", ringing:"ch.calling"
    }[st]);
  }
  function pressCall(el){
    var st = el.dataset.state || "idle";
    if(st === "arming" || st === "ringing") return;
    clearTimeout(callT); clearTimeout(callHoldT);
    if(st === "idle"){
      setCallState(el, "arming");
      callT = setTimeout(function(){
        setCallState(el, "ready");
        /* it disarms on its own — never silently, since the caption is what
           told them it was loaded in the first place */
        callHoldT = setTimeout(function(){ setCallState(el, "idle"); }, CALL_HOLD_MS);
      }, CALL_ARM_MS);
      return;
    }
    setCallState(el, "ringing");
    el.classList.add("ringing");
    toast(t("toast.calling"));
    callT = setTimeout(function(){
      el.classList.remove("ringing");
      setCallState(el, "idle");
    }, 3200);
  }

  /* ONE service changed, so exactly one cell is touched. Rebuilding the
     whole fold re-ran every other row's opening animation at once — three
     controls flashing because a fourth switch moved, all of them a beat
     behind the switch that caused it. */
  function refreshService(p, i, on){
    var cell = $('[data-ctl="' + p.id + ":" + i + '"]');
    /* Immediately, in both directions. It used to wait out the closing
       animation before touching the glyph strip, so turning something OFF
       dimmed its glyph half a second after the switch had already moved —
       two gestures where the person made one. */
    afterFold(p);
    if(!cell) return refreshFold(p.id);
    if(on){
      cell.classList.remove("shutting");
      cell.innerHTML = ctlFor(p, p.svc[i], i);
    } else if(cell.firstChild){
      cell.classList.add("shutting");
      setTimeout(function(){
        cell.classList.remove("shutting");
        cell.innerHTML = "";
      }, SW_MS);

  var PEOPLE = {};

  function makeDismissable(sheet){
    var grab = sheet.querySelector(".sgrab");
    if(!grab) return;
    var dragging = false, y0 = 0, dy = 0, lastY = 0, lastT = 0, v = 0;
    function move(e){
      if(!dragging) return;
      var raw = e.clientY - y0;
      dy = raw < 0 ? raw / 3.6 : raw;
      var dt = e.timeStamp - lastT;
      if(dt > 0) v = (e.clientY - lastY) / dt;
      lastY = e.clientY; lastT = e.timeStamp;
      sheet.style.transform = "translateY(" + dy.toFixed(1) + "px)";
      $("#scrim").style.opacity =
        Math.max(0, 1 - Math.max(0, dy) / sheet.offsetHeight * 1.25).toFixed(3);
    }
    function end(){
      if(!dragging) return;
      dragging = false;
      sheet.classList.remove("dragging");
      $("#scrim").classList.remove("dragging");
      if(!(dy > sheet.offsetHeight * DRAG_FRACTION || v > FLICK_V)){
        sheet.style.transform = "";
        $("#scrim").style.opacity = "";
        return;
      }
      sheet.classList.add("flick");
      sheet.style.transform = "translateY(" + (sheet.offsetHeight + 48) + "px)";
      $("#scrim").style.opacity = "0";
      /* The inline values are cleared only AFTER .show is gone, never before:
         for one frame in between, a sheet with .show and no inline transform
         snaps back into place — the flash of a thing returning right as it
         leaves. */
      setTimeout(function(){
        closeSheets();
        requestAnimationFrame(function(){
          sheet.classList.remove("flick");
          sheet.style.transform = "";
          $("#scrim").style.opacity = "";
        });
      }, 300);
    }
    grab.addEventListener("pointerdown", function(e){
      if(e.button) return;
      dragging = true; y0 = lastY = e.clientY; lastT = e.timeStamp; dy = 0; v = 0;
      sheet.classList.add("dragging");
      $("#scrim").classList.add("dragging");
      try{ grab.setPointerCapture(e.pointerId); }catch(err){}
      e.preventDefault();
    });
    grab.addEventListener("pointermove", move);
    grab.addEventListener("pointerup", end);
    grab.addEventListener("pointercancel", end);
  }
  makeDismissable($("#sheet"));
  makeDismissable($("#citySheet"));
  makeDismissable($("#cnSheet"));
  makeDismissable($("#mtSheet"));
  makeDismissable($("#mtNewSheet"));

  /* ── the scroll line ──
     Two scrollers ask the same question — is there more, and where am I in it
     — so they get the same answer in the same shape. Measured, never inferred
     from an item count: a cue drawn from a guess is wrong in both directions,
     and this one is the only thing telling somebody there is anything below. */
  function paintCue(el, cue){
    if(!el || !cue) return;
    var max = el.scrollHeight - el.clientHeight, on = max > 4;
    cue.classList.toggle("on", on);
    if(!on) return;
    var bar = cue.querySelector("i"), frac = Math.max(.18, el.clientHeight / el.scrollHeight);
    bar.style.setProperty("--w", (frac * 100).toFixed(1) + "%");
    bar.style.setProperty("--o", ((1 - frac) * (el.scrollTop / max) * 100).toFixed(1) + "%");
  }
  /* after a fold has finished opening, not while it is: the sheet's height is
     still changing until then, so measuring now measures a number that is
     about to be wrong */
  function updateSheetCue(){
    paintCue($("#sheet"), $("#sheetCue"));
    setTimeout(function(){ paintCue($("#sheet"), $("#sheetCue")); }, 580);
  }
  $("#sheet").addEventListener("scroll", function(){ paintCue($("#sheet"), $("#sheetCue")); });
  $("#sList").addEventListener("scroll", function(){ paintCue($("#sList"), $("#listCue")); });
  window.addEventListener("resize", updateSheetCue);
  document.addEventListener("keydown", function(e){
    if(e.key !== "Escape") return;
    if(!$("#calPop").hidden){ closeCal(); return; }
    closeSheets();
  });

  /* ───────── the task editor: no Save, no Cancel ─────────
     Every control writes straight through to the task and the list behind
     the sheet redraws as it happens, so the sheet has nothing left to
     confirm. A Save button here would only be a second way to do what the
     typing already did, and it was most of the height that made this
     scroll. Closing is the whole gesture: scrim, grabber, or Escape. */
  var editing = null, isNew = false, savedTimer = null, jumpAfterSheet = null;

  function bucketFor(dateStr){
    if(!dateStr) return "later";
    var n = new Date(), t0 = new Date(n.getFullYear(), n.getMonth(), n.getDate());
    var d = new Date(dateStr + "T00:00:00");
    var days = Math.round((d - t0) / 86400000);
    if(days < 0) return "late";
    if(days === 0) return "today";
    if(days === 1) return "tomorrow";
    return "later";
  }
  /* The row shows the smallest thing that still locates the task: inside
     the section it already sits under, the clock alone says everything. */
  function labelFor(x){
    var d = x.d, tm = x.all ? "" : x.tm, b = bucketFor(d);
    /* A shift is 12:00–19:00, and the hours are the whole content of the row —
       the title next to it is now just `משמרת`, because they finally have
       somewhere else to live. Written with an EN DASH and no spaces so the
       span still fits the chip at the end of a row. */
    if(tm && !x.all && x.tmEnd) tm = tm + "–" + x.tmEnd;
    if(!d) return tm || null;
    if(x.all && (b === "today" || b === "tomorrow")) return t("cal.allDay");
    if(tm && (b === "today" || b === "tomorrow")) return tm;
    if(b === "late" && d === isoAt(-1)) return t("cal.yesterday") + (tm ? " " + tm : "");
    var sep = LOCALE === "en" ? "/" : ".";
    return +d.slice(8) + sep + +d.slice(5,7) + (tm ? " " + tm : "");
  }
  function dateLabel(d){ return d ? longDate(d) : t("sheet.noDate"); }
  function both(v){ return {he:v, en:v}; }

  function flashSaved(){
    var el = $("#sSaved");
    el.textContent = t("sheet.saved"); el.classList.add("flash");
    clearTimeout(savedTimer);
    savedTimer = setTimeout(function(){
      el.textContent = t("sheet.autosave"); el.classList.remove("flash");
    }, 1300);
  }
  /* One writer for every control in the sheet. A new task only joins the
     list once it has a name — an empty row appearing the moment somebody
     opened the editor would be a task nobody asked for. */
  function commit(){
    if(!editing) return;
    var title = $("#sTitle").value.trim();
    editing.t = both(title);
    editing.tm = $("#sTime").value;
    /* An end at or before its start is not a range, and the server refuses the
       pair outright — so it is dropped here rather than sent and bounced, and
       the chip goes back to asking. Clearing the start clears the end with it,
       the same rule editTask applies on the other side. */
    editing.tmEnd = $("#sEnd").value;
    if(!editing.tm || (editing.tmEnd && editing.tmEnd <= editing.tm)){
      editing.tmEnd = ""; $("#sEnd").value = "";
    }
    editing.all = $("#sAllDay").getAttribute("aria-checked") === "true";
    var pick = $$("#sCat .chip").filter(function(c){ return c.getAttribute("aria-pressed") === "true"; })[0];
    if(pick) editing.cat = pick.dataset.cat;
    var wasRem = editing.rem, wasOff = editing.remOff, wasRep = editing.rep, wasCal = editing.cal;
    editing.rem = $("#sRemind").getAttribute("aria-checked") === "true";
    editing.cal = $("#sCal").getAttribute("aria-checked") === "true";
    var off = $$("#sOffset .chip").filter(function(c){ return c.getAttribute("aria-pressed") === "true"; })[0];
    editing.remOff = off ? +off.dataset.remoff : 0;
    var chosen = $$("#sRepeat .chip").filter(function(c){ return c.getAttribute("aria-pressed") === "true"; })[0];
    editing.rep = chosen ? chosen.dataset.rep : "none";
    syncSheetRows();
    if(isNew){
      if(!title) return;
      open.push(editing); isNew = false;
      $("#sDelete").hidden = false;
    }
    API.saveTask(editing);
    /* The reminder and the calendar entry are separate rows in separate
       systems, so they are separate calls — and only when they actually
       changed. Re-sending an unchanged reminder would cancel the row and write
       an identical one every time somebody touched the title, which is a new
       id, a new escalation ladder and a lost `attempts` count each time.

       The date and the time are part of a reminder's identity too: moving a
       task moves what it reminds you about. */
    var whenKey = String(editing.d) + "|" + String(editing.tm) + "|" + String(editing.all);
    if(editing.rem !== wasRem || editing.remOff !== wasOff || editing.rep !== wasRep
       || (editing.rem && whenKey !== lastWhenKey)) API.setTaskReminder(editing);
    if(editing.cal !== wasCal || (editing.cal && whenKey !== lastWhenKey)) API.setTaskCalendar(editing);
    lastWhenKey = whenKey;
    renderTasks(); renderStrip(selDay); flashSaved();
  }
  /* Three controls only make sense once a day has been chosen — an all-day
     switch, a clock, and a calendar entry are all answers to "when", and
     offering them before that question has one is offering nothing. */
  /* Greying is applied to the ROW, not to the control inside it: the label has
     to dim too, or a live-looking label sits above a dead control. `inert`
     removes it from the tab order and from pointer events in one attribute,
     which is the only way to be sure a nested button is genuinely unreachable
     rather than merely styled as if it were. */
  function lockRow(row, on, why){
    if(!row) return;
    row.classList.toggle("locked", on);
    if(on){ row.setAttribute("inert", ""); row.title = why || ""; }
    else { row.removeAttribute("inert"); row.removeAttribute("title"); }
  }
  function syncSheetSource(){
    var sc = srcOf(editing);
    $("#sSrc").hidden = !sc;
    if(sc){
      $("#sSrcIcon").innerHTML = '<use href="#' + sc.icon + '"/>';
      $("#sSrcTxt").textContent = t("sheet.fromApp", {name:sc.name});
    }
    var why = sc ? t("sheet.noField", {name:sc.name}) : "";
    /* Every field WE have is checked against what the source can hold. A task
       written here has no source, so nothing is ever locked on it. */
    lockRow($("#sCatRow"),    !canEdit(editing, "cat"),  why);
    /* Two separate reasons can close the repeat row, and both have to be
       decided HERE, in the last function that touches it — the earlier of two
       lockRow calls on one row is simply erased by the later one, which is
       what silently undid the "needs a reminder" lock. The source's own
       limitation wins the tooltip when both apply: adding a reminder would not
       open a row an imported task can never carry a repeat in. */
    var repNeedsRem = !editing.rem, repNoField = !canEdit(editing, "rep");
    lockRow($("#sRepeatRow"), repNeedsRem || repNoField,
            repNoField ? why : t("sheet.repeatNeedsRemind"));
    lockRow($("#sListRow"),   !canEdit(editing, "items"),why);
    lockRow($("#sShareRow"),  !canEdit(editing, "who"),  why);
    lockRow($("#sTimeChip"),  !canEdit(editing, "time"), why);
    lockRow($("#sEndChip"),   !canEdit(editing, "time"), why);
    /* the reminder and the calendar copy are OURS, not theirs — an imported
       task can still be reminded about, so these are never locked */
  }
  function syncSheetRows(){
    var dated = !!editing.d;
    $("#sDateVal").textContent = dateLabel(editing.d);
    $("#sDateRow").classList.toggle("set", dated);
    /* a clock and an all-day switch are both answers to a question that has
       not been asked yet when there is no date, so neither is offered */
    $("#sAllDay").hidden = !dated;
    $("#sAllDay").setAttribute("aria-checked", editing.all ? "true" : "false");
    $("#sAllDay").classList.toggle("on", !!editing.all);
    $("#sTimeChip").hidden = !dated || !!editing.all;
    $("#sTimeVal").textContent = editing.tm || t("sheet.pickTime");
    $("#sTimeChip").classList.toggle("set", !!editing.tm);
    /* No start, nothing to end. The chip is not merely disabled — it is a
       question that has not been asked yet, exactly like the clock itself
       before a date is picked. */
    $("#sEndChip").hidden = !dated || !!editing.all || !editing.tm;
    $("#sEndVal").textContent = editing.tmEnd
      ? "– " + editing.tmEnd : t("sheet.pickEnd");
    $("#sEndChip").classList.toggle("set", !!editing.tmEnd);
    $("#sCalRow").hidden = !dated;
    $("#sCalSub").textContent = calTargetName();
    /* No calendar to write to means the switch cannot keep its word, so it is
       not offered — the row still shows, saying which calendar is missing,
       because "connect one" is the useful next step and a vanished row says
       nothing at all. */
    lockRow($("#sCalRow"), dated && !calTarget(), t("sheet.inCalNone"));
    /* A repeat is a property of the REMINDER — task_reminders.repeat_rule is
       the only place the system stores one — so with no reminder there is
       nothing for "every week" to be attached to. Rather than accept it and
       drop it, the row says why it is unavailable. That lock is applied in
       syncSheetSource below, together with the source's own limit on the same
       row, because two lockRow calls on one row leave only the last. */
    var chosen = $$("#sRepeat .chip").filter(function(c){ return c.getAttribute("aria-pressed") === "true"; })[0];
    $("#sRepeatVal").textContent = t("rep." + ({none:"once", day:"day", week:"week", month:"month"}[chosen ? chosen.dataset.rep : "none"] || "once"));
    var ck = editing.cat || "none";
    $("#sCatVal").textContent = t("tcat." + ck);
    /* Olma's guess says so until the person overrules it — an automatic
       choice that looks hand-made is one nobody thinks to correct. */
    $("#sCatAuto").hidden = !editing.catAuto || ck === "none";
    $$("#sCat .chip").forEach(function(c){
      c.setAttribute("aria-pressed", c.dataset.cat === ck ? "true" : "false");
    });
    syncSheetSource();
  }
  /* Which calendar "add to calendar" actually writes to. The first connected
     provider whose calendar service is on and writable — the same one the
     agent would use — named out loud rather than left to be discovered after
     the event fails to appear. */
  function calTarget(){
    return PROV.filter(function(p){
      if(!p.connected) return false;
      return p.svc.some(function(sv){ return sv.k === "cal" && sv.on && sv.mode === "write"; });
    })[0] || null;
  }
  function calTargetName(){
    var p = calTarget();
    if(!p) return t("sheet.inCalNone");
    var sv = p.svc.filter(function(x){ return x.k === "cal"; })[0];
    return t("sheet.inCalTo", {name:t(sv.sub), account:p.account});
  }

  /* the category chips are built once from the closed set */
  function buildCatChips(){
    $("#sCat").innerHTML = TASKCATS.map(function(c){
      return '<button class="chip mini cat" aria-pressed="false" data-cat="' + c.k + '">' +
        '<i class="cdot" style="background:' + c.c + '"></i>' + esc(t("tcat." + c.k)) + "</button>";
    }).join("");

  /* ── the list inside the editor ──
     Items are written straight onto the task rather than through commit():
     ticking something off is not editing a field, it is doing the thing. */
  function renderSheetList(freshIdx){
    if(!editing) return;
    var items = editing.items || [], n = items.length, dn = itemsDone(editing);
    $("#sList").innerHTML = items.map(function(it, i){
      return '<div class="litem' + (it.done ? " on" : "") + (i === freshIdx ? " fresh" : "") + '">' +
        '<button class="lbox" data-titem="' + i + '" aria-pressed="' + !!it.done +
        '" aria-label="' + esc(L(it.t)) + '"><svg><use href="#i-check"/></svg></button>' +
        '<span class="ltext"><i>' + esc(L(it.t)) + "</i></span>" +
        '<button class="lrm" data-ritem="' + i + '" aria-label="' + esc(t("sheet.itemRm")) +
        '"><svg><use href="#i-x"/></svg></button></div>';
    }).join("") +
      '<div class="scuehold"><div class="scue" id="listCue"><i></i></div></div>';
    paintCue($("#sList"), $("#listCue"));
    $("#sListSub").textContent = n ? t("sheet.listSub.nN", {done:dn, n:n}) : t("sheet.listSub.n0");
    var pill = $("#sListCount");
    pill.hidden = !n;
    if(n){
      pill.textContent = dn + "/" + n;
      pill.style.setProperty("--p", Math.round(dn / n * 100) + "%");
      pill.classList.toggle("full", dn === n);
    }
  }
  function addItem(){
    var el = $("#sAddItem"), v = el.value.trim();
    if(!v || !editing) return;
    if(!editing.items) editing.items = [];
    editing.items.push({t:both(v), done:false});
    el.value = "";
    renderSheetList(editing.items.length - 1);
    renderTasks(); flashSaved();
  }
  $("#sAddItem").addEventListener("keydown", function(e){ if(e.key === "Enter"){ e.preventDefault(); addItem(); } });
  /* typed and then tapped away is still typed — the same promise the title
     field makes, so a half-added item is never silently thrown out */
  $("#sAddItem").addEventListener("blur", addItem);
  $("#sList").addEventListener("click", function(e){
    var tg = e.target.closest("[data-titem]");
    if(tg){
      var it = editing.items[+tg.dataset.titem];
      it.done = !it.done;
      tg.closest(".litem").classList.toggle("on", it.done);
      renderSheetList();
      renderTasks(); flashSaved();

    var rm = e.target.closest("[data-ritem]");
    if(rm){
      editing.items.splice(+rm.dataset.ritem, 1);

      renderSheetList();
      renderTasks(); flashSaved();
    }
  });

  /* ── who else has it ──
     Leaving and deleting are different things and the panel says so: the
     list of people, then what leaving actually does, then the action. */
  /* Adding and removing people is the OWNER's call. On a task somebody else
     opened, the only thing available is leaving it — which is exactly what the
     task_shares rows would allow, so the UI refuses what the server would
     refuse rather than drawing a button that comes back with an error. */
  function canManageShare(){
    return !editing || editing.owner === undefined || editing.owner === 0;
  }
  function renderSheetShare(){
    if(!editing) return;
    var who = (editing.who || []).slice(), shared = who.length > 0, mine = canManageShare();
    $("#sShareSub").textContent = shared ? sharedLine(editing) : t("sheet.notShared");
    $("#sShareFaces").innerHTML = shared ? faceStack(who) : "";
    var rows = "";
    if(shared){
      rows = '<div class="sperson"><span class="face">' + avatarSVG(myAvatar, {g:myGender()}) + "</span>" +
        "<b>" + esc(t("share.you")) + "</b>" +
        (editing.owner === 0 ? "<u>" + esc(t("share.ownerMe")) + "</u>" : "") + "</div>";
      who.forEach(function(id){
        var f = friendById(id);
        if(!f) return;
        rows += '<div class="sperson"><span class="face">' + avatarSVG(f.av, {g:f.g}) + "</span>" +
          "<b>" + esc(L(f.n)) + "</b>" +
          (editing.owner === id ? "<u>" + esc(t(f.g === "f" ? "share.ownerF" : "share.ownerM")) + "</u>" : "") +
          /* taking somebody off happens where they are named */
          (mine ? '<button class="spx" data-off="' + f.id + '" aria-label="' + esc(t("share.remove")) +
            '" title="' + esc(t("share.remove")) + '"><svg><use href="#i-x"/></svg></button>' : "") +
          "</div>";
      });
    }
    $("#sSharePeople").innerHTML = rows;
    $("#sAddRow").hidden = !mine;
    $("#sAddCount").textContent = t("fr.count", {n:FRIENDS.length});
    if(!mine){
      $("#sAddFold").classList.remove("open");
      $("#sAddRow").setAttribute("aria-expanded", "false");
    }
    renderPeoplePick();
    /* only a task somebody else is on can be left, and leaving is not a
       thing you do to a task that is only yours */
    $("#sLeave").hidden = !shared;
    $("#sLeaveNote").hidden = !shared;
  }
  /* Every friend is a chip and the pressed ones are on the task, so sharing
     and un-sharing are one gesture rather than two screens. */
  var PICK_SEARCH_AT = 12, pickQ = "";
  function renderPeoplePick(){
    var who = (editing && editing.who) || [];
    /* Search earns its place at twelve — three rows of faces is where the eye
       stops recognising and starts hunting. Below that a permanent field is
       one more thing to read for no tap saved. */
    var show = FRIENDS.length > PICK_SEARCH_AT;
    $("#pickSearch").hidden = !show;
    var q = show ? pickQ.trim().toLowerCase() : "";
    var list = !q ? FRIENDS : FRIENDS.filter(function(f){
      return (L(f.n) + " " + f.n.he + " " + f.n.en).toLowerCase().indexOf(q) > -1;
    });
    $("#pickEmpty").hidden = !!list.length;
    $("#pickEmpty").textContent = list.length ? "" : t("sheet.pickNone", {q:pickQ.trim()});
    $("#sPeople").innerHTML = list.map(function(f){
      var on = who.indexOf(f.id) > -1;
      return '<button class="pchip" aria-pressed="' + on + '" data-add="' + f.id + '">' +
        '<span class="face">' + avatarSVG(f.av, {g:f.g}) + "</span>" + esc(L(f.n)) + "</button>";
    }).join("");
  }
  /* One writer for both directions, because they are one question: is this
     person on the task. The last person leaving takes the sharing with them —
     no owner, no faces, nothing left to leave — so the task is an ordinary
     one again rather than a shared task that happens to have nobody in it. */
  function togglePerson(id){
    if(!editing) return;
    var f = friendById(id), name = L(editing.t) || t("sheet.untitled");
    if(!editing.who) editing.who = [];
    var i = editing.who.indexOf(id), removing = i > -1;
    if(removing){
      editing.who.splice(i, 1);
      API.unshareTask(editing.id, id);
      if(!editing.who.length){ delete editing.who; delete editing.owner; }
    } else {
      editing.who.push(id);
      /* the first person turns a private task into a shared one, and from then
         on it is clear who started it */
      if(editing.owner === undefined) editing.owner = 0;
      API.shareTask(editing.id, editing.who.slice());
    }
    renderSheetShare();
    renderTasks(); flashSaved();
    var left = (editing.who || []).length;
    toast(removing
      ? (left ? t("toast.tookOff", {who:f ? L(f.n) : ""}) : t("toast.unshared", {name:name}))
      : t("toast.shared", {name:name, who:sharedNames(editing.who)}));
  }
  $("#sPeople").addEventListener("click", function(e){
    var c = e.target.closest("[data-add]");
    if(c) togglePerson(+c.dataset.add);

  $("#sSharePeople").addEventListener("click", function(e){

    if(x) togglePerson(+x.dataset.off);

  $("#sAddRow").addEventListener("click", function(){

    updateSheetCue();

  $("#pickQ").addEventListener("input", function(){
    pickQ = this.value;
    $("#pickQClear").hidden = !pickQ;
    renderPeoplePick();
  });
  $("#pickQClear").addEventListener("click", function(){
    pickQ = ""; $("#pickQ").value = ""; this.hidden = true;
    renderPeoplePick(); $("#pickQ").focus();
  });
  function sharedNames(ids){
    var names = ids.map(function(id){ var f = friendById(id); return f ? L(f.n) : ""; }).filter(Boolean);
    if(names.length <= 2) return names.join(D.and);
    return names.slice(0, 2).join(D.and) + t("share.andMore", {n:names.length - 2});
  }
  $("#sListRow").addEventListener("click", function(){
    var on = !$("#sListFold").classList.contains("open");
    $("#sListFold").classList.toggle("open", on);
    this.setAttribute("aria-expanded", on ? "true" : "false");

  $("#sShareRow").addEventListener("click", function(){

    $("#sShareFold").classList.toggle("open", on);
    this.setAttribute("aria-expanded", on ? "true" : "false");

  /* leaving is not deleting: the row goes from MY list and the task itself
     carries on with everyone else, which is what the toast says out loud */
  $("#sLeave").addEventListener("click", function(){
    var id = editing.id, name = L(editing.t) || t("sheet.untitled");
    var wrap = $('.taskwrap[data-id="' + id + '"]');
    closeSheets();
    if(wrap) wrap.classList.add("gone");
    setTimeout(function(){

  /* ───────── date popover ─────────

  var calAnchor = null, calY = 0, calM = 0, calPane = "days";

    /* 6 Sep 2026 is a Sunday, which is where both calendars start their week */

    });

  function calHTML(){
    var val = calAnchor ? (calAnchor.dataset.val || "") : "", today = ymd(new Date()), i = 0;
    var head = '<div class="calhead">' +
      '<button class="calnav" data-calnav="-1" aria-label="prev"><svg viewBox="0 0 16 16"><path d="M10 2 4 8l6 6"/></svg></button>' +
      '<button class="calttl" data-calpane="1">' +

      '<button class="calnav" data-calnav="1" aria-label="next"><svg viewBox="0 0 16 16"><path d="M6 2l6 6-6 6"/></svg></button>' +
      "</div>";
    if(calPane === "months"){
      return head + '<div class="calmg">' + monthNames().map(function(n, m){
        return '<button style="--i:' + (i++) + '" aria-pressed="' + (m === calM) + '" data-calmonth="' + m + '">' + esc(n) + "</button>";
      }).join("") + "</div>";
    }
    var first = new Date(calY, calM, 1), start = new Date(calY, calM, 1 - first.getDay());
    var cells = "";
    for(var k = 0; k < 42; k++){
      var d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + k), v = ymd(d);
      var cls = (d.getMonth() === calM ? "" : "out") + (v === today ? " now" : "");

        '" data-calday="' + v + '">' + d.getDate() + "</button>";

      '<div class="calgrid">' + dowNames().map(function(n){ return '<div class="caldow">' + esc(n) + "</div>"; }).join("") + "</div>" +

  function placeCal(){

    var below = r.bottom + 10 + h <= window.innerHeight - 8;
    var top = below ? r.bottom + 10 : Math.max(8, r.top - 10 - h);

  function openCal(el){
    calAnchor = el; calPane = "days";

  function closeCal(){

    }
    var mo = e.target.closest("[data-calmonth]");
    if(mo){ calM = +mo.dataset.calmonth; calPane = "days"; renderCal(); return; }

    if(day){ pickDate(day.dataset.calday); }
  });
  /* the popover only knows it produced a date; what that date means is the
     caller's business, which is what keeps it usable on any field */
  function pickDate(v){

  /* ───────── city / time zone ───────── */
  function renderCityRow(){
    var c = CITIES[cityIdx];
    $("#cityName").textContent = L(c.n);
    $("#cityClock").textContent = clockIn(c.tz);
    $("#setupNote").textContent = t(cityConfirmed ? "me.confirmed" : "me.guessed") + " · " + t("me.setupNote");
  }
  function renderCityList(q){
    q = (q || "").trim().toLowerCase();
    var rows = CITIES.map(function(c, i){ return {c:c, i:i}; }).filter(function(o){
      if(!q) return true;
