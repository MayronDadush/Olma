<meta charset="utf-8">
<!-- Without this line Safari lays the page out at its 980px fallback width and
     then scales the result down to fit the phone, which is why the first real
     screenshot came back with everything shrunk into the middle: .app's 560px
     max-width sat centred in 980, leaving a third of the screen empty on each
     side and the type two sizes too small. Nothing in the design was wrong.

     `viewport-fit=cover` is load-bearing too, separately: the six
     env(safe-area-inset-*) values this stylesheet positions the tab bar and
     the preview buttons with all resolve to 0 without it, so the bar sat above
     the home indicator instead of clearing it. -->
<!-- No zoom at all, pinch included: the owner wants the page to feel like an
     app (Instagram has none), 2026-09-25. Android obeys these two words; iOS
     Safari ignores them on purpose, which is why the script also cancels the
     pinch gesture itself (search "zoom" in the script). -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<!-- The page defines both palettes; this is what stops the browser painting
     its own white behind them for the instant before the CSS lands. -->
<meta name="color-scheme" content="light dark">
<title>עולמה שלי</title>
<!-- The page as an app on the home screen (src/adapters/http/pwa.js): the
     manifest that makes it installable, the icon iOS puts on the home screen,
     and the colour the phone paints its own bars in. Served from
     scripts/serve-design.js these 404 harmlessly. theme-color is the page's
     own ground in each scheme, so the status bar and the page are one piece. -->
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="עולמה">

:root{

     tertiary one is not a hierarchy, it is two greys. Measured against

  --accent:#004643;

  --accent-soft:#E1EBE8;

  --accent-line:rgba(0,70,67,.40);

     "saved", "remove the connection" — and as text they measured 3.2-4.1.

     over 5 in the same move. */
  --danger:#B03A2E;

/* ─────────────────────────  base  ───────────────────────── */
*{box-sizing:border-box}
/* The page never zooms, the way an app never does (the owner, 2026-09-25).
   A phone browser zooms on a double tap and on a pinch unless the page opts
   out, so tapping a calendar arrow twice blew the page up. `pan-x pan-y`
   allows scrolling and nothing else: no double tap, no pinch. The viewport
   meta says the same for Android, and the script cancels iOS's pinch, which
   ignores both. Larger text is the phone's own setting, not a zoom here. */
html{touch-action:pan-x pan-y}
[hidden]{display:none !important}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  font-size:16px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0;text-align:center}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:8px}
h1,h2,h3,p{margin:0}

.app{
  max-width:560px;
  margin-inline:auto;
  padding:0 18px 156px;
  min-height:100vh;
}

/* ─────────────────────────  top bar  ───────────────────────── */
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  gap:14px;padding:26px 20px 10px;position:relative;
  /* the band runs to the screen's edges: .app pads 18px, and this takes it back */
  margin-inline:-18px;background:var(--band);color:var(--on-band);
  /* the mark on Cypress is the night mark in both themes: its dark half is
     --logo-d, and by day that is the band's own colour */
  --logo-d:#0A1817;--logo-l:#EDE9DF;--logo-ring:#EDE9DF;
}
.topbar :focus-visible{outline-color:var(--on-band)}
/* their own local time, deliberately quiet — the one number that answers "is
   now a reasonable time" at a glance. It sat dead centre until 2026-09-29; the
   owner moved it to the far end of the band, beside the day/night button, so
   nothing in the middle jumps when that button comes and goes by tab. */
/* The clock IS the timezone: it is the only place in the app that shows one,
   so it is where you would go to correct it — and going there should not mean
   a trip through the profile page for a control you can already see. */
/* It is a flex item, not an absolute overlay pinned to the middle: on a phone
   the name, the theme icons and the status pill already fill the bar, and an
   overlay has no way to know that — it sat on top of the theme icons. In the
   flow it can only ever take the room that is left. */
.topclock{
  flex:none;text-align:center;
  padding:5px 11px;border-radius:999px;
  font-size:14.5px;font-weight:600;letter-spacing:.04em;color:var(--on-band-2);
  font-variant-numeric:tabular-nums;
  transition:background var(--sw-t) var(--ease-io),color var(--sw-t) var(--ease-io),
             transform .3s var(--squash);
}
.topclock:active{background:var(--band-tint);color:var(--on-band);transform:scale(.94)}
.topclock:focus-visible{outline:2px solid var(--on-band);outline-offset:2px}
.brand{
  display:flex;align-items:center;gap:11px;min-width:0;
  transition:opacity .34s var(--ease),transform .34s var(--ease);
}
/* on the profile page the hero states who you are, so the header
   copy of the same face and name steps out of the way. */
html[data-v="me"] .brand{opacity:0;transform:translateY(-8px) scale(.94);pointer-events:none}
.avatar{
  width:42px;height:42px;border-radius:50%;flex:none;overflow:hidden;
  box-shadow:var(--shadow-s),inset 0 0 0 .5px rgba(0,0,0,.08);
}
.avatar svg,.fav svg{width:100%;height:100%;display:block}
.avatar.pop,.fav.pop{animation:pop .275s var(--spring)}
@keyframes pop{0%{transform:scale(.7) rotate(-10deg)}55%{transform:scale(1.07) rotate(4deg)}100%{transform:none}}

/* ── the character rig ─────────────────────────────────────────
   One set of keyframes drives every species. --lid is the resting
   eyelid height: 0 awake, .44 half-lidded (the illustrated style),
   .46 asleep, so night and mood are a token change
   rather than a second drawing. */
.ava{--lid:0}
.ava.line{--lid:.44}
.ava.night{--lid:.46}
.avaBody{transform-box:fill-box;transform-origin:50% 88%;animation:avaBreathe 2.3s ease-in-out infinite}
.avaLids{transform-box:fill-box;transform-origin:top;animation:avaBlink 3.1s infinite;will-change:transform}
.avaPupils{transform-box:fill-box;transform-origin:center;transition:transform .35s var(--ease)}
.avaStars{animation:avaTwinkle 1.7s ease-in-out infinite}
.avaHat{transform-box:fill-box;transform-origin:50% 100%;animation:avaTip 1.6s ease-in-out infinite}
.avaConf{transform-box:fill-box;animation:avaConfFall 1.55s linear infinite}
/* one tap plays the whole hop. :active only lasted while a finger was down,
   so a normal tap showed a fraction of it and looked like a glitch. */
.avatar.hop .avaBody,.fav.hop .avaBody{animation:avaHop .3s var(--spring)}
@keyframes avaBreathe{0%,100%{transform:scale(1)}50%{transform:scale(1.024)}}
@keyframes avaBlink{0%,91%,100%{transform:scaleY(var(--lid))}94.5%,96%{transform:scaleY(1)}}
@keyframes avaTwinkle{0%,100%{opacity:.3}50%{opacity:1}}
@keyframes avaTip{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(4deg)}}
@keyframes avaConfFall{0%{transform:translateY(0) rotate(0);opacity:0}10%{opacity:1}85%{opacity:1}100%{transform:translateY(116px) rotate(340deg);opacity:0}}
@keyframes avaHop{0%{transform:scale(1)}24%{transform:scale(1.12,.88) translateY(3px)}56%{transform:scale(.93,1.09) translateY(-5px)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){
  .avaBody,.avaLids,.avaStars,.avaHat,.avaConf{animation:none}
  .avaLids{transform:scaleY(var(--lid))}
}
.bmark{width:34px;height:34px;flex:none;display:block}
.brand-txt{min-width:0}
/* The name leads and the line under it is the welcome. It is one line and it
   stays one line: a header that reflows to two pushes the clock and the
   status pill around, and those two are the reason anybody looks up here. */
.brand-hi{font-size:13px;color:var(--on-band-2);line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-name{font-family:var(--font-display);font-weight:600;font-size:17px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdrend{display:flex;align-items:center;gap:9px;flex:none}
/* The pill that said "עולמה מושהית" here is gone (the owner, 2026-09-29):
   a paused page is blurred behind its own card now, and that card says it. */
/* The light/dark choice, on the profile page with its words beside each
   picture. It used to live here, beside the clock on every tab. */
/* …and one tap between day and night came back to the band, on the home tab
   only, at the far end of the bar (the owner, 2026-09-29). It flips to the
   OTHER look and remembers it, exactly as picking it on the profile would. */
.daynight{
  display:none;align-items:center;justify-content:center;flex:none;
  width:36px;height:36px;border-radius:50%;border:0;padding:0;cursor:pointer;
  background:color-mix(in oklab,var(--on-band) 14%,transparent);color:var(--on-band);
}
.daynight svg{width:17px;height:17px}
html[data-v="tools"] .daynight,html:not([data-v]) .daynight{display:inline-flex}
.themeseg button{display:inline-flex;align-items:center;justify-content:center;gap:6px}
.themeseg button svg{width:15px;height:15px;flex:none}

/* ─────────────────────────  view + titles  ───────────────────────── */
.view{display:none}
.view.active{display:block}
.view.active > *{animation:rise .25s var(--ease) both;animation-delay:calc(var(--i,0) * 22.5ms)}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}

/* ══════════════ the first visit ══════════════
   This page is the front door, and on the very first visit it arrives as one
   short cascade instead of all at once: the heading, then the three doors in
   reading order, then the cards under them, then the bar. About a second.

   It used to be four staged beats a second apart, with the doors centred on
   the screen and the whole page sliding home afterwards — 4.5s measured from
   load, most of it a dark screen, and the slide read as a jump. The owner
   called it slow and not pretty (2026-09-15), so there are no holds now and
   nothing moves further than 16px.

   The rules that stay:
   · It is never a gate. Nothing is inert while it plays; a tap works on the
     first frame.
   · It never runs before the page is there. Everything is held invisible until
     fonts settle (or half a second, whichever comes first) and one frame has
     painted, so a slow connection never shows the END of an animation.
   · It happens once per session, and reduced-motion skips it entirely.

   The classes go on the root element, not on .app: the floating tab bar is a
   SIBLING of .app. `intro` holds everything invisible; `intro-go` plays. Each
   keyframe fills `both`, so a delayed element waits in its first frame. */
/* `intro-settled` outlives the intro itself. Dropping `intro` hands the rise
   stagger back to a view that is already fully on screen, and it plays from the
   top — the page revealing itself a second time, immediately. So the animation
   stays off for the view the intro just finished revealing, and go() clears the
   marker so every later view change animates normally. */
html.intro .view.active > *,html.intro .view.active > .title > *,
html.intro-settled .view.active > *,html.intro-settled .view.active > .title > *{animation:none}
@keyframes introUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes introBar{from{opacity:0;transform:translateY(22px) scale(.97)}to{opacity:1;transform:none}}
html.intro:not(.intro-go) .title > *,
html.intro:not(.intro-go) [data-stage],
html.intro:not(.intro-go) .tabbar{opacity:0}
html.intro-go .title > *{animation:introUp .5s var(--ease) both}
html.intro-go [data-stage="1"] .glabel{animation:introUp .5s var(--ease) .06s both}
/* DOM order IS reading order in both directions, so one index serves rtl and
   ltr alike */
html.intro-go .chanrow > .chan{animation:introUp .5s var(--ease) both;animation-delay:calc(.1s + var(--ci,0) * .055s)}
html.intro-go [data-stage="0"]{animation:introUp .5s var(--ease) .04s both}
html.intro-go [data-stage="1b"]{animation:introUp .5s var(--ease) .26s both}
html.intro-go [data-stage="2"]{animation:introUp .5s var(--ease) .32s both}
html.intro-go [data-stage="3"]{animation:introUp .5s var(--ease) .38s both}
html.intro-go .tabbar{animation:introBar .55s var(--ease) .3s both}
@media (prefers-reduced-motion:reduce){
  html.intro .title > *,html.intro [data-stage],html.intro .tabbar,
  html.intro .chanrow > .chan,html.intro .glabel{animation:none;opacity:1}
}

/* The title closes the band the top bar opened: same Cypress, same bleed,
   and the rounded end is here. The two are separate boxes that touch, so
   nothing may move one without the other — the rise below plays on the
   title's WORDS, never on its box, or a seam opens for a quarter second. */
.title{
  padding:8px 20px 26px;margin:0 -18px 18px;
  background:var(--band);color:var(--on-band);border-radius:0 0 28px 28px;
}
.title h1{font-family:var(--font-display);font-weight:700;font-size:33px;line-height:1.12;letter-spacing:-.015em;text-wrap:balance}
/* One line, always: a second line made the band a third of the screen (the
   owner, 2026-09-28). The words are written to fit; the ellipsis is only for
   a narrow phone or a long name. */
.title p{margin-top:6px;color:var(--on-band-2);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* On home the first card sits over the band's end, as in the brand book. A
   negative margin rather than a named neighbour: whichever block is shown
   first (today, the install card, the home cards) is the one that rises. */
.view[data-view="tools"] > .title{padding-bottom:52px;margin-bottom:-30px}
.view[data-view="tools"] > .title ~ *{position:relative}
/* The tasks band is one line shorter in air, so the first screen holds tasks
   rather than green (owner, 2026-09-30). */
.view[data-view="tasks"] > .title{padding-bottom:18px}
.view.active > .title{animation:none}
.view.active > .title > *{animation:rise .25s var(--ease) both}

.glabel{
  font-size:12.5px;font-weight:600;color:var(--text-3);
  padding:0 14px 7px;display:flex;align-items:center;justify-content:space-between;gap:10px;
}
.glabel .hint{font-weight:500;font-size:12.5px}
.stack{display:flex;flex-direction:column;gap:26px}
.stack + .stack{margin-top:26px}

/* ─────────────────────────  one suggestion  ─────────────────────────
   The hand triage, made a control. It sits ABOVE the list because it is about
   the list, and it is drawn as one card rather than a row so that it cannot be
   mistaken for a task — pressing אשר here removes something, and a proposal
   that looked like its own to-do would be the worst possible place to learn
   that. There is no empty state and no placeholder: when the server sends
   nothing, this element is not in the page at all. */
/* It used to be drawn in the same material as a task group, on the argument
   that the icon and the two buttons were enough to say it is not a list. The
   owner asked for the opposite (2026-09-22): a suggestion is the one thing on
   this page Olma THOUGHT of rather than recorded, and he wanted it to look it
   — "סטייל ai עם אנימציה שתמיד זזה".
   So the card keeps the page's own geometry, spacing and type, and everything
   that changed is BEHIND the words: a light that travels around the edge, and
   a slow drift of colour under them. Nothing here moves the text, changes its
   size, or sits where a finger lands — the whole treatment is in three
   painted layers under `z-index:0`, and the card is still a card with two
   buttons on it.
   The palette is the product's own accent plus two neighbours, not the
   violet-to-cyan wash that every generated page reaches for: it has to look
   like this product thinking, not like an AI sticker pasted onto it. */
.sugg{
  /* Turquoise and sky rather than the product violet (owner, 2026-09-22):
     the buttons on this card are already the accent, and a light that is the
     same hue as the primary button reads as the button glowing. */
  --sugg-a:#12A3B8;
  --sugg-b:#5FC7EC;
  /* The face is light grey in this theme, not the white every other card
     uses — on white there is nothing for the rim to be seen against. */
  --sugg-face:#EDF1F3;
  --sugg-yes-ink:#0A6573;
  --sugg-rim:16%;
  --sugg-aura:.28;
  --sugg-mix-a:13%;
  --sugg-mix-b:11%;
  position:relative;isolation:isolate;overflow:hidden;
  /* The parent's own background paints BELOW its negative-z children, which
     makes it the constant part of the rim: the travelling light brightens the
     stretch it is passing and this is what the rest of the edge looks like. */
  background:color-mix(in oklab, var(--sugg-a) var(--sugg-rim), transparent);
  border-radius:16px;padding:15px 16px 13px;
  display:grid;gap:11px;margin-bottom:22px;
  box-shadow:var(--shadow-m);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .sugg{
    --sugg-a:#35CEE2;--sugg-b:#8AD6FF;--sugg-face:#33312B;--sugg-yes-ink:#8FE3EE;
    --sugg-rim:22%;--sugg-aura:.5;--sugg-mix-a:24%;--sugg-mix-b:20%;
  }
}
:root[data-theme="dark"] .sugg{
  --sugg-a:#35CEE2;--sugg-b:#8AD6FF;--sugg-face:#33312B;--sugg-yes-ink:#8FE3EE;
  --sugg-rim:22%;--sugg-aura:.5;--sugg-mix-a:24%;--sugg-mix-b:20%;
}
/* The travelling light, third attempt and the first one that actually goes
   ROUND. The two before it rotated a conic gradient, and a conic's speed is
   constant in DEGREES while an edge is walked in PIXELS — on a card three
   times wider than it is tall that means the light races the long edges and
   stalls at the ends, which is what "לא עושה לופ כמו שצריך" was, twice.
   This is a round glow that walks the perimeter itself, one edge at a time,
   at a pace set by how long each edge actually is (38/12/38/12 ≈ 343×110,
   the card at phone width). It is round, so a corner needs no special case
   and nothing has to rotate. Only the 1.5px the face does not cover shows it,
   so what the eye gets is a bright stretch of rim moving along the edge. */
.sugg::before{
  content:"";position:absolute;z-index:-3;
  width:132px;height:132px;margin:-66px;border-radius:50%;
  background:radial-gradient(circle closest-side,
    var(--sugg-b) 0%, var(--sugg-a) 42%, transparent 100%);
  animation:suggOrbit 13s linear infinite;
}
/* The face, inset by the rim's own width. The card's background cannot live
   here: it is the rim (see above). */
.sugg::after{
  content:"";position:absolute;z-index:-2;inset:1.5px;border-radius:14.5px;
  background:var(--sugg-face);
}
/* Two soft blobs drifting under the text. A GLOW on a dark card and a TINT on
   a light one, which are not the same number — at the dark value it was a
   smudge on the light theme, because there is no depth behind the card there
   for the colour to sit in. */
.sugg .saura{
  position:absolute;z-index:-1;inset:1.5px;border-radius:14.5px;
  pointer-events:none;opacity:var(--sugg-aura);
  background:
    radial-gradient(42% 74% at 18% 26%, color-mix(in oklab, var(--sugg-a) var(--sugg-mix-a), transparent), transparent 70%),
    radial-gradient(38% 66% at 82% 78%, color-mix(in oklab, var(--sugg-b) var(--sugg-mix-b), transparent), transparent 72%);
  animation:suggDrift 17s var(--ease-io) infinite alternate;
}
@keyframes suggOrbit{
  0%{top:0;left:0}
  38%{top:0;left:100%}
  50%{top:100%;left:100%}
  88%{top:100%;left:0}
  100%{top:0;left:0}
}
@keyframes suggDrift{
  0%{transform:translate(0,0) scale(1)}
  50%{transform:translate(4%,-3%) scale(1.09)}
  100%{transform:translate(-3%,3%) scale(1.04)}
}
/* Reduced motion keeps the LOOK and drops the movement: the rim stays lit
   where it is rather than the card falling back to a plain box, which would
   make the one thing Olma proposed the plainest thing on the page. */
@media (prefers-reduced-motion:reduce){
  .sugg::before,.sugg .saura{animation:none}
}
.sugg .sline{display:flex;gap:10px;align-items:flex-start}
.sugg .sicon{flex:none;width:19px;height:19px;color:var(--sugg-a);margin-top:1px}
.sugg .sicon svg{width:19px;height:19px;display:block}
.sugg .stext{display:grid;gap:3px;min-width:0}
/* Who is speaking, said on every card and not only when there is a second
   one (owner, 2026-09-28). "Olma noticed", never "AI": nothing here is a
   model's — `domain/task-suggestions.js` is three fixed rules and a word
   count — and a label is a promise about where a thing came from. */
.sugg .slbl{font-size:11.5px;font-weight:700;letter-spacing:.04em;color:var(--sugg-a);margin-bottom:-2px}
/* Their own words, and they may be long — this wraps rather than truncating,
   because a proposal to remove a task the person cannot fully read is one
   they cannot judge. */
.sugg .stitle{font-size:14.5px;font-weight:600;overflow-wrap:anywhere}
.sugg .swhy{font-size:12.5px;color:var(--text-3);line-height:1.45}
.sugg .sbtns{display:flex;gap:8px;justify-content:flex-end}
/* Pushed to the far end of the row: it is not one of the two answers. No fill
   either — on a card that already has a moving light, a third solid button is
   one too many things asking to be pressed. */
.sugg .sbtn.more{
  margin-inline-end:auto;background:transparent;color:var(--sugg-a);
  padding-inline:9px;
}
/* The page's own two button tones (.btn.primary / .btn.ghost) at card scale:
   a strip inside the list cannot carry a 16.5px sheet button, and inventing a
   third palette for two buttons is how this page grew a second vocabulary
   once already. */
.sugg .sbtn{
  background:var(--bg-tint);color:var(--text-2);
  border-radius:11px;padding:8px 16px;font-size:13.5px;font-weight:600;cursor:pointer;
  transition:transform .38s var(--squash),filter .3s var(--ease-io);
}
/* The card's own turquoise, as a tint rather than a fill (the owner,
   2026-09-28): the tasks screen keeps its one Mustard thing, "משימה חדשה",
   and at night the card sits a step lighter than the cards around it. */
.sugg .sbtn.yes{background:color-mix(in oklab,var(--sugg-a) 20%,transparent);color:var(--sugg-yes-ink)}
.sugg .sbtn:active{transform:scale(.98)}
.sugg .sbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ─────────────────────────  grouped list  ───────────────────────── */
.group{
  background:var(--surface);border-radius:16px;
  box-shadow:var(--shadow-m);overflow:hidden;
}
.row{
  display:flex;align-items:center;gap:12px;
  padding:10px 14px;position:relative;min-height:54px;width:100%;
  /* a row that is a <button> inherits the reset's `text-align:center`, which
     floated its title to the middle while the <div> rows beside it read from
     the start edge */
  text-align:start;
}
.row + .row::before,
.rowset + .rowset .row:first-child::before,
.row + .rowset .row:first-child::before{
  content:"";position:absolute;top:0;height:1px;background:var(--sep);
  inset-inline-start:60px;inset-inline-end:0;
}
.row.no-icon + .row.no-icon::before{inset-inline-start:14px}
button.row{cursor:pointer;transition:background .18s ease}
button.row:active{background:var(--bg-tint)}
.row-txt{min-width:0;flex:1}
.row-title{font-size:16.5px;font-weight:500;letter-spacing:-.005em}
.row-sub{font-size:13px;color:var(--text-2);margin-top:1px}
.row-sub.on{color:var(--ok)}
/* connected, but the grant is gone — not green, not an error either */
.row-sub.warn{color:var(--warn)}
.chev{width:9px;height:15px;flex:none;color:var(--text-3);transition:transform .32s var(--spring)}
[dir="ltr"] .chev{transform:scaleX(-1)}
.row[aria-expanded="true"] .chev{transform:rotate(-90deg)}

/* icon tiles */
.tile{
  width:34px;height:34px;border-radius:9px;flex:none;
  display:grid;place-items:center;color:#fff;
  box-shadow:inset 0 0 0 .5px rgba(0,0,0,.06);
}
.tile svg{width:20px;height:20px}
.tile.google{background:#fff;box-shadow:inset 0 0 0 1px var(--sep-2)}
.tile.ms{background:#fff;box-shadow:inset 0 0 0 1px var(--sep-2)}
.tile.apple{background:#fff;color:#1B1A1F;box-shadow:inset 0 0 0 1px var(--sep-2)}
.tile.monday{background:#fff;box-shadow:inset 0 0 0 1px var(--sep-2)}
.tile.slack{background:#fff;box-shadow:inset 0 0 0 1px var(--sep-2)}
.tile.notion{background:#fff;box-shadow:inset 0 0 0 1px var(--sep-2)}
.tile.msg{background:linear-gradient(160deg,#5FA8FF,#0B6FE8)}
.tile.wa{background:linear-gradient(160deg,#4EE07B,#12A94F)}
.tile.cal{background:linear-gradient(160deg,#FF6E63,#E2382C)}
.tile.contacts{background:linear-gradient(160deg,#FFA93D,#EE7A11)}
.tile.notes{background:linear-gradient(160deg,#FFD84D,#F0A81B)}
.tile.files{background:linear-gradient(160deg,#5AD08A,#1FA35F)}
.citylist{max-height:46vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.citylist .row-end{font-variant-numeric:tabular-nums;color:var(--text-3);font-size:13px;margin-inline-start:auto}
/* The call is the one channel that is Olma's own, so it wears the brand's
   Mustard beside WhatsApp's green and iMessage's blue (the owner, 2026-09-28). */
.tile.call{background:var(--action);color:var(--on-action)}
.tile.ghost{background:var(--bg-tint);color:var(--text-2);box-shadow:none}

/* ─────────────────────────  switch  ───────────────────────── */
/* The knob used to snap across in .3s, which on a phone is a jump rather
   than a movement. It now travels in .46s and stretches on the way, so the
   switch reads as a physical thing being pushed. */
.switch{
  width:51px;height:31px;border-radius:16px;flex:none;position:relative;
  background:var(--sep-2);cursor:pointer;
  transition:background var(--sw-t) var(--ease-io);
  -webkit-tap-highlight-color:transparent;
}
.switch::after{
  content:"";position:absolute;top:2px;inset-inline-start:2px;
  width:27px;height:27px;border-radius:999px;background:var(--knob);
  box-shadow:0 3px 8px rgba(0,0,0,.16),0 1px 1px rgba(0,0,0,.08);
  transform-origin:center;
  transition:transform var(--sw-t) var(--ease-io);
}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{transform:translateX(calc(-20px * var(--dirf)))}
/* Squash and stretch through the `scale` property, NOT through width.
   Width is anchored to one edge, so growing it moved the knob as well as
   stretched it — that fight with the travel transform is what made this
   look broken. `scale` is its own transform property: it composes with the
   translate instead of overwriting it, and it squashes about the centre. */
@keyframes knobTravel{
  0%{scale:1 1}
  16%{scale:.88 1.07}
  50%{scale:1.26 .93}
  78%{scale:.97 1.02}
  100%{scale:1 1}
}
.switch.moving::after{animation:knobTravel var(--sw-t) var(--ease-io)}

.connect{
  flex:none;padding:7px 16px;border-radius:999px;
  font-size:13.5px;font-weight:600;background:var(--action);color:var(--on-action);
  transition:transform .38s var(--squash),background .34s var(--ease-io),color .34s var(--ease-io);
}
.connect:active{transform:scale(.93)}
/* Not built yet. Greyed and genuinely unreachable — `inert` takes it out of
   the tab order and out of pointer events in one attribute, so the row cannot
   be pressed by finger, keyboard or screen reader. A control that answers a
   tap with "coming soon" is still a control that invited the tap; this one
   does not invite it. The pill says the same thing in the space the button
   would have occupied, so the row keeps its shape and its meaning. */
.soon{opacity:.5}
.soonpill{
  flex:none;padding:6px 14px;border-radius:999px;
  font-size:12.5px;font-weight:600;letter-spacing:.01em;
  background:var(--bg-tint);color:var(--text-3);
}
.chan.soon i{color:var(--text-3)}
.connect[data-busy="1"]{background:var(--bg-tint);color:var(--text-3)}
/* Connecting used to end with the row silently swapping itself out. It now
   lands: the button collapses to a circle, draws a tick, and only then
   hands over to the opened account. */
.connect.ok{
  width:34px;height:34px;padding:0;min-width:0;display:grid;place-items:center;
  background:var(--ok);color:var(--on-accent);animation:okPop .26s var(--spring);
  transition:width .17s var(--spring),padding .17s var(--spring),
             background .17s var(--ease),opacity .15s var(--ease),transform .15s var(--spring);
}
@keyframes okPop{0%{transform:scale(.55)}58%{transform:scale(1.16)}100%{transform:scale(1)}}
.connect.ok svg{
  width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2.6;
  stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:24;stroke-dashoffset:24;animation:okDraw .17s .05s var(--ease) forwards;
}
@keyframes okDraw{to{stroke-dashoffset:0}}
.connect.ok.leaving{opacity:0;transform:scale(.4)}
.row-end{
  margin-inline-start:auto;flex:none;font-size:12.5px;font-weight:600;
  color:var(--text-3);text-align:end;
}
.row-end.on{color:var(--ok)}
.row-end.go{
  font-size:13px;font-weight:700;color:var(--accent);
  padding:4px 11px;border-radius:999px;background:var(--accent-soft);
}
.rowset.pulse{animation:rowPulse .9s var(--ease)}
@keyframes rowPulse{
  0%{box-shadow:0 0 0 0 var(--accent-soft)}
  18%{box-shadow:0 0 0 5px var(--accent-soft)}
  100%{box-shadow:0 0 0 0 rgba(0,0,0,0)}
}
.rowset.pulse .connect{animation:connectPing .9s var(--ease)}
@keyframes connectPing{0%,100%{transform:scale(1)}20%{transform:scale(1.14)}40%{transform:scale(.98)}60%{transform:scale(1.06)}}
.row-end.tiny{font-size:12.5px;font-weight:600;color:var(--text-3);font-variant-numeric:tabular-nums}
.row-end.tiny.asleep{color:var(--accent);opacity:.85}
/* A friend's clock is shown only when it is not yours (2026-09-30): the same
   hour beside most names said nothing. A globe says "their time", a moon says
   it is night there. */
.row-end.away{display:inline-flex;align-items:center;gap:4px}
.row-end.away svg{width:13px;height:13px;flex:none}
.glabel.grlab{justify-content:flex-start;gap:6px}
.bdaydot{font-size:13px;margin-inline-start:4px;display:inline-block;animation:avaTip 1.2s ease-in-out infinite}
.rowset.arriving{animation:arrive .3s var(--ease)}
@keyframes arrive{
  0%{background:var(--accent-soft)}
  100%{background:transparent}
}

/* ─────────────────────────  disclosure body  ───────────────────────── */
.fold{display:grid;grid-template-rows:0fr;transition:grid-template-rows .54s var(--ease-io)}
.fold > div{overflow:hidden;min-height:0}
.fold.open{grid-template-rows:1fr}
.foldpad{padding:2px 14px 14px 14px;border-top:1px solid var(--sep)}
/* a window inside a window — same chevron row, one level in, so the
   vocabulary does not change with the depth */
.subrow{
  display:flex;align-items:center;gap:10px;width:100%;padding:12px 0 11px;
  border-top:1px solid var(--sep);margin-top:4px;
}
.subrow .row-title{flex:1;text-align:start;font-size:15px;font-weight:500}
.subrow[aria-expanded="true"] .chev{transform:rotate(-90deg)}
.subpad{padding-top:11px}
.foldpad.tight{padding-top:12px}

.chips{display:flex;flex-wrap:wrap;gap:8px}
/* Three rows is enough to show there is more; past that a picker stops being
   part of a form and becomes the page. Shared on purpose — every list that
   lives inside a sheet reaches this eventually. */
.cap3{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.chips.cap3{max-height:114px}   /* 3 × 32px person chip + 2 × 8px gap */
.chip{transition:transform .38s var(--squash),background var(--sw-t) var(--ease-io),color var(--sw-t) var(--ease-io);
  padding:7px 13px;border-radius:999px;font-size:13.5px;font-weight:600;
  background:var(--bg-tint);color:var(--text-2);
  transition:background .2s var(--ease),color .2s var(--ease),transform .2s var(--spring);
}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.chip:active{transform:scale(.95)}
.chip.mini{font-size:12.5px;padding:5px 11px}
/* The reminder's KIND, two cards under its row (#sKindWrap). */
.nagkind{padding:0 14px 12px;padding-inline-start:62px;display:grid;gap:8px}
.nagk-row{flex-wrap:nowrap}
.chip.nagk{flex:1 1 0;min-width:0;border-radius:14px;padding:9px 10px;display:grid;
  grid-template-columns:auto 1fr;column-gap:6px;align-items:center;text-align:start}
.chip.nagk svg{width:16px;height:16px;grid-row:1 / span 2}
.nagk-t{font-size:13.5px;font-weight:700}
.nagk-s{font-size:11.5px;font-weight:500;opacity:.8}
.nagk-say{line-height:1.45}
/* "שעה מדויקת" says the hour once there is one — the chip IS the value, so
   there is no second pill on a line below carrying a bare number nobody can
   tell is a button (the owner, 2026-09-22). The clock is the part that says
   it still opens the picker. */
.chip.exacttime{display:inline-flex;align-items:center;gap:5px;font-variant-numeric:tabular-nums}
.chip.exacttime svg{width:12.5px;height:12.5px;flex:none;opacity:.85}

/* ── channels ──────────────────────────────────────────────────
   Side by side rather than stacked: there are only ever two or three,
   and a vertical list of one-line rows reads as settings to configure.
   These are doors — the place a conversation already lives — so they
   get the shape of app icons and sit at the very top of the page. */
.chanrow{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
/* ── home: the two things she is holding for you ──
   Two cards, each the door to its own tab. The number is the point, so it is
   the largest thing on the card; the chevron says it goes somewhere, because
   a new person does not yet know the tab bar is there. */
.homecards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:30px}
.homeh{font-family:var(--font-display);font-weight:700;font-size:20px;letter-spacing:-.01em;padding:0 2px 12px}
.homecard{
  position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:4px;
  background:var(--surface);border-radius:20px;box-shadow:var(--shadow-m);
  padding:16px 16px 15px;text-align:start;min-width:0;
  transition:transform .38s var(--squash);
}
.homecard:active{transform:scale(.96)}
/* the tab bar's own glyphs, drawn the way the bar draws them — the card and
   the tab it opens are recognisably the same place */
.homeicon{width:28px;height:28px;color:var(--text-2);margin-bottom:10px}
.homenum{color:var(--text);font-family:var(--font-display);font-weight:700;font-size:38px;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.homecard b{font-size:15px;font-weight:600;margin-top:2px}
.homecard > i{font-style:normal;font-size:12.5px;color:var(--text-3);line-height:1.35;min-height:1.35em}
/* Nothing to count is not a zero to show — it is the first thing to do. The
   number gives its place to a plus in the same spot, the label becomes the
   invitation, and the tap goes on to open the sheet that starts one. */
.homeplus{display:none;width:38px;height:38px;border-radius:50%;place-items:center;
  background:var(--action);color:var(--on-action);box-shadow:var(--shadow-s)}
.homeplus svg{width:17px;height:17px}
.homecard.zero .homenum{display:none}
.homecard.zero .homeplus{display:grid}
.homecard.zero{background:linear-gradient(160deg,var(--accent-soft),var(--surface) 70%)}
.homecard > i.hot{color:var(--accent);font-weight:600}
/* What waits on YOU among the meetings — the same number the heading above
   counts, in the place the tasks card says "N להיום" (2026-09-30). */
.homecard > i.gold{color:var(--gold);font-weight:600;display:inline-flex;align-items:center;gap:5px}
.homecard > i.gold::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--gold-arc);flex:none}
.homechev{position:absolute;top:22px;inset-inline-end:16px}
@media (max-width:340px){.homenum{font-size:32px}.homecard{padding:14px 12px 13px}}
/* The first visit points at the tab bar once. People who landed here from a
   link did not know the bar was a menu, and left from the first screen. */
.navhint{
  position:fixed;inset-inline:0;margin-inline:auto;width:max-content;max-width:calc(100% - 32px);
  bottom:calc(18px + 74px);z-index:61;
  background:var(--text);color:var(--surface);border-radius:14px;padding:10px 16px;
  font-size:14px;font-weight:600;box-shadow:var(--shadow-m);
  animation:navHintIn .45s var(--ease) both;
}
.navhint::after{
  content:"";position:absolute;bottom:-6px;inset-inline:0;margin-inline:auto;width:12px;height:12px;
  background:inherit;transform:rotate(45deg);border-radius:2px;
}
.navhint.out{animation:navHintOut .25s var(--ease-io) both}
@keyframes navHintIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes navHintOut{to{opacity:0;transform:translateY(6px)}}
.tabbar.hinted{animation:navPulse 1.6s var(--ease-io) 2}
@keyframes navPulse{
  0%,100%{box-shadow:var(--shadow-m),var(--rim-soft)}
  50%{box-shadow:var(--shadow-m),var(--rim-soft),0 0 0 6px var(--accent-soft)}
}
@media (prefers-reduced-motion:reduce){.navhint,.navhint.out,.tabbar.hinted{animation:none}}
.chan{
  position:relative;
  background:var(--surface);border-radius:16px;box-shadow:var(--shadow-m);
  padding:15px 8px 13px;display:flex;flex-direction:column;align-items:center;gap:9px;
  text-align:center;min-width:0;
}
.chan:active{transform:scale(.955)}
.chan .tile{width:40px;height:40px;border-radius:13px}
.chan .tile svg{width:21px;height:21px}
.chan b{font-size:13.5px;font-weight:600;letter-spacing:-.005em;white-space:nowrap}
.chan i{font-style:normal;font-size:11.5px;color:var(--text-3);line-height:1.3}
.chan.on i{color:var(--ok)}
/* Call is one of the three, not a banner: the colour lives on its icon
   tile like every other channel's does, and the card behind it is plain. */
.chan.call i{color:var(--accent)}
/* armed reads differently from idle without a second control appearing: the
   caption changes colour and the tile takes a ring, so the thing that changed
   is the thing you are about to press */
.chan.call[data-state="arming"] i{color:var(--text-3)}
.chan.call[data-state="ready"] i{color:var(--ok)}
.chan.call[data-state="ready"] .tile{box-shadow:0 0 0 3px var(--accent-soft)}
@keyframes armPulse{0%,100%{opacity:.55}50%{opacity:1}}
.chan.call[data-state="arming"] .tile{animation:armPulse .5s var(--ease-io) infinite}
.chan.call.ringing .tile svg{animation:ring .5s var(--ease) infinite}
@keyframes ring{0%,100%{transform:rotate(0)}20%{transform:rotate(-14deg)}40%{transform:rotate(12deg)}60%{transform:rotate(-8deg)}80%{transform:rotate(5deg)}}

/* what an account actually brings, shown in place instead of in a
   second summary table that repeated the same five words below it. */
/* One colour for the whole strip. App-brand gradients made it a row of
   five logos to decode; filled-vs-empty in a single colour is read as
   on-and-off at a glance, which is the only question it answers. */
.glyphs{display:flex;gap:5px;margin-top:6px}
.glyphs span{
  /* same clock as the switch that changes them, so the glyph going dim and
     the access control folding away are one gesture rather than two */
  transition:background var(--sw-t) var(--ease-io),color var(--sw-t) var(--ease-io),
             transform var(--sw-t) var(--ease-io),opacity var(--sw-t) var(--ease-io);
  width:19px;height:19px;border-radius:6px;display:grid;place-items:center;flex:none;
  background:var(--accent);color:var(--on-accent);
}
.glyphs span svg{width:11.5px;height:11.5px}
.glyphs span.off{background:var(--bg-tint);color:var(--text-3);transform:scale(.84);opacity:.55}
@keyframes glyphIn{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:none}}
/* one glyph replacing another, rather than a list of them arriving */
#pauseIcon.morph{animation:glyphIn .22s var(--spring)}
.glyphs.fresh span{animation:glyphIn .21s var(--spring) backwards;animation-delay:calc(var(--i,0) * 27.5ms)}

/* the friend list only earns a search field once scanning it stops being
   instant; below that a permanently visible box is one more thing to read. */
.searchwrap{
  display:flex;align-items:center;gap:9px;margin-bottom:10px;
  background:var(--surface);border-radius:14px;box-shadow:var(--shadow-s);padding:0 12px;
}
.searchwrap .sicon{width:16px;height:16px;flex:none;color:var(--text-3)}
.searchwrap input{
  /* 16px exactly, and not a fraction under: Safari on iOS zooms the whole
     page in when a field smaller than that takes focus, and it does not zoom
     back out. Searching for a friend left the layout magnified and the tab
     bar off the bottom of the screen. */
  flex:1;min-width:0;border:0;background:none;font:inherit;font-size:16px;
  color:var(--text);padding:11px 0;outline:none;
}
.searchwrap input::placeholder{color:var(--text-3)}
.searchwrap input::-webkit-search-cancel-button{display:none}
.sclear{
  width:19px;height:19px;border-radius:50%;flex:none;background:var(--bg-tint);
  color:var(--text-2);font-size:10px;line-height:1;display:grid;place-items:center;
}

/* preview scaffolding — deliberately styled as a tool, not as chrome.

   None of it is product UI, so none of it survives being SERVED: the adapter
   stamps `data-served` on the root element, and these four buttons are gone
   before a rule below them is applied. Hiding them from script instead would
   mean showing them for as long as it takes the server to answer, which is a
   worse lie than not having them. Open this file from disk and the stamp is
   absent, which is the only situation the buttons were ever for. */
html[data-served] .langtog,
html[data-served] .introtog,
html[data-served] .newtog,
html[data-served] .themetog{display:none}
/* Groups do not survive being served either, for a different reason: nothing
   backs them. The /me payload carries no groups, user-dashboard-write.js has
   no group action and the ACT map has no entry — so the three lists on a
   served page are somebody else's example (פוקר, פאדל, האו״ם, seeded when
   this was designed), and a group made there is forgotten on the next reload.
   Hidden by the same stamp and for the same reason as the buttons above: from
   script it would show until the server answered. Emptying the seed instead
   would leave a section still offering to make one. Open this file from disk
   and the whole feature is there, which is what the design copy is for. */
/* The BUTTON stays hidden when served: a WhatsApp room is not something this
   page can create, and a group made here is still forgotten on reload. The
   LIST is a different thing since 2026-09-09 — the rooms Olma is in arrive
   from the server as groups that are already made, so it shows when there is
   something real in it and `hydrate` hides it when there is not. */
html[data-served] button.groupsblock{display:none}
/* The LIST starts hidden on a served page too, and `hydrate` turns it back on
   only once real rooms have arrived. Deliberately not a `hidden` set from
   script after the fetch: the three seeded design groups are IN the markup,
   so anything that hides them only when hydrate runs shows a real person
   somebody else's example lists for as long as the server takes to answer —
   which is the whole reason the rule this replaced covered the list as well. */
html[data-served] .groupsblock:not(button){display:none}
/* `hasrooms` and not `live`: this is the only rule in the file allowed to
   mention it, because it says nothing about how anything looks. The name it
   replaced was also a pill's — see .livepill. */
html[data-served] .groupsblock.hasrooms{display:block}
.langtog{
  position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 96px);inset-inline-start:14px;z-index:40;
  display:flex;padding:3px;border-radius:999px;background:var(--surface);
  box-shadow:var(--shadow-m);font-size:10.5px;font-weight:700;letter-spacing:.06em;
}
.langtog span{padding:4px 8px;border-radius:999px;color:var(--text-3);transition:background .22s var(--ease),color .22s var(--ease)}
.langtog span.on{background:var(--accent);color:var(--on-accent)}
.introtog{
  position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 96px);inset-inline-start:64px;z-index:40;
  width:26px;height:26px;border-radius:999px;background:var(--surface);
  box-shadow:var(--shadow-m);color:var(--text-3);font-size:14px;line-height:1;
  display:grid;place-items:center;
}

/* ─────────────────  the first screen (a stranger)  ───────────────── */
/* Somebody the system has never met has nothing of theirs to show — no
   tasks, no friends, no calendar — so the whole page becomes the one thing
   it can honestly offer: who she is, and the two doors to her. The app
   below is taken out of the flow entirely rather than covered, or its
   tabbar sits on top of this. */
html.is-new .introtog{display:none}
/* Inside the installed app a stranger is still somebody signing in, and the
   code is the whole screen — the app below goes, exactly as before. */
html.is-new.is-app .app,
html.is-new.is-app .tabbar{display:none}
.welcome{
  position:fixed;inset:0;z-index:70;overflow-y:auto;
  display:grid;place-items:center;
  /* `safe` so a short screen scrolls instead of centring the card half off
     the top edge, where nothing can reach it */
  place-items:safe center;
  padding:calc(env(safe-area-inset-top,0px) + 30px) 22px calc(env(safe-area-inset-bottom,0px) + 30px);
  background:radial-gradient(125% 68% at 50% -8%, var(--accent-soft) 0%, transparent 62%), var(--bg);
}
.wcard{width:100%;max-width:376px;display:flex;flex-direction:column;align-items:center;text-align:center}
.wword{
  font-family:var(--font-display);font-weight:700;
  font-size:42px;line-height:1;letter-spacing:-.02em;color:var(--text);
}
.wlede{margin-top:11px;font-size:16px;line-height:1.5;color:var(--text-2);max-width:20em}
/* The hint and the arrow are one unit: the sentence says what to do, the
   arrow says where. Splitting them would leave an arrow pointing at nothing
   in particular. */
.whint{margin-top:34px;display:flex;flex-direction:column;align-items:center;gap:7px}
.whint b{font-size:14.5px;font-weight:600;color:var(--text)}
.warrow{width:15px;height:15px;color:var(--accent);animation:wbob 1.7s var(--ease-io) infinite}
.warrow svg{width:100%;height:100%;display:block}
@keyframes wbob{0%,100%{transform:translateY(-1px);opacity:.34}50%{transform:translateY(6px);opacity:.92}}
.wrow{margin-top:13px;width:100%;display:grid;grid-template-columns:1fr 1fr;gap:12px}
/* these two are anchors, not buttons: without this the name renders in the
   browser's link blue on top of the tile's own colour */
.wrow .chan{padding:18px 8px 16px;color:var(--text);text-decoration:none}
.wfoot{margin-top:20px;font-size:12px;line-height:1.55;color:var(--text-3);max-width:23em}
/* ── the locked page (the owner, 2026-09-29) ──
   In a browser the stranger's screen is the app itself, drawn from this
   file's example data, one screen tall and blurred, with the card at its
   foot and what Allma is — the words Google's reviewer reads — under it.
   The app and the card share one grid cell so the card sits ON the app while
   the page still scrolls to the words, which a fixed overlay would swallow. */
html.is-new:not(.is-app) body{display:grid;grid-template-columns:minmax(0,1fr)}
html.is-new:not(.is-app) .app{
  grid-area:1/1;width:100%;height:100svh;min-height:0;overflow:hidden;
  filter:blur(2px) saturate(.9);pointer-events:none;user-select:none;
  /* a blur paints past its own box, onto the words below, without this */
  clip-path:inset(0);
}
/* Nothing behind the lock can open a sheet, and a closed one parked under
   the fold still casts its shadow up over the words — the tab bar hid that. */
html.is-new:not(.is-app) .tabbar{display:none}
html.is-new:not(.is-app) .sheet{visibility:hidden}
html.is-new:not(.is-app) .welcome{
  grid-area:1/1;position:relative;inset:auto;z-index:5;min-height:100svh;overflow:visible;
  place-items:end center;
  padding:calc(env(safe-area-inset-top,0px) + 64px) 16px calc(env(safe-area-inset-bottom,0px) + 16px);
  background:linear-gradient(to bottom,transparent 0%,color-mix(in oklab,var(--bg) 45%,transparent) 42%,color-mix(in oklab,var(--bg) 88%,transparent) 100%);
}
html.is-new:not(.is-app) .wcard{
  max-width:400px;padding:24px 20px 14px;border-radius:26px;
  background:var(--surface);box-shadow:var(--shadow-m);
}
html.is-new:not(.is-app) .wword{font-size:36px}
html.is-new:not(.is-app) .whint{margin-top:22px}
/* A mustard strip along the card's top edge, and the three things the
   example shows as mustard labels over it (the owner, 2026-09-29). */
html.is-new:not(.is-app) .wcard{border-top:6px solid var(--action)}
.wwhat{display:none}
html.is-new:not(.is-app) .wwhat{display:block;margin-top:10px;font-size:15px;line-height:1.5;color:var(--text-2);max-width:26em}
.wwhat b{color:var(--text);font-weight:600}
html.is-new:not(.is-app) .warrow{color:var(--mk-gold-s)}
.wcall{display:none}
/* In the flow above the card, not laid over the page: when the code form
   opens the card grows, and it has to push these up rather than slide under
   them. */
html.is-new:not(.is-app) .welcome{display:flex;flex-direction:column;align-items:center;gap:18px}
html.is-new:not(.is-app) .wcard{margin-top:auto}
html.is-new:not(.is-app) .wcall{
  display:flex;flex-direction:column;align-items:center;gap:10px;margin:54px 0 0;padding:0;list-style:none;
}
.wcall li{
  display:inline-flex;align-items:center;gap:8px;padding-block:9px;padding-inline:14px 16px;border-radius:999px;
  background:var(--action);color:var(--on-action);font-weight:700;font-size:15px;
  box-shadow:0 8px 22px -10px rgba(0,0,0,.45);
}
.wcall i{display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:#004643;color:var(--action);flex:none}
.wcall svg{width:12px;height:12px}
.wdemo{display:none}
html.is-new:not(.is-app) .wdemo{
  display:block;position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);left:50%;transform:translateX(-50%);
  padding:5px 13px;border-radius:999px;background:var(--surface);box-shadow:var(--shadow-s);
  font-size:12.5px;font-weight:700;letter-spacing:.04em;color:var(--text-2);white-space:nowrap;
}
.wback{margin-top:22px;width:100%;display:flex;flex-direction:column;gap:10px}
.wcode-get.wback-go{background:var(--action);color:var(--on-action);box-shadow:none}
.wback-p{font-size:13.5px;line-height:1.5;color:var(--text-2)}
.wnew{width:100%;display:flex;flex-direction:column;align-items:center}
.wabout{display:none}
html.is-new:not(.is-app) .wabout{
  display:inline-block;margin-top:6px;padding:6px 10px;font-size:13px;color:var(--text-3);text-decoration:underline;text-underline-offset:3px;
}
/* The words under the lock: the same text as the public home page, and the
   server puts them here (public-pages.homeSections), not this file. */
.about{display:none}
html.is-new:not(.is-app) .about{
  display:block;grid-row:2;grid-column:1;width:100%;max-width:640px;margin-inline:auto;
  padding:36px 20px calc(env(safe-area-inset-bottom,0px) + 44px);font-size:15.5px;line-height:1.6;
}
.about h1{font-family:var(--font-display);font-size:28px;line-height:1.15;font-weight:700}
.about h2{font-family:var(--font-display);font-size:20px;line-height:1.3;font-weight:700;margin:28px 0 8px}
.about h3{font-size:16px;font-weight:700;margin:18px 0 6px}
.about p{margin:0 0 10px;color:var(--text-2)}
.about ul{margin:0 0 10px;padding-inline-start:20px;color:var(--text-2)}
.about li{margin:5px 0}
.about b{color:var(--text)}
.about a{color:var(--accent);font-weight:600}
.about code{font-size:13px;padding:1px 5px;border-radius:6px;background:var(--surface-2);color:var(--text)}
.about .ab-lede{font-size:17px;margin-top:10px}
.about .ab-card{background:var(--surface);border-radius:16px;box-shadow:var(--shadow-s);padding:14px 16px 6px;margin:12px 0}
.about .ab-card h3{margin-top:0}
.about .ab-perm{font-size:13.5px}
.about .ab-he{direction:rtl;margin-top:36px;padding-top:28px;border-top:1px solid var(--sep)}
.about .ab-mark{width:48px;height:48px;color:var(--text);margin-bottom:6px}
.about .ab-mark svg{width:100%;height:100%;display:block}
.about .ab-cta{display:inline-block;padding:12px 22px;border-radius:999px;background:var(--action);color:var(--on-action);text-decoration:none;font-weight:700}
.about .ab-foot{margin-top:32px;font-size:13px}
/* Everything arrives in reading order, once. The global reduced-motion rule
   near the bottom of this sheet flattens all of it to nothing. */
@keyframes wrise{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:none}}
.welcome .wword,
.welcome .wlede,.welcome .whint,.welcome .wrow,.welcome .wfoot{
  animation:wrise .3s var(--ease-easy) both;
}
.welcome .wword{animation-delay:.045s}
.welcome .wlede{animation-delay:.08s}
.welcome .whint{animation-delay:.135s}
.welcome .wrow{animation-delay:.165s}
.welcome .wfoot{animation-delay:.21s}

/* ─────────────────  signing into the app with a code  ───────────────── */
/* A home-screen app on an iPhone keeps its own cookies, so the link that
   signed Safari in never reaches it; eight digits from Olma do. Inside the
   installed app (html.is-app) the first screen IS this form — the two chat
   tiles are for a stranger, and somebody who installed the app is not one.
   In a browser it waits behind "I have a code". */
.wcode{margin-top:22px;width:100%;display:flex;flex-direction:column;align-items:stretch;gap:10px;text-align:center}
.wcode[hidden]{display:none}
.wcode-p{font-size:14.5px;line-height:1.5;color:var(--text-2)}
.wcode-get{
  display:flex;align-items:center;justify-content:center;gap:8px;
  padding:14px 16px;border-radius:14px;background:var(--surface);box-shadow:var(--shadow-m);
  color:var(--text);font-weight:600;font-size:15.5px;text-decoration:none;
}
.wcode-get .tile{width:26px;height:26px;border-radius:8px}
.wcode-in{
  width:100%;padding:14px 12px;border-radius:14px;border:1.5px solid var(--sep-2);
  background:var(--surface);color:var(--text);outline:none;text-align:center;direction:ltr;
  font:600 24px/1.1 var(--font-display);letter-spacing:.18em;font-variant-numeric:tabular-nums;
}
.wcode-in:focus{border-color:var(--accent)}
.wcode-in::placeholder{letter-spacing:normal;font-size:16px;font-weight:500;color:var(--text-3)}
.wcode-go{
  padding:14px 16px;border-radius:14px;background:var(--accent);color:var(--on-accent);
  font-weight:700;font-size:16px;transition:opacity .2s var(--ease),transform .2s var(--spring);
}
.wcode-go:disabled{opacity:.45}
.wcode-go:active{transform:scale(.98)}
.wcode-err{min-height:1.4em;font-size:13.5px;color:var(--danger)}
.wcode-have{margin-top:14px;font-size:14px;font-weight:600;color:var(--accent);padding:6px 10px}
html.is-app .welcome .whint,
html.is-app .welcome .wrow,
html.is-app .welcome .wfoot,
html.is-app .welcome .wcode-have{display:none}

/* ─────────────────  the invitation to install  ───────────────── */
/* One card at the top of the home tab, only where installing can actually
   work: Chrome/Edge said so (beforeinstallprompt), or this is Safari on an
   iPhone, where the steps are three taps the browser will not offer itself.
   Never inside the installed app, never after "not now". */
.inst{
  position:relative;margin:0 0 14px;padding:15px 16px 14px;border-radius:20px;
  background:var(--surface);box-shadow:var(--shadow-m);
  display:grid;grid-template-columns:44px 1fr;column-gap:12px;row-gap:2px;align-items:center;
}
.inst[hidden]{display:none}
.inst-mark{grid-row:1 / span 2;width:44px;height:44px;border-radius:11px;overflow:hidden;box-shadow:var(--shadow-s)}
.inst-mark svg{display:block;width:100%;height:100%}
.inst b{font-family:var(--font-display);font-weight:700;font-size:16px;color:var(--text)}
.inst p{font-size:13.5px;line-height:1.45;color:var(--text-2)}
.inst-steps{grid-column:1 / -1;margin:12px 0 2px;padding:0;list-style:none;display:flex;flex-direction:column;gap:9px;counter-reset:inst}
.inst-steps li{display:flex;align-items:center;gap:10px;font-size:14px;line-height:1.4;color:var(--text);counter-increment:inst}
.inst-steps li::before{
  content:counter(inst);flex:none;width:22px;height:22px;border-radius:50%;
  display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);
  font:700 12px var(--font-display);
}
.inst-steps svg{width:17px;height:17px;flex:none;color:var(--accent);vertical-align:-3px}
.inst-acts{grid-column:1 / -1;display:flex;gap:8px;margin-top:12px}
.inst-acts button{flex:1;padding:11px 12px;border-radius:12px;font-weight:600;font-size:14.5px}
.inst-yes{background:var(--accent);color:var(--on-accent)}
.inst-no{background:var(--bg-tint);color:var(--text-2)}

/* ─────────────────  the apps on the home screen  ───────────────── */
/* Food and game nights, each its own service, as icons the way a phone's home
   screen draws apps (owner, 2026-10-08: option ג of the home-apps mockups).
   Only the packs somebody holds; none, and the invitation keeps the place.
   A tap asks the server for that person's own link (domain/user-apps.js) and
   goes there; the badge is open game nights, and nothing when gamesd is slow. */
.apps{margin:0 0 26px}
.apps[hidden]{display:none}
.appsh{font-family:var(--font-display);font-weight:700;font-size:20px;letter-spacing:-.01em;padding:0 2px 12px}
.appsrow{display:flex;flex-wrap:wrap;gap:14px 22px;padding:0 4px}
.appbtn{display:flex;flex-direction:column;align-items:center;gap:7px;min-width:72px;text-align:center;
  transition:transform .38s var(--squash)}
.appbtn:active{transform:scale(.92)}
.appbtn[aria-busy="true"]{opacity:.6}
.appico{position:relative;width:64px;height:64px;border-radius:15px;display:grid;place-items:center;
  box-shadow:var(--shadow-m),var(--rim-soft)}
.appico svg{width:31px;height:31px}
.appbtn[data-app="food"] .appico{background:var(--action);color:var(--on-action)}
.appbtn[data-app="games"] .appico{background:var(--accent);color:var(--on-accent)}
.appbtn b{font-size:13px;font-weight:600;line-height:1.2;color:var(--text);white-space:nowrap}
.appbadge{position:absolute;top:-6px;inset-inline-end:-6px;min-width:22px;height:22px;padding:0 6px;
  border-radius:999px;background:var(--danger);color:var(--on-accent);border:2px solid var(--bg);
  font-size:12px;font-weight:700;line-height:18px;font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){.appbtn{transition:none}}

/* ─────────────────  the invitation to a friend  ───────────────── */
/* Under the home cards (owner, 2026-09-30: the growth plan). The message and
   its link are made by the server (domain/referral.js); the page only hands
   them to WhatsApp or the clipboard. No data, no card. */
.invite{
  margin:14px 0 22px;padding:15px 16px 14px;border-radius:20px;
  background:var(--surface);box-shadow:var(--shadow-m);
  display:flex;flex-direction:column;gap:2px;
}
.invite[hidden]{display:none}
.invite b{font-family:var(--font-display);font-weight:700;font-size:16px;color:var(--text)}
.invite p{font-size:13.5px;line-height:1.45;color:var(--text-2)}
.invite .inst-acts a{
  flex:1;padding:11px 12px;border-radius:12px;font-weight:600;font-size:14.5px;
  text-align:center;text-decoration:none;
}
.themetog{
  position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 96px);inset-inline-start:128px;z-index:80;
  width:26px;height:26px;border-radius:999px;background:var(--surface);
  box-shadow:var(--shadow-m);color:var(--text-3);font-size:13px;line-height:1;
  display:grid;place-items:center;
}
.newtog{
  position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 96px);inset-inline-start:96px;z-index:80;
  width:26px;height:26px;border-radius:999px;background:var(--surface);
  box-shadow:var(--shadow-m);color:var(--text-3);font-size:13px;line-height:1;
  display:grid;place-items:center;
}
html.is-new .newtog{color:var(--accent)}
/* the two preview toggles that stay reachable over the first screen */
html.is-new .langtog{z-index:80}
html.is-new .themetog{z-index:80}

.pushhead{display:flex;align-items:center;gap:12px;padding:6px 2px 20px}
.backbtn{
  width:36px;height:36px;border-radius:50%;flex:none;color:var(--accent);
  background:var(--surface);box-shadow:var(--shadow-s);display:grid;place-items:center;
  transition:transform .2s var(--spring);
}
.backbtn:active{transform:scale(.9)}
.backbtn svg{width:9px;height:15px;transform:scaleX(-1)}
[dir="ltr"] .backbtn svg{transform:none}
.pushhead .tile{width:44px;height:44px;border-radius:14px}
.pushtxt{min-width:0}
.pushtxt b{display:block;font-family:var(--font-display);font-weight:700;font-size:22px;letter-spacing:-.01em}
.pushtxt span{display:block;font-size:13.5px;color:var(--text-2);margin-top:1px}

/* A value belongs beside its label, not in a box of its own that runs the
   full width with three words in it — same row, label at the start, value at
   the end. The name is an input dressed as that value, so it edits in place. */
.row-val{font-size:16.5px;color:var(--text-2);margin-inline-start:auto;white-space:nowrap}
.row-input{
  flex:1;min-width:0;border:0;background:none;font:inherit;font-size:16.5px;font-weight:500;
  color:var(--text);text-align:end;outline:none;padding:0;
}
.row-input::placeholder{color:var(--text-3)}
.row-input:focus{color:var(--accent)}
.row .row-title{flex:none}

/* Stopping Olma is one decision and its own switch, so it is a single narrow
   control in the middle of the page rather than a full-width list row that
   reads like one more setting. Pressed, it holds the paused state and says so. */
.pausewrap{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
.pausebtn{
  display:inline-flex;align-items:center;gap:9px;
  padding:11px 22px;border-radius:999px;
  background:var(--surface);box-shadow:var(--shadow-m);
  font-size:15px;font-weight:600;color:var(--text-2);white-space:nowrap;
  transition:background .28s var(--ease),color .28s var(--ease),transform .2s var(--spring);
}
.pausebtn svg{width:15px;height:15px;flex:none}
.pausebtn:active{transform:scale(.955)}
.pausebtn[aria-pressed="true"]{background:var(--warn);color:var(--on-accent);box-shadow:var(--shadow-m)}
.pausewrap .note{max-width:40ch;margin-top:12px}
/* Deleting everything sits under the pause, quieter than it: a pause is the
   answer most people looking for "stop" want, and it undoes itself. */
.delwrap{display:flex;justify-content:center;margin-top:28px}
.delsheet-body{color:var(--text-2);font-size:15px;line-height:1.55;margin-top:6px}
.goneview{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;
  padding:0 24px;background:var(--bg);color:var(--text);text-align:center;font-size:17px;line-height:1.6}

/* …and since 2026-09-29 (the owner) the page itself stops: everything behind
   is blurred and inert, and the one thing left to press is bringing her back.
   A paused page that still lets you add a reminder is a page promising
   something the server will refuse. */
html[data-paused] .app,html[data-paused] .tabbar{filter:blur(3px) saturate(.85);pointer-events:none;user-select:none}
.pausegate{display:none}
html[data-paused] .pausegate{
  display:flex;position:fixed;inset:0;z-index:85;align-items:center;justify-content:center;
  padding:24px 20px;background:color-mix(in oklab,var(--bg) 40%,transparent);
}
.pgcard{
  width:100%;max-width:340px;display:grid;gap:10px;justify-items:center;text-align:center;
  background:var(--surface);border-radius:24px;box-shadow:var(--shadow-m);padding:26px 22px 22px;
}
.pgicon{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--band);color:var(--on-band)}
.pgicon svg{width:20px;height:20px}
.pgcard h2{margin:4px 0 0;font-family:var(--font-display);font-size:22px;font-weight:700;line-height:1.2}
.pgcard p{margin:0;color:var(--text-2);font-size:15px;line-height:1.55;max-width:30ch}
.pggo{
  margin-top:8px;width:100%;display:inline-flex;align-items:center;justify-content:center;gap:9px;
  padding:14px 20px;border:0;border-radius:999px;cursor:pointer;
  background:var(--action);color:var(--on-action);font:inherit;font-size:16.5px;font-weight:700;
  transition:transform .2s var(--spring);
}
.pggo svg{width:16px;height:16px;flex:none}
.pggo:active{transform:scale(.96)}

.note{font-size:13px;color:var(--text-2);margin-top:10px;line-height:1.5}
.linkbtn{color:var(--accent);font-weight:600;font-size:14.5px}
.linkbtn.danger{color:var(--danger)}

/* The Privacy · Terms · Accessibility line at the foot of the settings tab.
   Quiet on purpose: note-sized, secondary text, no card. The padding makes
   each link a 44px-tall target without making it look like a button. */
.legalfoot{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:2px 4px;font-size:13px;color:var(--text-3)}
.legalfoot-a{color:var(--text-2);text-decoration:none;padding:12px 6px;border-radius:8px}
.legalfoot-a:hover{color:var(--accent);text-decoration:underline}

/* ── small controls, full-sized targets ──
   Nine controls on this page are drawn between 19 and 31 pixels across, which
   is right: a 44px trash beside a 15px line of text is not a design. What a
   finger needs is not the same as what the eye needs, so the target grows and
   the drawing does not — an ::after with a negative inset, which costs a
   pixel of nothing and is what every one of these was missing.

   Where such controls sit in a ROW of their own kind, the inline growth is
   small and the block growth does the work: two overlapping targets hand the
   tap to whichever is later in the source, which is worse than a small one. */
.tick,.tpin,.tjump,.tundo,.vclear,.sclear,.lrm,.evdrop,.calnav,.fq .fqskip,.permact{position:relative}
.tick::after,.vclear::after,.sclear::after,.lrm::after,.evdrop::after,.fq .fqskip::after{
  content:"";position:absolute;inset:-9px;border-radius:inherit;
}
/* these three live beside each other at the end of a task row */
.tpin::after,.tjump::after,.tundo::after,.calnav::after,.permact::after{
  content:"";position:absolute;inset-block:-9px;inset-inline:-4px;border-radius:inherit;
}

/* ─────────────────────────  tasks  ───────────────────────── */
.taskwrap{display:grid;grid-template-rows:1fr;transition:grid-template-rows .44s var(--ease),opacity .3s ease}
.taskwrap > .taskin{overflow:hidden;min-height:0}
/* a row on its way out stops accepting taps: the restore takes 440ms to
   animate, and a second tap inside that window would land on whichever row
   slid up into its place — putting back a task nobody asked for */
.taskwrap.gone{grid-template-rows:0fr;opacity:0;pointer-events:none}
/* …and the same idea for every OTHER list on the page, where the row is not a
   `.taskwrap` and has no wrapper to collapse: see foldAway(). */
.folding{transition:max-height .24s var(--ease-io),opacity .18s ease,
                    margin .24s var(--ease-io),padding .24s var(--ease-io)}
.task{display:flex;align-items:center;gap:12px;padding:13px 14px;position:relative}
.taskwrap + .taskwrap .task::before{
  content:"";position:absolute;top:0;height:1px;background:var(--sep);
  inset-inline-start:50px;inset-inline-end:0;
}
.tick{
  width:25px;height:25px;border-radius:50%;flex:none;
  box-shadow:inset 0 0 0 1.8px var(--sep-2);
  display:grid;place-items:center;color:var(--on-accent);
  transition:box-shadow .28s var(--spring),background .28s var(--spring),transform .28s var(--spring);
}
.tick svg{width:14px;height:14px;opacity:0;transform:scale(.4);transition:opacity .2s ease,transform .34s var(--spring)}
.tick:active{transform:scale(.88)}
.task.done .tick{background:var(--accent);box-shadow:inset 0 0 0 1.8px var(--accent);transform:scale(1)}
.task.done .tick svg{opacity:1;transform:scale(1)}
.tbody{flex:1;min-width:0}
.ttitle{position:relative;display:inline;font-size:16.5px;font-weight:500;letter-spacing:-.005em;transition:color .34s ease}
.ttitle::after{
  content:"";position:absolute;inset-inline:-1px;top:52%;height:1.6px;border-radius:2px;
  background:currentColor;transform:scaleX(0);transform-origin:var(--strike-origin);
  transition:transform .36s cubic-bezier(.5,0,.2,1);
}
.task.done .ttitle{color:var(--text-3)}
.task.done .ttitle::after{transform:scaleX(1)}
/* A handful of brand-coloured bits thrown from the tick (confetti(), below).
   Fixed to the viewport and on the body, so a sheet closing or a row folding
   away under them does not take them with it; never a target. */
.conf{position:fixed;pointer-events:none;z-index:99;border-radius:2px}
.task{cursor:pointer}
.task:active{background:var(--surface-2)}
/* ── dragging a task ──
   A row is lifted by a long press on a phone and by press-and-move with a
   mouse. Nothing in a row is text anybody selects, and iOS's own long-press
   menu would otherwise open on exactly the gesture that lifts it. The clone
   lives on <body>, not in its group: a .group clips (overflow:hidden) and the
   lifted row has to be able to sit over the edge of it. */
.taskwrap{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.dragclone{position:fixed;z-index:85;pointer-events:none;margin:0;will-change:transform}
/* The lifted card is frosted glass, tilted a little, so "in your hand" reads
   at a glance. The sheets' panel glass, not the tab bar's: the bar's thin,
   light lens is made to float over open space, and over a list of rows it
   shows their text (and this row's own dimmed placeholder) as a smeared
   double image. On an inner element: the outer one follows the finger every
   frame and must not carry a transition that would lag it. */
.draglift{
  border-radius:14px;
  /* closer to solid than the panel's plain alpha, so the row's own dimmed
     placeholder underneath does not ghost through its text — but not all
     the way, so it still reads as glass rather than a fresh opaque card */
  background:var(--glass-panel);
  background:color-mix(in srgb, var(--glass-panel), var(--surface) 38%);
  background-image:var(--sheen);
  border:.5px solid var(--glass-line);
  -webkit-backdrop-filter:var(--lens);backdrop-filter:var(--lens);
  box-shadow:var(--shadow-l),var(--rim);
  transform:rotate(-2deg) scale(1.03);
  animation:dragLift .38s var(--squash);
}
@keyframes dragLift{from{transform:none}}
@media (prefers-reduced-motion:reduce){ .draglift{transform:none} }
.dragclone .task{cursor:grabbing}
/* The dimmed row IS the placeholder: live DOM reordering puts it exactly
   where a drop will land, and the blue line marks that landing spot —
   deliberately a different hue from .nesttarget's purple ring so "moves
   beside" never reads as "moves inside". On the WRAP, not the row inside
   it, so the opacity that dims the row does not wash the line out too.
   Hidden while a nest target is live (dragsrc-nesting): the dimmed row is
   not where this drop would land any more. */
.taskwrap.dragsrc .task{opacity:.32}
.taskwrap.dragsrc{box-shadow:inset 0 2px 0 0 var(--drop-line)}
.taskwrap.dragsrc.dragsrc-nesting{box-shadow:none}
html.dragging-task, html.dragging-task *{cursor:grabbing !important}
/* The row it will go INTO: a ring, not a gap — dropping here does not put it
   beside this task, it puts it inside. */
.taskwrap.nesttarget .task{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent)}
.taskwrap.nesttarget .task::before{display:none}
.taskwrap + .taskwrap.nesttarget .task::before,.taskwrap.nesttarget + .taskwrap .task::before{display:none}
/* A row that would refuse this drop, while it is still being hovered — the
   same ring shape as .nesttarget, in red instead of purple, and softened
   with transparency so it never reads as a hard stop the way a full-strength
   error colour would. */
.taskwrap.nestrefused .task{
  background:color-mix(in srgb, var(--danger-soft) 65%, transparent);
  box-shadow:inset 0 0 0 2px color-mix(in srgb, var(--danger) 65%, transparent);
}
.taskwrap.nestrefused .task::before{display:none}
.taskwrap + .taskwrap.nestrefused .task::before,.taskwrap.nestrefused + .taskwrap .task::before{display:none}
.tend{display:flex;align-items:center;gap:8px;flex:none;margin-inline-start:auto;padding-top:1px}
.tglyph{width:14px;height:14px;color:var(--text-3)}
.tglyph.bell{color:var(--warn)}
/* The calendar, not the brand's two rings (owner, 2026-09-29): the rings
   read as our logo, and a row is saying where the thing lives. */
.tglyph.kindmark{width:14px;height:14px}
.ttime{
  font-size:13.5px;font-weight:600;color:var(--text-2);
  font-variant-numeric:tabular-nums;white-space:nowrap;
  /* "5.9 08:30" is one logical run of digits; without an isolate the RTL
     paragraph reorders it into "08:30 5.9" and the date reads as a time. */
  direction:ltr;unicode-bidi:isolate;
}
.ttime.late{color:var(--danger)}
/* "נודניק" on the row: a word, because the glyph beside it meant "repeats". */
.tnag{font-size:12px;font-weight:600;color:var(--warn);white-space:nowrap}
.tloc.trep{color:var(--accent);font-weight:600}
.edays{display:flex;gap:4px;margin-top:6px}
.edays b{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;font-size:12px;font-weight:600;color:var(--text-3);border:1px solid var(--sep)}
.edays b.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.tsec + .tsec{margin-top:19px}
.glabel .late{color:var(--danger)}
/* ── a task shared with people ──
   Faces sit in the sentence, right after the title, not out with the time
   and the bell. Who a task belongs to is part of what it IS; when it is due
   is metadata, and the two do not belong in the same cluster. Three faces
   then a count, because a stack has to survive a fourth person. */
.faces{display:inline-flex;vertical-align:-6px;margin-inline-start:9px;flex:none}
.face{
  width:21px;height:21px;border-radius:50%;overflow:hidden;flex:none;
  box-shadow:0 0 0 1.8px var(--surface);
}
.face + .face{margin-inline-start:-7px}
.face.more{
  display:grid;place-items:center;background:var(--bg-tint);color:var(--text-2);
  font-size:10px;font-weight:700;letter-spacing:-.02em;
  /* "+1" is arithmetic, not prose: left to the paragraph's direction it
     reorders to "1+" in Hebrew */
  direction:ltr;
}
#arcGroup .face{box-shadow:0 0 0 1.8px var(--surface-2)}

/* ── a task that is a list ──
   The pill IS the progress bar: it fills left-to-right in step with the
   count it shows, so one small object answers "how many" and "how far"
   at once instead of a number beside a bar. */
.tcount{
  font-size:11.5px;font-weight:700;font-variant-numeric:tabular-nums;
  padding:3.5px 9px;border-radius:999px;color:var(--accent);flex:none;direction:ltr;
  background:linear-gradient(to right,var(--prog) var(--p,0%),transparent var(--p,0%));
  box-shadow:inset 0 0 0 1px var(--accent-soft);
  transition:background .5s var(--ease-io);
}
[dir="rtl"] .tcount{background:linear-gradient(to left,var(--prog) var(--p,0%),transparent var(--p,0%))}
.tcount.full{background:var(--prog)}
/* the last item closing the list — the same beat the chips take */
.tcount.pop{animation:chipPop .26s var(--squash)}

/* the checklist inside the editor. It scrolls on its own so a long list can
   never make the sheet itself scroll — the one rule this editor has. It GROWS
   with its items until the sheet reaches its own ceiling (92vh), and only then
   scrolls (owner, 2026-10-03: a shopping list scrolled inside a sheet with
   half the phone still free). fitList sets the real cap; 232px — five items —
   is the floor it never goes under, what a page without it shows, and the
   cap again while the details are open. */
.listbox{max-height:232px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.litem{display:flex;align-items:center;gap:11px;padding:9px 14px;position:relative}
.litem + .litem::before{
  content:"";position:absolute;top:0;inset-inline-start:47px;inset-inline-end:0;
  height:1px;background:var(--sep);
}
.lbox{
  width:21px;height:21px;flex:none;border-radius:7px;display:grid;place-items:center;
  box-shadow:inset 0 0 0 1.7px var(--sep-2);color:var(--on-accent);
  transition:background var(--sw-t) var(--ease-io),box-shadow var(--sw-t) var(--ease-io),
             transform .38s var(--squash);
}
.lbox svg{width:12px;height:12px;opacity:0;transform:scale(.4);
  transition:opacity .22s ease,transform .36s var(--squash)}
.lbox:active{transform:scale(.86)}
.litem.on .lbox{background:var(--accent);box-shadow:inset 0 0 0 1.7px var(--accent)}
.litem.on .lbox svg{opacity:1;transform:none}
/* The strike belongs to the WORDS, not to the column they sit in — so the
   line rides an inline span that hugs the text, the same way a finished
   task's title does one level up. */
.ltext{flex:1;min-width:0;font-size:15.5px;transition:color .34s ease}
.ltext i{position:relative;font-style:normal}
.ltext i::after{
  content:"";position:absolute;top:53%;inset-inline:-1px;height:1.3px;background:currentColor;
  border-radius:2px;transform:scaleX(0);transform-origin:var(--strike-origin);
  transition:transform .42s var(--ease-io);
}
.litem.on .ltext{color:var(--text-3)}
.litem.on .ltext i::after{transform:scaleX(1)}
.lrm{
  width:24px;height:24px;flex:none;border-radius:8px;display:grid;place-items:center;
  color:var(--text-3);opacity:0;transition:opacity .3s var(--ease-io),background .3s var(--ease-io);
}
.litem:hover .lrm,.litem:focus-within .lrm{opacity:1}
/* On a phone there is no hover, so this button was drawn at opacity 0 and
   never came back: removing an item off a list was possible on a laptop and
   impossible on the device the page is designed for. Quiet, not invisible. */
@media (hover:none){ .lrm{opacity:.55} }
.lrm:active{background:var(--bg-tint)}
.lrm svg{width:11px;height:11px}
@keyframes itemIn{
  0%{opacity:0;transform:translateY(-8px) scaleY(.7)}
  62%{opacity:1;transform:translateY(1px) scaleY(1.04)}
  100%{opacity:1;transform:none}
}
.litem.fresh{animation:itemIn .23s var(--ease-io)}
.additem{text-align:start}
.additemrow{padding-top:4px}
/* A task that already has items opens on them, and the rest of the sheet
   folds behind one row that says what it holds (#sheet.listmode, set in
   openSheet). Outside listmode the row does not exist and nothing moves —
   including the separator it would otherwise hand to the row after it. */
#sDetailsRow{display:none}
#sheet.listmode #sDetailsRow{display:flex}
#sDetailsRow::before{
  content:"";position:absolute;top:0;height:1px;background:var(--sep);
  inset-inline-start:14px;inset-inline-end:0;
}
#sheet:not(.listmode) #sDetailsRow + .row::before{content:none}
#sheet.listmode:not(.details) .lfold{display:none}
#sheet.listmode.details .lfold{animation:itemIn .23s var(--ease-io)}

/* ── the task sheet as sentences (owner, 2026-09-30) ──
   Each row is a coloured icon, a small label saying what the row is, and the
   value said the way a person would say it. Only what the task HAS is a row;
   the rest waits below as tiles that each say what they add. */
#sheet .group + .group,#sheet .group + .also,#sheet .also + .group{margin-top:12px}
#sheet [hidden].group,#sheet .srow[hidden],#sheet .atile[hidden],
#sheet .wweekwrap[hidden],#sheet .wline[hidden],#sheet .endline[hidden],
#sheet .also[hidden],#sheet .sval[hidden],#sheet .wpk button[hidden]{display:none}
.srow{
  display:flex;align-items:center;gap:12px;width:100%;min-height:60px;
  padding:8px 14px;position:relative;text-align:start;
}
button.srow{cursor:pointer;transition:background .18s ease}
button.srow:active{background:var(--bg-tint)}
#sheet .group .srow:not(:first-child)::before{
  content:"";position:absolute;top:0;height:1px;background:var(--sep);
  inset-inline-start:62px;inset-inline-end:0;
}
.srow[aria-expanded="true"] .chev{transform:rotate(-90deg)}
.srow.locked{opacity:.42;cursor:default}
/* A repeating event's rhythm: a fact to read, not a dead control — full
   strength, no chevron, and the row says where it is changed. */
.srow.locked.fixed{opacity:1}
.srow.fixed .chev{display:none}
.stile{
  width:36px;height:36px;border-radius:11px;flex:none;display:grid;place-items:center;
}
.stile svg{width:19px;height:19px}
