/* ─────────────────────────  tokens  ───────────────────────── */
:root{
  --bg:#F4F3F8;
  --bg-tint:#EDEBF6;
  --surface:#FFFFFF;
  --surface-2:#FAF9FE;
  --sep:#E7E5F0;
  --sep-2:#D9D6E6;
  --text:#141322;

  --text-3:#A29FB5;
  --accent:#5654E0;
  --accent-2:#4340C6;
  --accent-soft:#EBEAFC;
  --prog:rgba(86,84,224,.26);
  --danger:#DC3A31;
  --danger-soft:#FCEBE9;
  --warn:#B57509;
  --warn-soft:#F8EFDC;
  --ok:#1B9B6B;
  --knob:#FFFFFF;
  --seg-on:#FFFFFF;
  --glass:rgba(255,255,255,.74);
  --glass-line:rgba(20,19,34,.08);
  /* Liquid glass, used sparingly: a lens only reads as a lens on something
     that already floats above the page. --rim is the specular hairline that
     catches light on the top edge and returns faintly along the bottom;
     --sheen is the soft fall of light across the upper third; --lens is what
     the material does to whatever is behind it. */
  --glass-panel:rgba(255,255,255,.86);
  --rim:inset 0 .6px 0 rgba(255,255,255,.92), inset 0 -.6px 0 rgba(255,255,255,.34), inset .6px 0 0 rgba(255,255,255,.42), inset -.6px 0 0 rgba(255,255,255,.42);
  /* The bar wears the material more lightly than the panels do: one hairline
     along the top edge instead of a rim on all four sides. A full lens there
     read as a different component from the one that was working. */
  --rim-soft:inset 0 .6px 0 rgba(255,255,255,.72);
  --bar:rgba(255,255,255,.44);
  --toast-bg:rgba(255,255,255,.56);
  --lens-bar:blur(15px) saturate(280%) brightness(1.05);
  --sheen:linear-gradient(178deg, rgba(255,255,255,.42), rgba(255,255,255,.06) 42%, rgba(255,255,255,0) 62%);
  --lens:blur(28px) saturate(190%) brightness(1.04);
  --shadow-s:0 1px 2px rgba(20,19,34,.05);
  --shadow-m:0 1px 2px rgba(20,19,34,.05), 0 10px 28px -16px rgba(20,19,34,.28);
  --shadow-l:0 24px 64px -20px rgba(20,19,34,.34), 0 2px 8px rgba(20,19,34,.08);
  --dirf:1;
  --strike-origin:right;
  /* Cartoon timing: nothing starts or stops abruptly. --ease-io is the
     default gentle in-and-out; --spring keeps its overshoot for things that
     should feel physical; --squash overshoots harder for arrivals. */
  --spring:cubic-bezier(.32,.72,0,1);
  --ease:cubic-bezier(.22,1,.36,1);
  --ease-io:cubic-bezier(.62,.02,.28,1);
  --squash:cubic-bezier(.34,1.56,.44,1);
  /* One number for the whole toggle beat. The switch, the knob's squash and
     the access control it reveals all read from it, so they cannot drift out
     of step the way three hand-copied durations did. */
  --sw-t:.52s;
}

    --sheen:linear-gradient(178deg, rgba(255,255,255,.13), rgba(255,255,255,.02) 42%, rgba(255,255,255,0) 62%);

  }
}
:root[data-theme="dark"]{
  --bg:#0C0B11;
  --bg-tint:#26232F;
  --surface:#181720;

  --sep:#2A2836;

  --sheen:linear-gradient(178deg, rgba(255,255,255,.13), rgba(255,255,255,.02) 42%, rgba(255,255,255,0) 62%);
  --lens:blur(28px) saturate(200%) brightness(1.16);

[dir="ltr"]{--dirf:-1;--strike-origin:left}

/* ─────────────────────────  base  ───────────────────────── */
*{box-sizing:border-box}
[hidden]{display:none !important}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:'Assistant','Heebo',system-ui,-apple-system,'Segoe UI',sans-serif;
  font-size:16px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0;text-align:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:8px}
h1,h2,h3,p{margin:0}

.app{
  max-width:560px;
  margin-inline:auto;
  padding:0 18px 148px;
  min-height:100vh;
}

/* ─────────────────────────  top bar  ───────────────────────── */
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  gap:14px;padding:26px 2px 10px;position:relative;
}
/* their own local time, dead centre and deliberately quiet — the one
   number that answers "is now a reasonable time" at a glance. */
/* The clock IS the timezone: it is the only place in the app that shows one,
   so it is where you would go to correct it — and going there should not mean
   a trip through the profile page for a control you can already see. */
.topclock{
  position:absolute;inset-inline:0;top:50%;transform:translateY(-50%);
  width:max-content;margin-inline:auto;text-align:center;
  padding:5px 11px;border-radius:999px;
  font-size:14.5px;font-weight:600;letter-spacing:.04em;color:var(--text-3);
  font-variant-numeric:tabular-nums;
  transition:background var(--sw-t) var(--ease-io),color var(--sw-t) var(--ease-io),
             transform .3s var(--squash);
}
.topclock:active{background:var(--bg-tint);color:var(--text-2);transform:translateY(-50%) scale(.94)}
.topclock:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.brand{
  display:flex;align-items:center;gap:11px;min-width:0;
  transition:opacity .34s var(--ease),transform .34s var(--ease);
}
/* on the profile page the hero states who you are, so the header
   copy of the same face and name steps out of the way. */
html[data-v="me"] .brand{opacity:0;transform:translateY(-8px) scale(.94);pointer-events:none}
.avatar{
  width:42px;height:42px;border-radius:50%;flex:none;overflow:hidden;
  box-shadow:var(--shadow-s),inset 0 0 0 .5px rgba(0,0,0,.08);
}
.avatar svg,.fav svg{width:100%;height:100%;display:block}
.avatar.pop,.fav.pop{animation:pop .55s var(--spring)}
@keyframes pop{0%{transform:scale(.7) rotate(-10deg)}55%{transform:scale(1.07) rotate(4deg)}100%{transform:none}}

/* ── the character rig ─────────────────────────────────────────
   One set of keyframes drives every species. --lid is the resting
   eyelid height: 0 awake, .44 half-lidded (the illustrated style),
   .46 asleep, so night and mood are a token change
   rather than a second drawing. */
.ava{--lid:0}
.ava.line{--lid:.44}
.ava.night{--lid:.46}
.avaBody{transform-box:fill-box;transform-origin:50% 88%;animation:avaBreathe 4.6s ease-in-out infinite}
.avaLids{transform-box:fill-box;transform-origin:top;animation:avaBlink 6.2s infinite;will-change:transform}
.avaPupils{transform-box:fill-box;transform-origin:center;transition:transform .35s var(--ease)}
.avaStars{animation:avaTwinkle 3.4s ease-in-out infinite}
.avaHat{transform-box:fill-box;transform-origin:50% 100%;animation:avaTip 3.2s ease-in-out infinite}
.avaConf{transform-box:fill-box;animation:avaConfFall 3.1s linear infinite}
/* one tap plays the whole hop. :active only lasted while a finger was down,
   so a normal tap showed a fraction of it and looked like a glitch. */
.avatar.hop .avaBody,.fav.hop .avaBody{animation:avaHop .6s var(--spring)}
@keyframes avaBreathe{0%,100%{transform:scale(1)}50%{transform:scale(1.024)}}
@keyframes avaBlink{0%,91%,100%{transform:scaleY(var(--lid))}94.5%,96%{transform:scaleY(1)}}
@keyframes avaTwinkle{0%,100%{opacity:.3}50%{opacity:1}}
@keyframes avaTip{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(4deg)}}
@keyframes avaConfFall{0%{transform:translateY(0) rotate(0);opacity:0}10%{opacity:1}85%{opacity:1}100%{transform:translateY(116px) rotate(340deg);opacity:0}}
@keyframes avaHop{0%{transform:scale(1)}24%{transform:scale(1.12,.88) translateY(3px)}56%{transform:scale(.93,1.09) translateY(-5px)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){
  .avaBody,.avaLids,.avaStars,.avaHat,.avaConf{animation:none}
  .avaLids{transform:scaleY(var(--lid))}
}
.brand-txt{min-width:0}
.brand-hi{font-size:13px;color:var(--text-2);line-height:1.2}
.brand-name{font-family:'Rubik',sans-serif;font-weight:600;font-size:17px;line-height:1.25}
.live{
  display:inline-flex;align-items:center;gap:7px;flex:none;
  padding:6px 12px 6px 10px;border-radius:999px;
  background:var(--surface);box-shadow:var(--shadow-s);
  font-size:12.5px;font-weight:600;color:var(--text-2);white-space:nowrap;
}
.live .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);position:relative}
.live .dot::after{
  content:"";position:absolute;inset:-4px;border-radius:50%;
  border:1.5px solid var(--ok);opacity:.5;animation:pulse 2.6s var(--ease) infinite;
}
@keyframes pulse{0%{transform:scale(.5);opacity:.6}70%,100%{transform:scale(1.25);opacity:0}}

/* ─────────────────────────  view + titles  ───────────────────────── */
.view{display:none}
.view.active{display:block}
.view.active > *{animation:rise .5s var(--ease) both;animation-delay:calc(var(--i,0) * 45ms)}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}

/* ══════════════ the first visit ══════════════
   This page is the front door, and on the very first visit it introduces
   itself instead of arriving all at once: the one question that matters — how
   do we talk — sits alone in the middle of the screen, and everything else
   comes up underneath it once that has landed.

   Three rules keep it from being the kind of intro people resent:

   · It is never a gate. Everything on screen is live from the first frame —
     tapping a channel both answers the question AND skips ahead, because
     someone who has already acted does not need to be introduced to what they
     just used. Nothing waits for an animation to be allowed to work.
   · It never runs before the page is actually there. The timers start after
     fonts have settled and one frame has painted, so on a slow connection the
     wait is spent loading rather than being counted down against a blank
     screen — otherwise the first stage would finish before anything appeared
     and the person would see the END of an animation they never watched.
   · It happens once, and reduced-motion skips it entirely.

   The classes go on the root element, not on .app: the floating tab bar is a
   SIBLING of .app, and stage 3 is precisely the moment it arrives.

   The mechanics: the whole view is offset so the channels group lands in the
   middle of the viewport (--introY, measured, because a hard-coded offset is
   only correct on one screen height), and everything below stage 1 is held
   invisible rather than removed — laying out is what makes the measurement
   possible in the first place. */
/* `intro-settled` outlives the intro itself. Dropping `intro` hands the rise
   stagger back to a view that is already fully on screen, and it plays from the
   top — the page revealing itself a second time, immediately. So the animation
   stays off for the view the intro just finished revealing, and go() clears the
   marker so every later view change animates normally. */
html.intro .view.active > *,
html.intro-settled .view.active > *{animation:none}
html.intro [data-stage]{transition:opacity .6s var(--ease),transform .6s var(--ease)}
html.intro .tabbar{
  opacity:0;transform:translateY(26px);
  transition:opacity .6s var(--ease),transform .6s var(--ease);
  pointer-events:none;
}
/* stage 1 — one question, in the middle of the page */
html.intro-1 main{transform:translateY(var(--introY,0px));transition:transform .7s var(--ease)}
html.intro-1 .title{opacity:0;transform:translateY(10px);transition:opacity .5s var(--ease),transform .5s var(--ease)}
html.intro-1 [data-stage="2"],
html.intro-1 [data-stage="3"],
html.intro-2 [data-stage="3"]{opacity:0;transform:translateY(20px)}
/* stage 2 — the question rises to where it belongs, the accounts come up */
html.intro-2 main{transform:none;transition:transform .7s var(--ease)}
html.intro-3 main{transform:none}
html.intro-3 .tabbar{opacity:1;transform:none;pointer-events:auto}
@media (prefers-reduced-motion:reduce){
  html.intro main{transform:none;transition:none}
  html.intro [data-stage],html.intro .title{opacity:1;transform:none;transition:none}
  html.intro .tabbar{opacity:1;transform:none;pointer-events:auto}
}

.title{padding:8px 2px 18px}
.title h1{font-family:'Rubik',sans-serif;font-weight:700;font-size:33px;line-height:1.12;letter-spacing:-.015em;text-wrap:balance}
.title p{margin-top:6px;color:var(--text-2);font-size:15px;max-width:52ch}

.glabel{
  font-size:12.5px;font-weight:600;color:var(--text-3);
  padding:0 14px 7px;display:flex;align-items:center;justify-content:space-between;gap:10px;
}
.glabel .hint{font-weight:500;font-size:12.5px}
.stack{display:flex;flex-direction:column;gap:26px}
.stack + .stack{margin-top:26px}

/* ─────────────────────────  grouped list  ───────────────────────── */
.group{
  background:var(--surface);border-radius:16px;
  box-shadow:var(--shadow-m);overflow:hidden;
}
.row{
  display:flex;align-items:center;gap:12px;
  padding:10px 14px;position:relative;min-height:54px;width:100%;
}
.row + .row::before,
.rowset + .rowset .row:first-child::before,
.row + .rowset .row:first-child::before{
  content:"";position:absolute;top:0;height:1px;background:var(--sep);
  inset-inline-start:60px;inset-inline-end:0;
}
.row.no-icon + .row.no-icon::before{inset-inline-start:14px}
button.row{cursor:pointer;transition:background .18s ease}
button.row:active{background:var(--bg-tint)}
.row-txt{min-width:0;flex:1}
.row-title{font-size:16.5px;font-weight:500;letter-spacing:-.005em}
.row-sub{font-size:13px;color:var(--text-2);margin-top:1px}
.row-sub.on{color:var(--ok)}
.chev{width:9px;height:15px;flex:none;color:var(--text-3);transition:transform .32s var(--spring)}
[dir="ltr"] .chev{transform:scaleX(-1)}
.row[aria-expanded="true"] .chev{transform:rotate(-90deg)}

/* icon tiles */
.tile{
  width:34px;height:34px;border-radius:9px;flex:none;
  display:grid;place-items:center;color:#fff;
  box-shadow:inset 0 0 0 .5px rgba(0,0,0,.06);
}
.tile svg{width:20px;height:20px}
.tile.google{background:#fff;box-shadow:inset 0 0 0 1px var(--sep-2)}
.tile.ms{background:#fff;box-shadow:inset 0 0 0 1px var(--sep-2)}
.tile.apple{background:#fff;color:#1B1A1F;box-shadow:inset 0 0 0 1px var(--sep-2)}
.tile.monday{background:#fff;box-shadow:inset 0 0 0 1px var(--sep-2)}
.tile.slack{background:#fff;box-shadow:inset 0 0 0 1px var(--sep-2)}
.tile.msg{background:linear-gradient(160deg,#5FA8FF,#0B6FE8)}
.tile.wa{background:linear-gradient(160deg,#4EE07B,#12A94F)}
.tile.cal{background:linear-gradient(160deg,#FF6E63,#E2382C)}
.tile.contacts{background:linear-gradient(160deg,#FFA93D,#EE7A11)}
.tile.mail{background:linear-gradient(160deg,#5FA8FF,#1E6BE0)}
.tile.notes{background:linear-gradient(160deg,#FFD84D,#F0A81B)}
.tile.files{background:linear-gradient(160deg,#5AD08A,#1FA35F)}
.citylist{max-height:46vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.citylist .row-end{font-variant-numeric:tabular-nums;color:var(--text-3);font-size:13px;margin-inline-start:auto}
.tile.call{background:var(--accent);color:#fff}
.tile.ghost{background:var(--bg-tint);color:var(--text-2);box-shadow:none}

/* ─────────────────────────  switch  ───────────────────────── */
/* The knob used to snap across in .3s, which on a phone is a jump rather
   than a movement. It now travels in .46s and stretches on the way, so the
   switch reads as a physical thing being pushed. */
.switch{
  width:51px;height:31px;border-radius:16px;flex:none;position:relative;
  background:var(--sep-2);cursor:pointer;
  transition:background var(--sw-t) var(--ease-io);
  -webkit-tap-highlight-color:transparent;
}
.switch::after{
  content:"";position:absolute;top:2px;inset-inline-start:2px;
  width:27px;height:27px;border-radius:999px;background:var(--knob);
  box-shadow:0 3px 8px rgba(0,0,0,.16),0 1px 1px rgba(0,0,0,.08);
  transform-origin:center;
  transition:transform var(--sw-t) var(--ease-io);
}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{transform:translateX(calc(-20px * var(--dirf)))}
/* Squash and stretch through the `scale` property, NOT through width.
   Width is anchored to one edge, so growing it moved the knob as well as
   stretched it — that fight with the travel transform is what made this
   look broken. `scale` is its own transform property: it composes with the
   translate instead of overwriting it, and it squashes about the centre. */
@keyframes knobTravel{
  0%{scale:1 1}
  16%{scale:.88 1.07}
  50%{scale:1.26 .93}
  78%{scale:.97 1.02}
  100%{scale:1 1}
}
.switch.moving::after{animation:knobTravel var(--sw-t) var(--ease-io)}

.connect{
  flex:none;padding:7px 16px;border-radius:999px;
  font-size:13.5px;font-weight:600;background:var(--accent);color:#fff;
  transition:transform .38s var(--squash),background .34s var(--ease-io),color .34s var(--ease-io);
}
.connect:active{transform:scale(.93)}
.connect[data-busy="1"]{background:var(--bg-tint);color:var(--text-3)}
/* Connecting used to end with the row silently swapping itself out. It now
   lands: the button collapses to a circle, draws a tick, and only then
   hands over to the opened account. */
.connect.ok{
  width:34px;height:34px;padding:0;min-width:0;display:grid;place-items:center;
  background:var(--ok);color:#fff;animation:okPop .52s var(--spring);
  transition:width .34s var(--spring),padding .34s var(--spring),
             background .34s var(--ease),opacity .3s var(--ease),transform .3s var(--spring);
}
@keyframes okPop{0%{transform:scale(.55)}58%{transform:scale(1.16)}100%{transform:scale(1)}}
.connect.ok svg{
  width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2.6;
  stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:24;stroke-dashoffset:24;animation:okDraw .34s .1s var(--ease) forwards;
}
@keyframes okDraw{to{stroke-dashoffset:0}}
.connect.ok.leaving{opacity:0;transform:scale(.4)}
.row-end{
  margin-inline-start:auto;flex:none;font-size:12.5px;font-weight:600;
  color:var(--text-3);text-align:end;
}
.row-end.on{color:var(--ok)}
.row-end.go{
  font-size:13px;font-weight:700;color:var(--accent);
  padding:4px 11px;border-radius:999px;background:var(--accent-soft);
}
.rowset.pulse{animation:rowPulse 1.8s var(--ease)}
@keyframes rowPulse{
  0%{box-shadow:0 0 0 0 var(--accent-soft)}
  18%{box-shadow:0 0 0 5px var(--accent-soft)}
  100%{box-shadow:0 0 0 0 rgba(0,0,0,0)}
}
.rowset.pulse .connect{animation:connectPing 1.8s var(--ease)}
@keyframes connectPing{0%,100%{transform:scale(1)}20%{transform:scale(1.14)}40%{transform:scale(.98)}60%{transform:scale(1.06)}}
.row-end.tiny{font-size:12.5px;font-weight:600;color:var(--text-3);font-variant-numeric:tabular-nums}
.row-end.tiny.asleep{color:var(--accent);opacity:.85}
.bdaydot{font-size:13px;margin-inline-start:4px;display:inline-block;animation:avaTip 2.4s ease-in-out infinite}
.rowset.arriving{animation:arrive .6s var(--ease)}
@keyframes arrive{
  0%{background:var(--accent-soft)}
  100%{background:transparent}
}

/* ─────────────────────────  disclosure body  ───────────────────────── */
.fold{display:grid;grid-template-rows:0fr;transition:grid-template-rows .54s var(--ease-io)}
.fold > div{overflow:hidden;min-height:0}
.fold.open{grid-template-rows:1fr}
.foldpad{padding:2px 14px 14px 14px;border-top:1px solid var(--sep)}
/* a window inside a window — same chevron row, one level in, so the
   vocabulary does not change with the depth */
.subrow{
  display:flex;align-items:center;gap:10px;width:100%;padding:12px 0 11px;
  border-top:1px solid var(--sep);margin-top:4px;
}
.subrow .row-title{flex:1;text-align:start;font-size:15px;font-weight:500}
.subrow[aria-expanded="true"] .chev{transform:rotate(-90deg)}
.subpad{padding-top:11px}
.foldpad.tight{padding-top:12px}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{transition:transform .38s var(--squash),background var(--sw-t) var(--ease-io),color var(--sw-t) var(--ease-io);
  padding:7px 13px;border-radius:999px;font-size:13.5px;font-weight:600;
  background:var(--bg-tint);color:var(--text-2);
  transition:background .2s var(--ease),color .2s var(--ease),transform .2s var(--spring);
}
.chip[aria-pressed="true"]{background:var(--accent);color:#fff}
.chip:active{transform:scale(.95)}
.chip.mini{font-size:12.5px;padding:5px 11px}

/* ── channels ──────────────────────────────────────────────────
   Side by side rather than stacked: there are only ever two or three,
   and a vertical list of one-line rows reads as settings to configure.
   These are doors — the place a conversation already lives — so they
   get the shape of app icons and sit at the very top of the page. */
.chanrow{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.chan{
  background:var(--surface);border-radius:16px;box-shadow:var(--shadow-m);
  padding:15px 8px 13px;display:flex;flex-direction:column;align-items:center;gap:9px;
  text-align:center;min-width:0;
}
.chan:active{transform:scale(.955)}
.chan .tile{width:40px;height:40px;border-radius:13px}
.chan .tile svg{width:21px;height:21px}
.chan b{font-size:13.5px;font-weight:600;letter-spacing:-.005em;white-space:nowrap}
.chan i{font-style:normal;font-size:11.5px;color:var(--text-3);line-height:1.3}
.chan.on i{color:var(--ok)}
/* Call is one of the three, not a banner: the colour lives on its icon
   tile like every other channel's does, and the card behind it is plain. */
.chan.call i{color:var(--accent)}
/* armed reads differently from idle without a second control appearing: the
   caption changes colour and the tile takes a ring, so the thing that changed
   is the thing you are about to press */
.chan.call[data-state="arming"] i{color:var(--text-3)}
.chan.call[data-state="ready"] i{color:var(--ok)}
.chan.call[data-state="ready"] .tile{box-shadow:0 0 0 3px var(--accent-soft)}
@keyframes armPulse{0%,100%{opacity:.55}50%{opacity:1}}
.chan.call[data-state="arming"] .tile{animation:armPulse 1s var(--ease-io) infinite}
.chan.call.ringing .tile svg{animation:ring 1s var(--ease) infinite}
@keyframes ring{0%,100%{transform:rotate(0)}20%{transform:rotate(-14deg)}40%{transform:rotate(12deg)}60%{transform:rotate(-8deg)}80%{transform:rotate(5deg)}}

/* what an account actually brings, shown in place instead of in a
   second summary table that repeated the same five words below it. */
/* One colour for the whole strip. App-brand gradients made it a row of
   five logos to decode; filled-vs-empty in a single colour is read as
   on-and-off at a glance, which is the only question it answers. */
.glyphs{display:flex;gap:5px;margin-top:6px}
.glyphs span{
  /* same clock as the switch that changes them, so the glyph going dim and
     the access control folding away are one gesture rather than two */
  transition:background var(--sw-t) var(--ease-io),color var(--sw-t) var(--ease-io),
             transform var(--sw-t) var(--ease-io),opacity var(--sw-t) var(--ease-io);
  width:19px;height:19px;border-radius:6px;display:grid;place-items:center;flex:none;
  background:var(--accent);color:#fff;
}
.glyphs span svg{width:11.5px;height:11.5px}
.glyphs span.off{background:var(--bg-tint);color:var(--text-3);transform:scale(.84);opacity:.55}
@keyframes glyphIn{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:none}}
.glyphs.fresh span{animation:glyphIn .42s var(--spring) backwards;animation-delay:calc(var(--i,0) * 55ms)}

/* the friend list only earns a search field once scanning it stops being
   instant; below that a permanently visible box is one more thing to read. */
.searchwrap{
  display:flex;align-items:center;gap:9px;margin-bottom:10px;
  background:var(--surface);border-radius:14px;box-shadow:var(--shadow-s);padding:0 12px;
}
.searchwrap .sicon{width:16px;height:16px;flex:none;color:var(--text-3)}
.searchwrap input{
  flex:1;min-width:0;border:0;background:none;font:inherit;font-size:15.5px;
  color:var(--text);padding:11px 0;outline:none;
}
.searchwrap input::placeholder{color:var(--text-3)}
.searchwrap input::-webkit-search-cancel-button{display:none}
.sclear{
  width:19px;height:19px;border-radius:50%;flex:none;background:var(--bg-tint);
  color:var(--text-2);font-size:10px;line-height:1;display:grid;place-items:center;
}

/* preview scaffolding — deliberately styled as a tool, not as chrome */
.langtog{
  position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 96px);inset-inline-start:14px;z-index:40;
  display:flex;padding:3px;border-radius:999px;background:var(--surface);
  box-shadow:var(--shadow-m);font-size:10.5px;font-weight:700;letter-spacing:.06em;
}
.langtog span{padding:4px 8px;border-radius:999px;color:var(--text-3);transition:background .22s var(--ease),color .22s var(--ease)}
.langtog span.on{background:var(--accent);color:#fff}
.introtog{
  position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 96px);inset-inline-start:64px;z-index:40;
  width:26px;height:26px;border-radius:999px;background:var(--surface);
  box-shadow:var(--shadow-m);color:var(--text-3);font-size:14px;line-height:1;
  display:grid;place-items:center;
}

.pushhead{display:flex;align-items:center;gap:12px;padding:6px 2px 20px}
.backbtn{
  width:36px;height:36px;border-radius:50%;flex:none;color:var(--accent);
  background:var(--surface);box-shadow:var(--shadow-s);display:grid;place-items:center;
  transition:transform .2s var(--spring);
}
.backbtn:active{transform:scale(.9)}
.backbtn svg{width:9px;height:15px;transform:scaleX(-1)}
[dir="ltr"] .backbtn svg{transform:none}
.pushhead .tile{width:44px;height:44px;border-radius:14px}
.pushtxt{min-width:0}
.pushtxt b{display:block;font-family:'Rubik',sans-serif;font-weight:700;font-size:22px;letter-spacing:-.01em}
.pushtxt span{display:block;font-size:13.5px;color:var(--text-2);margin-top:1px}

/* A value belongs beside its label, not in a box of its own that runs the
   full width with three words in it — same row, label at the start, value at
   the end. The name is an input dressed as that value, so it edits in place. */
.row-val{font-size:16.5px;color:var(--text-2);margin-inline-start:auto;white-space:nowrap}
.row-input{
  flex:1;min-width:0;border:0;background:none;font:inherit;font-size:16.5px;font-weight:500;
  color:var(--text);text-align:end;outline:none;padding:0;
}
.row-input::placeholder{color:var(--text-3)}
.row-input:focus{color:var(--accent)}
.row .row-title{flex:none}

/* Stopping Olma is one decision and its own switch, so it is a single narrow
   control in the middle of the page rather than a full-width list row that
   reads like one more setting. Pressed, it holds the paused state and says so. */
.pausewrap{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
.pausebtn{
  display:inline-flex;align-items:center;gap:9px;
  padding:11px 22px;border-radius:999px;
  background:var(--surface);box-shadow:var(--shadow-m);
  font-size:15px;font-weight:600;color:var(--text-2);white-space:nowrap;
  transition:background .28s var(--ease),color .28s var(--ease),transform .2s var(--spring);
}
.pausebtn svg{width:15px;height:15px;flex:none}
.pausebtn:active{transform:scale(.955)}
.pausebtn[aria-pressed="true"]{background:var(--warn);color:#fff;box-shadow:var(--shadow-m)}
.pausewrap .note{max-width:40ch;margin-top:12px}

/* while paused the whole app says so, not just the button that did it */
html[data-paused] .live{color:var(--warn)}
html[data-paused] .live .dot{background:var(--warn)}
html[data-paused] .live .dot::after{animation:none;opacity:0}

.note{font-size:13px;color:var(--text-2);margin-top:10px;line-height:1.5}
.linkbtn{color:var(--accent);font-weight:600;font-size:14.5px}
.linkbtn.danger{color:var(--danger)}

/* ─────────────────────────  tasks  ───────────────────────── */
.taskwrap{display:grid;grid-template-rows:1fr;transition:grid-template-rows .44s var(--ease),opacity .3s ease}
.taskwrap > .taskin{overflow:hidden;min-height:0}
/* a row on its way out stops accepting taps: the restore takes 440ms to
   animate, and a second tap inside that window would land on whichever row
   slid up into its place — putting back a task nobody asked for */
.taskwrap.gone{grid-template-rows:0fr;opacity:0;pointer-events:none}
.task{display:flex;align-items:center;gap:12px;padding:13px 14px;position:relative}
.taskwrap + .taskwrap .task::before{
  content:"";position:absolute;top:0;height:1px;background:var(--sep);
  inset-inline-start:50px;inset-inline-end:0;
}
.tick{
  width:25px;height:25px;border-radius:50%;flex:none;
  box-shadow:inset 0 0 0 1.8px var(--sep-2);
  display:grid;place-items:center;color:#fff;
  transition:box-shadow .28s var(--spring),background .28s var(--spring),transform .28s var(--spring);
}
.tick svg{width:14px;height:14px;opacity:0;transform:scale(.4);transition:opacity .2s ease,transform .34s var(--spring)}
.tick:active{transform:scale(.88)}
.task.done .tick{background:var(--accent);box-shadow:inset 0 0 0 1.8px var(--accent);transform:scale(1)}
.task.done .tick svg{opacity:1;transform:scale(1)}
.tbody{flex:1;min-width:0}
.ttitle{position:relative;display:inline;font-size:16.5px;font-weight:500;letter-spacing:-.005em;transition:color .34s ease}
.ttitle::after{
  content:"";position:absolute;inset-inline:-1px;top:52%;height:1.6px;border-radius:2px;
  background:currentColor;transform:scaleX(0);transform-origin:var(--strike-origin);
  transition:transform .36s cubic-bezier(.5,0,.2,1);
}
.task.done .ttitle{color:var(--text-3)}
.task.done .ttitle::after{transform:scaleX(1)}
.task{cursor:pointer}
.task:active{background:var(--surface-2)}
.tend{display:flex;align-items:center;gap:8px;flex:none;margin-inline-start:auto;padding-top:1px}
.tglyph{width:14px;height:14px;color:var(--text-3)}
.tglyph.bell{color:var(--warn)}
.ttime{
  font-size:13.5px;font-weight:600;color:var(--text-2);
  font-variant-numeric:tabular-nums;white-space:nowrap;
  /* "5.9 08:30" is one logical run of digits; without an isolate the RTL
     paragraph reorders it into "08:30 5.9" and the date reads as a time. */
  direction:ltr;unicode-bidi:isolate;
}
.ttime.late{color:var(--danger)}
.tsec + .tsec{margin-top:19px}
.tsec-add{margin-top:18px}
.glabel .late{color:var(--danger)}
/* ── a task shared with people ──
   Faces sit in the sentence, right after the title, not out with the time
   and the bell. Who a task belongs to is part of what it IS; when it is due
   is metadata, and the two do not belong in the same cluster. Three faces
   then a count, because a stack has to survive a fourth person. */
.faces{display:inline-flex;vertical-align:-6px;margin-inline-start:9px;flex:none}
.face{
  width:21px;height:21px;border-radius:50%;overflow:hidden;flex:none;
  box-shadow:0 0 0 1.8px var(--surface);
}
.face + .face{margin-inline-start:-7px}
.face.more{
  display:grid;place-items:center;background:var(--bg-tint);color:var(--text-2);
  font-size:10px;font-weight:700;letter-spacing:-.02em;
  /* "+1" is arithmetic, not prose: left to the paragraph's direction it
     reorders to "1+" in Hebrew */
  direction:ltr;
}
#arcGroup .face{box-shadow:0 0 0 1.8px var(--surface-2)}

/* ── a task that is a list ──
   The pill IS the progress bar: it fills left-to-right in step with the
   count it shows, so one small object answers "how many" and "how far"
   at once instead of a number beside a bar. */
.tcount{
  font-size:11.5px;font-weight:700;font-variant-numeric:tabular-nums;
  padding:3.5px 9px;border-radius:999px;color:var(--accent);flex:none;direction:ltr;
  background:linear-gradient(to right,var(--prog) var(--p,0%),transparent var(--p,0%));
  box-shadow:inset 0 0 0 1px var(--accent-soft);
  transition:background .5s var(--ease-io);
}
[dir="rtl"] .tcount{background:linear-gradient(to left,var(--prog) var(--p,0%),transparent var(--p,0%))}
.tcount.full{background:var(--prog)}

/* the checklist inside the editor. It scrolls on its own so a long list can
   never make the sheet itself scroll — the one rule this editor has. Five
   items fit; past that the scroll line at its foot says so. */
.listbox{max-height:232px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.litem{display:flex;align-items:center;gap:11px;padding:9px 14px;position:relative}
.litem + .litem::before{
  content:"";position:absolute;top:0;inset-inline-start:47px;inset-inline-end:0;
  height:1px;background:var(--sep);
}
.lbox{
  width:21px;height:21px;flex:none;border-radius:7px;display:grid;place-items:center;
  box-shadow:inset 0 0 0 1.7px var(--sep-2);color:#fff;
  transition:background var(--sw-t) var(--ease-io),box-shadow var(--sw-t) var(--ease-io),
             transform .38s var(--squash);
}
.lbox svg{width:12px;height:12px;opacity:0;transform:scale(.4);
  transition:opacity .22s ease,transform .36s var(--squash)}
.lbox:active{transform:scale(.86)}
.litem.on .lbox{background:var(--accent);box-shadow:inset 0 0 0 1.7px var(--accent)}
.litem.on .lbox svg{opacity:1;transform:none}
/* The strike belongs to the WORDS, not to the column they sit in — so the
   line rides an inline span that hugs the text, the same way a finished
   task's title does one level up. */
.ltext{flex:1;min-width:0;font-size:15.5px;transition:color .34s ease}
.ltext i{position:relative;font-style:normal}
.ltext i::after{
  content:"";position:absolute;top:53%;inset-inline:-1px;height:1.3px;background:currentColor;
  border-radius:2px;transform:scaleX(0);transform-origin:var(--strike-origin);
  transition:transform .42s var(--ease-io);
}
.litem.on .ltext{color:var(--text-3)}
.litem.on .ltext i::after{transform:scaleX(1)}
.lrm{
  width:24px;height:24px;flex:none;border-radius:8px;display:grid;place-items:center;
  color:var(--text-3);opacity:0;transition:opacity .3s var(--ease-io),background .3s var(--ease-io);
}
.litem:hover .lrm,.litem:focus-within .lrm{opacity:1}
.lrm:active{background:var(--bg-tint)}
.lrm svg{width:11px;height:11px}
@keyframes itemIn{
  0%{opacity:0;transform:translateY(-8px) scaleY(.7)}
  62%{opacity:1;transform:translateY(1px) scaleY(1.04)}
  100%{opacity:1;transform:none}
}
.litem.fresh{animation:itemIn .46s var(--ease-io)}
.additem{text-align:start}
.additemrow{padding-top:4px}

/* who a shared task belongs to, spelled out inside the editor */
.sperson{display:flex;align-items:center;gap:11px;padding:8px 0}
.sperson .face{width:30px;height:30px;box-shadow:none}
.sperson b{font-size:15px;font-weight:500;flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sperson u{
  text-decoration:none;font-size:11.5px;font-weight:600;color:var(--text-3);
  background:var(--bg-tint);padding:3px 8px;border-radius:999px;flex:none;
}
/* Removing somebody is done where they are named, not by hunting for their
   chip in the picker below. Only the person who opened the task gets these:
   taking someone off a task that is not yours is not your call, and a button
   that would be refused by the server has no business being drawn. */
.sperson .spx{
  width:27px;height:27px;flex:none;border-radius:9px;display:grid;place-items:center;
  color:var(--text-3);
  transition:background var(--sw-t) var(--ease-io),color var(--sw-t) var(--ease-io),
             transform .38s var(--squash);
}
.sperson .spx svg{width:11px;height:11px}
.sperson .spx:active{background:var(--danger-soft);color:var(--danger);transform:scale(.86)}

/* putting a finished task back is one tap, and it lives on the row itself */
.tundo{
  width:30px;height:30px;flex:none;border-radius:10px;display:grid;place-items:center;
  color:var(--text-3);transition:background .32s var(--ease-io),color .32s var(--ease-io),transform .4s var(--squash);
}
.tundo svg{width:15px;height:15px}
.tundo:active{background:var(--accent-soft);color:var(--accent);transform:scale(.88)}
[dir="ltr"] .tundo svg{transform:scaleX(-1)}
.arcnote{font-size:12.5px;color:var(--text-3);padding:10px 4px 0;text-align:center}

.tick.done-static{background:var(--sep-2);box-shadow:none;color:var(--surface)}
.tick.done-static svg{opacity:1;transform:none}
.tmeta{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.pill{
  display:inline-flex;align-items:center;gap:5px;
  padding:3.5px 9px 3.5px 8px;border-radius:8px;
  font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums;
  background:var(--bg-tint);color:var(--text-2);
}
.pill svg{width:12px;height:12px}
.pill.bell{background:var(--warn-soft);color:var(--warn)}
.pill.due{background:var(--accent-soft);color:var(--accent)}
.pill.late{background:var(--danger-soft);color:var(--danger)}
.tedit{
  flex:none;width:30px;height:30px;border-radius:50%;margin-top:0;
  display:grid;place-items:center;color:var(--text-3);
  transition:background .18s ease,color .18s ease;
}
.tedit:hover{background:var(--bg-tint);color:var(--text-2)}
.tedit svg{width:17px;height:17px}

.addrow{
  display:flex;align-items:center;gap:12px;padding:13px 14px;width:100%;
  color:var(--accent);font-weight:600;font-size:16px;
  transition:background .18s ease;
}
.addrow:active{background:var(--bg-tint)}
.addrow .plus{
  width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;
  display:grid;place-items:center;flex:none;
}
.addrow .plus svg{width:14px;height:14px}

/* A dead end that offers the way out. Nothing here is a failure state — the
   person simply has no address book connected yet — so it reads as an
   invitation with one button, not as an error with an apology. */
.emptybig{
  display:flex;flex-direction:column;align-items:center;gap:10px;
  padding:26px 24px 30px;text-align:center;
}
.emptybig .ebicon{
  width:46px;height:46px;border-radius:16px;display:grid;place-items:center;flex:none;
  background:var(--bg-tint);color:var(--text-3);margin-bottom:2px;
}
.emptybig .ebicon svg{width:22px;height:22px}
.emptybig b{font-size:17px;font-weight:650;letter-spacing:-.01em}
.emptybig p{font-size:14.5px;color:var(--text-3);line-height:1.5;max-width:30ch}
.emptybig .btn{margin-top:6px}

/* one contact, one action — the button IS the row's end, so the whole row
   stays a single tap target for the common case */
.cnrow{display:flex;align-items:center;gap:12px;padding:11px 14px;width:100%}
.cnrow .face{width:32px;height:32px;border-radius:50%;overflow:hidden;flex:none}
.cnrow .face svg{width:100%;height:100%;display:block}
.cnrow .cntxt{flex:1;min-width:0;text-align:start}
.cnrow .cnname{font-size:15.5px;font-weight:550;letter-spacing:-.01em}
.cnrow .cnnum{
  font-size:12.5px;color:var(--text-3);font-variant-numeric:tabular-nums;direction:ltr;
}
.cninv{
  flex:none;padding:6px 13px;border-radius:999px;font-size:13px;font-weight:600;
  background:var(--accent-soft);color:var(--accent);
  transition:background var(--sw-t) var(--ease-io),color var(--sw-t) var(--ease-io),
             transform .3s var(--squash);
}
.cninv:active{transform:scale(.94)}
.cnrow.sent .cninv{background:transparent;color:var(--ok);pointer-events:none}
.cnrow.sent .cnname{color:var(--text-3)}

/* ── meeting coordination ──
   The grid is the one place in this design that is genuinely tabular, so it is
   laid out as a grid and not as rows of chips: the columns have to line up
   across days or the density is unreadable. */
.mtgrid{
  display:grid;grid-template-columns:auto repeat(4,1fr);
  gap:5px;padding:12px 12px 14px;
}
.mtgrid .mth{
  font-size:11px;font-weight:650;letter-spacing:.02em;color:var(--text-3);
  text-align:center;padding-bottom:2px;
}
.mtgrid .mtd{
  display:flex;flex-direction:column;justify-content:center;
  padding-inline-end:8px;min-width:52px;
}
.mtgrid .mtd b{font-size:13.5px;font-weight:650;letter-spacing:-.01em;line-height:1.2}
.mtgrid .mtd span{font-size:11px;color:var(--text-3);font-variant-numeric:tabular-nums}
/* One cell carries two facts: whether I said yes (the fill) and how many of us
   did (the number). Keeping them in one object is what lets somebody mark and
   read in the same glance instead of cross-referencing two tables. */
.mtcell{
  position:relative;height:42px;border-radius:12px;overflow:hidden;
  background:var(--bg-tint);
  display:grid;place-items:center;
  font-size:12.5px;font-weight:650;color:var(--text-3);
  font-variant-numeric:tabular-nums;
  transition:background var(--sw-t) var(--ease-io),color var(--sw-t) var(--ease-io),
             transform .3s var(--squash);
}
.mtcell:active{transform:scale(.93)}
.mtcell.mine{background:var(--accent);color:#fff}
/* everyone free is worth seeing before you read the number */
.mtcell.full{box-shadow:inset 0 0 0 1.5px var(--ok)}
.mtcell.mine.full{box-shadow:inset 0 0 0 1.5px #fff}
.mtcell .fill{
  position:absolute;inset-inline-start:0;bottom:0;width:100%;
  background:var(--accent-soft);
  height:var(--h,0%);
  transition:height var(--sw-t) var(--ease-io);
}
.mtcell.mine .fill{background:rgba(255,255,255,.22)}
.mtcell b{position:relative;z-index:1}
.mtallrow{display:flex;gap:6px;padding:0 12px 14px}
.mtallrow .chip{flex:1;justify-content:center}

.mtfaces{display:flex;flex-wrap:wrap;gap:6px;padding:6px 14px 2px}
.mtface{
  display:flex;align-items:center;gap:6px;padding:4px 10px 4px 4px;border-radius:999px;
  background:var(--bg-tint);font-size:12.5px;font-weight:600;color:var(--text-3);
}
.mtface .face{width:22px;height:22px;border-radius:50%;overflow:hidden;flex:none}
.mtface .face svg{width:100%;height:100%;display:block}
.mtface.said{color:var(--ok)}
.mtface.said .face{box-shadow:0 0 0 1.5px var(--ok)}

/* The answer, ranked. The top row is the recommendation and looks like one;
   the runners-up are there because a recommendation you cannot compare against
   anything is just an instruction. */
.mtopt{
  display:flex;align-items:center;gap:12px;padding:12px 14px;width:100%;text-align:start;
  border-bottom:.5px solid var(--sep);
}
.mtopt:last-child{border-bottom:0}
.mtopt .mtrank{
  width:26px;height:26px;border-radius:9px;flex:none;display:grid;place-items:center;
  background:var(--bg-tint);color:var(--text-3);font-size:12.5px;font-weight:700;
  font-variant-numeric:tabular-nums;
}
.mtopt.top .mtrank{background:var(--accent);color:#fff}
.mtopt .mtwhen{flex:1;min-width:0}
.mtopt .mtwhen b{display:block;font-size:15.5px;font-weight:600;letter-spacing:-.01em}
.mtopt .mtwhen span{display:block;font-size:12.5px;color:var(--text-3);margin-top:1px}
.mtopt.top .mtwhen span{color:var(--ok)}
.mtopt .mtgo{
  flex:none;padding:6px 13px;border-radius:999px;font-size:13px;font-weight:600;
  background:var(--accent-soft);color:var(--accent);
}
.mtopt.done{opacity:.55}
.mtopt.done .mtgo{background:transparent;color:var(--ok);pointer-events:none}

/* A card in the list, before you open it. */
.mtcard{
  display:flex;align-items:center;gap:12px;padding:13px 14px;width:100%;text-align:start;
}
.mtcard .mtbody{flex:1;min-width:0}
.mtcard .mtname{font-size:16px;font-weight:600;letter-spacing:-.012em}
.mtcard .mtstate{font-size:12.5px;color:var(--text-3);margin-top:2px}
.mtcard .mtstate.ready{color:var(--ok);font-weight:600}
.mtcard .chev{width:15px;height:15px;flex:none;color:var(--text-3)}

/* ── imported tasks ──
   The logo is small and monochrome-adjacent on purpose: it is a provenance
   mark, not a brand placement, and five different brand colours down one list
   would read as five different kinds of task. */
.srcmark{
  width:17px;height:17px;flex:none;border-radius:5px;
  display:inline-grid;place-items:center;vertical-align:-3px;
  margin-inline-end:7px;background:var(--bg-tint);
}
.srcmark svg{width:11px;height:11px;color:var(--text-2)}
.srcline{
  display:flex;align-items:center;gap:0;padding:0 14px 12px;margin-top:-4px;
  font-size:13px;color:var(--text-3);
}
.tsec.imported .glabel .cdot{opacity:.6}

/* A field the source cannot hold. Dimmed AND inert — the row stays so the
   person can see the field exists, and cannot press it so they never get a
   change that silently would not survive the next sync. */
.row.locked,.vchip.locked{opacity:.42;cursor:default}
.row.locked .chev{opacity:.4}

.empty{padding:30px 18px;text-align:center;color:var(--text-3);font-size:14.5px}

/* ── one row, three answers ──
   Date, clock and all-day sit as values on the "when" row. Each is its own
   target, and the ones that make no sense yet are simply absent rather than
   present-and-disabled. */
.whenrow{align-items:center;gap:12px}
.whenrow .row-title{flex:none}
.whenvals{display:flex;align-items:center;gap:6px;margin-inline-start:auto;flex-wrap:wrap;justify-content:flex-end}
.vchip{
  padding:5.5px 11px;border-radius:999px;background:var(--bg-tint);color:var(--text-2);
  font-size:14px;font-weight:600;white-space:nowrap;
  transition:background .34s var(--ease-io),color .34s var(--ease-io),transform .38s var(--squash);
}
.vchip.set{color:var(--text)}
.vchip:active{transform:scale(.94)}
.vchip.toggle{box-shadow:inset 0 0 0 1.4px var(--sep-2);background:transparent;color:var(--text-3)}
.vchip.toggle[aria-checked="true"]{background:var(--accent);color:#fff;box-shadow:none}
@keyframes chipPop{0%{transform:scale(1)}38%{transform:scale(.93)}100%{transform:scale(1)}}
.vchip.pop{animation:chipPop .38s var(--ease-io)}
.autotag{
  font-size:11px;font-weight:600;color:var(--accent);background:var(--accent-soft);
  padding:2.5px 8px;border-radius:999px;flex:none;margin-inline-start:8px;
}
.chip.cat{display:inline-flex;align-items:center}
.chip.cat[aria-pressed="true"] .cdot{box-shadow:0 0 0 1.6px rgba(255,255,255,.85)}

/* every friend as a chip; the pressed ones are the people on the task, so
   sharing and un-sharing are one gesture rather than two screens */
.peoplepick{display:flex;flex-wrap:wrap;gap:7px}
.pchip{
  display:inline-flex;align-items:center;gap:7px;padding:4px 12px 4px 4px;
  border-radius:999px;background:var(--bg-tint);color:var(--text-2);
  font-size:13.5px;font-weight:600;
  transition:background var(--sw-t) var(--ease-io),color var(--sw-t) var(--ease-io),
             transform .38s var(--squash);
}
[dir="rtl"] .pchip{padding:4px 4px 4px 12px}
.pchip .face{width:24px;height:24px;box-shadow:none}
.pchip:active{transform:scale(.95)}
.pchip[aria-pressed="true"]{background:var(--accent);color:#fff}
.pchip[aria-pressed="true"] .face{box-shadow:0 0 0 1.6px rgba(255,255,255,.6)}

/* the category's colour, small enough to be a mark rather than a badge */
.cdot{
  width:7px;height:7px;border-radius:50%;display:inline-block;flex:none;
  margin-inline-end:8px;vertical-align:1px;
}
.glabel .cdot{vertical-align:0;margin-inline-end:6px}
/* the two ways of reading the list, and nothing else on the row */
.viewrow{display:flex;justify-content:flex-end;margin:-6px 4px 12px}
.seg.mini{flex:none;padding:2.5px;border-radius:10px;gap:2px}
.seg.mini button{flex:none;padding:5px 12px;font-size:13px;border-radius:8px}
@keyframes stackSwap{
  0%{opacity:0;transform:translateY(7px)}
  100%{opacity:1;transform:none}
}
.stack.swap{animation:stackSwap .42s var(--ease-io)}

/* archive – deliberately quiet */
.archive{margin-top:34px;opacity:.72;transition:opacity .3s ease}
.archive:hover,.archive.open{opacity:1}
.arcbtn{
  display:flex;align-items:center;gap:9px;width:100%;padding:11px 4px;
  color:var(--text-3);font-size:14px;font-weight:600;
}
.archive.open .arcbtn .chev{transform:rotate(-90deg)}
#arcGroup .task{opacity:.7}
#arcGroup .ttitle{color:var(--text-3)}
#arcGroup .pill{background:transparent;padding-inline:0;color:var(--text-3);font-weight:500}

/* ─────────────────────────  calendar peek  ───────────────────────── */
/* the week strip never said which month it was in — a date with no month
   is only readable if you already know the answer */
.stripmonth{
  display:flex;align-items:baseline;gap:7px;padding:13px 16px 10px;
  border-bottom:1px solid var(--sep);
}
.stripmonth span:first-child{font-family:'Rubik',sans-serif;font-size:15.5px;font-weight:600;color:var(--text)}
.stripmonth span:last-child{font-size:13px;font-weight:500;color:var(--text-3);font-variant-numeric:tabular-nums}
.daystrip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;padding:12px 10px}
.day{
  border-radius:13px;padding:9px 2px 8px;text-align:center;
  transition:background .24s var(--ease),color .24s var(--ease),transform .24s var(--spring);
}
.day .dn{font-size:11.5px;font-weight:600;color:var(--text-3)}
.day .dd{font-family:'Rubik',sans-serif;font-size:17px;font-weight:600;margin-top:2px;font-variant-numeric:tabular-nums}
.day .dots{display:flex;justify-content:center;gap:3px;margin-top:5px;height:4px}
.day .dots i{width:4px;height:4px;border-radius:50%;background:var(--text-3);display:block}
.day[aria-selected="true"]{background:var(--accent);color:#fff}
.day[aria-selected="true"] .dn{color:rgba(255,255,255,.8)}
.day[aria-selected="true"] .dots i{background:rgba(255,255,255,.85)}
.day:not([aria-selected="true"]):active{background:var(--bg-tint);transform:scale(.94)}

.ev{display:flex;gap:12px;padding:12px 14px;position:relative;align-items:flex-start}
.ev + .ev::before{content:"";position:absolute;top:0;height:1px;background:var(--sep);inset-inline-start:76px;inset-inline-end:0}
.evtime.allday{font-size:12px;line-height:1.3;white-space:normal}
.evtime{
  width:52px;flex:none;font-variant-numeric:tabular-nums;
  font-size:13.5px;font-weight:600;color:var(--text-2);line-height:1.35;
}
.evtime small{display:block;font-weight:500;color:var(--text-3);font-size:12.5px}
.evbar{width:3.5px;border-radius:3px;flex:none;align-self:stretch;min-height:34px}
.evtitle{font-size:16px;font-weight:500}
.evsub{font-size:13px;color:var(--text-2);margin-top:2px}
/* a task standing in the day alongside real calendar events, and openable
   from here — the same task, not a copy of it */
.ev[data-task]{cursor:pointer;border-radius:14px}
.ev[data-task] .evtitle{display:flex;align-items:center;gap:7px}
.evtag{
  font-size:10.5px;font-weight:700;letter-spacing:.04em;padding:2px 7px;border-radius:999px;
  background:var(--accent-soft);color:var(--accent);flex:none
}
@keyframes evLand{
  0%{box-shadow:0 0 0 0 var(--accent-soft)}
  38%{box-shadow:0 0 0 9px var(--accent-soft)}
  100%{box-shadow:0 0 0 0 rgba(0,0,0,0)}
}
.ev.landing{animation:evLand .9s var(--ease)}
.ev.pressed{transform:scale(.972);transition:transform .18s var(--spring)}
/* the way back out of the list: one glyph, on the rows that have a day */
.tjump{
  width:26px;height:26px;flex:none;border-radius:9px;display:grid;place-items:center;
  color:var(--text-3);transition:background .3s var(--ease-io),color .18s var(--ease)
}
.tjump svg{width:15px;height:15px}
.tjump:active{background:var(--accent-soft);color:var(--accent)}

.bigbtn{
  display:flex;align-items:center;justify-content:center;gap:9px;width:100%;
  padding:15px;border-radius:16px;background:var(--surface);
  box-shadow:var(--shadow-m);color:var(--accent);font-weight:600;font-size:16px;
  transition:transform .22s var(--spring),background .18s ease;
}
.bigbtn:active{transform:scale(.98);background:var(--bg-tint)}
.bigbtn svg{width:17px;height:17px}

/* ─────────────────────────  friends  ───────────────────────── */
.fav{
  width:38px;height:38px;border-radius:50%;flex:none;overflow:hidden;
  box-shadow:inset 0 0 0 .5px rgba(0,0,0,.08);
}

/* The read/write choice sits inside the service it governs, so there is
   never a question of what it applies to. It appears only when that service
   is on and only where writing is actually possible; everything else states
   plainly that it is read-only rather than offering a control with one answer. */
.accseg{display:inline-flex;align-items:stretch;gap:2px;padding:2px;border-radius:999px;background:var(--bg-tint);flex:none}
/* ── a mark instead of a caption ──
   The paragraph under the list used two sentences to say that writing
   includes reading. The control can say it itself: choosing כתיבה fades an
   ampersand in between the two words so the pair reads as one phrase —
   קריאה & כתיבה — and fades it back out the same way when only reading is
   granted. A caption is read once and never again; a mark that appears
   exactly where the answer is only has to be read once. */
.accseg .amp{
  width:0;overflow:hidden;flex:none;display:grid;place-items:center;
  font-size:12.5px;font-weight:700;color:var(--accent);opacity:0;
  transition:width var(--sw-t) var(--ease-io),opacity var(--sw-t) var(--ease-io),
             margin var(--sw-t) var(--ease-io);
}
/* Centred between the two BOXES it read as glued to the pill, because on one
   side it meets a hard filled edge 2px away and on the other a word 16px away.
   The margin is on the pill's side only — a painted edge needs more clearance
   than a letter does, and `.both` is the one state where which side is which
   is known: it is always the write pill. */
.accseg.both .amp{width:12px;opacity:1;margin-inline-end:6px}
/* reading is included, so its label leans to the accent without taking the
   pill — the pill still says which word you would tap to change things */
.accseg.both .mread{color:var(--accent)}
.accseg button{
  transition:background var(--sw-t) var(--ease-io),color var(--sw-t) var(--ease-io),
             box-shadow var(--sw-t) var(--ease-io);
}
.accseg button{
  font:inherit;font-size:12px;font-weight:600;line-height:1;padding:6px 12px;border-radius:999px;
  color:var(--text-2);white-space:nowrap;
  transition:background .24s var(--ease),color .24s var(--ease);
}
.accseg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:var(--shadow-s)}
.accseg button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.readonly{font-style:normal;font-size:12px;font-weight:600;color:var(--text-3);flex:none;white-space:nowrap}
/* title, what it governs, and the access choice all sit on one line: the
   control belongs beside the thing it applies to, not on a line below it
   where it read as a separate setting. */
/* the friends card still uses plain rows — one switch, no access control */
.permrow{display:flex;align-items:center;gap:12px;padding:11px 0}
.permrow .permtxt{flex:1;min-width:0}
/* Sharing a task with somebody is the thing the permission is FOR, so the
   way to do it sits on the permission's own row — and it comes and goes with
   the switch, on the same clip-path open/shut as the access control in
   Connections. An offer that outlives the permission it depends on would be
   an offer that fails when tapped. */
.permact{
  width:31px;height:31px;flex:none;border-radius:11px;display:grid;place-items:center;
  background:var(--accent-soft);color:var(--accent);
  transition:transform .38s var(--squash),background var(--sw-t) var(--ease-io);
}
.permact svg{width:16px;height:16px}
.permact:active{transform:scale(.88)}
.permact.opening{animation:segOpen var(--sw-t) var(--ease-io) backwards}
.permact.shutting{animation:segShut var(--sw-t) var(--ease-io) forwards}
.permrow + .permrow{border-top:1px solid var(--sep)}
/* no column-gap: the separator is drawn on the cells themselves, and a gap
   would break the line into three pieces */
.permgrid{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center}
.permgrid > *{padding:11px 0}
.permtxt,.permctl{padding-inline-end:12px}
.permgrid > *:nth-child(n+4){border-top:1px solid var(--sep)}
.permtxt{min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:1px}
.permctl{display:flex;justify-content:flex-end;min-height:31px;align-items:center}
.permsw{display:flex;justify-content:flex-end}
/* opens from its own middle, both halves parting at once, and closes back
   into it — the control belongs to the switch that just turned it on */
@keyframes segOpen{
  0%{clip-path:inset(0 50% 0 50% round 999px);opacity:0;transform:scaleY(.7)}
  60%{opacity:1}
  100%{clip-path:inset(0 0 0 0 round 999px);opacity:1;transform:none}
}
/* Closing ran at .62 of the opening and read as a different gesture. It is
   the same movement backwards, so it is now the exact mirror: same clock,
   and the opacity ramp reflected (open holds until 60%, shut fades after
   40%) instead of being a flat fade. */
@keyframes segShut{
  0%{clip-path:inset(0 0 0 0 round 999px);opacity:1;transform:none}
  40%{opacity:1}
  100%{clip-path:inset(0 50% 0 50% round 999px);opacity:0;transform:scaleY(.7)}
}
.permctl .accseg,.permctl .readonly{animation:segOpen var(--sw-t) var(--ease-io) backwards}
.permctl.shutting .accseg,.permctl.shutting .readonly{
  animation:segShut var(--sw-t) var(--ease-io) forwards
}
.permtxt b,.permtxt span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.permtxt b{font-size:15px;font-weight:500}
.permtxt span{font-size:12.5px;color:var(--text-2)}

/* ─────────────────────────  form fields  ───────────────────────── */
.field{display:flex;align-items:center;gap:12px;padding:10px 14px;position:relative;min-height:52px}
.field + .field::before{content:"";position:absolute;top:0;height:1px;background:var(--sep);inset-inline-start:14px;inset-inline-end:0}
.field label{width:104px;flex:none;font-size:15.5px;color:var(--text-2)}
[dir="ltr"] .field label{width:128px}
.field input{
  flex:1;min-width:0;border:0;background:none;font-size:16.5px;font-weight:500;
  padding:4px 0;color:var(--text);
}
.field input::placeholder{color:var(--text-3);font-weight:400}
.field input[type="date"],.field input[type="time"]{
  flex:1;direction:ltr;text-align:right;
  font-variant-numeric:tabular-nums;
}
[dir="ltr"] .field input[type="date"],[dir="ltr"] .field input[type="time"]{flex:none;width:auto;text-align:left}
.field input[type="date"]::-webkit-calendar-picker-indicator,
.field input[type="time"]::-webkit-calendar-picker-indicator{opacity:.45;cursor:pointer}
/* boxed form grid — short inputs sized to their content, not stretched
   edge to edge; used on the profile card and inside the task sheet */
.fpad{padding:16px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.ffield{display:flex;flex-direction:column;gap:7px;min-width:0}
.ffield.wide{grid-column:1/-1}
.ffield > label{
  font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:var(--text-3);
}
.ffield > input,.ffield > .dateval{
  width:100%;box-sizing:border-box;font:inherit;font-size:16px;font-weight:500;
  color:var(--text);background:var(--surface-2);border:1px solid var(--sep);
  border-radius:13px;padding:11px 13px;
  transition:border-color .2s var(--ease),box-shadow .2s var(--ease),background .2s var(--ease);
}
.ffield > input::placeholder{color:var(--text-3);font-weight:400}
.ffield > input:focus{
  outline:none;border-color:var(--accent);background:var(--surface);
  box-shadow:0 0 0 4px var(--accent-soft);
}
/* Chrome forces direction:ltr on date/time inputs, so text-align is the only
   lever that keeps their value on the same edge as every other field's. */
.ffield > input[type="date"],.ffield > input[type="time"]{
  font-variant-numeric:tabular-nums;text-align:right;padding-inline-end:8px;
}
[dir="ltr"] .ffield > input[type="date"],[dir="ltr"] .ffield > input[type="time"]{
  text-align:left;padding-inline-end:13px;
}
.ffield > input[type="date"]::-webkit-calendar-picker-indicator,
.ffield > input[type="time"]::-webkit-calendar-picker-indicator{opacity:.45;cursor:pointer}
.ffield > .dateval{text-align:start;display:block}
.ffield .seg{width:100%}
.seg{
  display:flex;gap:3px;padding:3px;border-radius:11px;background:var(--bg-tint);
  flex:1;
}
.seg button{
  flex:1;padding:7px 4px;border-radius:8.5px;font-size:14.5px;font-weight:600;
  color:var(--text-2);
  transition:background var(--sw-t) var(--ease-io),color var(--sw-t) var(--ease-io),
             box-shadow var(--sw-t) var(--ease-io);
}
.seg button[aria-pressed="true"]{
  background:var(--seg-on);background-image:var(--sheen);color:var(--text);
  box-shadow:var(--shadow-s),var(--rim);
}

/* where Olma reaches YOU — a second question from "where do I open her",
   so it gets its own row rather than a fourth state on the tiles */
.defrow .defhead{padding-bottom:6px}
.defrow .defpick{padding-top:0}
.defrow .row-sub{color:var(--accent);font-weight:600}
/* ── the one word that changed ──
   Re-typing the whole sentence made the reader re-read a line they had
   already read. Only the channel's name is new, so only it moves: the old
   name falls away downward while the new one arrives from above, on the
   switch's clock. The hidden twin in normal flow is what holds the slot's
   width, so nothing around it reflows mid-movement. */
.wordslot{
  position:relative;display:inline-block;vertical-align:bottom;
  overflow:hidden;padding-block:2px;margin-block:-2px;
}
/* `wnow`/`wout`, not `live`/`out`: `.live` is already the header's activity
   pill, and its padding and font-size landed on this the moment the names
   collided — no specificity fight, just two rules setting different things. */
.wordslot i{font-style:normal;display:inline-block;white-space:nowrap;padding:0;font-size:inherit}
.wordslot i.wghost{visibility:hidden}
.wordslot i.wnow,.wordslot i.wout{position:absolute;inset-inline-start:0;top:2px}

.defseg{flex:1}

/* The fill arrives from the middle of the chip and opens outward — the same

/* ─────────────────────────  tab bar  ───────────────────────── */
.tabbar{
  position:fixed;bottom:18px;inset-inline:0;margin-inline:auto;
  width:max-content;max-width:calc(100% - 24px);
  display:flex;gap:2px;padding:6px;border-radius:24px;z-index:60;
  background:var(--bar);border:.5px solid var(--glass-line);
  /* Its own lens, not the shared one: LESS blur and MORE saturation than a
     card, which is what makes the bar answer to whatever scrolls under it —
     colours and shapes stay recognisable through it instead of being ground
     down into an even wash. */
  -webkit-backdrop-filter:var(--lens-bar);
  backdrop-filter:var(--lens-bar);
  box-shadow:var(--shadow-m),var(--rim-soft);
}
/* The pill travelled at a constant shape, which reads as a rectangle being
   moved. Stretching it along its direction of travel and letting it settle
   is what makes it read as one liquid thing following your finger. */
.tabpill{
  position:absolute;top:6px;height:calc(100% - 12px);border-radius:18px;overflow:hidden;
  background:var(--accent-soft);z-index:0;
  box-shadow:0 2px 10px rgba(0,0,0,.10),var(--rim-soft);
  transform-origin:50% 50%;
  transition:transform .58s var(--ease-io),width .58s var(--ease-io),
             scale .42s var(--ease-io),transform-origin 0s;

/* Two things made one direction read as a hop backwards. The stretch was
   centred, so half of it grew AGAINST the travel; and it relaxed on --squash,
   an overshoot curve, so the trailing edge shot past its mark and came back —
   which is exactly what a bounce looks like. Now the origin is pinned to the
   LEADING edge, so the pill only ever smears out behind itself, and it
   relaxes on the same ease it travels with. */
.tabpill.travel{scale:var(--sx,1.12) .92;transform-origin:var(--tox,50%) 50%}
/* The origin has to outlive the stretch. Drop it the moment `.travel` goes and
   the origin snaps back to centre while `scale` is still on its way home — which
   moves the painted box by half the leftover stretch, instantly, mid-travel.
   That is a hop, and it is the one you can see. `.relax` holds the origin until
   the scale is genuinely 1, where moving it costs nothing. */
.tabpill.relax{transform-origin:var(--tox,50%) 50%}
/* Light sliding across the lens as it moves. This is the one thing that
   makes the pill read as glass rather than as a coloured rectangle that
   changed position, so it gets its own class and its own clock — the
   stretch settles early on purpose, the light does not. */

  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(105deg,transparent 34%,rgba(255,255,255,.55) 50%,transparent 66%);
  opacity:0;
}
/* --sd is the direction the pill is ACTUALLY travelling, not the direction
   the language reads in. Light that slides against the movement is what made
   one of the two directions look wrong; scaleX flips the streak's lean with
   it, so both directions are the same gesture mirrored. */

  0%{opacity:0;transform:translateX(calc(-70% * var(--sd,1))) scaleX(var(--sd,1))}

/* ─────────────────────────  sheet  ───────────────────────── */
.scrim{
  position:fixed;inset:0;z-index:80;background:rgba(12,11,17,.42);
  -webkit-backdrop-filter:blur(9px) saturate(140%);backdrop-filter:blur(9px) saturate(140%);
  opacity:0;pointer-events:none;transition:opacity .44s var(--ease-io);
}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;z-index:81;bottom:0;inset-inline:0;margin-inline:auto;
  width:min(500px,100%);
  background:var(--glass-panel);border-radius:26px 26px 0 0;
  -webkit-backdrop-filter:var(--lens);backdrop-filter:var(--lens);
  padding:10px 18px calc(24px + env(safe-area-inset-bottom));
  transform:translateY(102%);transition:transform .56s var(--ease-io);
  box-shadow:var(--shadow-l),var(--rim);max-height:92vh;overflow-y:auto;
}

/* ── the top edge is a handle ──
   Five pixels of ribbon cannot be caught with a thumb, so the whole strip
   above the title is the grab area. `touch-action:none` or the browser
   scrolls the sheet's contents instead of moving the sheet. */
.sgrab{
  display:block;width:100%;padding:6px 0 13px;margin-top:-6px;cursor:grab;
  touch-action:none;-webkit-tap-highlight-color:transparent;
}
.grabber{
  display:block;width:38px;height:5px;border-radius:3px;background:var(--sep-2);margin:0 auto;
  transition:background var(--sw-t) var(--ease-io),width var(--sw-t) var(--ease-io);
}

.sheet.dragging .sgrab{cursor:grabbing}

.scrim.dragging{transition:none}

   already moving, rather than easing out of a gesture the hand finished */
.sheet.flick{transition:transform .3s cubic-bezier(.36,0,.68,.1)}

/* ── "there is more below" ──
   A sheet and the checklist inside it can each outgrow their box, and a hard
   edge at the cut reads as a rendering fault rather than as a list carrying
   on. One line answers it in both places: it lights up only when there is
   somewhere to scroll, and the bright part is how much of the whole you are
   looking at, and where. It rides a zero-height sticky element, so it stays
   pinned to the bottom of the scrollport without taking a pixel of layout. */

  position:absolute;bottom:4px;inset-inline:0;margin-inline:auto;width:42px;height:3px;
  border-radius:999px;background:var(--sep-2);opacity:0;

   own place in the flow — so the line hops the moment you reach the bottom,
   which is precisely when somebody is looking at it. */
