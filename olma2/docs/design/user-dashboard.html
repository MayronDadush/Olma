.st-cal{background:var(--accent-soft);color:var(--accent)}
.st-bell,.st-gold{background:var(--gold-soft);color:var(--gold)}
.st-rep,.st-sea{background:var(--sea-soft);color:var(--drop-line)}
.st-share{background:var(--danger-soft);color:var(--clay)}
.st-ghost{background:var(--bg-tint);color:var(--text-2)}
.stx{flex:1;min-width:0;display:grid;gap:1px}
.slab{font-size:12.5px;font-weight:600;color:var(--text-3)}
.sval{font-size:16px;font-weight:600;color:var(--text);
  display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px}
.sval.off{color:var(--text-3);font-weight:500}
.sval.small{font-size:13.5px;font-weight:500;color:var(--text-2)}
.sval.flash{animation:svalFlash .6s ease}
@keyframes svalFlash{0%{color:var(--gold)}100%{color:inherit}}
/* the part of a sentence that is itself a choice */
.sinl{
  display:inline-flex;align-items:center;gap:3px;border-radius:8px;padding:1px 8px;
  background:var(--gold-soft);color:var(--gold);font-size:15px;font-weight:700;
}
.sinl svg{width:9px;height:12px;transform:rotate(-90deg);transition:transform .3s var(--spring)}
.sinl[aria-expanded="true"] svg{transform:rotate(90deg)}
.spad{padding:0 14px 12px;padding-inline-start:62px;display:grid;gap:8px;justify-items:start}

/* the when-row, open: a line for the day and a line for the hour */
.wpad{padding:0 14px 12px;padding-inline-start:62px;display:grid;gap:9px}
.wline{display:grid;gap:4px}
.wkey{font-size:12px;font-weight:700;color:var(--text-3)}
.wpk{display:flex;flex-wrap:wrap;gap:6px}
.wpk button{
  border-radius:999px;padding:5px 11px;font-size:13.5px;font-weight:600;
  background:var(--bg-tint);color:var(--text-2);
  display:inline-flex;align-items:center;gap:5px;font-variant-numeric:tabular-nums;
  transition:background .2s var(--ease),color .2s var(--ease),transform .2s var(--spring);
}
.wpk button:active{transform:scale(.94)}
.wpk button svg{width:13px;height:13px}
.wpk button.quiet{background:none;box-shadow:inset 0 0 0 1.4px var(--sep-2)}
.wpk button[aria-pressed="true"],.wpk button[aria-checked="true"]{
  background:var(--accent);color:var(--on-accent);box-shadow:none}
.wpk button.locked{opacity:.42;cursor:default}
.wweekwrap{display:grid;gap:4px}
.wweek{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wweek button{
  border-radius:10px;background:var(--bg-tint);padding:5px 0;display:grid;justify-items:center;
  font-size:11px;font-weight:600;color:var(--text-3);
}
.wweek button b{font-size:15px;color:var(--text);font-variant-numeric:tabular-nums}
.wweek button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.wweek button[aria-pressed="true"] b{color:var(--on-accent)}
.wmore{justify-self:center;color:var(--accent);font-size:13px;font-weight:600;padding:2px 8px}
.endline{display:flex;align-items:center;gap:4px;justify-self:start}
.endlink{color:var(--accent);font-weight:600;font-size:13.5px;padding:2px 0;font-variant-numeric:tabular-nums}
.endlink.set{background:var(--accent-soft);border-radius:999px;padding:3px 10px}
.endx{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:var(--text-3)}
.endx svg{width:10px;height:10px}

/* the category, as a tag under the title */
.catline{display:grid;justify-items:center;gap:8px;margin:-4px 0 12px}
.catchip{
  display:inline-flex;align-items:center;gap:0;border-radius:999px;padding:4px 12px 4px 10px;
  background:var(--bg-tint);font-size:13.5px;font-weight:600;color:var(--text-2);
  transition:transform .2s var(--spring);
}
[dir="rtl"] .catchip{padding:4px 10px 4px 12px}
.catchip:active{transform:scale(.95)}
.catchip small{font-size:12.5px;font-weight:500;color:var(--text-3);margin-inline-start:5px}
.catchip.locked{opacity:.42;cursor:default}
.catfold{display:grid;grid-template-rows:0fr;transition:grid-template-rows .36s var(--ease-io);width:100%}
.catfold.open{grid-template-rows:1fr}
.catfold > div{overflow:hidden;min-height:0}
.catfold .chips{justify-content:center;padding:2px 0 2px}

/* "you can also": what the task could become, each saying what it adds */
.alsoh{font-size:13px;font-weight:700;color:var(--text-3);padding:2px 6px 8px}
.alsotiles{display:grid;grid-template-columns:repeat(var(--n,3),1fr);gap:9px}
.atile{
  background:var(--surface-2);border-radius:16px;padding:12px 10px;
  display:grid;gap:6px;justify-items:start;align-content:start;text-align:start;
  transition:transform .15s var(--ease);
}
.atile:active{transform:scale(.95)}
.atile b{font-size:15px;font-weight:600;display:flex;align-items:center;gap:4px;color:var(--text)}
.atile b svg{width:12px;height:12px;color:var(--text-3)}
.atile > span:last-child{font-size:12.5px;line-height:1.3;color:var(--text-3)}
/* a tile becoming its row: the row arrives, and its icon lands */
.fresh-row{animation:itemIn .38s var(--ease-io)}
.fresh-row .stile{animation:stileLand .5s var(--squash)}
@keyframes stileLand{0%{transform:scale(.4)}100%{transform:none}}
.wline.locked,.endline.locked{opacity:.42}
@media (prefers-reduced-motion: reduce){
  .fresh-row,.fresh-row .stile,.sval.flash{animation:none}
}
/* nothing to say until something was saved */
#sSaved{opacity:0;transition:opacity .3s var(--ease),color .2s var(--ease)}
#sSaved.flash{opacity:1}

/* who a shared task belongs to, spelled out inside the editor */
.sperson{display:flex;align-items:center;gap:11px;padding:8px 0}
.sperson .face{width:30px;height:30px;box-shadow:none}
.sperson b{font-size:15px;font-weight:500;flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sperson u{
  text-decoration:none;font-size:11.5px;font-weight:600;color:var(--text-3);
  background:var(--bg-tint);padding:3px 8px;border-radius:999px;flex:none;
}
/* Removing somebody is done where they are named, not by hunting for their
   chip in the picker below. Only the person who opened the task gets these:
   taking someone off a task that is not yours is not your call, and a button
   that would be refused by the server has no business being drawn. */
.sperson .spx{
  width:27px;height:27px;flex:none;border-radius:9px;display:grid;place-items:center;
  color:var(--text-3);
  transition:background var(--sw-t) var(--ease-io),color var(--sw-t) var(--ease-io),
             transform .38s var(--squash);
}
.sperson .spx svg{width:11px;height:11px}
.sperson .spx:active{background:var(--danger-soft);color:var(--danger);transform:scale(.86)}

/* putting a finished task back is one tap, and it lives on the row itself */
.tundo{
  width:30px;height:30px;flex:none;border-radius:10px;display:grid;place-items:center;
  color:var(--text-3);transition:background .32s var(--ease-io),color .32s var(--ease-io),transform .4s var(--squash);
}
.tundo svg{width:15px;height:15px}
.tundo:active{background:var(--accent-soft);color:var(--accent);transform:scale(.88)}
[dir="ltr"] .tundo svg{transform:scaleX(-1)}
/* Not a note any more: it said "showing the last 8 of 23" and left the other
   fifteen with no way to be reached from this page at all. The sentence that
   names them is the thing you would press, so it is the button. */
.arcnote{
  font-size:12.5px;color:var(--text-2);font-weight:600;padding:11px 4px;width:100%;
  text-align:center;font-family:inherit;background:none;border:0;cursor:pointer;
  border-radius:10px;transition:background .2s var(--ease-io),color .2s var(--ease-io);
}
.arcnote:hover{color:var(--accent)}
.arcnote:active{background:var(--bg-tint)}

.tick.done-static{background:var(--sep-2);box-shadow:none;color:var(--surface)}
.tick.done-static svg{opacity:1;transform:none}
.tmeta{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.pill{
  display:inline-flex;align-items:center;gap:5px;
  padding:3.5px 9px 3.5px 8px;border-radius:8px;
  font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums;
  background:var(--bg-tint);color:var(--text-2);
}
.pill svg{width:12px;height:12px}
.pill.bell{background:var(--warn-soft);color:var(--warn)}
.pill.due{background:var(--accent-soft);color:var(--accent)}
.pill.late{background:var(--danger-soft);color:var(--danger)}
.tedit{
  flex:none;width:30px;height:30px;border-radius:50%;margin-top:0;
  display:grid;place-items:center;color:var(--text-3);
  transition:background .18s ease,color .18s ease;
}
.tedit:hover{background:var(--bg-tint);color:var(--text-2)}
.tedit svg{width:17px;height:17px}

.addrow{
  display:flex;align-items:center;gap:12px;padding:13px 14px;width:100%;
  color:var(--accent);font-weight:600;font-size:16px;
  transition:background .18s ease;
}
.addrow:active{background:var(--bg-tint)}
.addrow .plus{
  width:26px;height:26px;border-radius:50%;background:var(--action);color:var(--on-action);
  display:grid;place-items:center;flex:none;
}
.addrow .plus svg{width:14px;height:14px}

/* A dead end that offers the way out. Nothing here is a failure state — the
   person simply has no address book connected yet — so it reads as an
   invitation with one button, not as an error with an apology. */
.emptybig{
  display:flex;flex-direction:column;align-items:center;gap:10px;
  padding:26px 24px 30px;text-align:center;
}
.emptybig .ebicon{
  width:46px;height:46px;border-radius:16px;display:grid;place-items:center;flex:none;
  background:var(--bg-tint);color:var(--text-3);margin-bottom:2px;
}
.emptybig .ebicon svg{width:22px;height:22px}
.emptybig b{font-size:17px;font-weight:650;letter-spacing:-.01em}
.emptybig p{font-size:14.5px;color:var(--text-3);line-height:1.5;max-width:30ch}
.emptybig .btn{margin-top:6px}

/* one contact, one action — the button IS the row's end, so the whole row
   stays a single tap target for the common case */
.cnrow{display:flex;align-items:center;gap:12px;padding:11px 14px;width:100%}
.cnrow .face{width:32px;height:32px;border-radius:50%;overflow:hidden;flex:none}
.cnrow .face svg{width:100%;height:100%;display:block}
.cnrow .cntxt{flex:1;min-width:0;text-align:start}
.cnrow .cnname{font-size:15.5px;font-weight:550;letter-spacing:-.01em}
.cnrow .cnnum{
  font-size:12.5px;color:var(--text-3);font-variant-numeric:tabular-nums;direction:ltr;
}
.cninv{
  flex:none;padding:6px 13px;border-radius:999px;font-size:13px;font-weight:600;
  background:var(--accent-soft);color:var(--accent);
  transition:background var(--sw-t) var(--ease-io),color var(--sw-t) var(--ease-io),
             transform .3s var(--squash);
}
.cninv:active{transform:scale(.94)}
.cnrow.sent .cninv{background:transparent;color:var(--ok);pointer-events:none}
.cnrow.sent .cnname{color:var(--text-3)}

/* ── meeting coordination ──
   An option is a row, not a cell. The grid it replaces was compact and taught
   nobody its second press; a row has space for two buttons that say what they
   do, and for the answer so far right under the question.

   The row carries FOUR elements and no more — ring, formula, answer, settle —
   which is what leaves room for the names to open underneath instead of in a
   second screen, and what keeps the trash off the row entirely on a phone.

   ── the ring ──
   One object that answers two questions at once: how many said yes (the
   number, and the accent arc) and how the rest split (the second arc is the
   noes, the gap is silence). Silence is drawn as absence deliberately — it is
   not a third opinion, it is the absence of one, and a grey wedge of "hasn't
   answered" reads as a vote against.

   Two states recolour it, and they are not the same claim. Gold means
   everybody can: nobody outstanding, nobody against, and it is the ONLY state
   that settles itself. Green means the coordination's own minimum is met —
   enough people, not all of them — and it settles nothing, because "enough"
   is a judgement somebody still has to make with the ✓. */
.mtring{position:relative;width:38px;height:38px;flex:0 0 auto}
.mtring svg{transform:rotate(-90deg)}
.mtring .track{stroke:var(--sep)}
.mtring .yes{stroke:var(--accent);stroke-linecap:round}
.mtring .no{stroke:var(--no-arc);stroke-linecap:round}
.mtring b{position:absolute;inset:0;display:grid;place-items:center;
  font-weight:650;font-size:11px;color:var(--accent);font-variant-numeric:tabular-nums}
.mtring.full .yes{stroke:var(--gold-arc)}
.mtring.full b{color:var(--gold)}
.mtring.min .yes{stroke:var(--ok)}
.mtring.min b{color:var(--ok)}

/* ── the formula: day · when · date ──
   Fixed columns so four rows can be scanned down the day and down the hour
   without reading a sentence. `min-width` rather than a grid because the row
   also holds a ring and two controls, and a grid would fight them. */
/* The line was drawn on a 390px phone and there are narrower ones, so what
   gives way when it does not fit is decided here rather than by which token
   happens to be last. The day and the MARK never shrink — one is the answer
   to "when", the other is the rule the ring is drawing — and the date is the
   detail, so the date is what goes. `min-width:3.9em` lines the columns up
   between rows and is dropped for `.f-when` before any of that: alignment is
   a nicety, a clipped crown is a lost signal. */
/* The date goes WHOLE, with the dot in front of it, or not at all. It used to
   shrink with `overflow:hidden`, and in a right-to-left line a clipped number
   loses its FIRST digits: "3.10" read ".10", and "5.10" read ".10" as well —
   another date, not a shorter one (2026-09-30). CSS cannot drop a box whole
   when it does not fit, so `mtFitDates` measures the line after every render
   and sets `.nodate`; until it has, the line clips rather than spilling into
   the buttons beside it. */
.mtformula{display:flex;align-items:center;gap:0;font-size:14px;margin:0 0 2px;white-space:nowrap;overflow:hidden}
.mtformula .f-day{font-weight:700;color:var(--text);min-width:3.9em;flex:none}
.mtformula .f-when{font-weight:700;color:var(--accent);font-size:13px;min-width:3.9em;flex:none}
.mtformula .f-dt{display:flex;align-items:center;flex:none}
.mtformula .f-date{font-weight:600;color:var(--text-3);font-size:12px;font-variant-numeric:tabular-nums}
.mtformula .f-sep{color:var(--text-3);margin:0 6px;font-weight:400;flex:none}
.mtformula .mk{width:17px;height:17px;margin-inline-start:6px;flex:none}
.mtformula.nodate .f-dt{display:none}
.mtformula.nodate .f-when{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
@media (max-width:380px){
  .mtformula .f-when{min-width:0}
  .mtformula .f-sep{margin:0 4px}
}
.mtsum{font-size:11.5px;color:var(--text-3);margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mtsum .gold{color:var(--gold);font-weight:700}
.mtsum .grn{color:var(--ok);font-weight:700}
.mtsum .no{color:var(--danger)}

/* ── the swipe shell ──
   The gesture IS the first of the two presses a delete takes: it cannot happen
   by accident, and it is more deliberate than a tap. The red is underneath and
   the row slides off it, so nothing appears that was not already there. */
.mtswipe{position:relative;overflow:hidden;border-bottom:1px solid var(--sep)}
.mtswipe:last-child{border-bottom:0}
.mtswipe .mtback{position:absolute;inset:0;background:var(--danger);display:flex;align-items:center;
  justify-content:flex-start;padding-inline-start:20px;gap:9px;color:var(--on-accent);font-weight:700;font-size:13.5px;
  border:0;width:100%;font-family:inherit;cursor:pointer}
.mtswipe .mtback svg{width:19px;height:19px;color:var(--on-accent)}
.mtswipe .mtfront{position:relative;background:var(--surface);
  transition:transform .22s cubic-bezier(.32,.72,0,1);touch-action:pan-y}
.mtswipe.dragging .mtfront{transition:none}
/* The red is only THERE while the row is off it. Painted at rest, the edge of
   the row above it antialiases against red and a hairline of it shows round
   every row (the owner saw it in the demo, 2026-09-23). It hides only once
   the row has slid home — the delay is the slide — and shows at once. */
.mtswipe .mtback{opacity:0;transition:opacity 0s linear .24s,clip-path .22s cubic-bezier(.32,.72,0,1);
  clip-path:inset(0 0 0 100%)}
.mtswipe.dragging .mtback,.mtswipe.open .mtback{opacity:1;transition:clip-path .22s cubic-bezier(.32,.72,0,1)}
.mtswipe.dragging .mtback{transition:none}
.mtswipe.open .mtback{clip-path:inset(0 0 0 calc(100% - 96px))}
[dir="ltr"] .mtswipe .mtback{clip-path:inset(0 100% 0 0)}
[dir="ltr"] .mtswipe.open .mtback{clip-path:inset(0 calc(100% - 96px) 0 0)}
/* The row slides towards the END of the line, which is what uncovers the red
   sitting at the START where the trash label is — so the direction is logical
   and `--dirf` is what makes the same rule right in both languages. */
.mtswipe.open .mtfront{transform:translateX(calc(-96px * var(--dirf)))}
/* A settled time is not deletable at all — ending a coordination everybody has
   already been told about is `cancel_meeting`, which messages them. */
.mtswipe.locked .mtfront{transform:none}
/* The time most people have said yes to. `mtBest` has marked it since the row
   was a grid, and the mark has drawn nothing since the row stopped being one —
   the rule that drew it named `.mopt`, a class no markup on this page carries
   any more, and it is gone.
   `:not(.crown)` is the whole point of putting it back this way: a time
   EVERYBODY can make already says so, in gold, with a crown and a full ring.
   Two markers on one row is not twice as clear. This is for the leading time
   that is only leading — 2 of 3 — which today carries nothing at all. */
.mtswipe.best .mtopt:not(.crown){box-shadow:inset 0 0 0 1.5px var(--accent-line)}
/* `.mtopt`, not `.mtrow`: the meetings LIST has owned `.mtrow` since long
   before this row existed, and it is `display:flex` — which laid the clash
   badge and the settle question out BESIDE the row instead of under it, and
   clipped both. A stack is the whole point here, so the name had to give. */
.mtopt{padding:10px 11px}
.mtopt.crown{background:linear-gradient(90deg,var(--gold-soft),transparent 80%)}
.mttop{display:flex;align-items:center;gap:9px}
.mtmain{flex:1;min-width:0}

/* The desktop half of the same affordance: no swipe with a mouse, so the trash
   is always there and takes its own second click to confirm. Always, not on
   hover (owner, 2026-09-23): a mouse has no gesture to discover, and a control
   that appears only under the pointer is one nobody knows to point at. */
.mtdel,.swdel{border:0;background:transparent;color:var(--text-3);padding:0;width:30px;height:30px;flex:none;
  display:grid;place-items:center;border-radius:8px;cursor:pointer;transition:.16s}
.mtdel svg,.swdel svg{width:16px;height:16px}
.mtdel:hover,.swdel:hover{background:var(--danger-soft);color:var(--danger)}
.mtdel.arm,.swdel.arm{background:var(--danger);color:var(--on-accent)}
@media (hover:none){.mtdel,.swdel{display:none}}

/* ── the same swipe, on the task list and the coordinations list ──
   One gesture for "take this off my list" wherever a list is (owner,
   2026-09-23), modelled on the times inside a coordination above: slide the
   row, the red underneath says what will happen, and pressing the red does
   it. `.swr` wraps the row, `.swback` is the red, `.swfront` is the row. */
.swr{position:relative;overflow:hidden}
.swback{position:absolute;inset:0;background:var(--danger);display:flex;align-items:center;
  justify-content:flex-start;padding-inline-start:20px;gap:9px;color:var(--on-accent);font-weight:700;font-size:13.5px;
  border:0;width:100%;font-family:inherit;cursor:pointer;
  opacity:0;transition:opacity 0s linear .26s,clip-path .26s var(--spring)}
.swback svg{width:19px;height:19px;color:var(--on-accent)}
/* The red is cut to exactly the strip the row has uncovered — never the whole
   layer behind it. Painted whole, the row's own edges and rounded corners
   antialias against it and a hairline of red rims the row the moment a finger
   touches it (owner, twice, 2026-09-23). During a drag the strip follows the
   finger (swClip); open and peek are the same cut at a fixed width. */
.swback{clip-path:inset(0 0 0 100%)}
[dir="ltr"] .swback{clip-path:inset(0 100% 0 0)}
.swr.dragging > .swback,.swr.open > .swback,.swr.peek > .swback{opacity:1;transition:clip-path .26s var(--spring)}
.swr.dragging > .swback{transition:none}
.swr.peek > .swback{transition:clip-path .5s var(--ease)}
.swr.open > .swback{clip-path:inset(0 0 0 calc(100% - 104px))}
.swr.peek > .swback{clip-path:inset(0 0 0 calc(100% - 88px))}
[dir="ltr"] .swr.open > .swback{clip-path:inset(0 calc(100% - 104px) 0 0)}
[dir="ltr"] .swr.peek > .swback{clip-path:inset(0 calc(100% - 88px) 0 0)}
.swfront{position:relative;background:var(--surface);
  transition:transform .26s var(--spring);touch-action:pan-y}
.group.mtset .swfront{background:var(--accent-soft)}
/* A task somebody else is on carries the accent's soft ground on the ROW,
   not on its section, so it keeps it wherever it lands — pinned at the top
   or unpinned back among the rest (owner, 2026-09-28). Violet because no
   category uses it: the dot beside the title is the category's colour. */
/* Its own token, because the night's accent-soft sits 1.1:1 from the row
   it would tint and the tint vanished (measured on the demo, 2026-09-28). */
.swr.shared > .swfront{background:var(--shared-bg)}
.swr.dragging > .swfront{transition:none}
.swr.open > .swfront{transform:translateX(calc(-104px * var(--dirf)))}
/* The first-time peek: part of the way, slower, and back by itself. */
.swr.peek > .swfront{transition:transform .5s var(--ease);transform:translateX(calc(-88px * var(--dirf)))}
/* A row with nothing to delete says so by refusing the gesture, not by
   ignoring it: a finger that gets no answer tries again. */
.swr.nope > .swfront{animation:swNope .42s var(--ease)}
@keyframes swNope{30%{transform:translateX(calc(-12px * var(--dirf)))}60%{transform:translateX(calc(5px * var(--dirf)))}}
/* The line that says the gesture exists, said once. Two stages each way, so
   nothing jumps: coming in, the room opens first and the pill settles into it;
   going out, the pill lifts away first and only then does the room close —
   the list below moves once, slowly, and never under a line still visible. */
.swhint{display:grid;grid-template-rows:0fr;
  transition:grid-template-rows .5s var(--ease) .2s}
.swhint > div{min-height:0;overflow:hidden}
.swhint.on{grid-template-rows:1fr;transition-delay:0s}
.swhint p{display:flex;align-items:center;gap:8px;width:fit-content;max-width:100%;margin:2px auto 14px;
  padding:7px 14px;border-radius:999px;background:var(--accent-soft);
  font-size:13px;font-weight:600;color:var(--accent);
  opacity:0;transform:translateY(-8px) scale(.96);filter:blur(3px);
  transition:opacity .22s ease,transform .26s var(--ease),filter .22s ease}
.swhint.on p{opacity:1;transform:none;filter:none;
  transition:opacity .4s ease .22s,transform .55s var(--spring) .22s,filter .4s ease .22s}
.swhint svg{width:16px;height:16px;flex:none;animation:swNudge 1.3s ease-in-out infinite}
@keyframes swNudge{50%{transform:translateX(calc(-5px * var(--dirf)))}}
[dir="ltr"] .swhint svg{scale:-1 1}
@media (prefers-reduced-motion:reduce){
  .swr.peek > .swfront{transform:none}
  .swhint,.swhint p,.swhint.on p{transition-duration:.01s;transition-delay:0s;transform:none;filter:none}
}

/* The names, opened by a tap on the row itself. Nobody who has not answered is
   listed — they are the grey of the ring, and a name under "hasn't answered"
   invites somebody to read a silence as a refusal. */
.mtvotes{padding:2px 11px 11px}
.mtvgrp{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.mtvlab{font-size:11px;font-weight:700;color:var(--text-3);margin-inline-end:2px}
.mtvlab.y{color:var(--accent)} .mtvlab.n{color:var(--danger)}
.mtvnote{font-size:11px;color:var(--text-3);margin:4px 0 0}
/* the note an answer was given with: secondary, and a long one wraps rather
   than pushing the row wider than a phone */
.mtvgrp .pill{max-width:100%;white-space:normal}
.mtvsaid{color:var(--text-3);font-weight:400}
.mtvgrp .mtwords{max-width:16em}

.mtseg{display:flex;background:var(--sep);border-radius:9px;padding:2px;flex:none}
.mtseg button{border:0;background:transparent;font:inherit;font-size:12px;font-weight:700;
  color:var(--text-3);padding:6px 9px;border-radius:7px;cursor:pointer;
  transition:background var(--sw-t) var(--ease-io),color var(--sw-t) var(--ease-io),
             box-shadow var(--sw-t) var(--ease-io),transform .18s var(--squash)}
.mtseg button:active{transform:scale(.93)}
/* Saying "I can" is the one press in a coordination that decides something,
   and it was the only control on the page that answered with nothing at all. */
.mtseg button.pop{animation:chipPop .24s var(--squash)}
.mtseg button[aria-pressed="true"]{background:var(--seg-on);color:var(--accent);box-shadow:var(--shadow-s)}
.mtseg button[data-a="n"][aria-pressed="true"]{color:var(--danger)}
/* One control per row (2026-09-30): the answer, or — once "לקבוע מועד בלי
   לחכות לכולם" is pressed under the table — "לקבוע" in its place. Settling by
   hand is the exception, so it no longer sits on every row beside the answer. */
.mtpick{border:0;background:var(--accent);color:var(--on-accent);border-radius:9px;
  font:inherit;font-size:12px;font-weight:700;padding:8px 14px;flex:none;cursor:pointer;
  transition:transform .18s var(--squash)}
.mtpick:active{transform:scale(.93)}
.mtpick.arm{background:var(--warn)}
.mtpicklink{display:flex;align-items:center;gap:6px;margin:10px 4px 0;padding:6px 10px;
  border:0;background:transparent;font:inherit;font-size:13px;font-weight:600;
  color:var(--accent);cursor:pointer}
.mtpicklink svg{width:14px;height:14px;flex:none}

/* "Enough for me is 3 of 5" — the coordination's own minimum, set from here. */
.minchip{display:inline-flex;align-items:center;gap:6px;background:var(--surface);
  border:1px solid var(--sep-2);border-radius:99px;padding:4px 10px;font-size:12px;
  font-weight:600;color:var(--text-2);margin:0 0 11px;cursor:pointer;font-family:inherit}
.minchip b{color:var(--accent);font-variant-numeric:tabular-nums}
.minchip svg{width:12px;height:12px}

/* The two answers, side by side and both labelled. Pressing the one you are
   already on clears it — the third state, without a third gesture. */
.moact{display:flex;align-items:center;gap:7px;margin-top:11px;flex-wrap:wrap}
.mobtn{
  display:inline-flex;align-items:center;gap:6px;
  padding:7px 13px;border-radius:999px;font-size:13.5px;font-weight:600;
  background:var(--bg-tint);color:var(--text-2);
  transition:background var(--sw-t) var(--ease-io),color var(--sw-t) var(--ease-io),
             box-shadow var(--sw-t) var(--ease-io),transform .34s var(--squash);
}
.mobtn svg{width:12px;height:12px}
.mobtn:active{transform:scale(.95)}
.mobtn.yes[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.mobtn.no[aria-pressed="true"]{background:var(--danger);color:var(--on-accent)}
/* Settling is the occasional act, not the one being asked for — pushed to the
   far end, unfilled, so it cannot be hit while answering. The ring is what
   keeps it reading as a control rather than a caption. */
.mobtn.settle{margin-inline-start:auto;background:transparent;color:var(--accent);
  box-shadow:inset 0 0 0 1px var(--accent-soft)}
.mobtn.ok{background:var(--accent);color:var(--on-accent)}
.mobtn.warn{background:var(--warn);color:var(--on-accent)}
/* Settling on something not everybody can make asks once, by name. The second
   button is worded differently from the first on purpose, so a fast double
   press cannot carry straight through it. */
/* Not an error — a fact about your day that whoever proposed this could not
   see. Warm, not red, and it names the thing so you can judge it. */
.moclash{
  display:flex;align-items:center;gap:7px;margin-top:10px;
  padding:7px 10px;border-radius:11px;
  background:var(--warn-soft);color:var(--warn);
  font-size:12.5px;font-weight:600;
}
.moclash svg{width:13px;height:13px;flex:none}
/* The settle grace. Green rather than amber on purpose: nothing is wrong, the
   meeting is agreed — the number is only saying how long the door stays open
   to change your mind. Amber here would read as a problem to solve. */
.mosettling{
  display:flex;align-items:center;gap:7px;margin-top:10px;
  padding:7px 10px;border-radius:11px;
  background:var(--ok-soft);color:var(--ok);
  font-size:12.5px;font-weight:600;
}
.mosettling svg{width:13px;height:13px;flex:none}
/* Bleeds to the edges of the row it belongs to, so its negative margins are
   `.mtopt`'s padding exactly. The square corners are deliberate: `.group`
   clips the last row's for us, and rounding them here draws a card inside a
   card on every row above it. */
.moconfirm{
  margin:10px -11px -10px;padding:11px 11px;
  background:var(--warn-soft);border-radius:0;
}
.moconfirm p{margin:0;font-size:13.5px;color:var(--text-2);font-weight:600}
.moconfirm .moact{margin-top:9px}


.mtfaces{display:flex;flex-wrap:wrap;gap:6px;padding:6px 14px 2px}
.mtface{
  display:flex;align-items:center;gap:6px;padding:4px 10px 4px 4px;border-radius:999px;
  background:var(--bg-tint);font-size:12.5px;font-weight:600;color:var(--text-3);
}
.mtface .face{width:22px;height:22px;border-radius:50%;overflow:hidden;flex:none}
.mtface .face svg{width:100%;height:100%;display:block}
.mtface.said{color:var(--ok)}
.mtface.said .face{box-shadow:0 0 0 1.5px var(--ok)}
/* Somebody who left is still shown, and struck through, because the group
   needs to see why the count dropped. They count towards nothing. */
.mtface.gone{opacity:.5;text-decoration:line-through;text-decoration-thickness:1px}
.mtface.gone .face{filter:grayscale(1)}
/* A note is one line, cut with an ellipsis where it runs out of room, and a
   tap opens it whole (owner, 2026-10-05: long notes made the row ugly). The
   cut is the browser's, so it lands at the real width in either direction. */
.mtface{max-width:100%;min-width:0;white-space:nowrap}
.mtwords{display:inline-block;max-width:14em;min-width:0;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;vertical-align:bottom;cursor:pointer}
.mtwords.open{max-width:none;white-space:normal}

/* A card in the list, before you open it. */
.mtcard{
  display:flex;align-items:center;gap:12px;padding:13px 14px;width:100%;text-align:start;
}
.mtcard .mtbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.mtcard .mtname{font-size:16px;font-weight:600;letter-spacing:-.012em}
.mtcard .mtstate{
  display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text-3);
  min-width:0;
}
/* The chip answers "does this still need anything" before the sentence after
   it is read at all — which is the only question a list of these gets asked. */
.mtpill{
  flex:none;font-style:normal;font-size:11px;font-weight:700;letter-spacing:.01em;
  padding:2px 7px;border-radius:999px;background:var(--bg-tint);color:var(--text-3);
}
.mtpill.ready{background:var(--ok-soft);color:var(--ok)}
.mtpill.stuck{background:var(--danger-soft);color:var(--danger)}
/* The list is three groups since 2026-09-30 — waiting on you, waiting on
   others, settled — each ONE card with hairlines between its rows, the shape
   the task list has. The group's heading says what the solid "מחכה לתשובה
   שלך" pill used to say on every card, once. A settled coordination stays
   here until its moment has actually passed (2026-09-23), and its group is
   still the tinted one, so it reads as settled before any sentence on it is
   read; its time carries the ✓ the solid chip used to. Only the ACTIVE list
   tints — an archive row is over, and nothing in it is worth pointing at. */
.mtgrps{display:flex;flex-direction:column;gap:20px}
.mtglab .n{margin-inline-start:auto;font-weight:500;font-variant-numeric:tabular-nums}
.mtglab .dot{width:7px;height:7px;border-radius:50%;background:var(--gold-arc);flex:none;
  margin-inline-end:-4px}
.mtglab{justify-content:flex-start}
.mtgrp > *{position:relative}
.mtgrp > * + *::before{content:"";position:absolute;top:0;height:1px;background:var(--sep);
  inset-inline-start:14px;inset-inline-end:0;z-index:2}
.group.mtset{background:var(--accent-soft)}
.mtstate .mtok{color:var(--accent);font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis}
.mtstate .mtok::before{content:"\2713";font-size:11px;font-weight:800;margin-inline-end:4px}
.mtcard .chev{width:15px;height:15px;flex:none;color:var(--text-3)}
.mtrow{display:flex;align-items:center}
.mtrow .mtcard{padding-inline-end:10px}
.mtrow .mtcard{flex:1;min-width:0}
/* Leaving from the row, where the thought "this should stop appearing"
   actually happens — by the swipe on a phone and the trash with a mouse, the
   same two doors every list on the page has (.swr above). */
.mtrow .swdel{margin-inline-end:8px}
.mtconfirm{padding:13px 14px}
.mtconfirm p{margin:0 0 10px;font-size:13.5px;color:var(--text-2)}
.mtconfirm .moact{margin-top:0}

/* ── picking the days ──
   A row of chips taught "pick one" and then behaved like "pick several". A
   calendar is the one surface where everybody already knows that several is
   allowed, so the affordance stops needing to be explained. */
.daygrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;padding:2px 2px 0}
.daygrid .dgh{
  font-size:10.5px;font-weight:650;color:var(--text-3);
  text-align:center;padding-bottom:3px;
}
.dgc{
  position:relative;aspect-ratio:1;border-radius:11px;background:var(--bg-tint);
  display:grid;place-items:center;font-size:13.5px;font-weight:600;color:var(--text-2);
  font-variant-numeric:tabular-nums;
  transition:background var(--sw-t) var(--ease-io),color var(--sw-t) var(--ease-io),
             transform .3s var(--squash);
}
.dgc:active{transform:scale(.9)}
.dgc.past{opacity:.26;pointer-events:none;background:transparent}
.dgc.on{background:var(--accent);color:var(--on-accent);font-weight:700}
.dgc.now::after{
  content:"";position:absolute;bottom:4px;width:4px;height:4px;border-radius:50%;
  background:var(--accent);
}
.dgc.busy.now::after{inset-inline-end:calc(50% - 7px)}
.dgc.on.now::after{background:#fff}
.dgmon{display:flex;align-items:center;gap:4px;padding:0 0 6px}
.dgttl{
  flex:1;text-align:center;font-size:11.5px;font-weight:650;color:var(--text-3);
  letter-spacing:.02em;padding:6px 4px;border-radius:9px;transition:background .3s var(--ease-io)
}
.dgttl:active{background:var(--bg-tint)}
.dgmon .calnav[disabled]{opacity:.24;pointer-events:none}
/* A day that already has something on it. Hollow, under the number, so it
   cannot be read as the selection — which is a filled circle around it. */
.dgc.busy::before{
  content:"";position:absolute;bottom:4px;width:4px;height:4px;border-radius:50%;
  box-shadow:inset 0 0 0 1.5px var(--text-3);
}
.dgc.busy.now::before{inset-inline-start:calc(50% - 7px)}
.dgc.on.busy::before{box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.9)}
.dgcount{
  display:flex;align-items:center;gap:6px;padding:11px 4px 2px;
  font-size:12.5px;color:var(--text-3);
}
.dgcount.over{color:var(--warn);font-weight:600}

/* what she read back out of a written sentence, before any of it counts */
.whenecho{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  margin:0 0 10px;padding:11px 13px;border-radius:14px;
  background:var(--accent-soft);color:var(--accent);
  font-size:13.5px;font-weight:600;
}
.whenecho.miss{background:var(--bg-tint);color:var(--text-3);font-weight:500}
.whenecho .mobtn{margin-inline-start:auto}
#mtNewTime,#mtOptTime{margin-top:9px}
.mtcatline{display:block;margin:-6px auto 12px;text-align:center;font-size:12.5px;color:var(--text-3);padding:2px 8px;border-radius:999px}
.mtcatline .cdot{margin-inline-end:5px;vertical-align:0}
.mtcatline:active{background:var(--bg-tint)}
.mtcatpick{justify-content:center;margin:0 0 14px}
.mtcard .mtname .cdot{margin-inline-end:6px;vertical-align:1px}
.mtexactbtn{flex:1;min-width:0;text-align:start;font-size:16.5px;font-weight:500;color:var(--accent);padding:4px 0}
/* A little more air than the chips above it, and a chevron that flips
   open — the same disclosure language as every fold trigger elsewhere
   (.row[aria-expanded] .chev), just on a text link instead of a full row. */
.pdtoggle{display:inline-flex;align-items:center;gap:4px;margin-top:14px}
#mtPerDay[aria-expanded="true"] .chev{transform:rotate(-90deg)}
.pdlist{margin-top:10px;display:grid;gap:9px}
.pdrow{display:grid;gap:6px}
.pdrow b{font-size:12.5px;font-weight:650;color:var(--text-3)}
.sheetbtns.wrap{flex-wrap:wrap}
/* Leaving a coordination is deliberate, not an alarm — red words on the same
   quiet ground as any other secondary button. Without the explicit background
   `.btn.danger` (declared later, same specificity as `.btn.ghost`) fills it. */
.btn.ghost.danger{background:var(--bg-tint);color:var(--danger)}
.row-val.drop{color:var(--danger);font-weight:600}
/* the small control that lives ON the calendar row it acts on */
.evdrop{
  width:24px;height:24px;border-radius:50%;flex:none;
  display:grid;place-items:center;background:var(--bg-tint);color:var(--text-3);
  transition:transform .3s var(--squash),background var(--sw-t) var(--ease-io);
}
.evdrop svg{width:10px;height:10px}
.evdrop:active{transform:scale(.9)}
.evbody{flex:1;min-width:0}

/* A group is a shortcut to its members, not a thing you invite. Tapping it
   selects them individually, which is what makes "poker without Dan" one tap
   away instead of a fresh start. Half-selected is its own state — anything
   else would lie about what pressing it again does. */
.pchip.grp{padding:4px 12px;gap:6px}
.pchip.grp .gdot{
  width:20px;height:20px;border-radius:7px;flex:none;display:grid;place-items:center;
  background:var(--accent-soft);color:var(--accent);font-size:10px;font-weight:700;
  font-variant-numeric:tabular-nums;
}
.pchip.grp[aria-pressed="true"] .gdot{background:var(--on-accent-soft);color:var(--on-accent)}
.pchip.grp.part{box-shadow:inset 0 0 0 1.5px var(--accent);color:var(--accent)}
.pchip.grp.part .gdot{background:var(--accent);color:var(--on-accent)}
.picknone{padding:10px 4px;font-size:13.5px;color:var(--text-3)}

/* ── imported tasks ──
   The logo is small and monochrome-adjacent on purpose: it is a provenance
   mark, not a brand placement, and five different brand colours down one list
   would read as five different kinds of task. */
.srcmark{
  width:17px;height:17px;flex:none;border-radius:5px;
  display:inline-grid;place-items:center;vertical-align:-3px;
  margin-inline-end:7px;background:var(--bg-tint);
}
.srcmark svg{width:11px;height:11px;color:var(--text-2)}
.srcline{
  display:flex;align-items:center;gap:0;padding:0 14px 12px;margin-top:-4px;
  font-size:13px;color:var(--text-3);
}
.tsec.imported .glabel .cdot{opacity:.6}

/* A field the source cannot hold. Dimmed AND inert — the row stays so the
   person can see the field exists, and cannot press it so they never get a
   change that silently would not survive the next sync. */
.row.locked,.vchip.locked{opacity:.42;cursor:default}
.row.locked .chev{opacity:.4}

.empty{padding:30px 18px;text-align:center;color:var(--text-3);font-size:14.5px}
/* An empty list that only says it is empty leaves the person to find the way
   out of it. The way out is always one control that already exists further up
   the page, so the empty state borrows it rather than inventing a second one:
   `emptyGo` presses the real button, which is also why there is nothing here
   to keep in sync with it. */
.emptybig{display:grid;justify-items:center;gap:12px;padding:34px 18px}
.emptybig p{margin:0;max-width:34ch;line-height:1.5}
.emptygo{
  display:inline-flex;align-items:center;gap:7px;font-family:inherit;
  padding:9px 16px;border-radius:999px;background:var(--action);color:var(--on-action);
  font-size:13.5px;font-weight:600;box-shadow:var(--shadow-s);
  transition:transform .22s var(--spring);
}
.emptygo svg{width:13px;height:13px;flex:none}
.emptygo:active{transform:scale(.94)}
/* The last task of the day closing the list. An empty list and a FINISHED one
   are not the same fact, and until now they said the same sentence. The mark
   is the one the connect button draws, at rest. */
.alldone{display:grid;justify-items:center;gap:12px;padding:32px 18px}
.alldone .okmark{
  width:42px;height:42px;border-radius:999px;display:grid;place-items:center;
  background:var(--ok);color:var(--on-accent);animation:okPop .3s var(--spring);
}
.alldone .okmark svg{
  width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:2.6;
  stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:24;stroke-dashoffset:24;animation:okDraw .19s .06s var(--ease) forwards;
}
.alldone b{display:block;color:var(--text);font-size:16px;font-weight:700}
.alldone span.sub{display:block;color:var(--text-3);font-size:13.5px;margin-top:3px}
.alldone .txt{animation:stackSwap .26s .06s var(--ease-io) backwards}

/* ── one row, three answers ──
   Date, clock and all-day sit as values on the "when" row. Each is its own
   target, and the ones that make no sense yet are simply absent rather than
   present-and-disabled. */
.whenrow{align-items:center;gap:12px}
.whenrow .row-title{flex:none}
.whenvals{display:flex;align-items:center;gap:6px;margin-inline-start:auto;flex-wrap:wrap;justify-content:flex-end}
.vchip{
  padding:5.5px 11px;border-radius:999px;background:var(--bg-tint);color:var(--text-2);
  font-size:14px;font-weight:600;white-space:nowrap;
  transition:background .34s var(--ease-io),color .34s var(--ease-io),transform .38s var(--squash);
}
.vchip.set{color:var(--text)}
.vchip:active{transform:scale(.94)}
.vchip.toggle{box-shadow:inset 0 0 0 1.4px var(--sep-2);background:transparent;color:var(--text-3)}
.vchip.toggle[aria-checked="true"]{background:var(--accent);color:var(--on-accent);box-shadow:none}
/* The task sheet's when-row only. `.vchip` is shared with the hours and
   digest rows, so everything below is scoped to the sheet's own classes and
   never restyles a bare `.vchip` (one CSS namespace — a reused name wins by
   source order). */
.whenvals .vchip.quick{color:var(--accent);background:var(--accent-soft)}
/* On somebody else's task the day is theirs to move. Dimmed to say so — a
   disabled control that still looks lit is a button that lies. */
.whenvals .vchip.quick[disabled]{opacity:.3;pointer-events:none}
.whenvals .vchip.toggle{display:inline-flex;align-items:center;gap:6px;
  background:var(--bg-tint);box-shadow:none;color:var(--text-2)}
.whenvals .vchip.toggle .tdot{width:12px;height:12px;border-radius:50%;flex:none;
  box-shadow:inset 0 0 0 1.5px currentColor;opacity:.55;
  transition:box-shadow .2s var(--ease-io),opacity .2s var(--ease-io)}
.whenvals .vchip.toggle[aria-checked="true"]{background:var(--accent);color:var(--on-accent)}
.whenvals .vchip.toggle[aria-checked="true"] .tdot{box-shadow:inset 0 0 0 3.5px #fff;opacity:1}
.vseg{display:inline-flex;align-items:center;border-radius:999px;background:var(--bg-tint);
  font-size:14px;font-weight:600;white-space:nowrap}
.vseg[hidden]{display:none}
/* Nothing chosen looks like nothing chosen: a dashed outline and no fill, the
   convention for an empty slot — a filled pill reads as a value. */
.vseg{border:1.3px solid transparent}
.vseg.vunset{background:transparent;border-color:var(--sep-2);border-style:dashed}
.vseg.vunset .vseg-b{color:var(--text-3)}
.vseg-b.open{color:var(--accent)}
.vseg-b{display:inline-flex;align-items:center;gap:6px;padding:5.5px 11px;border-radius:999px;
  color:var(--text-2);font:inherit;transition:color .34s var(--ease-io),transform .38s var(--squash)}
.vseg-b.set{color:var(--text)}
.vseg-b:active{transform:scale(.94)}
.vseg-b .vic{width:14px;height:14px;flex:none;color:var(--text-3)}
.vseg-b.set .vic{color:var(--accent)}
/* the end reads as the second half of one range, not as a chip of its own */
.vseg-b.end{position:relative;padding-inline-start:10px}
.vseg-b.end::before{content:"";position:absolute;inset-inline-start:0;top:28%;bottom:28%;
  width:1px;background:var(--sep-2)}
.vseg-b.end:not(.set){color:var(--text-3)}
.vclear{width:22px;height:22px;margin-inline-end:4px;margin-inline-start:-5px;border-radius:50%;
  display:grid;place-items:center;flex:none;color:var(--text-3);
  transition:background .2s var(--ease-io),color .2s var(--ease-io),transform .38s var(--squash)}
.vclear svg{width:9px;height:9px}
.vclear:hover{background:var(--sep-2);color:var(--text)}
.vclear:active{transform:scale(.88)}
.vseg-b.locked{opacity:.42;cursor:default}
@keyframes chipPop{0%{transform:scale(1)}38%{transform:scale(.93)}100%{transform:scale(1)}}
/* The archive CATCHES a task that has just been ticked: the count it lands in
   takes the same beat the chips do, so the row does not merely vanish — it
   goes somewhere, and the somewhere says so. */
#arcCount{display:inline-block}
#arcCount.caught{animation:chipPop .3s var(--squash)}
.vchip.pop{animation:chipPop .19s var(--ease-io)}
.chip.cat{display:inline-flex;align-items:center}
.chip.cat[aria-pressed="true"] .cdot{box-shadow:0 0 0 1.6px rgba(255,255,255,.85)}

/* every friend as a chip; the pressed ones are the people on the task, so
   sharing and un-sharing are one gesture rather than two screens */
.peoplepick{display:flex;flex-wrap:wrap;gap:7px}
.pchip{
  display:inline-flex;align-items:center;gap:7px;padding:4px 12px 4px 4px;
  border-radius:999px;background:var(--bg-tint);color:var(--text-2);
  font-size:13.5px;font-weight:600;
  transition:background var(--sw-t) var(--ease-io),color var(--sw-t) var(--ease-io),
             transform .38s var(--squash);
}
[dir="rtl"] .pchip{padding:4px 4px 4px 12px}
.pchip .face{width:24px;height:24px;box-shadow:none}
.pchip:active{transform:scale(.95)}
.pchip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.pchip[aria-pressed="true"] .face{box-shadow:0 0 0 1.6px rgba(255,255,255,.6)}

/* the category's colour, small enough to be a mark rather than a badge */
.cdot{
  width:7px;height:7px;border-radius:50%;display:inline-block;flex:none;
  margin-inline-end:8px;vertical-align:1px;
}
.glabel .cdot{vertical-align:0;margin-inline-end:6px}
/* the two ways of reading the list, and nothing else on the row */
/* `flex-end` put this control on the trailing edge — the LEFT of a Hebrew
   page, i.e. the far side from where the eye starts and from the heading it
   belongs to. The row reads from the start edge in both directions now, and
   the action that belongs with it sits at the other end of the same row
   instead of at the bottom of the list. */
.viewrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:-6px 4px 12px}
.addmini{
  display:flex;align-items:center;gap:6px;flex:none;
  padding-block:6px;padding-inline-start:8px;padding-inline-end:12px;border-radius:999px;
  background:var(--action);color:var(--on-action);font-weight:600;font-size:13px;
  box-shadow:var(--shadow-s);
  transition:transform .22s var(--spring),background .2s ease;
}
.addmini:active{transform:scale(.94)}
/* the second action on a row is the quieter one — same shape, no fill, so
   the pair reads as one primary and one alternative rather than two rivals */
.addmini.ghost{background:var(--accent-soft);color:var(--accent);box-shadow:none}
.viewrow.pair{justify-content:flex-start}
/* A group is a list you keep, not a relationship anybody agreed to — the
   faces say who is in it before the name has to. */
.grfaces{display:flex;flex:none;align-items:center}
.grfaces .fav{
  width:30px;height:30px;border-radius:50%;overflow:hidden;flex:none;
  box-shadow:0 0 0 2px var(--surface);
}
.grfaces .fav + .fav{margin-inline-start:-11px}
.grfaces .more{
  width:30px;height:30px;border-radius:50%;flex:none;margin-inline-start:-11px;
  background:var(--bg-tint);color:var(--text-2);box-shadow:0 0 0 2px var(--surface);
  display:grid;place-items:center;font-size:11px;font-weight:700;
}
.grname{
  width:100%;margin:10px 0 4px;padding:9px 12px;border-radius:11px;
  background:var(--bg-tint);color:var(--text);font:inherit;font-size:15px;font-weight:600;
}
.grname:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.chipcloud{display:flex;flex-wrap:wrap;gap:7px;margin:8px 0 4px}
.frchip{
  display:flex;align-items:center;gap:6px;
  padding-block:4px;padding-inline-start:4px;padding-inline-end:11px;
  border-radius:999px;background:var(--bg-tint);color:var(--text-2);
  font-size:13.5px;font-weight:600;
  transition:background .22s var(--ease-io),color .22s var(--ease-io),transform .2s var(--spring);
}
.frchip .fav{width:22px;height:22px;border-radius:50%;overflow:hidden;flex:none}
.frchip:active{transform:scale(.94)}
.frchip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
/* Past four the list stops being something you take in at a glance, so it
   becomes something you scroll and search instead. */
.grscroll{max-height:none;overflow:visible}
.grscroll.scroll{max-height:296px;overflow-y:auto;border-radius:16px;-webkit-overflow-scrolling:touch}
.addmini svg{width:13px;height:13px;flex:none}
.seg.mini{flex:none;padding:2.5px;border-radius:10px;gap:2px}
.seg.mini button{flex:none;padding:5px 12px;font-size:13px;border-radius:8px}
@keyframes stackSwap{
  0%{opacity:0;transform:translateY(7px)}
  100%{opacity:1;transform:none}
}
.stack.swap{animation:stackSwap .21s var(--ease-io)}
/* The two calendar modes swap into each other the way the two task views
   already do — the same rise, on whichever half has just been shown. */
#calRead.swap,#calMeet.swap{animation:stackSwap .21s var(--ease-io)}

/* archive – deliberately quiet */
.archive{margin-top:34px;opacity:.72;transition:opacity .3s ease}
.archive:hover,.archive.open{opacity:1}
.arcbtn{
  display:flex;align-items:center;gap:9px;width:100%;padding:11px 4px;
  color:var(--text-3);font-size:14px;font-weight:600;
}
.archive.open .arcbtn .chev{transform:rotate(-90deg)}
/* "How does a meeting get set?" — the paragraph that sat under the list,
   folded into the question it answers. */
.mthow .note{padding:0 4px 6px;margin-top:0}
/* what is already on the calendar: the archive's quiet fold, inside the list */
/* spacing comes from .tsec + .tsec like its neighbours; first on the page, none */
.calfold{margin-top:0}
.calfold .arcbtn{padding-inline:14px 4px}
.calfoldmark{width:15px;height:15px;flex:none}
.calfoldn{margin-inline-start:auto;font-weight:500}
.calfold .fold .group{margin-top:4px}
/* Between sections the list used to take the stack's 26px AND .tsec's 19px,
   45px of nothing four times over — three tasks on a phone's first screen.
   The section margin alone is the gap now. */
#taskStack{gap:0}
/* The calendar fold is one slim row, set off by a tint rather than by air. */
#taskStack .calfold .arcbtn{padding:8px 14px;background:var(--bg-tint);border-radius:12px}
#arcGroup .task{opacity:.7}
#arcGroup .ttitle{color:var(--text-3)}
#arcGroup .pill{background:transparent;padding-inline:0;color:var(--text-3);font-weight:500}

/* ─────────────────────────  calendar peek  ───────────────────────── */
/* the week strip never said which month it was in — a date with no month
   is only readable if you already know the answer */
.stripmonth{
  display:flex;align-items:center;gap:7px;padding:9px 8px 8px 8px;
  border-bottom:1px solid var(--sep);
}
/* Addressed by id, not by position. These were `span:first-child` and
   `span:last-child` until the paging arrows joined the row — at which point
   neither span was a first or last child any more and the heading silently
   lost its type. */
#stripMonth{font-family:var(--font-display);font-size:15.5px;font-weight:600;color:var(--text)}
#stripYear{font-size:13px;font-weight:500;color:var(--text-3);font-variant-numeric:tabular-nums}
/* The arrows sit at the two ends and the label floats between them, so the
   row reads as one control rather than three things that happen to be
   adjacent. `auto` on both sides of the label does that at any string width. */
/* Both sit inside one button now, the one that opens the date popover, so
   the auto margins moved onto it. */
.stripttl{
  margin-inline:auto;display:flex;align-items:baseline;gap:7px;
  padding:4px 8px;border-radius:9px;transition:background .3s var(--ease-io)
}
.stripttl:active{background:var(--bg-tint)}
.wkback{
  font-size:12.5px;font-weight:600;color:var(--accent);
  padding:5px 10px;border-radius:99px;background:var(--bg-tint);flex:none;
}
.wknav[disabled]{opacity:.28}
.wknav[disabled]:active{background:transparent}
.daystrip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;padding:12px 10px}
.day{
  border-radius:13px;padding:9px 2px 8px;text-align:center;
  transition:background .24s var(--ease),color .24s var(--ease),transform .24s var(--spring);
}
.day .dn{font-size:11.5px;font-weight:600;color:var(--text-3)}
.day .dd{font-family:var(--font-display);font-size:17px;font-weight:600;margin-top:2px;font-variant-numeric:tabular-nums}
.day.today .dd{color:var(--accent)}
/* "Today" instead of the weekday letter. A dot here sat one line above the
   dots that count what is IN the day — same shape, two meanings, and the
   reader has to be told which is which. A word never needs explaining. */
.day .dn.isnow{color:var(--accent);font-weight:700;font-size:10.5px}
.day.today[aria-selected="true"] .dd{color:var(--on-accent)}
.day[aria-selected="true"] .dn.isnow{color:var(--on-accent)}
.day .dots{display:flex;justify-content:center;gap:3px;margin-top:5px;height:4px}
.day .dots i{width:4px;height:4px;border-radius:50%;background:var(--text-3);display:block}
.day[aria-selected="true"]{background:var(--accent);color:var(--on-accent)}
.day[aria-selected="true"] .dn{color:rgba(255,255,255,.8)}
.day[aria-selected="true"] .dots i{background:rgba(255,255,255,.85)}
.day:not([aria-selected="true"]):active{background:var(--bg-tint);transform:scale(.94)}
/* Paging a week is a move in a direction, and the strip says which: the new
   week arrives from the side you paged towards. `--dirf` makes the same two
   rules right in Hebrew and in English. */
@keyframes wkNext{from{opacity:0;transform:translateX(calc(-26px * var(--dirf)))}to{opacity:1;transform:none}}
@keyframes wkPrev{from{opacity:0;transform:translateX(calc(26px * var(--dirf)))}to{opacity:1;transform:none}}
.daystrip.wknext{animation:wkNext .26s var(--ease)}
.daystrip.wkprev{animation:wkPrev .26s var(--ease)}
/* The day's list rises the way the task views already swap into each other. */
#agenda.swap{animation:stackSwap .21s var(--ease-io)}

.ev{display:flex;gap:12px;padding:12px 14px;position:relative;align-items:flex-start}
.ev + .ev::before{content:"";position:absolute;top:0;height:1px;background:var(--sep);inset-inline-start:76px;inset-inline-end:0}
.evtime.allday{font-size:12px;line-height:1.3;white-space:normal}
.evtime{
  width:52px;flex:none;font-variant-numeric:tabular-nums;
  font-size:13.5px;font-weight:600;color:var(--text-2);line-height:1.35;
}
.evtime small{display:block;font-weight:500;color:var(--text-3);font-size:12.5px}
.evbar{width:3.5px;border-radius:3px;flex:none;align-self:stretch;min-height:34px}
.evtitle{font-size:16px;font-weight:500}
.evsub{font-size:13px;color:var(--text-2);margin-top:2px}
/* a task standing in the day alongside real calendar events, and openable
   from here — the same task, not a copy of it */
.ev[data-task]{cursor:pointer;border-radius:14px}
.ev[data-task] .evtitle{display:flex;align-items:center;gap:7px}
.evtag{
  font-size:10.5px;font-weight:700;letter-spacing:.04em;padding:2px 7px;border-radius:999px;
  background:var(--accent-soft);color:var(--accent);flex:none
}
/* Where an event is, under its title in the list — small, because the title
   is the thing and the place is only ever there to help find it. */
.tloc{display:block;font-size:11.5px;color:var(--text-3);margin-top:1px}
.glabel .sub{font-weight:600;color:var(--text-3)}
@keyframes evLand{
  0%{box-shadow:0 0 0 0 var(--accent-soft)}
  38%{box-shadow:0 0 0 9px var(--accent-soft)}
  100%{box-shadow:0 0 0 0 rgba(0,0,0,0)}
}
.ev.landing{animation:evLand .45s var(--ease)}
.ev.pressed{transform:scale(.972);transition:transform .18s var(--spring)}
/* the way back out of the list: one glyph, on the rows that have a day */
.tjump{
  width:26px;height:26px;flex:none;border-radius:9px;display:grid;place-items:center;
  color:var(--text-3);transition:background .3s var(--ease-io),color .18s var(--ease)
}
.tjump svg{width:15px;height:15px}
.tjump:active{background:var(--accent-soft);color:var(--accent)}
/* A shared task's pin. Filled where the task is pinned (the section at the
   top), an outline wherever it has gone back to its place. The path inside the
   symbol carries no fill of its own, so it inherits this one. */
.tpin{
  width:26px;height:26px;flex:none;border-radius:9px;display:grid;place-items:center;
  color:var(--text-3);transition:background .3s var(--ease-io),color .18s var(--ease)
}
.tpin svg{width:15px;height:15px;fill:none}
.tpin.on{color:var(--accent)}
.tpin.on svg{fill:currentColor}
.tpin:active{background:var(--accent-soft);color:var(--accent)}
.glabel .pinmark{width:12px;height:12px;fill:currentColor;vertical-align:-1px;margin-inline-end:6px}

.bigbtn{
  display:flex;align-items:center;justify-content:center;gap:9px;width:100%;
  padding:15px;border-radius:16px;background:var(--surface);
  box-shadow:var(--shadow-m);color:var(--accent);font-weight:600;font-size:16px;
  transition:transform .22s var(--spring),background .18s ease;
}
.bigbtn:active{transform:scale(.98);background:var(--bg-tint)}
.bigbtn svg{width:17px;height:17px}

/* ─────────────────────────  friends  ───────────────────────── */
.fav{
  width:38px;height:38px;border-radius:50%;flex:none;overflow:hidden;
  box-shadow:inset 0 0 0 .5px rgba(0,0,0,.08);
}

/* The read/write choice sits inside the service it governs, so there is
   never a question of what it applies to. It appears only when that service
   is on and only where writing is actually possible; everything else states
   plainly that it is read-only rather than offering a control with one answer. */
.accseg{display:inline-flex;align-items:stretch;gap:2px;padding:2px;border-radius:999px;background:var(--bg-tint);flex:none}
/* ── a mark instead of a caption ──
   The paragraph under the list used two sentences to say that writing
   includes reading. The control can say it itself: choosing כתיבה fades an
   ampersand in between the two words so the pair reads as one phrase —
   קריאה & כתיבה — and fades it back out the same way when only reading is
   granted. A caption is read once and never again; a mark that appears
   exactly where the answer is only has to be read once. */
.accseg .amp{
  width:0;overflow:hidden;flex:none;display:grid;place-items:center;
  font-size:12.5px;font-weight:700;color:var(--accent);opacity:0;
  transition:width var(--sw-t) var(--ease-io),opacity var(--sw-t) var(--ease-io),
             margin var(--sw-t) var(--ease-io);
}
/* Centred between the two BOXES it read as glued to the pill, because on one
   side it meets a hard filled edge 2px away and on the other a word 16px away.
   The margin is on the pill's side only — a painted edge needs more clearance
   than a letter does, and `.both` is the one state where which side is which
   is known: it is always the write pill. */
.accseg.both .amp{width:12px;opacity:1;margin-inline-end:6px}
/* reading is included, so its label leans to the accent without taking the
   pill — the pill still says which word you would tap to change things */
.accseg.both .mread{color:var(--accent)}
.accseg button{
  transition:background var(--sw-t) var(--ease-io),color var(--sw-t) var(--ease-io),
             box-shadow var(--sw-t) var(--ease-io);
}
.accseg button{
  font:inherit;font-size:12px;font-weight:600;line-height:1;padding:6px 12px;border-radius:999px;
  color:var(--text-2);white-space:nowrap;
  transition:background .24s var(--ease),color .24s var(--ease);
}
.accseg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:var(--shadow-s)}
.accseg button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.readonly{font-style:normal;font-size:12px;font-weight:600;color:var(--text-3);flex:none;white-space:nowrap}
/* title, what it governs, and the access choice all sit on one line: the
   control belongs beside the thing it applies to, not on a line below it
   where it read as a separate setting. */
/* the friends card still uses plain rows — one switch, no access control */
.permrow{display:flex;align-items:center;gap:12px;padding:11px 0}
.permrow .permtxt{flex:1;min-width:0}
/* Sharing a task with somebody is the thing the permission is FOR, so the
   way to do it sits on the permission's own row — and it comes and goes with
   the switch, on the same clip-path open/shut as the access control in
   Connections. An offer that outlives the permission it depends on would be
   an offer that fails when tapped. */
.permact{
  width:31px;height:31px;flex:none;border-radius:11px;display:grid;place-items:center;
  background:var(--accent-soft);color:var(--accent);
  transition:transform .38s var(--squash),background var(--sw-t) var(--ease-io);
}
.permact svg{width:16px;height:16px}
.permact:active{transform:scale(.88)}
.permact.opening{animation:segOpen var(--sw-t) var(--ease-io) backwards}
.permact.shutting{animation:segShut var(--sw-t) var(--ease-io) forwards}
.permrow + .permrow{border-top:1px solid var(--sep)}
/* Two things break this line, and both have bitten. No column-gap, because
   the separator is drawn on the cells themselves and a gap cuts it into three
   pieces. And no `align-items:center` either, for the same reason one
   dimension over: centred cells are each as tall as their own content, so
   their TOPS land at three different heights and the one border reads as
   three misaligned dashes. The cells stretch and their contents centre
   instead. */
.permgrid{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:stretch}
.permgrid > *{padding:11px 0}
.permtxt,.permctl{padding-inline-end:12px}
.permgrid > *:nth-child(n+4){border-top:1px solid var(--sep)}
.permtxt{min-width:0;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:1px}
.permctl{display:flex;justify-content:flex-end;min-height:31px;align-items:center}
.permsw{display:flex;justify-content:flex-end;align-items:center}
/* opens from its own middle, both halves parting at once, and closes back
   into it — the control belongs to the switch that just turned it on */
@keyframes segOpen{
  0%{clip-path:inset(0 50% 0 50% round 999px);opacity:0;transform:scaleY(.7)}
  60%{opacity:1}
  100%{clip-path:inset(0 0 0 0 round 999px);opacity:1;transform:none}
}
/* Closing ran at .62 of the opening and read as a different gesture. It is
   the same movement backwards, so it is now the exact mirror: same clock,
   and the opacity ramp reflected (open holds until 60%, shut fades after
   40%) instead of being a flat fade. */
@keyframes segShut{
  0%{clip-path:inset(0 0 0 0 round 999px);opacity:1;transform:none}
  40%{opacity:1}
  100%{clip-path:inset(0 50% 0 50% round 999px);opacity:0;transform:scaleY(.7)}
}
.permctl .accseg,.permctl .readonly{animation:segOpen var(--sw-t) var(--ease-io) backwards}
.permctl.shutting .accseg,.permctl.shutting .readonly{
  animation:segShut var(--sw-t) var(--ease-io) forwards
}
.permtxt b,.permtxt span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.permtxt b{font-size:15px;font-weight:500}
.permtxt span{font-size:12.5px;color:var(--text-2)}

/* ─────────────────────────  form fields  ───────────────────────── */
.field{display:flex;align-items:center;gap:12px;padding:10px 14px;position:relative;min-height:52px}
.field + .field::before{content:"";position:absolute;top:0;height:1px;background:var(--sep);inset-inline-start:14px;inset-inline-end:0}
.field label{width:104px;flex:none;font-size:15.5px;color:var(--text-2)}
[dir="ltr"] .field label{width:128px}
.field input{
  flex:1;min-width:0;border:0;background:none;font-size:16.5px;font-weight:500;
  padding:4px 0;color:var(--text);
}
.field input::placeholder{color:var(--text-3);font-weight:400}
.field input[type="date"],.field input[type="time"]{
  flex:1;direction:ltr;text-align:right;
  font-variant-numeric:tabular-nums;
}
[dir="ltr"] .field input[type="date"],[dir="ltr"] .field input[type="time"]{flex:none;width:auto;text-align:left}
.field input[type="date"]::-webkit-calendar-picker-indicator,
.field input[type="time"]::-webkit-calendar-picker-indicator{opacity:.45;cursor:pointer}
/* boxed form grid — short inputs sized to their content, not stretched
   edge to edge; used on the profile card and inside the task sheet */
.fpad{padding:16px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.ffield{display:flex;flex-direction:column;gap:7px;min-width:0}
.ffield.wide{grid-column:1/-1}
.ffield > label{
  font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:var(--text-3);
}
.ffield > input,.ffield > .dateval{
  width:100%;box-sizing:border-box;font:inherit;font-size:16px;font-weight:500;
  color:var(--text);background:var(--surface-2);border:1px solid var(--sep);
  border-radius:13px;padding:11px 13px;
  transition:border-color .2s var(--ease),box-shadow .2s var(--ease),background .2s var(--ease);
}
.ffield > input::placeholder{color:var(--text-3);font-weight:400}
.ffield > input:focus{
  outline:none;border-color:var(--accent);background:var(--surface);
  box-shadow:0 0 0 4px var(--accent-soft);
}
/* Chrome forces direction:ltr on date/time inputs, so text-align is the only
   lever that keeps their value on the same edge as every other field's. */
.ffield > input[type="date"],.ffield > input[type="time"]{
  font-variant-numeric:tabular-nums;text-align:right;padding-inline-end:8px;
}
[dir="ltr"] .ffield > input[type="date"],[dir="ltr"] .ffield > input[type="time"]{
  text-align:left;padding-inline-end:13px;
}
.ffield > input[type="date"]::-webkit-calendar-picker-indicator,
.ffield > input[type="time"]::-webkit-calendar-picker-indicator{opacity:.45;cursor:pointer}
.ffield > .dateval{text-align:start;display:block}
.ffield > .dateval.cityval{display:flex;align-items:center;gap:8px}
.ffield .seg{width:100%}
.seg{
  display:flex;gap:3px;padding:3px;border-radius:11px;background:var(--bg-tint);
  flex:1;
}
.seg button{
  flex:1;padding:7px 4px;border-radius:8.5px;font-size:14.5px;font-weight:600;
  color:var(--text-2);box-shadow:inset 0 0 0 1px var(--sep-2);
  transition:background var(--sw-t) var(--ease-io),color var(--sw-t) var(--ease-io),
             box-shadow var(--sw-t) var(--ease-io);
}
.seg button[aria-pressed="true"]{
  background:var(--seg-on);background-image:var(--sheen);color:var(--text);
  box-shadow:var(--shadow-s),var(--rim);
}

/* where Olma reaches YOU — a second question from "where do I open her",
   so it gets its own row rather than a fourth state on the tiles */
.defrow .defhead{padding-bottom:6px}
/* Title and answer on one line: "Reminders and updates — arrive on WhatsApp"
   is one thought, and stacking it made a two-line card out of a sentence.
   It wraps rather than clips, because the next language through here will be
   longer than both of the two this was checked in. */
.defrow .defhead .row-txt{display:flex;flex-wrap:wrap;align-items:baseline;column-gap:7px;row-gap:1px}
.defrow .defhead .row-sub{margin-top:0}
.defrow .defpick{padding-top:0}
.defrow .row-sub{color:var(--accent);font-weight:600}
/* ── the one word that changed ──
   Re-typing the whole sentence made the reader re-read a line they had
   already read. Only the channel's name is new, so only it moves: the old
   name falls away downward while the new one arrives from above, on the
   switch's clock. The hidden twin in normal flow is what holds the slot's
   width, so nothing around it reflows mid-movement. */
.wordslot{
  position:relative;display:inline-block;vertical-align:bottom;
  overflow:hidden;padding-block:2px;margin-block:-2px;
}
/* `wnow`/`wout`, not `live`/`out`: the header's activity pill answered to
   `.live` back then, and its padding and font-size landed on this the moment
   the names collided — no specificity fight, just two rules setting different
   things. The pill is `.livepill` now, precisely because this was the SECOND
   thing that word collected; the first was the groups section, which drew
   itself as a screen-wide lozenge for every real person in a room. */
.wordslot i{font-style:normal;display:inline-block;white-space:nowrap;padding:0;font-size:inherit}
.wordslot i.wghost{visibility:hidden}
.wordslot i.wnow,.wordslot i.wout{position:absolute;inset-inline-start:0;top:2px}
@keyframes wordUp{from{transform:translateY(-105%);opacity:0}to{transform:none;opacity:1}}
@keyframes wordDown{from{transform:none;opacity:1}to{transform:translateY(105%);opacity:0}}
.wordslot i.wnow.win{animation:wordUp var(--sw-t) var(--ease-io)}
.wordslot i.wout{animation:wordDown var(--sw-t) var(--ease-io) forwards}
.defseg{flex:1}
.defseg button{
  display:flex;align-items:center;justify-content:center;gap:6px;
  padding:7px 11px;font-size:13.5px;white-space:nowrap;
  transition:background var(--sw-t) var(--ease-io),color var(--sw-t) var(--ease-io),
             box-shadow var(--sw-t) var(--ease-io);
}
.defseg button svg{width:15px;height:15px;flex:none}
.defseg button[aria-pressed="true"]{
  background:transparent;color:var(--on-accent);box-shadow:none;
  transition:color .3s var(--ease-io) .1s;
}
/* The fill arrives from the middle of the chip and opens outward — the same
   gesture the access control makes one card up. The chip itself does not
   move: a control that jumps under your finger reads as a mis-tap. */
.defseg button{position:relative;z-index:0;overflow:hidden}
.defseg button::before{
  content:"";position:absolute;inset:0;border-radius:inherit;background:var(--accent);
  z-index:-1;opacity:0;clip-path:inset(0 50% 0 50% round 999px);
  transition:opacity var(--sw-t) var(--ease-io),clip-path var(--sw-t) var(--ease-io);
}
.defseg button[aria-pressed="true"]::before{opacity:1;clip-path:inset(0 0 0 0 round 999px)}
/* This was a keyframe fired by a `.picked` class the click added. A keyframe
   plays whenever the browser decides the element is new — coming back to this
   page replayed the open on BOTH chips before settling onto one, which is
   exactly the flicker that was reported. A transition cannot do that: with no
   state change on arrival there is nothing to animate, and the same gesture
   still plays on the only event that means anything, the tap. */
/* the card the choice landed on says so, and the badge drops in */
@keyframes badgeIn{
  0%{opacity:0;transform:translateY(-7px) scale(.6)}
  62%{opacity:1;transform:translateY(1px) scale(1.08)}
  100%{opacity:1;transform:none}
}
/* A word inside a card whose caption is already a sentence is one word too
   many. The mark says the same thing in the corner, the way a badge on an app
   icon does, and the word survives for anybody listening to the page rather
   than looking at it. The bell is the honest glyph: default means this is
   where she REACHES you, not where you open her. */
.defbadge{
  position:absolute;top:8px;inset-inline-end:8px;
  width:19px;height:19px;border-radius:999px;
  background:var(--accent);color:var(--on-accent);
  display:grid;place-items:center;text-decoration:none;
  animation:badgeIn .26s var(--squash) backwards;
}
.defbadge svg{width:10px;height:10px}
.defbadge.out{animation:badgeIn .14s var(--ease-io) reverse forwards}
.chan.isdefault{box-shadow:var(--shadow-m),inset 0 0 0 1.5px var(--accent-soft)}
.chan{transition:transform .28s var(--squash),box-shadow .42s var(--ease-io)}

/* The profile has no title; its hero is what closes the band there. */
/* The animal sits beside the name rather than above it (the owner,
   2026-09-30): half a screen of band pushed every setting below the fold.
   It stays large — 88px, bigger than the 64 first proposed, at his ask. */
.hero-profile{
  display:flex;align-items:center;gap:16px;padding:6px 24px 24px;
  margin:0 -18px 18px;background:var(--band);color:var(--on-band);border-radius:0 0 28px 28px;
}
.view.active > .hero-profile{animation:none}
.view.active > .hero-profile > *{animation:rise .25s var(--ease) both}
.hero-profile .linkbtn{color:var(--on-band);text-decoration:underline;text-underline-offset:3px;font-size:14.5px}
.hero-profile .avatar{width:88px;height:88px;flex:none}
.hero-profile .who{display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-width:0}
.hero-profile .who b{display:block;font-family:var(--font-display);font-size:24px;font-weight:600;overflow-wrap:anywhere}

/* The profile as sentences: the task sheet's row (.srow — icon, what the row
   is, what is set), and each opens its own controls in place beneath it. */
.profrows .fold + .srow::before{
  content:"";position:absolute;top:0;height:1px;background:var(--sep);
  inset-inline-start:62px;inset-inline-end:0;
}
.profrows .slab{display:flex;align-items:baseline;gap:6px}
.profrows .sval{overflow-wrap:anywhere}
.pfin{border-top:1px solid var(--sep);background:color-mix(in oklab,var(--bg) 45%,var(--surface))}
.pfpad{padding:12px 14px 12px}
.pfin > .pfpad + .row::before,.pfin > .pnote + .row::before{
  content:"";position:absolute;top:0;height:1px;background:var(--sep);inset-inline-start:14px;inset-inline-end:0;
}
.pnote{padding:0 14px 14px;margin:0}
.pfin > .row + .pnote{padding-top:2px}

/* ─────────────────────────  profile settings  ───────────────────────── */
/* A row whose control is too wide to share a line with its title: the title
   keeps the row's rhythm, the control takes the full width under it. */
.row.stackrow{flex-direction:column;align-items:stretch;gap:10px;padding-top:12px;padding-bottom:13px}
.row.stackrow .rowline{display:flex;align-items:center;gap:12px}
.row.stackrow .seg{flex:none}
.hoursvals{gap:4px;flex-wrap:nowrap}
.hoursvals .vchip{font-variant-numeric:tabular-nums;min-width:62px;text-align:center}
.digestvals{display:flex;margin-top:9px}
.digestvals .vchip{font-variant-numeric:tabular-nums}
.hoursdash{color:var(--text-3);font-weight:600}
.row-sub.auto{color:var(--accent)}

/* The week as seven round keys. A quiet day is a day she keeps her distance,
   so the pressed state is the moon-coloured one rather than a bright tick. */
.daypick{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.daypick button{
  aspect-ratio:1;max-width:44px;width:100%;justify-self:center;border-radius:50%;
  background:var(--bg-tint);color:var(--text-2);font-size:14.5px;font-weight:650;
  display:grid;place-items:center;
  transition:background .26s var(--ease-io),color .26s var(--ease-io),transform .38s var(--squash),box-shadow .26s var(--ease-io);
}
.daypick button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);box-shadow:var(--shadow-s)}
.daypick button:active{transform:scale(.9)}
.daypick button.pop{animation:chipPop .22s var(--ease-io)}

.flabel{font-size:12.5px;font-weight:600;color:var(--text-3);margin:4px 0 8px}
.foldpad .seg{margin-bottom:2px}
.flabel + .seg,.chips + .flabel{margin-top:14px}
.tchip{display:inline-flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.tchip i{font-style:normal;opacity:.55;font-size:12px;line-height:1}
.tchip.add{background:transparent;box-shadow:inset 0 0 0 1.4px var(--sep-2);color:var(--accent)}
.tchip.add svg{width:11px;height:11px}
.tchip.enter{animation:chipPop .24s var(--ease-io)}

/* The receipt. It appears beside the card's label for a moment and fades —
   loud enough to be seen, quiet enough never to be a toast per keystroke. */
.savedmark{color:var(--ok);opacity:0;transform:translateY(2px);transition:opacity .3s var(--ease),transform .3s var(--ease)}
.savedmark.show{opacity:1;transform:none}

/* ── what Olma knows ─────────────────────────────────────────── */
.fqhead{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin:2px 0 10px}
.fqhead b{font-size:14px;font-weight:650}
.fqhead span{font-size:12.5px;color:var(--text-3)}
.fqlist{display:flex;flex-direction:column;gap:9px}
/* Each question is its own small card inside the group, so three of them read
   as three things to answer rather than one long form. The wrapper animates
   its height; the card inside animates everything else. */
.fqwrap{display:grid;grid-template-rows:1fr;transition:grid-template-rows .42s var(--ease-io),margin .42s var(--ease-io)}
.fqwrap > .fq{min-height:0;overflow:hidden}
.fq{
  background:var(--bg);border-radius:14px;padding:12px 12px 12px;
  box-shadow:inset 0 0 0 1px var(--sep);
  transition:opacity .3s var(--ease),transform .42s var(--spring),box-shadow .3s var(--ease),background .3s var(--ease);
}
.fq .fqtop{display:flex;align-items:flex-start;gap:10px}
.fq .fqq{flex:1;font-size:15px;font-weight:600;line-height:1.35;padding-top:5px}
.fq .fqskip{flex:none;width:26px;height:26px;border-radius:50%;color:var(--text-3);font-size:13px;display:grid;place-items:center}
.fq .fqskip:active{background:var(--bg-tint)}
.fq .fqbody{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.fq .fqin{flex:1;min-width:0;display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.fq .fqin .daypick{flex:1;gap:4px}
.fq .fqin .daypick button{max-width:36px;font-size:13px}
.fq .fqtext{
  /* 16px for the same reason as .searchwrap input — see there. */
  flex:1;min-width:0;border:0;background:var(--surface);border-radius:11px;
  font:inherit;font-size:16px;color:var(--text);padding:9px 12px;outline:none;
  box-shadow:inset 0 0 0 1px var(--sep);
}
.fq .fqtext:focus{box-shadow:inset 0 0 0 1.6px var(--accent)}
.fq .fqtime{
  min-width:74px;height:38px;padding:0 12px;border-radius:11px;background:var(--surface);
  box-shadow:inset 0 0 0 1px var(--sep);font-size:15px;font-weight:600;color:var(--text-3);
  font-variant-numeric:tabular-nums;direction:ltr;
  transition:box-shadow .26s var(--ease-io),transform .38s var(--squash);
}
.fq .fqtime.set{color:var(--text)}
.fq .fqtime.open{box-shadow:inset 0 0 0 1.6px var(--accent)}
.fq .fqtime:active{transform:scale(.95)}
.fq .fqto{color:var(--text-3);font-weight:600}
.fqok{
  flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;
  background:var(--bg-tint);color:var(--text-3);align-self:flex-end;
  transition:background .26s var(--ease-io),color .26s var(--ease-io),transform .38s var(--squash);
}
.fqok svg{width:17px;height:17px}
.fqok:not([disabled]){background:var(--action);color:var(--on-action);box-shadow:var(--shadow-s)}
.fqok:not([disabled]):active{transform:scale(.9)}
.fqok[disabled]{cursor:default}
/* saved: the tick turns green and pops, the card lifts and folds away */
.fq.done .fqok{background:var(--ok);color:var(--on-accent);animation:okPop .3s var(--spring)}
.fq.done{box-shadow:inset 0 0 0 1.5px var(--ok);background:var(--surface)}
.fqwrap.leaving{grid-template-rows:0fr;margin-top:-9px}
.fqwrap.leaving > .fq{opacity:0;transform:translateY(-6px) scale(.97)}
.fqwrap.skipping > .fq{opacity:0;transform:translateX(calc(40px * var(--dirf)))}
.fqwrap.entering{grid-template-rows:0fr}
.fqwrap.entering > .fq{opacity:0;transform:translateY(12px) scale(.98)}
.fqdone{font-size:13.5px;color:var(--text-2);text-align:center;padding:8px 0 2px}

.factshead{margin-top:18px;display:flex;justify-content:space-between}
.factlist{display:flex;flex-direction:column}
.factwrap{display:grid;grid-template-rows:1fr;transition:grid-template-rows .4s var(--ease-io),opacity .3s var(--ease)}
.factwrap > .fact{min-height:0;overflow:hidden}
.fact{display:flex;align-items:center;gap:10px;padding:9px 8px;margin-inline:-8px;position:relative;border-radius:10px;
  transition:background .9s var(--ease)}
.factwrap + .factwrap .fact::before{content:"";position:absolute;top:0;inset-inline:8px;height:1px;background:var(--sep)}
.fact .ftxt{flex:1;min-width:0;font-size:14.5px;line-height:1.4}
.fact .fcat{flex:none;font-size:11px;font-weight:650;color:var(--text-3);background:var(--bg-tint);padding:2px 8px;border-radius:999px}
