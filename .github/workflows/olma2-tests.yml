name: olma2 tests

# The decided CI: every push runs the full suite against a real Postgres.
# On a merge to main, the deploy job below runs scripts/deploy.sh against
# the live server and restarts the services — see CLAUDE.md "Deploy+test".
on:
  push:
    paths: ['olma2/**', '.github/workflows/olma2-tests.yml']
  pull_request:
    # The workflow file is in this list for the same reason it is in `push`
    # above: a change to CI has to be checked BY CI. Without it a PR touching
    # only this file gets no `test` check at all — it shows a green tick that
    # means "nothing ran", which is the same "pending reads as fine" failure
    # the timeouts below exist to end. Found on the PR that added them, which
    # was itself unchecked.
    paths: ['olma2/**', '.github/workflows/olma2-tests.yml']

# Two branches picking the same next migration number is the ordinary way
# this repo works (see the "Two branches, one migration number" incident in
# CLAUDE.md, and its repeat on 2026-08-29 — three collisions in two days).
# That is a correctness problem the migrations job below catches. This block
# is the OTHER half: on `main`, each push triggers a real `deploy.sh
# --restart` against the one production box, and two of those running at once
# would race the same `/opt/olma2-previous` rollback snapshot. Grouping by
# ref and refusing to cancel main's queue makes concurrent merges run their
# full test+deploy pipelines one at a time, in order, instead of overlapping
# — exactly the discipline this session followed by hand for three merges
# in a row before this existed. Every other ref (a PR, a feature-branch
# push) still cancels its own superseded runs, which is the ordinary CI
# time-saving default and has no deploy to protect.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # DB-less and dependency-less — migrate.js's collision check needs neither
  # Postgres nor `npm install`, so this fails in seconds with the one line
  # that explains it, before the test job spends several minutes running (and
  # failing) 500+ tests to discover the same thing via every freshDb() in the
  # suite throwing in its `before` hook.
  migrations:
    runs-on: ubuntu-latest
    # Observed 5-20s. See the timeout note on `test` below for why these exist.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node olma2/scripts/check-migrations.js
      # deploy.sh and rollback.sh are the two files in this repo that no test
      # can execute end-to-end — running them IS deploying to the one
      # production box. That makes a syntax error in them uniquely expensive:
      # `set -euo pipefail` means bash dies at the bad line, and in deploy.sh
      # the bad line can fall between the rsync and the rollback safeguard,
      # leaving the box in a state no automation is left running to repair.
      # `bash -n` parses without executing, which is the whole check that CAN
      # be run for free. It rides in the `migrations` job because that job is
      # already the seconds-fast gate that runs before anything expensive.
      - run: bash -n olma2/scripts/deploy.sh olma2/scripts/rollback.sh olma2/scripts/prune-releases.sh

  test:
    needs: migrations
    runs-on: ubuntu-latest
    # Observed 45-90s across recent successful runs, so 10 minutes is ~7-13x
    # headroom and nothing legitimate will reach it.
    #
    # It exists because of what happened on 2026-09-03: `node --test` wedged
    # mid-suite three times in one evening — a few test files reported, then
    # total silence, with the Postgres service logging nothing at all (so it
    # was idle, not the culprit). The same commit passed 707/707 on an earlier
    # run and 756/756 on a later one, so the code was never the problem.
    #
    # GitHub's default is a SIX HOUR job timeout. Without this line a wedge
    # holds a runner for six hours and, worse, shows as a pending check
    # forever — which reads as "CI hasn't got to it yet" rather than "this is
    # dead". Three of those cost about an hour of a session before anyone
    # thought to compare a run's frozen `updated_at` against its sibling.
    # Failing at 10 minutes turns an invisible hang into a red check someone
    # can just re-run.
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: olma
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: olma2_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      OLMA_TEST_ADMIN_URL: postgres://olma:ci-password@127.0.0.1:5432/olma2_test
      OLMA_DB_URL: postgres://olma:ci-password@127.0.0.1:5432/olma2_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
        working-directory: olma2
      - run: node --test 'tests/*.test.js'
        working-directory: olma2

  deploy:
    needs: test
    # Deliberately loose (observed 160-178s), and the asymmetry with `test`
    # above is the whole point. Killing a verification job costs nothing; the
    # work is pure and re-running is free. Killing THIS one can interrupt
    # deploy.sh between the rsync and its own rollback safeguard, leaving the
    # box in a state no automation is left running to repair. So the tight
    # timeout goes where it is safe and a generous one goes here — long enough
    # that only a genuine hang reaches it, short enough that a hung deploy is
    # not still holding main's serialized queue hours later.
    timeout-minutes: 30
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up deploy SSH key
        run: |
          install -m 600 /dev/null /tmp/deploy_key
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > /tmp/deploy_key
          mkdir -p ~/.ssh
          ssh-keyscan -H 157.230.210.233 >> ~/.ssh/known_hosts
      - name: Deploy and restart
        run: SSH_KEY=/tmp/deploy_key bash olma2/scripts/deploy.sh --restart
      - name: Clean up deploy key
        if: always()
        run: rm -f /tmp/deploy_key
