name: olma2 tests

# The decided CI: every push runs the full suite against a real Postgres.
# On a merge to main, the deploy job below runs scripts/deploy.sh against
# the live server and restarts the services — see CLAUDE.md "Deploy+test".
on:
  push:
    paths: ['olma2/**', '.github/workflows/olma2-tests.yml']
  pull_request:
    paths: ['olma2/**']

# Two branches picking the same next migration number is the ordinary way
# this repo works (see the "Two branches, one migration number" incident in
# CLAUDE.md, and its repeat on 2026-08-29 — three collisions in two days).
# That is a correctness problem the migrations job below catches. This block
# is the OTHER half: on `main`, each push triggers a real `deploy.sh
# --restart` against the one production box, and two of those running at once
# would race the same `/opt/olma2-previous` rollback snapshot. Grouping by
# ref and refusing to cancel main's queue makes concurrent merges run their
# full test+deploy pipelines one at a time, in order, instead of overlapping
# — exactly the discipline this session followed by hand for three merges
# in a row before this existed. Every other ref (a PR, a feature-branch
# push) still cancels its own superseded runs, which is the ordinary CI
# time-saving default and has no deploy to protect.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # DB-less and dependency-less — migrate.js's collision check needs neither
  # Postgres nor `npm install`, so this fails in seconds with the one line
  # that explains it, before the test job spends several minutes running (and
  # failing) 500+ tests to discover the same thing via every freshDb() in the
  # suite throwing in its `before` hook.
  migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node olma2/scripts/check-migrations.js

  test:
    needs: migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: olma
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: olma2_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      OLMA_TEST_ADMIN_URL: postgres://olma:ci-password@127.0.0.1:5432/olma2_test
      OLMA_DB_URL: postgres://olma:ci-password@127.0.0.1:5432/olma2_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
        working-directory: olma2
      - run: node --test 'tests/*.test.js'
        working-directory: olma2

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up deploy SSH key
        run: |
          install -m 600 /dev/null /tmp/deploy_key
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > /tmp/deploy_key
          mkdir -p ~/.ssh
          ssh-keyscan -H 157.230.210.233 >> ~/.ssh/known_hosts
      - name: Deploy and restart
        run: SSH_KEY=/tmp/deploy_key bash olma2/scripts/deploy.sh --restart
      - name: Clean up deploy key
        if: always()
        run: rm -f /tmp/deploy_key
