<title>עולמה · הצלחת של היום</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Hebrew:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a WhatsApp chat with Olma beside the "today" page she links to. Phone: one at a time, switched from the band.
   Brand: Allma Cypress + Mustard on Sand (same tokens as games/public/night.html). Mustard = the ONE main action. */
:root{
  color-scheme:light;
  --font:'IBM Plex Sans Hebrew',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --bg:#F0EDE5;--fill:#EDEAE2;--surface:#FFFFFF;--surface-2:#F8F7F3;
  --sep:#E2DFD6;--sep-2:#D2CFC5;--text:#0E1F1E;--text-2:#44504E;--text-3:#5E6966;
  --accent:#004643;--accent-soft:#E1EBE8;--on-accent:#FFFFFF;
  --action:#F9C23C;--on-action:#004643;
  --band:#004643;--on-band:#F0EDE5;--on-band-2:#BFD3CF;--band-tint:rgba(255,255,255,.14);
  --logo-d:#004643;--logo-l:#F0EDE5;--logo-lens:#F9C23C;--logo-ring:#004643;
  --bubble-me:#DDEBE6;--bubble-ol:#FFFFFF;--chat-bg:#E9E6DD;
  --wall-ink:rgba(0,70,67,.06);
  --m-protein:#009488;--m-carbs:#C98A0E;--m-fat:#A0559A;
  --track:#ECE9E1;
  --shadow-s:0 1px 2px rgba(14,31,30,.06);
  --shadow-m:0 1px 2px rgba(14,31,30,.05),0 12px 30px -18px rgba(14,31,30,.32);
  --ease:cubic-bezier(.22,1,.36,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#1B1A18;--fill:#36342D;--surface:#26251F;--surface-2:#2D2B26;
  --sep:#35332D;--sep-2:#44413A;--text:#EDE9DF;--text-2:#B9B5AC;--text-3:#A39F96;
  --accent:#7CC4BA;--accent-soft:#1F3532;--on-accent:#1B1A18;
  --action:#F9C23C;--on-action:#0E1F1E;
  --band:#004643;--on-band:#EDE9DF;--on-band-2:#AFC6C1;--band-tint:rgba(255,255,255,.1);
  --logo-d:#1B1A18;--logo-l:#EDE9DF;--logo-lens:#F9C23C;--logo-ring:#EDE9DF;
  --bubble-me:#1F3532;--bubble-ol:#2D2B26;--chat-bg:#161513;
  --wall-ink:rgba(240,237,229,.04);
  --m-protein:#279E93;--m-carbs:#B57D0C;--m-fat:#B06AA9;
  --track:#34322C;
  --shadow-s:0 1px 2px rgba(0,0,0,.4);
  --shadow-m:0 1px 2px rgba(0,0,0,.4),0 12px 30px -18px rgba(0,0,0,.8);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#1B1A18;--fill:#36342D;--surface:#26251F;--surface-2:#2D2B26;
  --sep:#35332D;--sep-2:#44413A;--text:#EDE9DF;--text-2:#B9B5AC;--text-3:#A39F96;
  --accent:#7CC4BA;--accent-soft:#1F3532;--on-accent:#1B1A18;
  --action:#F9C23C;--on-action:#0E1F1E;
  --band:#004643;--on-band:#EDE9DF;--on-band-2:#AFC6C1;--band-tint:rgba(255,255,255,.1);
  --logo-d:#1B1A18;--logo-l:#EDE9DF;--logo-lens:#F9C23C;--logo-ring:#EDE9DF;
  --bubble-me:#1F3532;--bubble-ol:#2D2B26;--chat-bg:#161513;
  --wall-ink:rgba(240,237,229,.04);
  --m-protein:#279E93;--m-carbs:#B57D0C;--m-fat:#B06AA9;
  --track:#34322C;
  --shadow-s:0 1px 2px rgba(0,0,0,.4);
  --shadow-m:0 1px 2px rgba(0,0,0,.4),0 12px 30px -18px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}

/* band */
.band{background:var(--band);color:var(--on-band);padding:12px 16px}
.band .in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.mark{width:34px;height:34px;flex:none}
.brand b{display:block;font-size:17px;font-weight:700;letter-spacing:-.01em}
.brand span{display:block;font-size:12.5px;color:var(--on-band-2)}
.pill{font-size:11.5px;font-weight:600;letter-spacing:.04em;padding:3px 9px;border-radius:99px;background:var(--band-tint);color:var(--on-band)}
.ibtn{width:36px;height:36px;border-radius:50%;border:0;background:var(--band-tint);color:var(--on-band);display:grid;place-items:center}
.ibtn svg{width:18px;height:18px}
.seg{display:none;background:var(--band-tint);border-radius:99px;padding:3px;gap:2px;width:100%}
.seg button{flex:1;border:0;background:transparent;color:var(--on-band);padding:7px 10px;border-radius:99px;font-size:14px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--on-band);color:var(--band)}

.stage{max-width:1180px;margin:0 auto;padding:22px 16px 40px;display:grid;grid-template-columns:400px minmax(0,1fr);gap:28px;align-items:start}
.col-h{font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--text-3);margin:0 4px 8px}

/* phone / chat */
.phone{background:var(--chat-bg);border-radius:28px;border:1px solid var(--sep);box-shadow:var(--shadow-m);overflow:hidden;display:flex;flex-direction:column;height:min(780px,calc(100vh - 120px));min-height:560px;position:sticky;top:calc(16px + env(safe-area-inset-top,0px))}
.chathead{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--surface);border-bottom:1px solid var(--sep)}
.chathead .mark{width:36px;height:36px}
.chathead b{display:block;font-size:15.5px}
.chathead span{display:block;font-size:12.5px;color:var(--text-3)}
.msgs{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:8px;
  background-image:radial-gradient(var(--wall-ink) 1.4px,transparent 1.6px);background-size:22px 22px}
.day-chip{align-self:center;font-size:12px;color:var(--text-2);background:var(--surface);padding:3px 10px;border-radius:8px;box-shadow:var(--shadow-s)}
.b{max-width:86%;padding:8px 11px 6px;border-radius:14px;box-shadow:var(--shadow-s);font-size:14.5px;line-height:1.45;position:relative;animation:pop .28s var(--ease) both}
.b.me{align-self:flex-start;background:var(--bubble-me);border-start-start-radius:4px}
.b.ol{align-self:flex-end;background:var(--bubble-ol);border-start-end-radius:4px}
.b .t{display:block;font-size:11px;color:var(--text-3);text-align:end;margin-top:2px}
.b.photo{padding:4px;width:200px}
.b.photo .ph{width:100%;aspect-ratio:1;border-radius:11px;overflow:hidden;display:block;max-width:100%}
.b.photo .ph>svg,.b.photo .ph>img{width:100%;height:100%;display:block;object-fit:cover}
.b.photo .t{padding:0 6px 2px}
.b.wide{max-width:94%;width:330px}
.b p{margin:0}
.b p+p{margin-top:6px}
.typing{align-self:flex-end;display:flex;gap:4px;padding:11px 13px;border-radius:14px;background:var(--bubble-ol);box-shadow:var(--shadow-s);align-items:center}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--text-3);animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
.typing span{font-size:12.5px;color:var(--text-3);margin-inline-start:6px}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.98)}to{opacity:1;transform:none}}

/* analysis card */
.ana h4{margin:0 0 2px;font-size:14.5px}
.ana .sub{font-size:12.5px;color:var(--text-3);margin-bottom:8px}
.rows{display:flex;flex-direction:column;border-top:1px solid var(--sep)}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto 52px;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--sep)}
.row .nm{min-width:0;font-size:14px;display:flex;align-items:center;gap:6px}
.row .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.conf{font-size:10.5px;font-weight:600;padding:1px 6px;border-radius:99px;background:var(--fill);color:var(--text-2);flex:none}
.step{display:flex;align-items:center;background:var(--surface-2);border:1px solid var(--sep);border-radius:99px}
.step button{width:26px;height:26px;border:0;background:transparent;font-size:16px;line-height:1;border-radius:50%;color:var(--accent);font-weight:700}
.step button:disabled{opacity:.3;cursor:default}
.step output{min-width:50px;text-align:center;font-size:13px}
.row .kc{text-align:start;font-size:13px;color:var(--text-2)}
.tot{display:flex;gap:10px;flex-wrap:wrap;align-items:baseline;margin-top:8px;font-size:12.5px;color:var(--text-2)}
.tot b{font-size:17px;color:var(--text);margin-inline-end:auto}
.tot .dot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-inline-end:4px;vertical-align:1px}
.acts{display:flex;gap:8px;margin-top:10px}
.btn{border:0;border-radius:99px;padding:8px 16px;font-weight:600;font-size:14px}
.btn.main{background:var(--action);color:var(--on-action)}
.btn.ghost{background:var(--fill);color:var(--text-2)}
.done-tag{font-size:13px;font-weight:600;color:var(--accent);margin-top:10px;display:flex;align-items:center;gap:6px}
details.peek{margin-top:8px;font-size:12px;color:var(--text-3)}
details.peek summary{cursor:pointer}
details.peek pre{font-family:var(--mono);font-size:11px;line-height:1.5;background:var(--surface-2);border:1px solid var(--sep);border-radius:8px;padding:8px;overflow-x:auto;direction:ltr;text-align:left;color:var(--text-2);margin:6px 0 0;max-height:220px}
.linkcard{display:flex;align-items:center;gap:10px;margin-top:8px;padding:8px 10px;border-radius:10px;background:var(--accent-soft);border:0;width:100%;text-align:start}
.linkcard .mark{width:26px;height:26px}
.linkcard b{font-size:13.5px;display:block}
.linkcard span{font-size:12px;color:var(--text-2)}

/* tray + composer */
.tray{display:flex;gap:8px;align-items:center;padding:8px 10px 0;background:var(--chat-bg);overflow-x:auto}
.tray .lbl{font-size:12px;color:var(--text-3);flex:none}
.thumb{flex:none;width:52px;height:52px;border-radius:12px;border:2px solid var(--surface);box-shadow:var(--shadow-s);padding:0;overflow:hidden;background:var(--surface)}
.thumb svg{width:100%;height:100%;display:block}
.thumb[disabled]{opacity:.35;cursor:default}
.upl{flex:none;height:52px;border-radius:12px;border:1.5px dashed var(--sep-2);background:var(--surface-2);padding:0 12px;font-size:12.5px;font-weight:600;color:var(--accent);display:flex;align-items:center;gap:6px;cursor:pointer}
.upl svg{width:18px;height:18px}
.composer{display:flex;gap:8px;padding:8px 10px 10px;background:var(--chat-bg)}
.composer input{flex:1;min-width:0;border:0;border-radius:99px;padding:10px 14px;font:inherit;font-size:15px;background:var(--surface);color:var(--text);box-shadow:var(--shadow-s)}
.composer .send{width:42px;height:42px;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;flex:none}
.composer .send svg{width:19px;height:19px}

/* today page */
.today{display:flex;flex-direction:column;gap:18px;min-width:0}
.card{background:var(--surface);border:1px solid var(--sep);border-radius:20px;padding:18px;box-shadow:var(--shadow-s)}
.dayhead{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap}
.dayhead h1{margin:0;font-size:26px;letter-spacing:-.02em;line-height:1.15;text-wrap:balance}
.dayhead p{margin:2px 0 0;color:var(--text-3);font-size:13.5px}
.hero{display:grid;grid-template-columns:200px minmax(0,1fr);gap:24px;align-items:center}
.ring{position:relative;width:200px;height:200px;max-width:100%}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .ctr{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .big{font-size:40px;font-weight:700;letter-spacing:-.03em;line-height:1}
.ring .of{font-size:13px;color:var(--text-3);margin-top:4px}
.ring .left{font-size:13px;font-weight:600;color:var(--accent);margin-top:6px}
.ring circle{transition:stroke-dashoffset .9s var(--ease)}
.macros{display:flex;flex-direction:column;gap:14px;min-width:0}
.mac .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:14px}
.mac .top b{font-weight:600}
.mac .top span{color:var(--text-2);font-size:13.5px}
.bar{height:10px;border-radius:99px;background:var(--track);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:99px;transition:width .9s var(--ease)}
.say{display:flex;gap:10px;align-items:flex-start;background:var(--accent-soft);border-radius:14px;padding:12px 14px;font-size:14.5px}
.say .mark{width:24px;height:24px;margin-top:1px}
.flash{animation:flash 1.1s var(--ease)}
@keyframes flash{0%{box-shadow:0 0 0 0 var(--action)}30%{box-shadow:0 0 0 4px var(--action)}100%{box-shadow:var(--shadow-s)}}

.sec-h{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 10px}
.sec-h h2{margin:0;font-size:16px}
.sec-h span{font-size:12.5px;color:var(--text-3)}
.meals{display:flex;flex-direction:column}
.meal{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--sep)}
.meal:first-child{border-top:0;padding-top:0}
.meal .im{width:52px;height:52px;border-radius:12px;overflow:hidden;background:var(--fill)}
.meal .im svg,.meal .im img{width:100%;height:100%;display:block;object-fit:cover}
.meal .im.empty{display:grid;place-items:center;color:var(--text-3);border:1.5px dashed var(--sep-2);background:transparent}
.meal .nm{min-width:0}
.meal .nm small{display:block;font-size:12px;color:var(--text-3)}
.meal .nm b{display:block;font-weight:600;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meal .nm .mx{font-size:12px;color:var(--text-2)}
.meal .kc{font-weight:600;font-size:15px}
.meal .kc small{font-weight:400;color:var(--text-3);font-size:11.5px}
.meal.new{animation:pop .5s var(--ease) both}

.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:18px}
.cups{display:flex;gap:6px;flex-wrap:wrap}
.cup{width:34px;height:42px;border:0;background:transparent;padding:0;color:var(--sep-2)}
.cup.on{color:var(--m-protein)}
.cup svg{width:100%;height:100%}
.week{position:relative}
.week svg{width:100%;height:auto;display:block}
.tip{position:absolute;pointer-events:none;background:var(--text);color:var(--bg);font-size:12px;padding:4px 8px;border-radius:6px;white-space:nowrap;transform:translate(50%,-100%);opacity:0;transition:opacity .12s}
.foot{text-align:center;font-size:12.5px;color:var(--text-3);margin:4px 0 0}
.note{font-size:12px;color:var(--text-3)}

@media (max-width:900px){
  .seg{display:flex}
  .stage{grid-template-columns:minmax(0,1fr);padding-top:14px}
  .stage[data-view="chat"] .today{display:none}
  .stage[data-view="today"] .chatcol{display:none}
  .phone{position:static;height:calc(100vh - 150px);min-height:520px;border-radius:20px}
  .col-h{display:none}
}
@media (max-width:560px){
  .hero{grid-template-columns:minmax(0,1fr);justify-items:center}
  .macros{width:100%}
  .two{grid-template-columns:minmax(0,1fr)}
  .dayhead h1{font-size:22px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* v2: quick chips, demo strip, onboarding, learned portions, no-numbers mode */
.demo{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:0 4px 10px}
.demo span{font-size:12px;color:var(--text-3)}
.demo button{border:1px solid var(--sep-2);background:var(--surface);border-radius:99px;padding:5px 11px;font-size:12.5px;font-weight:600;color:var(--accent)}
.chips{display:flex;gap:6px;padding:8px 10px 0;background:var(--chat-bg);overflow-x:auto}
.chip{flex:none;border:1px solid var(--sep-2);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:13px;font-weight:500;color:var(--text)}
.qr{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.qr button{border:1px solid var(--accent);background:transparent;color:var(--accent);border-radius:99px;padding:5px 12px;font-size:13px;font-weight:600;text-align:start}
.qr button:disabled{opacity:.4;cursor:default}
.qr button.picked{background:var(--accent);color:var(--on-accent);opacity:1}
.conf.mine{background:var(--accent-soft);color:var(--accent)}
.conf.lbl{background:var(--accent-soft);color:var(--accent)}
.grp{font-size:11px;font-weight:600;padding:1px 7px;border-radius:99px;background:var(--fill);color:var(--text-2);flex:none}
.goalcard{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:8px 0 2px}
.goalcard div{background:var(--surface-2);border:1px solid var(--sep);border-radius:10px;padding:6px 4px;text-align:center}
.goalcard b{display:block;font-size:16px}
.goalcard span{font-size:11px;color:var(--text-3)}
.small{font-size:12.5px;color:var(--text-3)}
.wk{display:block;width:100%;height:auto;margin:6px 0 4px}
.switch{display:flex;align-items:center;gap:8px;border:0;background:var(--surface);border:1px solid var(--sep);border-radius:99px;padding:5px 6px 5px 12px;font-size:13px;font-weight:600;color:var(--text-2)}
.switch i{width:34px;height:20px;border-radius:99px;background:var(--sep-2);position:relative;flex:none;transition:background .2s}
.switch i::after{content:"";position:absolute;top:2px;inset-inline-start:2px;width:16px;height:16px;border-radius:50%;background:var(--surface);transition:inset-inline-start .2s var(--ease)}
.switch[aria-checked="true"] i{background:var(--accent)}
.switch[aria-checked="true"] i::after{inset-inline-start:16px}
.bal{display:flex;flex-direction:column;gap:14px;width:100%}
.bal .lead{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.bal .lead small{display:block;font-size:13.5px;font-weight:400;color:var(--text-3);letter-spacing:0;margin-top:4px}
.balrow{display:grid;grid-template-columns:120px minmax(0,1fr);gap:10px;align-items:center;font-size:14px}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dots i{width:22px;height:22px;border-radius:50%;border:2px solid var(--sep-2)}
.dots i.on{border-color:transparent}
.learn{display:flex;flex-direction:column}
.lrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--sep)}
.lrow:first-child{border-top:0;padding-top:0}
.lrow b{font-weight:600;font-size:14.5px}
.lrow span{display:block;font-size:12px;color:var(--text-3)}
.lrow button{border:0;background:var(--fill);border-radius:99px;padding:5px 11px;font-size:12.5px;color:var(--text-2)}
.wkdots{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;text-align:center;font-size:12px;color:var(--text-3)}
.wkdots i{display:grid;place-items:center;width:34px;height:34px;margin:0 auto 4px;border-radius:50%;border:2px dashed var(--sep-2);font-style:normal;font-weight:700;color:var(--text-3)}
.wkdots i.on{border:0;background:var(--accent-soft);color:var(--accent)}
.wkdots i.today{background:var(--accent);color:var(--on-accent)}
.mic{width:42px;height:42px;border-radius:50%;border:1px solid var(--sep-2);background:var(--surface);color:var(--accent);display:grid;place-items:center;flex:none}
.mic svg{width:19px;height:19px}
.voice{display:flex;align-items:center;gap:8px;width:210px;max-width:100%}
.voice .pl{width:32px;height:32px;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;flex:none}
.voice .pl svg{width:14px;height:14px}
.voice .wave{display:flex;gap:2px;align-items:center;height:26px;flex:1;min-width:0}
.voice .wave i{width:3px;border-radius:2px;background:var(--text-3);opacity:.55;flex:none}
.voice .wave i.on{background:var(--accent);opacity:1}

const cards=[]; // redraw functions, so switching the numbers mode updates cards already in the chat
function analysisCard(data,meta){
  const items=data.items; const slot=meta.slot||slotFor(); const yest=meta.day==='yesterday';
  items.forEach(it=>{it.orig=it.g;const l=learned.get(base(it.name));if(l&&it.conf!=='label'){it.g=l.g;it.orig=l.g;it.learned=true}});
  const usedLearned=items.filter(it=>it.learned);
  const el=bubble('ol','','wide ana'); let locked=false;
  const tag=it=>it.learned?'<em class="conf mine">המנה שלך</em>':it.conf==='label'?'<em class="conf lbl">מהתווית</em>':it.conf==='mid'?'<em class="conf">בערך</em>':it.conf==='low'?'<em class="conf">הערכה</em>':'';
  const draw=()=>{
    const t=calc(items);
    const sub=data.note||(usedLearned.length?`את ה${base(usedLearned[0].name)} שמתי לפי המנה שאתה רגיל אליה.`:'אם משהו לא מדויק, אפשר לתקן כאן או לכתוב לי.');
    const rows=numbers
      ? items.map((it,i)=>`<div class="row"><div class="nm"><span>${esc(it.name)}</span>${tag(it)}</div>
        <div class="step"><button type="button" data-i="${i}" data-d="-1" aria-label="פחות ${esc(it.name)}" ${locked?'disabled':''}>−</button><output class="num">${fmt(it.g)} ${unitOf(it.name)}</output><button type="button" data-i="${i}" data-d="1" aria-label="יותר ${esc(it.name)}" ${locked?'disabled':''}>+</button></div>
        <div class="kc num">${fmt(it.g/100*it.v[0])}</div></div>`).join('')
      : items.map(it=>`<div class="row" style="grid-template-columns:minmax(0,1fr) auto"><div class="nm"><span>${esc(it.name)}</span></div><em class="grp">${GRP[grpOf(it)]}</em></div>`).join('');
    const bal=balOf(items);
    const tot=numbers
      ? `<div class="tot num"><b>${fmt(t.kcal)} קק״ל</b><span><i class="dot" style="background:var(--m-protein)"></i>חלבון ${fmt(t.protein)}</span><span><i class="dot" style="background:var(--m-carbs)"></i>פחמ׳ ${fmt(t.carbs)}</span><span><i class="dot" style="background:var(--m-fat)"></i>שומן ${fmt(t.fat)}</span></div>`
      : `<div class="tot">בצלחת: ${BAL.map(b=>bal.includes(b[0])?`<b style="font-size:14px;margin:0">${b[1]} ✓</b>`:`<span>${b[1]} –</span>`).join(' · ')}</div>`;
    const qi=locked?-1:items.findIndex(it=>it.q&&!it.answered&&!it.learned);
    const qs=qi<0?'':`<div class="qstrip"><p>${esc(items[qi].q.text)}</p><div class="qr">${items[qi].q.opts.map((o,j)=>`<button type="button" data-qa="${qi}" data-j="${j}">${esc(o[0])}</button>`).join('')}</div></div>`;
    el.innerHTML=`<h4>${esc(data.title)}</h4><div class="sub">${esc(sub)}</div><div class="rows">${rows}</div>${tot}${qs}
    ${locked?`<div class="done-tag">✓ נרשם · ${yest?'אתמול · '+SLOT_NAME[slot]:SLOT_NAME[slot]+' · '+meta.time}</div>`:`<div class="acts"><button class="btn main" type="button" data-ok>לרשום ל${yest?'אתמול, ':''}${SLOT_NAME[slot]}</button><button class="btn ghost" type="button" data-no>לא לרשום</button></div>`}
    ${locked?`<details class="peek"><summary>מה עולמה קראה מאחורי הקלעים</summary><pre>${esc(JSON.stringify({tool:'log_meal',args:{date:yest?'2026-10-06':'2026-10-07',meal:slotKey(slot),title:data.title,source:meta.src,items:items.map(it=>({name:it.name,grams:it.g,group:grpOf(it),kcal:Math.round(it.g/100*it.v[0]),protein:+(it.g/100*it.v[1]).toFixed(1),carbs:+(it.g/100*it.v[2]).toFixed(1),fat:+(it.g/100*it.v[3]).toFixed(1),confidence:it.learned?'learned':it.conf}))}},null,2))}</pre></details>`:''}`;
  };
  draw(); cards.push(draw);
  el.addEventListener('click',async e=>{
    const s=e.target.closest('[data-d]');
    const qa=e.target.closest('[data-qa]');
    if(qa){const it=items[+qa.dataset.qa];const o=it.q.opts[+qa.dataset.j][1];if(o.g!=null){it.g=o.g;it.orig=o.g}if(o.v)it.v=[...o.v];if(o.name)it.name=o.name;it.answered=true;it.conf='high';draw();return}
    if(s&&!s.disabled){const it=items[+s.dataset.i];const step=Math.max(5,Math.round(it.g*.2/5)*5);it.g=Math.max(0,it.g+step*(+s.dataset.d));draw();return}
    if(e.target.closest('[data-no]')){locked=true;cards.splice(cards.indexOf(draw),1);el.querySelector('.acts').remove();await wait(300);reply('בסדר, לא רשמתי.');return}
    if(e.target.closest('[data-ok]')){
      locked=true; draw();
      if(yest){logYesterday(items,slot);if(meta.after)meta.after();return}
      addMeal({slot,time:meta.time,title:data.title,art:meta.art,img:meta.img,items});

      const taught=items.filter(it=>it.conf!=='label'&&it.g!==it.orig&&it.g>0);
      taught.forEach(it=>learned.set(base(it.name),{g:it.g,unit:unitOf(it.name),why:`תיקנת ב-${meta.time}, מ-${fmt(it.orig)} ל-${fmt(it.g)} ${unitOf(it.name)}`}));
      if(taught.length)renderLearn();
      await wait(500);
      afterLog(taught);
      if(meta.after){await wait(700);meta.after()}
    }
  });
  return el;

const PROMPT=()=>`את עולמה, עוזרת אישית בוואטסאפ שעוזרת לאדם לעקוב אחרי מה שהוא אוכל. התפקיד: לפרק ארוחה לרכיבים, להעריך כמות בגרמים (או מ״ל לשתייה) לפי מה שנראה או נכתב, ולתת ערכים תזונתיים ל-100 גרם לפי טבלאות מקובלות. מאכלים ישראליים בשמות שלהם בעברית. אם בתמונה יש תווית תזונתית של מוצר, קראי ממנה את הערכים ל-100 גרם ואת משקל האריזה בדיוק, ו-confidence יהיה "label". אל תשפטי ואל תמליצי על דיאטה.
המנות הקבועות של האדם (השתמשי בהן כשהרכיב מופיע): ${JSON.stringify(Object.fromEntries([...learned].map(([k,v])=>[k,v.g])))}
החזירי JSON בלבד, בדיוק במבנה:
{"title":"שם קצר לארוחה","note":"משפט אחד קצר על מה שהיה קשה להעריך, או מחרוזת ריקה","items":[{"name":"ביצים · 2","grams":120,"group":"protein","per100":{"kcal":143,"protein":12.6,"carbs":0.7,"fat":9.5},"confidence":"high"}]}
אם יש רכיב אחד שהכמות שלו באמת לא ברורה, אפשר להוסיף שאלה אחת קצרה עם 2-4 תשובות: "question":{"item":0,"text":"הטחינה הייתה כף או שתיים?","options":[{"label":"כף","grams":15},{"label":"שתיים","grams":30}]}. בלי שאלה אם הכול ברור.
group הוא אחד מ: protein, veg, fruit, grain, fat, sweet, drink. confidence הוא high, mid, low או label. לכל היותר 8 רכיבים. אם אין כאן אוכל, items ריק ו-note מסביר בעדינות.`;
function fromClaude(j){
  const items=(Array.isArray(j?.items)?j.items:[]).slice(0,8).map(x=>{const p=x.per100||{};const n=v=>Math.max(0,Math.min(1000,+v||0));
    return I(String(x.name||'רכיב').slice(0,40),Math.max(1,Math.min(1500,Math.round(+x.grams||100))),[n(p.kcal),n(p.protein),n(p.carbs),n(p.fat)],['high','mid','low','label'].includes(x.confidence)?x.confidence:'mid',GRP[x.group]?x.group:undefined)});
  const q=j?.question, qi=+q?.item;
  if(q&&items[qi]&&Array.isArray(q.options)&&q.options.length>=2)Q(items[qi],String(q.text||'').slice(0,80),q.options.slice(0,4).map(o=>[String(o.label||'').slice(0,24),{g:Math.max(0,Math.min(1500,Math.round(+o.grams||0)))}]));
  return {title:String(j?.title||'הארוחה שלך').slice(0,60),note:String(j?.note||'').slice(0,160),items};
}

async function onbBody(txt){
  const ns=(txt.match(/\d+(\.\d+)?/g)||[]).map(Number);
  const h=ns.find(n=>n>=120&&n<=230), w=ns.find(n=>n>=35&&n<=250&&n!==h), a=ns.find(n=>n>=10&&n<=100&&n!==h&&n!==w);
  const sex=/אישה|נקבה|בחורה/.test(txt)?'f':/גבר|זכר|בחור/.test(txt)?'m':null;
  await think(700);
  if(!h||!w||!a||!sex){reply('לא הצלחתי לקרוא את כל ארבעת הפרטים. אפשר לכתוב שוב, למשל: 178, 80, 32, גבר');return}
  if(a<18){onb=null;setNumbers(false);reply('לגיל הזה אני לא מחשבת יעד קלורי. אשמח לעזור לך לעקוב בלי מספרים, רק מה היה בצלחת. ואם יש משהו שמטריד אותך באוכל, כדאי לדבר עליו עם מישהו מבוגר שאתה סומך עליו.');return}
  Object.assign(onb,{h,w,a,sex,step:'act'});
  ask('<p>ואיך נראה שבוע רגיל שלך מבחינת תנועה?</p>',[['כמעט לא זז',()=>onbAct(1.3)],['2-3 אימונים בשבוע',()=>onbAct(1.5)],['4 אימונים ומעלה',()=>onbAct(1.7)]]);
}
async function onbAct(f){
  const o=onb; const bmr=10*o.w+6.25*o.h-5*o.a+(o.sex==='m'?5:-161);
  const adj={lose:-400,keep:0,gain:250}[o.goal];
  const kcal=Math.max(Math.round(bmr*1.1/50)*50,Math.round((bmr*f+adj)/50)*50);
  const protein=Math.round(o.w*(o.goal==='keep'?1.4:1.8)/5)*5, fat=Math.round(kcal*.28/9/5)*5, carbs=Math.max(0,Math.round((kcal-protein*4-fat*9)/4/5)*5);
  onb.result={kcal,protein,carbs,fat};
  await think(1100,'מחשבת');
  ask(`<p>זה היעד היומי שיצא לי:</p><div class="goalcard num"><div><b>${fmt(kcal)}</b><span>קק״ל</span></div><div><b>${protein}</b><span>חלבון ג׳</span></div><div><b>${carbs}</b><span>פחמ׳ ג׳</span></div><div><b>${fat}</b><span>שומן ג׳</span></div></div>
    <p class="small">חישוב לפי נוסחת מיפלין-סנט ג'ור והתנועה שלך${o.goal==='lose'?', עם גירעון קטן שמתאים לירידה של עד חצי קילו בשבוע':''}. זו הערכה, ואם משהו לא מרגיש נכון, משנים.</p>`,
    [['לשמור את היעד',async()=>{Object.assign(goal,o.result);onb=null;setNumbers(true);renderToday();await think(500);reply('שמרתי. מעכשיו העמוד היומי והסיכומים מחושבים לפי היעד הזה.'+linkCard(),true)}],
     ['לא עכשיו',async()=>{onb=null;await think(400);reply('בסדר, נשארים עם היעד הקודם.')}]],'wide');
}

async function sendText(txt){

  if(onb?.step==='body'){onbBody(txt);return}

  if(/בלי מספרים/.test(txt)){await think(600);setNumbers(false);reply('בסדר. מעכשיו בלי קלוריות וגרמים, רק מה שהיה בצלחת. אני ממשיכה לרשום ברקע, אז אם תתחרט, הכול שם.');return}
  if(/עם מספרים/.test(txt)){await think(600);setNumbers(true);reply('חזרנו למספרים.'+linkCard(),true);return}
  if(/כרטיס/.test(txt)){dailyCard();return}
  if(/אתגר/.test(txt)){chooseChallenge();return}
  if(!/כמו אתמול/.test(txt)&&/אתמול/.test(txt)&&/אכלתי|שתיתי|היה לי|אכלנו/.test(txt)){lateLog(txt);return}
  if(/פיצה/.test(txt)&&/אכלנו|משפחתית|משולש/.test(txt)){const n=countOf(txt);if(n){pizzaCard(n);return}await think(600);ask('<p>פיצה משפחתית, 8 משולשים. כמה מהם היו שלך?</p>',[1,2,3,4].map(k=>[String(k),()=>pizzaCard(k)]));return}
  if(/אתמול/.test(txt)){likeYesterday(/בוקר/.test(txt)?'בוקר':/צהריים/.test(txt)?'צהריים':/ערב/.test(txt)?'ערב':null);return}
  if(/קבוע|הרגיל|כרגיל/.test(txt)){showUsual();return}
  if(/נשאר|כמה אכלתי|סיכום|איך (אני|היום)/.test(txt)){
    await think(600); const t=dayTot();
    if(numbers)reply(`<p>עד עכשיו: <b class="num">${fmt(t.kcal)}</b> קק״ל מתוך ${fmt(goal.kcal)}.</p><p class="num">חלבון ${fmt(t.protein)}/${goal.protein} · פחמימות ${fmt(t.carbs)}/${goal.carbs} · שומן ${fmt(t.fat)}/${goal.fat} ג׳ · מים ${water}/8 כוסות</p>${linkCard()}`,true);

    return}
  if(/מים/.test(txt)){water=Math.min(8,water+1);renderWater();renderChallenge();await think(400);reply(`רשמתי כוס מים. ${water} מתוך 8 היום.`);return}
  if(/מחק|תמחקי|בטלי|ביטול/.test(txt)){const m=meals.pop();renderToday();await think(400);reply(m?`מחקתי את "${esc(m.title)}".`:'אין מה למחוק היום.');return}
  const time=hh(clock);
  if(sample){
    const stop=typing();
    try{const d=fromClaude(await sample.json(PROMPT()+'\n\nזה מה שהאדם כתב על מה שאכל: '+JSON.stringify(txt)));stop();
      if(d.items.length){analysisCard(d,{time,src:'text',art:'note'});return}
      reply(esc(d.note||'לא הבנתי מה אכלת. אפשר לשלוח תמונה או לכתוב למשל "אכלתי פיתה עם חומוס".'));return}
    catch(e){stop();if(e?.code!=='not_granted'){reply(errCopy(e));return}}
  }
  const found=FOOD.filter(f=>f[0].test(txt));
  if(!found.length){await think(500);reply('לא זיהיתי מה אכלת. אפשר לשלוח תמונה, או לכתוב למשל "אכלתי פיתה עם חומוס".');return}
  await think(900);

const WEEK=[['א׳',1980,3],['ב׳',2240,4],['ג׳',1870,3],['ד׳',null,0],['ה׳',null,0],['ו׳',null,0],['ש׳',null,0]];
function renderWeek(todayK){
  const wk=$('#week'); wk.querySelector('svg,.wkdots')?.remove();
  $('#weekSub').textContent=numbers?'קק״ל ליום · הקו הוא היעד':'ימים עם רישום · המספר הוא ארוחות';
  if(!numbers){
    wk.insertAdjacentHTML('beforeend',`<div class="wkdots">${WEEK.map(([d,,n],i)=>{const c=i===3?meals.length:n;return `<div><i class="${i===3?'on today':c?'on':''}">${i<=3?c:''}</i>${d}</div>`}).join('')}</div>`);return}
  const W=320,H=150,pad={t:12,b:26,l:8,r:8},max=2800,bw=24,gap=(W-pad.l-pad.r-7*bw)/6;
  const y=v=>pad.t+(H-pad.t-pad.b)*(1-v/max);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="קלוריות בכל יום השבוע מול היעד">`;
  [0,1000,2000].forEach(v=>{s+=`<line x1="${pad.l}" x2="${W-pad.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--sep)" stroke-width="1"/>`});
  WEEK.forEach(([d,v],i)=>{
    const val=i===3?todayK:v; const x=W-pad.r-bw-i*(bw+gap);
    if(val==null)s+=`<rect x="${x}" y="${y(0)-4}" width="${bw}" height="4" rx="2" fill="var(--sep-2)"/>`;
    else{const top=y(val);s+=`<path d="M${x},${y(0)} V${top+4} a4,4 0 0 1 4,-4 h${bw-8} a4,4 0 0 1 4,4 V${y(0)} Z" fill="${i===3?'var(--accent)':'var(--sep-2)'}"/><rect x="${x-gap/2}" y="${pad.t}" width="${bw+gap}" height="${H-pad.t-pad.b}" fill="transparent" data-tip="${d} · ${fmt(val)} קק״ל" data-x="${x+bw/2}" data-y="${top}"/>`}
    s+=`<text x="${x+bw/2}" y="${H-8}" text-anchor="middle" font-size="11.5" font-family="IBM Plex Sans Hebrew, sans-serif" fill="${i===3?'var(--text)':'var(--text-3)'}" font-weight="${i===3?700:400}">${d}</text>`;
  });
  s+=`<line x1="${pad.l}" x2="${W-pad.r}" y1="${y(goal.kcal)}" y2="${y(goal.kcal)}" stroke="var(--text-2)" stroke-width="1.5" stroke-dasharray="4 4"/></svg>`;
  wk.insertAdjacentHTML('beforeend',s);
}
$('#week').addEventListener('pointermove',e=>{const t=e.target.closest('[data-x]');const tip=$('#tip');if(!t){tip.style.opacity=0;return}
  const k=$('#week svg').getBoundingClientRect().width/320;tip.textContent=t.dataset.tip;tip.style.left=(+t.dataset.x*k)+'px';tip.style.top=(+t.dataset.y*k)+'px';tip.style.transform='translate(-50%,-110%)';tip.style.opacity=1});
$('#week').addEventListener('pointerleave',()=>$('#tip').style.opacity=0);
