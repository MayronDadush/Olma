<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>הצלחת של היום</title>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#004643">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Hebrew:wght@400;500;600;700&display=swap">
<style>
/* One person's food page, the link Olma sends them. Allma Cypress + Mustard on
   Sand, the same tokens as games/public/night.html. Mustard is the ONE main
   action. Everything here can also be asked of Olma in the chat: each control
   is one write (POST api/write), the same store function as a tool. */
:root{
  color-scheme:light;
  --font:'IBM Plex Sans Hebrew',system-ui,-apple-system,'Segoe UI',sans-serif;
  --bg:#F0EDE5;--fill:#EDEAE2;--surface:#FFFFFF;--surface-2:#F8F7F3;
  --sep:#E2DFD6;--sep-2:#D2CFC5;--text:#0E1F1E;--text-2:#44504E;--text-3:#5E6966;
  --accent:#004643;--accent-soft:#E1EBE8;--on-accent:#FFFFFF;
  --action:#F9C23C;--on-action:#004643;--danger:#B03A2E;
  --band:#004643;--on-band:#F0EDE5;--on-band-2:#BFD3CF;--band-tint:rgba(255,255,255,.14);
  --logo-d:#004643;--logo-l:#F0EDE5;--logo-lens:#F9C23C;--logo-ring:#F0EDE5;
  --m-protein:#009488;--m-carbs:#C98A0E;--m-fat:#A0559A;--m-veg:#5E9E4A;
  --track:#ECE9E1;--scrim:rgba(14,31,30,.34);
  --shadow-s:0 1px 2px rgba(14,31,30,.06);
  --shadow-l:0 24px 64px -20px rgba(14,31,30,.34),0 2px 8px rgba(14,31,30,.08);
  --ease:cubic-bezier(.22,1,.36,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#1B1A18;--fill:#36342D;--surface:#26251F;--surface-2:#2D2B26;
  --sep:#35332D;--sep-2:#44413A;--text:#EDE9DF;--text-2:#B9B5AC;--text-3:#A39F96;
  --accent:#7CC4BA;--accent-soft:#1F3532;--on-accent:#1B1A18;
  --action:#F9C23C;--on-action:#0E1F1E;--danger:#F08A7E;
  --band:#004643;--on-band:#EDE9DF;--on-band-2:#AFC6C1;--band-tint:rgba(255,255,255,.1);
  --logo-d:#1B1A18;--logo-l:#EDE9DF;--logo-lens:#F9C23C;--logo-ring:#EDE9DF;
  --m-protein:#279E93;--m-carbs:#B57D0C;--m-fat:#B06AA9;--m-veg:#6FAE5A;
  --track:#34322C;--scrim:rgba(0,0,0,.55);
  --shadow-s:0 1px 2px rgba(0,0,0,.4);
  --shadow-l:0 24px 64px -20px rgba(0,0,0,.8),0 2px 8px rgba(0,0,0,.5);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#1B1A18;--fill:#36342D;--surface:#26251F;--surface-2:#2D2B26;
  --sep:#35332D;--sep-2:#44413A;--text:#EDE9DF;--text-2:#B9B5AC;--text-3:#A39F96;
  --accent:#7CC4BA;--accent-soft:#1F3532;--on-accent:#1B1A18;
  --action:#F9C23C;--on-action:#0E1F1E;--danger:#F08A7E;
  --band:#004643;--on-band:#EDE9DF;--on-band-2:#AFC6C1;--band-tint:rgba(255,255,255,.1);
  --logo-d:#1B1A18;--logo-l:#EDE9DF;--logo-lens:#F9C23C;--logo-ring:#EDE9DF;
  --m-protein:#279E93;--m-carbs:#B57D0C;--m-fat:#B06AA9;--m-veg:#6FAE5A;
  --track:#34322C;--scrim:rgba(0,0,0,.55);
  --shadow-s:0 1px 2px rgba(0,0,0,.4);
  --shadow-l:0 24px 64px -20px rgba(0,0,0,.8),0 2px 8px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom,0px)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}

.band{background:var(--band);color:var(--on-band);padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px}
.band .in{max-width:860px;margin:0 auto;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.mark{width:34px;height:34px;flex:none}
.brand b{display:block;font-size:17px;font-weight:700}
.brand span{display:block;font-size:12.5px;color:var(--on-band-2)}
.ibtn{width:36px;height:36px;border-radius:50%;border:0;background:var(--band-tint);color:var(--on-band);display:grid;place-items:center;flex:none}
.ibtn svg{width:18px;height:18px}

main{max-width:860px;margin:0 auto;padding:18px 16px 40px;display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--sep);border-radius:20px;padding:18px;box-shadow:var(--shadow-s);min-width:0}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:0 0 12px}
.sec-h h2{margin:0;font-size:16px}
.sec-h span{font-size:12.5px;color:var(--text-3)}
.link{border:0;background:transparent;color:var(--accent);font-weight:600;font-size:13.5px;padding:0}
.note{font-size:12.5px;color:var(--text-3);margin:0}

.dayhead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.daynav{display:flex;align-items:center;gap:8px;min-width:0}
.daynav h1{margin:0;font-size:22px;letter-spacing:-.02em;line-height:1.2;text-wrap:balance}
.daynav p{margin:2px 0 0;color:var(--text-3);font-size:13px}
.navb{width:34px;height:34px;border-radius:50%;border:1px solid var(--sep-2);background:var(--surface);display:grid;place-items:center;flex:none;color:var(--accent)}
.navb:disabled{opacity:.3;cursor:default}
.navb svg{width:16px;height:16px}
.switch{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--sep);border-radius:99px;padding:5px 6px 5px 12px;font-size:13px;font-weight:600;color:var(--text-2)}
.switch i{width:34px;height:20px;border-radius:99px;background:var(--sep-2);position:relative;flex:none;transition:background .2s}
.switch i::after{content:"";position:absolute;top:2px;inset-inline-start:2px;width:16px;height:16px;border-radius:50%;background:var(--surface);transition:inset-inline-start .2s var(--ease)}
.switch[aria-checked="true"] i{background:var(--accent)}
.switch[aria-checked="true"] i::after{inset-inline-start:16px}

.hero{display:grid;grid-template-columns:190px minmax(0,1fr);gap:24px;align-items:center}
.ring{position:relative;width:190px;height:190px;max-width:100%}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{transition:stroke-dashoffset .9s var(--ease)}
.ring .ctr{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .big{font-size:38px;font-weight:700;letter-spacing:-.03em;line-height:1}
.ring .of{font-size:13px;color:var(--text-3);margin-top:4px}
.ring .left{font-size:13px;font-weight:600;color:var(--accent);margin-top:6px}
.macros{display:flex;flex-direction:column;gap:14px;min-width:0}
.mac .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:14px}
.mac .top b{font-weight:600}
.mac .top span{color:var(--text-2);font-size:13.5px}
.bar{height:10px;border-radius:99px;background:var(--track);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:99px;transition:width .9s var(--ease)}
.goalline{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:14px;font-size:12.5px;color:var(--text-3);flex-wrap:wrap}
.bal{display:flex;flex-direction:column;gap:14px}
.bal .lead{font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.bal .lead small{display:block;font-size:13.5px;font-weight:400;color:var(--text-3);letter-spacing:0;margin-top:4px}
.balrow{display:grid;grid-template-columns:120px minmax(0,1fr);gap:10px;align-items:center;font-size:14px}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dots i{width:22px;height:22px;border-radius:50%;border:2px solid var(--sep-2)}
.dots i.on{border-color:transparent}

.slot{margin-top:4px}
.slot+.slot{border-top:1px solid var(--sep);padding-top:10px;margin-top:10px}
.slot h3{margin:0 0 4px;font-size:12.5px;font-weight:600;letter-spacing:.02em;color:var(--text-3)}
.meal{border-radius:14px}
.meal>summary{list-style:none;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;cursor:pointer}
.meal>summary::-webkit-details-marker{display:none}
.meal .t b{display:block;font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meal .t small{display:block;font-size:12.5px;color:var(--text-3)}
.meal .k{font-weight:600}
.meal .k small{font-weight:400;color:var(--text-3);font-size:11.5px}
.meal[open]>summary{border-bottom:1px solid var(--sep)}
.items{display:flex;flex-direction:column;padding:6px 0 4px}
.it{display:grid;grid-template-columns:minmax(0,1fr) auto 46px 28px;gap:8px;align-items:center;padding:6px 0}
.it .nm{min-width:0;font-size:14px;display:flex;gap:6px;align-items:center}
.it .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{font-size:10.5px;font-weight:600;padding:1px 7px;border-radius:99px;background:var(--fill);color:var(--text-2);flex:none}
.tag.mine{background:var(--accent-soft);color:var(--accent)}
.step{display:flex;align-items:center;background:var(--surface-2);border:1px solid var(--sep);border-radius:99px}
.step button{width:28px;height:28px;border:0;background:transparent;font-size:16px;line-height:1;border-radius:50%;color:var(--accent);font-weight:700}
.step output{min-width:52px;text-align:center;font-size:13px}
.it .kc{font-size:13px;color:var(--text-2);text-align:start}
.x{width:28px;height:28px;border:0;border-radius:50%;background:transparent;color:var(--text-3);font-size:18px;line-height:1}
.x:hover{background:var(--fill)}
.mealbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:6px 0 12px}
.mealbar select{border:1px solid var(--sep-2);background:var(--surface);border-radius:99px;padding:5px 10px;font-size:13px}
.mealbar .del{margin-inline-start:auto;border:0;background:transparent;color:var(--danger);font-size:13px;font-weight:600}
.confirm{display:flex;gap:8px;align-items:center;font-size:13px}
.confirm button{border:0;border-radius:99px;padding:5px 12px;font-weight:600;font-size:13px}
.confirm .yes{background:var(--danger);color:#fff}
.confirm .no{background:var(--fill)}
.empty{display:flex;gap:12px;align-items:center;padding:6px 0;color:var(--text-2)}
.empty .mark{width:28px;height:28px}

.pips{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;text-align:center;font-size:12px;color:var(--text-3);margin-top:12px}
.pips i{display:block;height:10px;border-radius:99px;background:var(--track);margin-bottom:5px}
.pips i.ok{background:var(--accent)}
.pips i.miss{background:var(--sep-2)}
.pips i.now{box-shadow:0 0 0 2px var(--action)}
.chal b{font-size:16px;display:block}
.chal p{margin:4px 0 0;font-size:13.5px;color:var(--text-2)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.chip{border:1px solid var(--sep-2);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:13px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.insight p{margin:0;font-size:15px;line-height:1.6}
.rowbtns{display:flex;justify-content:space-between;align-items:center;margin-top:12px}

.lrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--sep)}
.lrow:first-child{border-top:0;padding-top:0}
.lrow b{font-weight:600;font-size:14.5px}
.lrow .sub{display:block;font-size:12px;color:var(--text-3)}
.lrow .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.sbtn{border:0;background:var(--fill);border-radius:99px;padding:5px 11px;font-size:12.5px;color:var(--text-2)}
.sbtn.on{background:var(--accent-soft);color:var(--accent);font-weight:600}

.cups{display:flex;gap:6px;flex-wrap:wrap}
.cup{width:32px;height:40px;border:0;background:transparent;padding:0;color:var(--sep-2)}
.cup.on{color:var(--m-protein)}
.cup svg{width:100%;height:100%}
.week{position:relative}
.week svg{width:100%;height:auto;display:block}
.wkdots{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;text-align:center;font-size:12px;color:var(--text-3)}
.wkdots i{display:grid;place-items:center;width:34px;height:34px;margin:0 auto 4px;border-radius:50%;border:2px dashed var(--sep-2);font-style:normal;font-weight:700;color:var(--text-3)}
.wkdots i.on{border:0;background:var(--accent-soft);color:var(--accent)}
.wkdots i.cur{background:var(--accent);color:var(--on-accent)}

.main-btn{border:0;border-radius:99px;padding:9px 18px;font-weight:600;font-size:14px;background:var(--action);color:var(--on-action)}
.goalform{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px}
.goalform label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--text-3)}
.goalform input{width:100%;border:1px solid var(--sep-2);border-radius:10px;padding:7px 8px;background:var(--surface-2);font-size:15px}
.goalform .row{grid-column:1/-1;display:flex;gap:8px;align-items:center}

.scrim{position:fixed;inset:0;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{visibility:hidden;position:fixed;inset-inline:0;bottom:0;max-width:520px;margin:0 auto;background:var(--surface);border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));box-shadow:var(--shadow-l);transform:translateY(105%);transition:transform .3s var(--ease);z-index:21;max-height:92vh;overflow:auto}
.sheet.on{transform:none;visibility:visible}
.sheet img{width:100%;max-width:100%;border-radius:14px;display:block;border:1px solid var(--sep)}
.toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));inset-inline:16px;max-width:420px;margin:0 auto;background:var(--text);color:var(--bg);padding:10px 14px;border-radius:12px;font-size:14px;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none;z-index:30;text-align:center}
.toast.on{opacity:1;transform:none}
.foot{text-align:center;font-size:12.5px;color:var(--text-3);margin:4px 0 0}
.skeleton{min-height:200px;display:grid;place-items:center;color:var(--text-3)}

@media (max-width:620px){
  .hero{grid-template-columns:minmax(0,1fr);justify-items:center}
  .macros{width:100%}
  .two{grid-template-columns:minmax(0,1fr)}
  .balrow{grid-template-columns:minmax(0,1fr)}
  .goalform{grid-template-columns:repeat(2,minmax(0,1fr))}
  .daynav h1{font-size:19px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <clipPath id="logo-c"><circle cx="60" cy="60" r="60"/></clipPath>
  <clipPath id="logo-a"><circle cx="44" cy="60" r="24"/></clipPath>
  <symbol id="logo" viewBox="0 0 120 120">
    <g clip-path="url(#logo-c)">
      <rect width="60" height="120" fill="var(--logo-d)"/><rect x="60" width="60" height="120" fill="var(--logo-l)"/>
      <circle cx="44" cy="60" r="24" fill="var(--logo-l)"/><circle cx="76" cy="60" r="24" fill="var(--logo-d)"/>
      <circle cx="76" cy="60" r="24" fill="var(--logo-lens)" clip-path="url(#logo-a)"/>
    </g>
    <circle cx="60" cy="60" r="58.25" fill="none" stroke="var(--logo-ring)" stroke-width="3.5"/>
  </symbol>
</defs></svg>

<header class="band"><div class="in">
  <div class="brand">
    <svg class="mark" viewBox="0 0 120 120" aria-hidden="true"><use href="#logo"/></svg>
    <div style="min-width:0"><b>הצלחת של היום</b><span id="who">עולמה</span></div>
  </div>
  <button class="ibtn" id="cardBtn" type="button" aria-label="כרטיס היום"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="3"/><circle cx="12" cy="10" r="3.5"/><path d="M8 17h8"/></svg></button>
  <button class="ibtn" id="themeBtn" type="button" aria-label="החלפת מצב תצוגה"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg></button>
</div></header>

<main id="main">
  <div class="card skeleton" id="loading">טוען…</div>
</main>

<div class="scrim" id="scrim"></div>
<section class="sheet" id="cardSheet" aria-label="כרטיס היום" aria-hidden="true">
  <div class="sec-h"><h2>כרטיס היום</h2><button class="link" type="button" data-close>סגירה</button></div>
  <img id="cardImg" alt="כרטיס היום: הארוחות, בלי קלוריות">
  <p class="note" style="margin-top:10px">כדי לקבל אותו כתמונה לשיתוף, כותבים לעולמה ״כרטיס היום״. הוא יוצא עם קישור הצטרפות מתחתיו.</p>
</section>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = n => Math.round(n).toLocaleString('he-IL');
const TOKEN = (location.pathname.match(/\/food\/([A-Za-z0-9]{22})/) || [])[1];
const API = `/food/${TOKEN}`;
const SLOTS = [['breakfast', 'ארוחת בוקר'], ['lunch', 'ארוחת צהריים'], ['snack', 'נשנוש'], ['dinner', 'ארוחת ערב']];
const GROUP = { protein: 'חלבון', veg: 'ירק', fruit: 'פרי', grain: 'פחמימה', fat: 'שומן', sweet: 'מתוק', drink: 'שתייה' };
const BAL = [['protein', 'חלבון', '--m-protein'], ['veg', 'ירקות ופירות', '--m-veg'], ['grain', 'פחמימות', '--m-carbs']];
const CH = [['veg_dinner', 'ירק בכל ארוחת ערב'], ['protein_breakfast', 'חלבון בארוחת הבוקר'], ['water6', '6 כוסות מים ביום']];
const ERR = {
  rate_limited: 'יותר מדי שינויים בדקה. נסו שוב עוד רגע.', too_old: 'אפשר לשנות רק את 7 הימים האחרונים.',
  bad_number: 'המספר הזה מחוץ לטווח.', not_found: 'זה כבר לא נמצא. רעננו את העמוד.', internal: 'משהו השתבש. נסו שוב.',
};

let S = null;            // the day as the server last sent it
let day = null;          // null = today
let open = new Set();    // meal ids whose details are open, kept across redraws
let insI = 0;
let confirmDel = null;

function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 2400); }

async function load(d) {
  const r = await fetch(`${API}/api/state${d ? `?day=${d}` : ''}`);
  if (!r.ok) { $('#main').innerHTML = '<div class="card">הקישור הזה לא מוביל לשום עמוד.</div>'; return; }
  S = await r.json(); day = S.today ? null : S.day; render();
}
async function write(op, data = {}) {
  try {
    const r = await fetch(`${API}/api/write`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ op, date: S.day, ...data }) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) { toast(ERR[j.error] || 'לא נשמר. נסו שוב.'); return null; }
    S = j.state; render(); return j.result;
  } catch { toast('אין חיבור. נסו שוב.'); return null; }
}

/* ── render ── */
function render() {
  const num = S.person.numbers;
  const g = S.person.goal;
  $('#who').textContent = S.person.name ? `${S.person.name} · עולמה` : 'עולמה';
  const canNext = !S.today;
  const canPrev = S.week && dayDiff(S.day, S.today_day) < 7;
  let h = `<div class="dayhead">
    <div class="daynav">
      <button class="navb" type="button" data-nav="-1" ${canPrev ? '' : 'disabled'} aria-label="יום קודם"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
      <div><h1>${esc(S.today ? 'היום, ' + S.date_he.replace(/^יום /, '') : S.date_he)}</h1><p>${num ? `יעד יומי ${fmt(g.kcal)} קק״ל · ${g.protein} ג׳ חלבון${g.set ? '' : ' (ברירת מחדל)'}` : 'בלי מספרים · רק מה שהיה בצלחת'}</p></div>
      <button class="navb" type="button" data-nav="1" ${canNext ? '' : 'disabled'} aria-label="יום הבא"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>
    </div>
    <button class="switch" type="button" role="switch" id="numSwitch" aria-checked="${num}"><i></i>להציג מספרים</button>
  </div>`;

  // hero
  h += `<div class="card">`;
  if (num) {
    const p = Math.min(1, S.totals.kcal / g.kcal), left = g.kcal - S.totals.kcal;
    h += `<div class="hero"><div class="ring" role="img" aria-label="${fmt(S.totals.kcal)} מתוך ${fmt(g.kcal)} קלוריות">
      <svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" fill="none" stroke="var(--track)" stroke-width="11"/><circle cx="60" cy="60" r="52" fill="none" stroke="var(--accent)" stroke-width="11" stroke-linecap="round" stroke-dasharray="326.7" stroke-dashoffset="${326.7 * (1 - p)}"/></svg>
      <div class="ctr"><div class="big num">${fmt(S.totals.kcal)}</div><div class="of num">מתוך ${fmt(g.kcal)} קק״ל</div><div class="left num">${left >= 0 ? `נשארו ${fmt(left)}` : `${fmt(-left)} מעל היעד`}</div></div></div>
      <div class="macros">${[['protein', 'חלבון', '--m-protein'], ['carbs', 'פחמימות', '--m-carbs'], ['fat', 'שומן', '--m-fat']].map(([k, n, c]) => `<div class="mac"><div class="top"><b>${n}</b><span class="num">${fmt(S.totals[k])} / ${g[k]} ג׳</span></div><div class="bar"><i style="width:${Math.min(100, S.totals[k] / g[k] * 100)}%;background:var(${c})"></i></div></div>`).join('')}</div></div>
      <div class="goalline"><span>${g.set ? 'היעד שלך' : 'זה יעד ברירת מחדל. אפשר לבקש מעולמה לחשב אחד שמתאים לך, או לקבוע כאן.'}</span><button class="link" type="button" id="goalBtn">לשנות יעד</button></div>
      <form class="goalform" id="goalForm" hidden>
        <label>קק״ל<input id="g_kcal" type="number" inputmode="numeric" min="800" max="6000" value="${g.kcal}"></label>
        <label>חלבון (ג׳)<input id="g_protein" type="number" inputmode="numeric" min="10" max="400" value="${g.protein}"></label>
        <label>פחמימות (ג׳)<input id="g_carbs" type="number" inputmode="numeric" min="0" max="800" value="${g.carbs}"></label>
        <label>שומן (ג׳)<input id="g_fat" type="number" inputmode="numeric" min="10" max="300" value="${g.fat}"></label>
        <div class="row"><button class="main-btn" type="submit">לשמור יעד</button><button class="link" type="button" id="goalCancel">ביטול</button></div>
      </form>`;
  } else {
    h += `<div class="bal"><div class="lead">${S.meals.length ? `${S.meals.length} ארוחות` : 'עוד לא נרשמה ארוחה'}<small>כל עיגול הוא ארוחה. מלא אם היה בה</small></div>
      ${BAL.map(([k, n, c]) => `<div class="balrow"><b>${n}</b><div class="dots">${S.meals.filter(m => !m.rough).map(m => `<i class="${m.balance.includes(k) ? 'on' : ''}" style="${m.balance.includes(k) ? `background:var(${c})` : ''}" title="${esc(m.title)}"></i>`).join('') || '<span class="note">—</span>'}</div></div>`).join('')}</div>`;
  }
  h += `</div>`;

  // meals
  h += `<div class="card"><div class="sec-h"><h2>הארוחות</h2><span>${S.meals.length ? `${S.meals.length} ארוחות` : ''}</span></div>`;
  if (!S.meals.length) {
    h += `<div class="empty"><svg class="mark" viewBox="0 0 120 120" aria-hidden="true"><use href="#logo"/></svg><span>${S.today ? 'עוד לא נרשם כלום היום. שולחים לעולמה תמונה של מה שאכלת, הודעה קולית או שורה.' : 'ביום הזה לא נרשם כלום.'}</span></div>`;
  }
  for (const [slot, he] of SLOTS) {
    const ms = S.meals.filter(m => m.slot === slot);
    if (!ms.length) continue;
    h += `<div class="slot"><h3>${he}</h3>${ms.map(m => mealHtml(m, num)).join('')}</div>`;
  }
  h += `</div>`;

  // challenge + insight
  const ins = S.insights.filter(i => num || !i.numbers);
  h += `<div class="two"><div class="card chal"><div class="sec-h"><h2>אתגר השבוע</h2></div>${chalHtml()}</div>
    <div class="card insight"><div class="sec-h"><h2>משהו שגיליתי</h2><span class="num">${ins.length > 1 ? `${(insI % ins.length) + 1} מתוך ${ins.length}` : ''}</span></div>
      <p>${ins.length ? esc(ins[insI % ins.length].he) : 'עוד מעט. אחרי כמה ימים של רישום יופיעו כאן דברים שמצאתי.'}</p>
      ${ins.length > 1 ? '<div class="rowbtns"><button class="link" type="button" id="insNext">עוד אחד</button></div>' : ''}</div></div>`;

  // learned
  const rows = S.portions.map(x => `<div class="lrow"><div><b>${esc(x.name)}${num ? ` · <span class="num">${fmt(x.grams)} ג׳</span>` : ''}</b><span class="sub">המנה שלך${x.from_grams && num ? ` · תיקנת מ-${fmt(x.from_grams)} ג׳` : ''}</span></div><div class="acts"><button class="sbtn" type="button" data-forget="${esc(x.name)}">לשכוח</button></div></div>`)
    .concat(S.usual.map(u => `<div class="lrow"><div><b>${esc(u.title)}</b><span class="sub">${u.times} פעמים בארבעה שבועות${u.auto_hour != null ? ` · נרשם לבד כל יום ב-${u.auto_hour}:00` : ''}</span></div><div class="acts">
      <button class="sbtn" type="button" data-relog="${u.meal_id}">לרשום עכשיו</button>
      ${u.auto_hour != null ? `<button class="sbtn on" type="button" data-unauto="${esc(u.title)}">להפסיק רישום אוטומטי</button>` : `<button class="sbtn" type="button" data-auto="${u.meal_id}">לרשום לבד כל יום</button>`}</div></div>`));
  h += `<div class="card"><div class="sec-h"><h2>מה עולמה למדה עליך</h2><span>מנות שתיקנת, ומה שחוזר</span></div>${rows.join('') || '<p class="note">עוד כלום. כשמתקנים כמות, עולמה זוכרת אותה. ארוחה שחוזרת 3 פעמים מופיעה כאן.</p>'}</div>`;

  // water + week
  h += `<div class="two"><div class="card"><div class="sec-h"><h2>מים</h2><span class="num">${S.water} / ${S.person.water_goal} כוסות</span></div>
      <div class="cups">${Array.from({ length: Math.max(S.person.water_goal, S.water) }, (_, i) => `<button type="button" class="cup ${i < S.water ? 'on' : ''}" data-cup="${i}" aria-label="כוס ${i + 1}" aria-pressed="${i < S.water}"><svg viewBox="0 0 34 42"><path d="M5 4h24l-3 33a3 3 0 0 1-3 3H11a3 3 0 0 1-3-3z" fill="${i < S.water ? 'currentColor' : 'none'}" fill-opacity=".85" stroke="currentColor" stroke-width="2"/></svg></button>`).join('')}</div></div>
    <div class="card"><div class="sec-h"><h2>השבוע</h2><span>${num ? 'קק״ל ליום · הקו הוא היעד' : 'ארוחות בכל יום'}</span></div><div class="week">${weekHtml(num)}</div></div></div>`;
  h += `<p class="foot">כל מה שאפשר לעשות כאן, אפשר גם לבקש מעולמה בצ׳אט · הערכים הם הערכה, לא מדידה</p>`;
  $('#main').innerHTML = h;
}

function mealHtml(m, num) {
  if (m.rough) return `<div class="meal"><div style="padding:8px 0" class="t"><b>${esc(m.title)}</b><small>${esc(m.time)} · נרשם בערך, בלי פירוט</small></div></div>`;
  const items = m.items.map(it => `<div class="it" style="${num ? '' : 'grid-template-columns:minmax(0,1fr) auto 28px'}">
      <div class="nm"><span>${esc(it.name)}</span>${it.confidence === 'portion' ? '<em class="tag mine">המנה שלך</em>' : it.confidence === 'label' ? '<em class="tag mine">מהתווית</em>' : it.confidence === 'low' ? '<em class="tag">הערכה</em>' : it.confidence === 'mid' ? '<em class="tag">בערך</em>' : ''}</div>
      ${num ? `<div class="step"><button type="button" data-g="${m.id}:${it.id}:-1" aria-label="פחות ${esc(it.name)}">−</button><output class="num">${fmt(it.grams)} ${/קפה|הפוך|חלב|מיץ|קולה|שתייה/.test(it.name) ? 'מ״ל' : 'ג׳'}</output><button type="button" data-g="${m.id}:${it.id}:1" aria-label="יותר ${esc(it.name)}">+</button></div><span class="kc num">${fmt(it.kcal)}</span>` : `<em class="tag">${GROUP[it.grp] || ''}</em>`}
      <button class="x" type="button" data-rm="${m.id}:${it.id}" aria-label="להוריד את ${esc(it.name)}">×</button></div>`).join('');
  const sub = [m.time, m.shared_part ? `החלק שלך: ${m.shared_part}` : null, m.source === 'auto' ? 'נרשם לבד' : null].filter(Boolean).join(' · ');
  return `<details class="meal" data-meal="${m.id}" ${open.has(m.id) ? 'open' : ''}><summary>
      <div class="t"><b>${esc(m.title)}</b><small>${esc(sub)}${num ? '' : ` · ${m.balance.map(b => BAL.find(x => x[0] === b)[1]).join(' · ')}`}</small></div>
      <div class="k num">${num ? `${fmt(m.totals.kcal)} <small>קק״ל</small>` : ''}</div></summary>
    <div class="items">${items}</div>
    <div class="mealbar"><select data-slot="${m.id}" aria-label="איזו ארוחה">${SLOTS.map(([k, he]) => `<option value="${k}" ${k === m.slot ? 'selected' : ''}>${he}</option>`).join('')}</select>
      ${confirmDel === m.id ? `<span class="confirm">למחוק את הארוחה? <button class="yes" type="button" data-delyes="${m.id}">למחוק</button><button class="no" type="button" data-delno>לא</button></span>` : `<button class="del" type="button" data-del="${m.id}">למחוק ארוחה</button>`}</div>
  </details>`;
}

function chalHtml() {
  const c = S.challenge;
  const chips = `<div class="chips">${CH.map(([k, he]) => `<button class="chip" type="button" data-ch="${k}" aria-pressed="${c && c.key === k}">${he}</button>`).join('')}${c ? '<button class="chip" type="button" data-ch="none">בלי אתגר</button>' : ''}</div>`;
  if (!c) return `<p class="note">משהו קטן לשבוע, בלי עונשים. עולמה סופרת לבד מהתמונות.</p>${chips}`;
  return `<b>${esc(c.he)}</b><p>${c.score} מתוך ${c.so_far} עד עכשיו. 5 מתוך 7 זה כבר ניצחון.</p>
    <div class="pips">${c.days.map((d, i) => `<div><i class="${d.met === true ? 'ok' : d.met === false ? 'miss' : ''} ${d.day === S.day ? 'now' : ''}"></i>${['א׳', 'ב׳', 'ג׳', 'ד׳', 'ה׳', 'ו׳', 'ש׳'][i]}</div>`).join('')}</div>${chips}`;
}

function weekHtml(num) {
  const W = S.week;
  if (!num) return `<div class="wkdots">${W.map((w, i) => `<div><i class="${w.day === S.day ? 'on cur' : w.meals ? 'on' : ''}">${w.future ? '' : w.meals}</i>${['א׳', 'ב׳', 'ג׳', 'ד׳', 'ה׳', 'ו׳', 'ש׳'][i]}</div>`).join('')}</div>`;
  const Wd = 320, H = 150, pt = 12, pb = 26, pad = 8, bw = 24, gap = (Wd - 2 * pad - 7 * bw) / 6;
  const max = Math.max(2800, S.person.goal.kcal * 1.25, ...W.map(w => w.kcal || 0));
  const y = v => pt + (H - pt - pb) * (1 - v / max);
  let s = `<svg viewBox="0 0 ${Wd} ${H}" role="img" aria-label="קלוריות בכל יום השבוע מול היעד">`;
  [0, 1000, 2000].forEach(v => { s += `<line x1="${pad}" x2="${Wd - pad}" y1="${y(v)}" y2="${y(v)}" stroke="var(--sep)" stroke-width="1"/>`; });
  W.forEach((w, i) => {
    const x = Wd - pad - bw - i * (bw + gap);   // Sunday on the right
    const cur = w.day === S.day;
    if (w.future || !w.kcal) s += `<rect x="${x}" y="${y(0) - 4}" width="${bw}" height="4" rx="2" fill="var(--sep-2)"/>`;
    else { const t = y(w.kcal); s += `<path d="M${x},${y(0)} V${t + 4} a4,4 0 0 1 4,-4 h${bw - 8} a4,4 0 0 1 4,4 V${y(0)} Z" fill="${cur ? 'var(--accent)' : 'var(--sep-2)'}"><title>${esc(w.weekday)} · ${fmt(w.kcal)} קק״ל</title></path>`; }
    s += `<text x="${x + bw / 2}" y="${H - 8}" text-anchor="middle" font-size="11.5" font-family="IBM Plex Sans Hebrew, sans-serif" fill="${cur ? 'var(--text)' : 'var(--text-3)'}" font-weight="${cur ? 700 : 400}">${['א׳', 'ב׳', 'ג׳', 'ד׳', 'ה׳', 'ו׳', 'ש׳'][i]}</text>`;
  });
  s += `<line x1="${pad}" x2="${Wd - pad}" y1="${y(S.person.goal.kcal)}" y2="${y(S.person.goal.kcal)}" stroke="var(--text-2)" stroke-width="1.5" stroke-dasharray="4 4"/></svg>`;
  return s;
}

const dayDiff = (a, b) => Math.round((new Date(b + 'T12:00:00Z') - new Date(a + 'T12:00:00Z')) / 864e5);
const addDays = (d, n) => { const x = new Date(d + 'T12:00:00Z'); x.setUTCDate(x.getUTCDate() + n); return x.toISOString().slice(0, 10); };

/* ── events: one write each ── */
$('#main').addEventListener('toggle', e => { const d = e.target.closest('details[data-meal]'); if (!d) return; const id = +d.dataset.meal; d.open ? open.add(id) : open.delete(id); }, true);
$('#main').addEventListener('click', async e => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.dataset.nav) { const n = +t.dataset.nav; const next = addDays(S.day, n); return load(next >= S.today_day ? null : next); }
  if (t.id === 'numSwitch') return write('numbers', { on: !S.person.numbers });
  if (t.dataset.g) {
    const [mid, iid, dir] = t.dataset.g.split(':').map(Number);
    const it = S.meals.find(m => m.id === mid).items.find(i => i.id === iid);
    const step = Math.max(5, Math.round(it.grams * 0.2 / 5) * 5);
    const r = await write('item_grams', { meal_id: mid, item_id: iid, grams: Math.max(0, it.grams + dir * step) });
    if (r && r.learned && r.learned.length) toast(`מעכשיו עולמה תתחיל מ-${fmt(r.learned[0].grams)} ג׳ ${r.learned[0].name}`);
    return;
  }
  if (t.dataset.rm) { const [mid, iid] = t.dataset.rm.split(':').map(Number); return write('item_remove', { meal_id: mid, item_id: iid }); }
  if (t.dataset.del) { confirmDel = +t.dataset.del; return render(); }
  if (t.hasAttribute('data-delno')) { confirmDel = null; return render(); }
  if (t.dataset.delyes) { confirmDel = null; open.delete(+t.dataset.delyes); if (await write('meal_delete', { meal_id: +t.dataset.delyes })) toast('הארוחה נמחקה'); return; }
  if (t.dataset.cup) { const i = +t.dataset.cup; return write('water', { cups: i + 1 === S.water ? i : i + 1 }); }
  if (t.dataset.ch) return write('challenge', { key: t.dataset.ch });
  if (t.id === 'insNext') { insI++; return render(); }
  if (t.dataset.forget) { if (await write('forget', { name: t.dataset.forget })) toast('נשכח'); return; }
  if (t.dataset.relog) { const r = await write('relog', { meal_id: +t.dataset.relog }); if (r) toast(`נרשם: ${r.meal.title}`); return; }
  if (t.dataset.auto) { const r = await write('auto', { meal_id: +t.dataset.auto, on: true, hour: 8 }); if (r) toast(`מחר ב-8:00 זה יירשם לבד`); return; }
  if (t.dataset.unauto) { if (await write('auto', { title: t.dataset.unauto, on: false })) toast('הרישום האוטומטי נעצר'); return; }
  if (t.id === 'goalBtn') { $('#goalForm').hidden = false; return; }
  if (t.id === 'goalCancel') { $('#goalForm').hidden = true; return; }
});
$('#main').addEventListener('change', e => { const s = e.target.closest('select[data-slot]'); if (s) write('meal_slot', { meal_id: +s.dataset.slot, slot: s.value }); });
$('#main').addEventListener('submit', async e => {
  if (e.target.id !== 'goalForm') return;
  e.preventDefault();
  const v = k => Number($('#g_' + k).value);
  if (await write('goal', { kcal: v('kcal'), protein: v('protein'), carbs: v('carbs'), fat: v('fat') })) toast('היעד נשמר');
});

/* ── card sheet, theme ── */
const sheet = $('#cardSheet'), scrim = $('#scrim');
const closeSheet = () => { sheet.classList.remove('on'); scrim.classList.remove('on'); sheet.setAttribute('aria-hidden', 'true'); };
$('#cardBtn').addEventListener('click', () => { $('#cardImg').src = `${API}/card.svg${S && !S.today ? `?day=${S.day}` : ''}`; sheet.classList.add('on'); scrim.classList.add('on'); sheet.setAttribute('aria-hidden', 'false'); });
scrim.addEventListener('click', closeSheet);
sheet.addEventListener('click', e => { if (e.target.closest('[data-close]')) closeSheet(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });
$('#themeBtn').addEventListener('click', () => { const r = document.documentElement; const dark = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; r.dataset.theme = dark ? 'light' : 'dark'; });

// Olma may have logged something since the page opened: look again whenever
// the page comes back into view, never on a timer.
document.addEventListener('visibilitychange', () => { if (!document.hidden && S) load(day); });

if (!TOKEN) $('#main').innerHTML = '<div class="card">הקישור הזה לא מוביל לשום עמוד.</div>';
else load(null);
})();
</script>
</body>
</html>
