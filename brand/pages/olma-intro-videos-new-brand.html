<title>סרטוני עולמה במותג החדש</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Rubik:wght@500;600;700;800&family=Playpen+Sans+Hebrew:wght@400;600;800&display=swap">
<style>
:root{
  --bg:#F4F3F8; --surface:#FFFFFF; --text:#141322; --muted:#6C6982; --sep:#E7E5F0;
  --accent:#5B2FD6; --on-accent:#FFFFFF;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C0B11; --surface:#181720; --text:#F4F3FA; --muted:#9D9AB2; --sep:#2A2836;
    --accent:#9C7BFF; --on-accent:#0C0B11; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C0B11; --surface:#181720; --text:#F4F3FA; --muted:#9D9AB2; --sep:#2A2836;
  --accent:#9C7BFF; --on-accent:#0C0B11; color-scheme:dark;
}
body{background:var(--bg);color:var(--text);font-family:Assistant,-apple-system,"Segoe UI",system-ui,sans-serif;font-size:16px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding-inline:20px;padding-block:28px 64px;display:grid;gap:40px}
header{display:grid;gap:14px}
h1{font-family:Rubik,Assistant,sans-serif;font-weight:700;font-size:clamp(26px,4vw,38px);line-height:1.15;margin:0;text-wrap:balance}
.lede{margin:0;color:var(--muted);max-width:62ch}
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--sep);border-radius:999px;padding:3px}
.seg button{font:600 14px Assistant,sans-serif;border:0;background:none;color:var(--muted);padding:7px 16px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.seg button:focus-visible,.replay:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hint{font-size:14px;color:var(--muted)}
section{display:grid;gap:16px}
h2{font-family:Rubik,Assistant,sans-serif;font-weight:600;font-size:22px;margin:0;display:flex;gap:10px;align-items:baseline}
h2 .n{color:var(--accent);font-variant-numeric:tabular-nums}
h2 small{font:400 15px Assistant,sans-serif;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px}
figure{min-width:0;margin:0;display:grid;gap:10px;align-content:start}
figcaption{display:grid;gap:2px}
figcaption .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
figcaption b{font-family:Rubik,Assistant,sans-serif;font-weight:600;font-size:16px}
figcaption span{font-size:14px;color:var(--muted)}
.replay{font:600 13px Assistant,sans-serif;border:1px solid var(--sep);background:var(--surface);color:var(--text);border-radius:999px;padding:4px 12px;cursor:pointer}

/* ---------- stage engine ---------- */
.stage{position:relative;width:100%;max-width:100%;aspect-ratio:1;container-type:inline-size;overflow:hidden;border-radius:14px;box-shadow:0 1px 0 var(--sep),0 10px 30px -18px rgba(20,19,34,.45);font-family:Assistant,-apple-system,sans-serif;cursor:pointer}
.stage *{box-sizing:border-box}
.t{display:none}
.t.on{display:block;animation:pop .38s cubic-bezier(.2,.9,.3,1.25) both}
.t.on.off{display:none}
.stage.reset,.stage.reset *{transition:none!important;animation:none!important}
@keyframes pop{from{opacity:0;transform:translateY(3cqw) scale(.96)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes dots{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-.8cqw)}}
@keyframes rx{0%{transform:scale(0)}60%{transform:scale(1.35)}100%{transform:scale(1)}}
@keyframes ring{from{transform:scale(.6);opacity:.8}to{transform:scale(2.2);opacity:0}}
@keyframes jit{0%,100%{transform:translate(0,0)}25%{transform:translate(.6cqw,-.5cqw)}50%{transform:translate(-.4cqw,.7cqw)}75%{transform:translate(.5cqw,.4cqw)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-1.2cqw) rotate(-2deg)}40%{transform:translateX(1.2cqw) rotate(2deg)}60%{transform:translateX(-.8cqw)}80%{transform:translateX(.8cqw)}}
@keyframes drop{from{transform:translateY(-140%)}to{transform:none}}

/* ---------- A · WhatsApp ---------- */
.wa{background:#EFEAE2;background-image:radial-gradient(rgba(0,0,0,.035) 1.2px,transparent 1.3px);background-size:4.4cqw 4.4cqw;color:#111B21}
.wa-top{position:absolute;inset:0 0 auto 0;height:14cqw;background:#F0F2F5;display:flex;align-items:center;gap:3cqw;padding-inline:4cqw;border-bottom:1px solid rgba(0,0,0,.06);z-index:2}
.av{width:8.5cqw;height:8.5cqw;border-radius:50%;background:#5B2FD6;color:#fff;display:grid;place-items:center;font:700 4.4cqw Rubik,sans-serif;flex:none}
.wa-top b{display:block;font:600 4.3cqw Assistant,sans-serif;line-height:1.1}
.wa-top small{display:block;font-size:3.2cqw;color:#667781;line-height:1.3;min-height:4.2cqw}
.wa-top small .t.on{animation:fade .2s both;display:inline}
.wa-top small .t.on.off{display:none}
.wa-body{position:absolute;inset:14cqw 0 0 0;display:flex;flex-direction:column;justify-content:flex-end;gap:2cqw;padding:4cqw 4.5cqw 5cqw}
.b{position:relative;max-width:78%;padding:2.2cqw 3cqw 1.6cqw;border-radius:2.6cqw;font-size:3.9cqw;line-height:1.38;box-shadow:0 .3cqw .4cqw rgba(0,0,0,.08)}
.b.out{align-self:flex-end;background:#D9FDD3}
.b.in{align-self:flex-start;background:#fff}
.tm{display:block;text-align:end;font-size:2.6cqw;color:#667781;margin-top:.6cqw}
.tm i{font-style:normal;color:#53BDEB}
.rx{position:absolute;inset-inline-start:2cqw;bottom:-3.8cqw;background:#fff;border-radius:999px;padding:.4cqw 1.3cqw;font-size:3.6cqw;box-shadow:0 .3cqw .8cqw rgba(0,0,0,.15)}
.rx.t.on{display:block;animation:rx .45s cubic-bezier(.2,.9,.3,1.3) both}
.typing{align-self:flex-start;background:#fff;border-radius:2.6cqw;padding:2.6cqw 3.4cqw;display:none;gap:1.1cqw}
.typing.on{display:flex}
.typing i{width:1.6cqw;height:1.6cqw;border-radius:50%;background:#8696A0;animation:dots 1.1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
.b .g{margin-top:1.4cqw}
.b .g b{font-weight:700}
.b .li.t.on{display:block;animation:fade .3s both}
.daychip{align-self:center;background:#fff;color:#54656F;border-radius:1.8cqw;padding:1cqw 3cqw;font-size:3.1cqw;box-shadow:0 .2cqw .3cqw rgba(0,0,0,.08);margin-block:2cqw}
.flash{position:absolute;inset:0;background:#0B1E3A;opacity:0;pointer-events:none;z-index:3}
.flash.on{display:block;animation:night 1.3s ease both}
@keyframes night{0%{opacity:0}35%,55%{opacity:.55}100%{opacity:0}}
.wa .end{position:absolute;inset:auto 0 0 0;z-index:4;background:linear-gradient(to top,rgba(91,47,214,.97) 62%,rgba(91,47,214,0));color:#fff;padding:14cqw 6cqw 7cqw;font-family:Rubik,sans-serif}
.wa .end.on{animation:fade .5s both}
.wa .end p{margin:0;font-weight:700;font-size:6.6cqw;line-height:1.15}
.wa .end p+p{color:#FFD98A}
.wa .end small{display:block;margin-top:2.4cqw;font:500 3.4cqw Assistant,sans-serif;opacity:.9}

/* ---------- B · Studio ---------- */
.st{background:#5B2FD6;color:#fff;transition:background 1s ease}
.st::before{content:"";position:absolute;inset:-20%;background:radial-gradient(circle at 80% 10%,rgba(255,255,255,.18),transparent 45%),radial-gradient(circle at 10% 95%,rgba(255,217,138,.20),transparent 40%);pointer-events:none}
.st .mark{position:absolute;top:5cqw;inset-inline-start:6cqw;font:700 3.6cqw Rubik,sans-serif;letter-spacing:.02em;opacity:.75;display:flex;align-items:center;gap:1.6cqw}
.st .mark i{width:2.2cqw;height:2.2cqw;border-radius:50%;background:#FFD98A}
.st .col{position:absolute;inset:14cqw 6cqw 7cqw;display:flex;flex-direction:column;justify-content:center;gap:3cqw}
.st .you{align-self:flex-end;max-width:88%;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);border-radius:5cqw;border-end-end-radius:1.4cqw;padding:3.4cqw 4.4cqw;font:500 4.6cqw/1.35 Assistant,sans-serif;position:relative}
.st .her{align-self:flex-start;width:92%;background:#fff;color:#1D1440;border-radius:5cqw;border-end-start-radius:1.4cqw;padding:3.6cqw 4.6cqw;font-size:4cqw;line-height:1.35;box-shadow:0 3cqw 6cqw -3cqw rgba(20,5,60,.5)}
.st .her .h{font:700 4.6cqw Rubik,sans-serif;color:#5B2FD6;margin-bottom:1cqw}
.st .her .grp{display:flex;gap:2.4cqw;align-items:baseline;padding-block:1.3cqw;border-top:1px solid #ECE8F8}
.st .her .grp.on{display:flex}
.st .her .grp b{font:600 3.5cqw Rubik,sans-serif;color:#5B2FD6;min-width:17cqw;flex:none}
.st .big-rx{position:absolute;inset-inline-start:-3cqw;bottom:-5cqw;width:11cqw;height:11cqw;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:6cqw;box-shadow:0 1cqw 3cqw rgba(0,0,0,.25)}
.st .big-rx.on{display:grid;animation:rx .5s cubic-bezier(.2,.9,.3,1.3) both}
.st .big-rx::after{content:"";position:absolute;inset:0;border-radius:50%;border:.6cqw solid #FFD98A;animation:ring 1.2s .2s ease-out 2 both}
.st .clk{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;opacity:0;transition:opacity .5s}
.st .clk span{grid-area:1/1;font:800 22cqw/1 Rubik,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-.02em;transition:transform .8s cubic-bezier(.7,0,.2,1),opacity .6s}
.st .clk .d2{transform:translateY(60%);opacity:0;color:#FFD98A}
.st .clk em{position:absolute;top:22%;font:500 4cqw Assistant,sans-serif;font-style:normal;opacity:.7;transition:opacity .4s}
.st.night{background:#1B1140}
.st.night .clk{opacity:1}
.st.night .col{opacity:.12;transition:opacity .4s}
.st.morning .clk .d1{transform:translateY(-60%);opacity:0}
.st.morning .clk .d2{transform:none;opacity:1}
.st.day{background:#5B2FD6}
.st.day .clk{opacity:0}
.st.day .col{opacity:1}
.st .notif{position:absolute;top:5cqw;inset-inline:5cqw;background:#fff;color:#1D1440;border-radius:4cqw;padding:3cqw 3.6cqw;display:none;gap:3cqw;align-items:center;box-shadow:0 2cqw 6cqw rgba(15,5,50,.45);z-index:3}
.st .notif.on{display:flex;animation:drop .55s cubic-bezier(.2,.9,.3,1.15) both}
.st .notif .av{width:10cqw;height:10cqw;font-size:5cqw}
.st .notif b{display:block;font:600 3.3cqw Rubik,sans-serif;color:#5B2FD6}
.st .notif p{margin:0;font-size:4.2cqw;line-height:1.3}
.st .end{position:absolute;inset:0;background:#5B2FD6;z-index:5;display:none;flex-direction:column;justify-content:center;padding:8cqw;font-family:Rubik,sans-serif}
.st .end.on{display:flex;animation:fade .45s both}
.st .end p{margin:0;font-weight:800;font-size:10.5cqw;line-height:1.05;letter-spacing:-.01em}
.st .end p+p{color:#FFD98A}
.st .end small{margin-top:6cqw;font:500 4cqw Assistant,sans-serif;opacity:.85;display:flex;gap:2cqw;align-items:center}
.st .end small i{width:2.4cqw;height:2.4cqw;border-radius:50%;background:#FFD98A;flex:none}

/* ---------- C · Wordless ---------- */
.wl{background:#F3EFFB;transition:background 1.1s ease}
.wl .cloud{position:absolute;left:10%;top:12%;width:80%;height:72%;border:.7cqw dashed #C9BDF0;border-radius:46% 54% 50% 50%/55% 45% 55% 45%;transition:opacity .5s,transform .8s}
.wl.p1 .cloud{opacity:0;transform:scale(.8)}
.wl .card{position:absolute;left:12%;top:14%;width:76%;height:72%;background:#fff;border-radius:6cqw;box-shadow:0 4cqw 8cqw -4cqw rgba(60,30,140,.35);opacity:0;transform:scale(.9);transition:opacity .5s,transform .6s cubic-bezier(.2,.9,.3,1.2)}
.wl.p1 .card{opacity:1;transform:none}
.wl .card::before,.wl .card::after{content:"";position:absolute;left:8%;right:8%;height:1px;background:#EEE9FA}
.wl .card::before{top:36%}.wl .card::after{top:62%}
.wl .chip{position:absolute;left:var(--x);top:var(--y);transform:translate(-50%,-50%) rotate(var(--r));width:14cqw;height:14cqw;border-radius:4cqw;background:#fff;display:grid;place-items:center;font-size:8cqw;box-shadow:0 1.2cqw 2.6cqw -1cqw rgba(60,30,140,.35);transition:left .9s cubic-bezier(.6,0,.2,1),top .9s cubic-bezier(.6,0,.2,1),transform .9s,box-shadow .6s,background .6s;transition-delay:var(--d,0s)}
.wl .chip span{display:block;animation:jit 1.4s ease-in-out infinite;animation-delay:var(--d,0s)}
.wl.p1 .chip{left:var(--sx);top:var(--sy);transform:translate(-50%,-50%);box-shadow:none;background:#F6F3FF}
.wl.p1 .chip span{animation:none}
.wl .gi{position:absolute;left:var(--sx);top:var(--sy);transform:translate(-50%,-50%) scale(0);width:13cqw;height:13cqw;border-radius:50%;background:var(--c);display:grid;place-items:center;font-size:7cqw;transition:transform .45s cubic-bezier(.2,.9,.3,1.4);transition-delay:var(--d,0s)}
.wl.p2 .gi{transform:translate(-50%,-50%) scale(1)}
.wl .ck{position:absolute;left:var(--sx);top:var(--sy);transform:translate(-50%,-50%) scale(0);width:7cqw;height:7cqw;border-radius:50%;background:#5B2FD6;display:grid;place-items:center;transition:transform .4s cubic-bezier(.2,.9,.3,1.5);transition-delay:var(--d,0s)}
.wl .ck::after{content:"";width:2.8cqw;height:1.5cqw;border-left:.8cqw solid #fff;border-bottom:.8cqw solid #fff;transform:translateY(-.3cqw) rotate(-45deg)}
.wl.p3 .ck{transform:translate(-50%,-50%) scale(1)}
.wl .spark{position:absolute;right:8%;top:8%;font-size:8cqw;opacity:0;transform:scale(.4) rotate(-30deg);transition:all .5s cubic-bezier(.2,.9,.3,1.4)}
.wl.p3 .spark{opacity:1;transform:none}

.wl2 .sky{position:absolute;inset:0;background:linear-gradient(#FFF6E0,#F3EFFB);transition:opacity 1s}
.wl2 .skyn{position:absolute;inset:0;background:linear-gradient(#0F1233,#2B1E63);opacity:0;transition:opacity 1s}
.wl2.p2 .skyn{opacity:1}
.wl2.p3 .skyn{opacity:0}
.wl2 .orb{position:absolute;font-size:12cqw;left:74%;top:10%;transition:transform 1s cubic-bezier(.5,0,.2,1),opacity .8s}
.wl2 .sun{transform:translateY(0)}
.wl2.p2 .sun{transform:translateY(-160%);opacity:0}
.wl2.p3 .sun{transform:none;opacity:1}
.wl2 .moon{transform:translateY(-160%);opacity:0}
.wl2.p2 .moon{transform:none;opacity:1}
.wl2.p3 .moon{transform:translateY(-160%);opacity:0}
.wl2 .stars{position:absolute;inset:0 0 50% 0;opacity:0;transition:opacity 1s;background-image:radial-gradient(#fff 1px,transparent 1.4px),radial-gradient(rgba(255,255,255,.7) 1px,transparent 1.4px);background-size:17cqw 13cqw,11cqw 19cqw;background-position:3cqw 4cqw,9cqw 2cqw}
.wl2.p2 .stars{opacity:1}.wl2.p3 .stars{opacity:0}
.wl2 .col{position:absolute;inset:26cqw 8cqw 8cqw;display:flex;flex-direction:column;gap:4cqw;transition:opacity .5s}
.wl2.p2 .col{opacity:.18}.wl2.p3 .col{opacity:1}
.wl2 .bb{position:relative;font-size:9cqw;padding:2.4cqw 4.4cqw;border-radius:5cqw;background:#fff;box-shadow:0 1.4cqw 3cqw -1.4cqw rgba(60,30,140,.4);letter-spacing:1cqw;line-height:1.2}
.wl2 .bb.me{align-self:flex-start;background:#E3D9FF;border-end-start-radius:1.4cqw}
.wl2 .bb.her{align-self:flex-end;border-end-end-radius:1.4cqw}
.wl2 .bb.her.on{animation:pop .38s cubic-bezier(.2,.9,.3,1.25) both,shake .5s .45s 2}
.wl2 .bb.sm{font-size:7cqw}
.wl2 .brx{position:absolute;right:-3cqw;bottom:-4.5cqw;width:10cqw;height:10cqw;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:5.6cqw;letter-spacing:0;box-shadow:0 1cqw 2.4cqw rgba(0,0,0,.2)}
.wl2 .brx.on{display:grid;animation:rx .5s cubic-bezier(.2,.9,.3,1.3) both}
.wl2 .face{position:absolute;left:50%;top:52%;width:44cqw;height:44cqw;margin:-22cqw 0 0 -22cqw;border-radius:50%;background:#fff;border:1.4cqw solid #FFD98A;opacity:0;transform:scale(.7);transition:opacity .5s,transform .6s cubic-bezier(.2,.9,.3,1.2)}
.wl2.p2 .face{opacity:1;transform:none}
.wl2.p3 .face{opacity:0;transform:scale(.7)}
.wl2 .face i{position:absolute;left:50%;bottom:50%;transform-origin:50% 100%;background:#1B1140;border-radius:1cqw}
.wl2 .face .hh{width:2cqw;height:11cqw;margin-left:-1cqw;transform:rotate(320deg);transition:transform 2.2s cubic-bezier(.6,0,.3,1)}
.wl2 .face .mh{width:1.2cqw;height:16cqw;margin-left:-.6cqw;transform:rotate(240deg);transition:transform 2.2s cubic-bezier(.6,0,.3,1)}
.wl2 .face::after{content:"";position:absolute;left:50%;top:50%;width:3.6cqw;height:3.6cqw;margin:-1.8cqw;border-radius:50%;background:#5B2FD6}
.wl2.p2 .face .hh{transform:rotate(960deg)}
.wl2.p2 .face .mh{transform:rotate(2760deg)}


/* ---------- shared bits for script-driven scenes ---------- */
.t.on.pre,.t.on.pre *{animation:none}
.grid{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}

/* A generic: panes, group names, captions */
.wa .pane,.screen .pane{position:absolute;inset:0}
.pane.t.on{animation:paneIn .45s ease both}
@keyframes paneIn{from{opacity:0;transform:scale(1.03)}to{opacity:1;transform:none}}
.b .who{display:block;font:600 3.1cqw Assistant,sans-serif;margin-bottom:.3cqw}
.cap{position:absolute;top:17cqw;left:50%;transform:translateX(-50%);white-space:nowrap;background:#111B21;color:#fff;border-radius:999px;padding:1cqw 3.6cqw;font:600 3.2cqw Rubik,sans-serif;z-index:3;box-shadow:0 1cqw 3cqw rgba(0,0,0,.25)}
.cap.t.on{animation:fade .3s both}
.b .lnk{color:#027EB5;direction:ltr;unicode-bidi:isolate}

/* B generic */
.st .col.g{justify-content:flex-end;gap:2.6cqw}
.st .col.g.t.on{display:flex;animation:fade .35s both}
.st .col.g.t.on.off{display:none}
.st .col.g .you{font-size:4cqw}
.st .col.g .her{width:auto;max-width:90%;font-size:3.7cqw}
.st .col.g .her.wide{width:92%}
.st .col.g .oth{align-self:flex-start;border-end-end-radius:5cqw;border-end-start-radius:1.4cqw}
.st .who{display:block;font:600 3cqw Rubik,sans-serif;opacity:.85;margin-bottom:.6cqw}
.st .her .who{color:#5B2FD6;opacity:1}
.st .her .li{padding-top:.5cqw}
.st .her b,.st .you b{font-weight:700}
.st .bcap{position:absolute;top:4.4cqw;inset-inline-end:6cqw;background:#FFD98A;color:#1D1440;border-radius:999px;padding:.8cqw 3cqw;font:600 3.2cqw Rubik,sans-serif;z-index:3}
.st .bcap.t.on{animation:fade .3s both}
.st .btyp{align-self:flex-start;background:#fff;border-radius:5cqw;padding:3cqw 4cqw;display:none;gap:1.3cqw}
.st .btyp.on{display:flex}.st .btyp.on.off{display:none}
.st .btyp i{width:2cqw;height:2cqw;border-radius:50%;background:#5B2FD6;animation:dots 1.1s infinite}
.st .btyp i:nth-child(2){animation-delay:.15s}.st .btyp i:nth-child(3){animation-delay:.3s}
.st .bchip{align-self:center;font:600 3.4cqw Rubik,sans-serif;background:rgba(255,255,255,.18);border-radius:999px;padding:1cqw 3.4cqw}
.st .lnk{color:#5B2FD6;text-decoration:underline;direction:ltr;unicode-bidi:isolate}

/* D · notebook */
.sk{background:#FFFDF5;background-image:repeating-linear-gradient(to bottom,transparent 0 7.2cqw,#D6E4F5 7.2cqw 7.45cqw);color:#1D1440;font-family:"Playpen Sans Hebrew","Playpen Sans","Comic Sans MS",Assistant,cursive}
.sk::before{content:"";position:absolute;top:0;bottom:0;inset-inline-start:10cqw;width:.35cqw;background:#F2A7A7}
.sk .skcol{position:absolute;inset:14cqw 6cqw 6cqw 14cqw;display:none;flex-direction:column;justify-content:flex-end;gap:3cqw}
.sk[dir="rtl"] .skcol{inset:14cqw 14cqw 6cqw 6cqw}
.sk .skcol.t.on{display:flex;animation:fade .35s both}
.sk .skcol.t.on.off{display:none}
.sk .note{position:relative;align-self:flex-end;max-width:80%;background:#FFE872;padding:3cqw 3.6cqw 3.2cqw;font-size:4cqw;line-height:1.35;box-shadow:0 1.6cqw 2.4cqw -1.4cqw rgba(80,60,0,.45);transform:rotate(var(--r,-2deg))}
.sk .note.t.on{animation:stick .45s cubic-bezier(.2,.9,.3,1.3) both}
@keyframes stick{from{opacity:0;transform:rotate(var(--r,-2deg)) scale(1.25) translateY(-4cqw)}to{opacity:1;transform:rotate(var(--r,-2deg))}}
.sk .note::before{content:"";position:absolute;top:-2.2cqw;left:50%;width:14cqw;height:4.4cqw;margin-left:-7cqw;background:rgba(255,255,255,.55);transform:rotate(3deg)}
.sk .note.oth{align-self:flex-start;background:var(--nc,#FFC4D6)}
.sk .note .who{display:block;font-weight:800;font-size:3.2cqw;opacity:.7}
.sk .ink{align-self:flex-start;max-width:86%;color:#4A22B8;font-size:4cqw;line-height:1.45;padding-inline-start:9cqw;position:relative}
.sk .ink::before{content:attr(data-av);position:absolute;inset-inline-start:0;top:0;width:6.6cqw;height:6.6cqw;border:.5cqw solid #4A22B8;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:3.6cqw}
.sk .ink .who{display:block;font-weight:800;font-size:3.1cqw;opacity:.7}
.sk .ink b{font-weight:800;background:linear-gradient(transparent 55%,#FFE872 55%)}
.sk .ink .li.t.on{display:block;animation:fade .3s both}
.sk .ink.t.on{animation:write .5s ease both}
@keyframes write{from{opacity:0;clip-path:inset(0 0 100% 0)}to{opacity:1;clip-path:inset(0 0 0 0)}}
.sk .stamp{position:absolute;inset-inline-start:-4cqw;bottom:-4cqw;width:11cqw;height:11cqw;border-radius:50%;border:.6cqw solid #D94848;color:#D94848;display:grid;place-items:center;font-size:5.6cqw;background:rgba(255,253,245,.9);transform:rotate(-14deg)}
.sk .stamp.on{display:grid;animation:stamp .35s cubic-bezier(.2,.9,.3,1.4) both}
@keyframes stamp{from{transform:rotate(-14deg) scale(2.4);opacity:0}to{transform:rotate(-14deg) scale(1);opacity:1}}
.sk .tape{align-self:center;background:#CDEBFF;padding:1cqw 5cqw;font-weight:800;font-size:3.6cqw;transform:rotate(-2deg);box-shadow:0 .6cqw 1cqw rgba(0,0,0,.08)}
.sk .skcap{position:absolute;top:4.6cqw;inset-inline-start:14cqw;font-weight:800;font-size:4.4cqw;color:#D94848;z-index:3}
.sk .skcap.t.on{animation:write .5s ease both}
.sk .sktyp{align-self:flex-start;font-size:6cqw;color:#4A22B8;letter-spacing:1cqw;padding-inline-start:9cqw}
.sk .flipper{position:absolute;inset:0;background:#FFFDF5;background-image:repeating-linear-gradient(to bottom,transparent 0 7.2cqw,#D6E4F5 7.2cqw 7.45cqw);z-index:4;box-shadow:-2cqw 0 4cqw rgba(0,0,0,.18);display:none;place-items:center;font-weight:800;font-size:9cqw;color:#D94848}
.sk .flipper.on{display:grid;animation:flip 1.4s cubic-bezier(.6,0,.3,1) both}
.sk .flipper.on.off{display:none}
@keyframes flip{0%{transform:translateX(100%)}30%,70%{transform:none}100%{transform:translateX(-100%)}}
.sk .skend{position:absolute;inset:0;z-index:5;background:#FFFDF5;background-image:repeating-linear-gradient(to bottom,transparent 0 7.2cqw,#D6E4F5 7.2cqw 7.45cqw);display:none;flex-direction:column;justify-content:center;padding:10cqw 12cqw}
.sk .skend.on{display:flex;animation:fade .4s both}
.sk .skend p{margin:0;font-weight:800;font-size:9cqw;line-height:1.2}
.sk .skend p+p span{background:linear-gradient(#FFE872,#FFE872) no-repeat;background-size:0 45%;background-position:0 85%;animation:hl .8s .5s ease forwards}
.sk[dir="rtl"] .skend p+p span{background-position:100% 85%}
@keyframes hl{to{background-size:100% 45%}}
.sk .skend small{margin-top:5cqw;font-size:3.8cqw;color:#4A22B8}
.sk .lnk{text-decoration:underline;direction:ltr;unicode-bidi:isolate}

/* E · phone ad */
.ph{background:#FFD9B8;color:#1D1440}
.ph::before{content:"";position:absolute;width:80cqw;height:80cqw;border-radius:50%;background:radial-gradient(circle,#FF9EC0 0,rgba(255,158,192,0) 65%);top:-30cqw;inset-inline-end:-30cqw}
.ph::after{content:"";position:absolute;width:70cqw;height:70cqw;border-radius:50%;background:radial-gradient(circle,rgba(91,47,214,.35) 0,rgba(91,47,214,0) 65%);bottom:-35cqw;inset-inline-start:-25cqw}
.ph .phone{position:absolute;z-index:1;top:7%;height:86%;width:auto;aspect-ratio:9/18.6;inset-inline-start:7cqw;border-radius:6.5cqw;background:#1D1440;padding:1.3cqw;box-shadow:0 5cqw 8cqw -3cqw rgba(60,20,90,.55);transform:rotate(-5deg);animation:bob 4s ease-in-out infinite}
.ph[dir="ltr"] .phone{transform:rotate(5deg)}
@keyframes bob{0%,100%{translate:0 0}50%{translate:0 -1.2cqw}}
.ph .screen{position:relative;width:100%;height:100%;border-radius:5.4cqw;overflow:hidden;container-type:inline-size}
.ph .copy{position:absolute;z-index:1;inset-inline-end:5cqw;width:40%;top:50%;transform:translateY(-50%);display:grid;gap:2cqw;font-family:Rubik,sans-serif}
.ph .copy p{margin:0;font-weight:800;font-size:6.4cqw;line-height:1.08;letter-spacing:-.01em}
.ph .copy p.hl{color:#5B2FD6}
.ph .copy small{font:600 3.4cqw Assistant,sans-serif;opacity:.75;margin-top:2cqw}
.ph .copy .t.on{animation:kin .45s cubic-bezier(.2,.9,.3,1) both}
.ph .stk{position:absolute;z-index:2;width:15cqw;height:15cqw;border-radius:50%;background:#fff;display:none;place-items:center;font-size:8cqw;box-shadow:0 2cqw 4cqw rgba(60,20,90,.35);top:12%;inset-inline-start:38%}
.ph .stk.on{display:grid;animation:rx .5s cubic-bezier(.2,.9,.3,1.3) both}
.ph .stk.on.off{display:none}


/* E: the tall screen reads top-down, like a phone someone is holding up, with the input bar WhatsApp really has */
.ph .screen .wa-body{justify-content:flex-start;bottom:17cqw;padding-top:6cqw;gap:2.6cqw}
.ph .screen .b{font-size:4.5cqw;max-width:86%}
.ph .screen .b .who{font-size:3.5cqw}
.ph .screen .tm{font-size:2.9cqw}
.ph .screen .cap{top:18cqw}
.ph .screen .pane::after{content:"";position:absolute;left:3cqw;right:17cqw;bottom:4cqw;height:10cqw;border-radius:999px;background:#fff;box-shadow:0 .3cqw .5cqw rgba(0,0,0,.08)}
.ph .screen .pane::before{content:"";position:absolute;right:3cqw;bottom:4cqw;width:10cqw;height:10cqw;border-radius:50%;background:#00A884;z-index:1}
.ph[dir="rtl"] .screen .pane::after{left:17cqw;right:3cqw}
.ph[dir="rtl"] .screen .pane::before{right:auto;left:3cqw}


/* Every chat reads top-down now, and scrolls like a real one once it fills (engine: follow()) */
.wa-body{justify-content:flex-start;overflow:hidden}
.wa-body.hascap{padding-top:11cqw}
.ph .screen .wa-body.hascap{padding-top:13cqw}
.st .col.g{justify-content:flex-start;overflow:hidden;padding-top:2cqw}
.sk .skcol{justify-content:flex-start;overflow:hidden;padding-top:3cqw}
.wa-body>*,.st .col.g>*,.sk .skcol>*{flex:none}

/* A variants: typing bar (A3), opening question (A2), end cards, callout */
.wa-body.hasbar{padding-bottom:17cqw}
.inbar{position:absolute;left:3cqw;right:3cqw;bottom:3cqw;height:11cqw;display:flex;gap:2cqw;align-items:center;z-index:2}
.inbar .field{flex:1;min-width:0;height:100%;background:#fff;border-radius:999px;display:flex;justify-content:flex-start;align-items:center;padding-inline:4cqw;font-size:3.9cqw;color:#111B21;overflow:hidden;white-space:nowrap;box-shadow:0 .3cqw .5cqw rgba(0,0,0,.08)}
.inbar.typing .field{justify-content:flex-end}
.inbar .hint0{color:#8696A0}
.inbar.typing .hint0{display:none}
.inbar .typer{flex:none}
.inbar .typer:empty{display:none}
.inbar .typer::after{content:"";display:inline-block;width:.35cqw;height:4.6cqw;background:#00A884;margin-inline-start:.4cqw;vertical-align:middle;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.inbar .send{width:11cqw;height:11cqw;border-radius:50%;background:#00A884;flex:none;display:grid;place-items:center;color:#fff;font-size:4.6cqw;transition:transform .15s}
.inbar.typing .send{transform:scale(1.08)}
[dir="rtl"] .inbar .send{transform:scaleX(-1)}
[dir="rtl"] .inbar.typing .send{transform:scaleX(-1) scale(1.08)}
.hook{position:absolute;inset:0;z-index:6;background:#5B2FD6;color:#fff;display:none;flex-direction:column;justify-content:center;padding:9cqw;gap:5cqw;font-family:Rubik,sans-serif}
.hook.on{display:flex;animation:fade .3s both}
.hook.on.off{display:none}
.hook p{margin:0;font-weight:800;font-size:9.4cqw;line-height:1.12;text-wrap:balance;animation:kin .5s .15s both}
.hook small,.end2 small{display:flex;align-items:center;gap:2.4cqw;font:600 3.8cqw Assistant,sans-serif;opacity:.9}
.hook small .av,.end2 small .av{width:8cqw;height:8cqw;font-size:4cqw;background:#fff;color:#5B2FD6}
.end2{position:absolute;inset:0;z-index:6;background:#5B2FD6;color:#fff;display:none;flex-direction:column;justify-content:center;padding:9cqw;gap:1.6cqw;font-family:Rubik,sans-serif}
.end2.on{display:flex;animation:paneIn .45s both}
.end2 p{margin:0;font-weight:800;line-height:1.12;text-wrap:balance}
.end2 p+p{color:#FFD98A}
.end2 small{margin-top:5cqw}
.end3{position:absolute;inset:0;z-index:6;display:none;place-items:center;background:rgba(239,234,226,.55);backdrop-filter:blur(1.2cqw);-webkit-backdrop-filter:blur(1.2cqw)}
.end3.on{display:grid;animation:fade .4s both}
.end3 .card{width:80%;background:#fff;border-radius:6cqw;padding:7cqw 7cqw 6cqw;box-shadow:0 4cqw 8cqw -3cqw rgba(40,20,90,.45);display:grid;gap:1.4cqw;font-family:Rubik,sans-serif;animation:pop .45s .1s both}
.end3 .card p{margin:0;font-weight:800;line-height:1.12;color:#141322;text-wrap:balance}
.end3 .card p+p{color:#5B2FD6}
.end3 .card small{margin-top:3cqw;font:500 3.4cqw Assistant,sans-serif;color:#667781;display:flex;gap:2cqw;align-items:center}
.end3 .card small .av{width:7cqw;height:7cqw;font-size:3.6cqw}
.wa .end p{text-wrap:balance}
.call{position:absolute;left:50%;bottom:19cqw;transform:translateX(-50%);z-index:5;background:#111B21;color:#fff;border-radius:999px;padding:1.8cqw 4.4cqw;font:600 3.8cqw Rubik,sans-serif;white-space:nowrap;box-shadow:0 1.6cqw 4cqw rgba(0,0,0,.3)}
.call.t.on{animation:callIn .45s cubic-bezier(.2,.9,.3,1.3) both}
.call.t.on.off{display:none}
@keyframes callIn{from{opacity:0;transform:translate(-50%,3cqw) scale(.9)}to{opacity:1;transform:translate(-50%,0)}}

/* Moving between chats is a push/pop slide, the way a phone moves between screens */
.wa .pane{background:inherit;will-change:transform}
.wa .pane.push.t.on{animation:none;box-shadow:0 0 6cqw rgba(0,0,0,.25)}
.wa .pane.t.on.off{display:block;animation:none}
.stage.wa.tr-cube{perspective:240cqw}
@keyframes paneEnter{
  from{transform:translate(var(--fx,0),var(--fy,0)) scale(var(--fs,1)) rotateY(var(--fr,0deg));opacity:var(--fo,1);filter:brightness(var(--fb,1));border-radius:var(--frad,0);transform-origin:var(--forg,50% 50%)}
  to{transform:none;opacity:1;filter:none;border-radius:0;transform-origin:var(--forg,50% 50%)}}
@keyframes paneLeave{
  from{transform-origin:var(--torg,50% 50%)}
  to{transform:translate(var(--tx,0),var(--ty,0)) scale(var(--ts,1)) rotateY(var(--tr,0deg));opacity:var(--to,1);filter:brightness(var(--tb,1));transform-origin:var(--torg,50% 50%)}}
.finger{position:absolute;top:58%;width:13cqw;height:13cqw;margin:-6.5cqw;border-radius:50%;background:rgba(255,255,255,.55);border:.6cqw solid rgba(17,27,33,.35);box-shadow:0 1cqw 3cqw rgba(0,0,0,.25);z-index:5}
.finger.on{display:block;animation:swipe .8s cubic-bezier(.4,0,.2,1) both}
.finger.on.off{display:none}
@keyframes swipe{0%{left:var(--x1);opacity:0;transform:scale(.7)}15%{opacity:1;transform:scale(1)}85%{opacity:1}100%{left:var(--x2);opacity:0;transform:scale(.9)}}
.wa .pane.t.on.off .t.on{animation:none}
@keyframes pushIn{from{transform:translateX(var(--fromX))}to{transform:none}}
@keyframes pushOut{to{transform:translateX(var(--toX));filter:brightness(.82)}}

/* F · kinetic captions */
.kf{background:#FAFAFC;color:#141322;font-family:Rubik,sans-serif}
.kf .kc{position:absolute;inset:0;display:none;flex-direction:column;justify-content:center;gap:2.4cqw;padding:10cqw 9cqw}
.kf .kc.t.on{display:flex;animation:kin .35s cubic-bezier(.2,.9,.3,1) both}
.kf .kc.t.on.off{display:none}
@keyframes kin{from{opacity:0;transform:translateY(7cqw) skewY(2deg)}to{opacity:1;transform:none}}
.kf .kc .tag{display:flex;align-items:center;gap:2cqw;font:600 3.4cqw Assistant,sans-serif;opacity:.6}
.kf .kc .tag i{width:5cqw;height:5cqw;border-radius:50%;background:#C9C6D6;display:grid;place-items:center;font:700 2.8cqw Rubik,sans-serif;font-style:normal;color:#fff}
.kf .kc .txt{font-weight:800;line-height:1.12;letter-spacing:-.01em;text-wrap:balance}
.kf .kc.her{background:#5B2FD6;color:#fff}
.kf .kc.her .tag{opacity:.85}
.kf .kc.her .tag i{background:#FFD98A;color:#5B2FD6}
.kf .kc.her b{color:#FFD98A}
.kf .kc .li{font-weight:600;line-height:1.25}
.kf .kc .li.t.on{display:block;animation:kin .3s cubic-bezier(.2,.9,.3,1) both}
.kf .kc.lab{align-items:center;text-align:center}
.kf .kc.lab .txt{font-size:9cqw;color:#5B2FD6}
.kf .kc.clk{background:#141322;color:#fff;align-items:center}
.kf .kc.clk span{position:absolute;font-weight:800;font-size:24cqw;font-variant-numeric:tabular-nums}
.kf .kc.clk span.t.on{animation:kin .4s both}
.kf .kc.clk span.b2{color:#FFD98A}
.kf .kc.clk em{position:absolute;top:18%;font:600 4cqw Assistant,sans-serif;font-style:normal;opacity:.7}
.kf .kstamp{position:absolute;inset-inline-end:8cqw;bottom:10cqw;font-size:18cqw;line-height:1}
.kf .kstamp.on{display:block;animation:kstamp .45s cubic-bezier(.2,.9,.3,1.5) both}
@keyframes kstamp{from{transform:scale(3) rotate(-25deg);opacity:0}to{transform:rotate(-10deg);opacity:1}}
.kf .kcap{position:absolute;top:4cqw;inset-inline-start:9cqw;z-index:3;background:#FFD98A;color:#1D1440;border-radius:999px;padding:.8cqw 3cqw;font:600 3.2cqw Rubik,sans-serif}
.kf .kcap.t.on{animation:fade .3s both}
.kf .kc.end{background:#141322;color:#fff}
.kf .kc.end .txt{font-size:10cqw}
.kf .kc.end .txt+.txt{color:#B69CFF}
.kf .kc.end small{font:500 3.8cqw Assistant,sans-serif;opacity:.7;margin-top:4cqw}
.kf .dots{display:flex;gap:3cqw}.kf .dots i{width:5cqw;height:5cqw;border-radius:50%;background:#5B2FD6;animation:dots 1.1s infinite}
.kf .dots i:nth-child(2){animation-delay:.15s}.kf .dots i:nth-child(3){animation-delay:.3s}
.kf .lnk{text-decoration:underline;direction:ltr;unicode-bidi:isolate;font-size:.8em}

/* C · wordless, videos 4–6 */
.wx{background:#F3EFFB}
.wx .av2{position:absolute;left:var(--x);top:var(--y);transform:translate(-50%,-50%);width:17cqw;height:17cqw;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:9.5cqw;box-shadow:0 1.6cqw 3cqw -1.2cqw rgba(60,30,140,.35);transition:transform .4s cubic-bezier(.2,.9,.3,1.4)}
.wx .av2.olma{background:#5B2FD6;color:#FFD98A;font-size:8cqw;width:19cqw;height:19cqw}
.wx .av2.olma::after{content:"";position:absolute;inset:-2cqw;border-radius:50%;border:.6cqw solid rgba(91,47,214,.35);animation:ring 2s ease-out infinite}
.wx .bub{position:absolute;left:var(--x);top:var(--y);transform:translate(-50%,-100%);background:#fff;border-radius:4cqw;padding:1.6cqw 3cqw;font-size:6.4cqw;white-space:nowrap;box-shadow:0 1.4cqw 3cqw -1.4cqw rgba(60,30,140,.45);letter-spacing:.6cqw}
.wx .bub.on{display:block;animation:bubIn .38s cubic-bezier(.2,.9,.3,1.3) both}
.wx .bub.on.off{display:none}
@keyframes bubIn{from{opacity:0;transform:translate(-50%,-80%) scale(.8)}to{opacity:1;transform:translate(-50%,-100%)}}
.wx .bub.me{background:#E3D9FF}
.wx .bub .op{display:inline-block;padding:.4cqw 1.6cqw;border-radius:2.4cqw;background:#F3EFFB;transition:background .3s,box-shadow .3s}
.wx.pick .bub .op.win{background:#FFD98A;box-shadow:0 0 0 .6cqw #5B2FD6}
.wx .fly{position:absolute;top:var(--y);width:4.6cqw;height:4.6cqw;margin:-2.3cqw;border-radius:50%;background:#5B2FD6}
.wx .fly.on{display:block;animation:fly .7s cubic-bezier(.6,0,.4,1) both}
.wx .fly.on.off{display:none}
@keyframes fly{from{left:var(--x1);opacity:1}to{left:var(--x2);opacity:.2}}
.wx .cal{position:absolute;left:50%;top:80%;transform:translate(-50%,-50%);width:36cqw;background:#fff;border-radius:3.4cqw;overflow:hidden;box-shadow:0 2cqw 4cqw -1.4cqw rgba(60,30,140,.45);text-align:center}
.wx .cal.on{display:block;animation:drop2 .5s cubic-bezier(.2,.9,.3,1.3) both}
@keyframes drop2{from{opacity:0;transform:translate(-50%,-120%)}to{opacity:1;transform:translate(-50%,-50%)}}
.wx .cal i{display:block;background:#E5484D;height:5cqw}
.wx .cal span{display:block;font-size:7.4cqw;padding:1.6cqw 0 2cqw;letter-spacing:.6cqw}
.wx .room{position:absolute;left:12%;top:12%;width:76%;height:76%;border-radius:50%;border:.6cqw dashed #C9BDF0}
.wx svg.lines{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.wx svg.lines line{stroke:#5B2FD6;stroke-width:.7;stroke-dasharray:2 1.6;opacity:0;transition:opacity .4s}
.wx.p1 svg.lines line{opacity:.7;animation:march 1s linear infinite}
.wx.p3 svg.lines line{opacity:0}
@keyframes march{to{stroke-dashoffset:-7.2}}
.wx .conf{position:absolute;left:var(--x);top:var(--y);font-size:7cqw;transform:translate(-50%,-50%) scale(0);transition:transform .45s cubic-bezier(.2,.9,.3,1.5);transition-delay:var(--d,0s)}
.wx.p3 .conf{transform:translate(-50%,-50%) scale(1)}
.wx.p3 .av2:not(.olma){transform:translate(-50%,-50%) scale(1.08)}
.wx6{transition:background 1.2s}
.wx6 .dawn{position:absolute;inset:0;background:linear-gradient(#141238,#3B2A7A);transition:opacity 1.6s}
.wx6.p1 .dawn{opacity:0}
.wx6 .sky6{position:absolute;inset:0;background:linear-gradient(#FFE3B3,#F3EFFB 70%)}
.wx6 .sun6{position:absolute;left:50%;top:100%;transform:translate(-50%,0);font-size:22cqw;transition:top 1.8s cubic-bezier(.3,0,.2,1)}
.wx6.p1 .sun6{top:-2%}
.wx6 .card6{position:absolute;left:18%;top:20%;width:64%;background:#fff;border-radius:5cqw;padding:3cqw 4cqw;box-shadow:0 3cqw 6cqw -3cqw rgba(60,30,140,.45);display:grid;gap:1.4cqw}
.wx6 .card6.on{display:grid;animation:drop2b .5s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes drop2b{from{opacity:0;transform:translateY(-6cqw)}to{opacity:1;transform:none}}

        { t: 7000, from: 'her', who: s.name, color: '#5B2FD6', html: s.g3, time: '19:40' },
        { t: 8400, from: 'her', who: s.name, color: '#5B2FD6', html: s.g4, time: '20:15' } ] } ] };

    return { dur: 10500, endAt: 7200, end: [...s.mEnd, s.mSub], panes: [{ t: 0, beats: [

/* ---------------- renderers ---------------- */
const endSize = (sc, big) => { const n = Math.max(sc.end[0].length, sc.end[1].length); return n > 16 ? big * .74 : n > 12 ? big * .86 : big; };
const outOf = (arr, i) => arr[i + 1] ? ` data-out="${arr[i + 1].t}"` : '';
const lineHtml = (b, cls = 'li') => (b.lines || []).map(l => `<div class="${cls} t${b.pre ? ' pre' : ''}" data-in="${l.t}">${fmt(l.html)}</div>`).join('');
const preC = b => b.pre ? ' pre' : '';

// A · WhatsApp (also the screen inside E)
// How a new chat arrives (in / backIn) and how the one under it leaves (out / backOut).
// n = the "forward" direction on screen: -1 in Hebrew (new screens come from the left), 1 in English.
const TRANSITIONS = {
  push:     n => ({ in: { fx: `${100 * n}%` }, out: { tx: `${-30 * n}%`, tb: .82 }, backIn: { fx: `${-30 * n}%`, fb: .82 }, backOut: { tx: `${100 * n}%`, z: 3 } }),
  carousel: n => ({ in: { fx: `${100 * n}%` }, out: { tx: `${-100 * n}%` }, backIn: { fx: `${-100 * n}%` }, backOut: { tx: `${100 * n}%` } }),
  sheet:    n => ({ in: { fy: '100%', frad: '6cqw' }, out: { ts: .9, tb: .6 }, backIn: { fs: .9, fb: .6 }, backOut: { ty: '100%', z: 3 } }),
  zoom:     n => ({ in: { fs: .82, fo: 0 }, out: { ts: 1.12, to: 0 }, backIn: { fs: 1.12, fo: 0 }, backOut: { ts: .82, to: 0, z: 3 } }),
  cube:     n => { const a = n > 0 ? 'left' : 'right', b = n > 0 ? 'right' : 'left';
    return { in: { fx: `${100 * n}%`, fr: `${90 * n}deg`, forg: `${a} center` }, out: { tx: `${-100 * n}%`, tr: `${-90 * n}deg`, torg: `${b} center` },
             backIn: { fx: `${-100 * n}%`, fr: `${-90 * n}deg`, forg: `${b} center` }, backOut: { tx: `${100 * n}%`, tr: `${90 * n}deg`, torg: `${a} center` } }; },
  finger:   n => TRANSITIONS.push(n)
};
const cssVars = o => Object.entries(o || {}).map(([k, v]) => `--${k}:${v};`).join('');
function waPanes(sc, s, opt = {}){
  return sc.panes.map((p, i, arr) => {
    const body = p.beats.map(b => {
      if (b.typing) return `<div class="typing t" data-in="${b.t}" data-out="${b.out}"><i></i><i></i><i></i></div>`;
      if (b.chip) return `<div class="daychip t" data-in="${b.t}">${b.chip}</div>`;
      const who = p.group && b.from !== 'me' ? `<span class="who" style="color:${b.color}">${b.who}</span>` : '';
      const rx = b.rx ? `<span class="rx t${preC(b)}" data-in="${b.rx.t}">${b.rx.e}</span>` : '';
      return `<div class="b ${b.from === 'me' ? 'out' : 'in'} t${preC(b)}" data-in="${b.t}"${b.rx ? ' style="margin-bottom:3cqw"' : ''}>${who}${fmt(b.html)}${lineHtml(b)}<span class="tm">${b.time}${b.from === 'me' ? ' <i>✓✓</i>' : ''}</span>${rx}</div>`;
    }).join('');
    const head = p.group ? `<div class="av" style="background:#E8E1FF;color:#5B2FD6">🍝</div><div><b>${s.g}</b><small>${s.gMembers}</small></div>`
                         : `<div class="av">${s.av}</div><div><b>${s.name}</b><small>${s.online}</small></div>`;
    const n = s.dir === 'rtl' ? -1 : 1, next = arr[i + 1], T = TRANSITIONS[opt.tr || 'push'](n);
    const enter = i === 0 ? '' : ` data-enter='${JSON.stringify(p.back ? T.backIn : T.in)}'`;
    const leave = next ? ` data-leave='${JSON.stringify(next.back ? T.backOut : T.out)}'` : '';
    return `<div class="pane t${i ? ' push' : ''}"${enter}${leave} data-in="${p.t}"${outOf(arr, i)}><div class="wa-top">${head}</div><div class="wa-body${p.caption ? ' hascap' : ''}${opt.typers ? ' hasbar' : ''}">${body}</div>${opt.typers ? inbar(opt.typers.filter(x => x.pane === i), s) : ''}${p.caption ? `<div class="cap t" data-in="${p.t}">${p.caption}</div>` : ''}</div>`;
  }).join('') + (opt.tr === 'finger' ? sc.panes.slice(1).map(p => {
    const n = (s.dir === 'rtl' ? -1 : 1) * (p.back ? -1 : 1);
    return `<div class="finger t" style="--x1:${50 + 38 * n}%;--x2:${50 - 38 * n}%" data-in="${p.t - 350}" data-out="${p.t + 450}"></div>`;
  }).join('') : '') + (sc.jump ? `<div class="flash t" data-in="${sc.jump.t}" data-out="${sc.jump.t + 1300}"></div>` : '');
}
function inbar(ts, s){
  return `<div class="inbar"><div class="field"><span class="hint0">${s.typeHint}</span>${ts.map(x => `<span class="typer" data-start="${x.start}" data-end="${x.end}" data-text="${x.text.replace(/"/g, '&quot;')}"></span>`).join('')}</div><span class="send">➤</span></div>`;
}
const endFs = (lines, table) => { const n = Math.max(...lines.map(l => l.length)); return (table.find(([m]) => n <= m) || table[table.length - 1])[1]; };
function rA(sc, s, opt = {}){
  const brand = `<small><span class="av">${s.av}</span>${sc.end[2]}</small>`;
  const e = sc.end.slice(0, 2);
  if (opt.variant === 2 || opt.variant === 3) {
    const fs = endFs(e, [[14, 9.4], [20, 8], [28, 6.8], [99, 6]]);
    const lines = e.map(l => `<p style="font-size:${fs}cqw">${l}</p>`).join('');
    const hook = opt.hook ? `<div class="hook t" data-in="0" data-out="${opt.hookOut}"><p>${fmt(opt.hook)}</p><small><span class="av">${s.av}</span>${s.brand}</small></div>` : '';
    const call = opt.call ? `<div class="call t" data-in="${opt.call.t}" data-out="${opt.call.t + 2300}">${opt.call.text}</div>` : '';
    const end = opt.variant === 2 ? `<div class="end2 t" data-in="${sc.endAt}">${lines}${brand}</div>`
                                  : `<div class="end3 t" data-in="${sc.endAt}"><div class="card">${lines}<small><span class="av">${s.av}</span>${sc.end[2]}</small></div></div>`;
    return `<div class="stage wa${opt.tr ? ' tr-' + opt.tr : ''}" dir="${s.dir}" data-dur="${sc.dur}">${waPanes(sc, s, opt)}${call}${hook}${end}</div>`;
  }
  return rA1(sc, s);
}
function rA1(sc, s){

    <div class="end t" data-in="${sc.endAt}"><p style="font-size:${endSize(sc, 6.6)}cqw">${sc.end[0]}</p><p style="font-size:${endSize(sc, 6.6)}cqw">${sc.end[1]}</p><small>${sc.end[2]}</small></div></div>`;

// B · studio
function rB(sc, s){
  let notif = '';

      if (b.chip) return sc.jump ? '' : `<div class="bchip t" data-in="${b.t}">${b.chip}</div>`;
      if (b.notif) { notif = `<div class="notif t" data-in="${b.t}"><div class="av">${s.av}</div><div><b>${s.name}</b><p>${fmt(b.html)}</p></div></div>`; return ''; }
      const who = p.group && b.who ? `<span class="who">${b.who}</span>` : '';
      if (b.from === 'her') return `<div class="her t${b.lines ? ' wide' : ''}${preC(b)}" data-in="${b.t}">${who}${fmt(b.html)}${lineHtml(b)}</div>`;
      const rx = b.rx ? `<span class="big-rx t${preC(b)}" data-in="${b.rx.t}">${b.rx.e}</span>` : '';
      return `<div class="you${b.from === 'other' ? ' oth' : ''} t${preC(b)}" data-in="${b.t}">${who}${fmt(b.html)}${rx}</div>`;

  }).join('');
  const j = sc.jump;
  const steps = j ? `${j.t}:night ${j.t + 1200}:morning ${j.t + 2200}:day` : '';
  return `<div class="stage st" dir="${s.dir}" data-dur="${sc.dur}" data-steps="${steps}"><div class="mark"><i></i>${s.name}</div>${cols}
    ${j ? `<div class="clk"><span class="d1">${j.from}</span><span class="d2">${j.to}</span></div>` : ''}${notif}
    <div class="end t" data-in="${sc.endAt}" style="--es:${endSize(sc, 10.5)}cqw"><p style="font-size:var(--es)">${sc.end[0]}</p><p style="font-size:var(--es)">${sc.end[1]}</p><small><i></i>${sc.end[2]}</small></div></div>`;
}

function rD(sc, s){
  const tilts = ['-2.5deg', '1.8deg', '-1.2deg', '2.4deg'];
  let k = 0;
  const cols = sc.panes.map((p, i, arr) => {
    const body = p.beats.map(b => {

      const who = p.group && b.who ? `<span class="who">${b.who}</span>` : '';

      const rx = b.rx ? `<span class="stamp t${preC(b)}" data-in="${b.rx.t}">${b.rx.e}</span>` : '';

// F · kinetic captions
function rF(sc, s){
  const size = h => { const n = h.replace(/<[^>]+>|\*/g, '').length; return n < 22 ? 10 : n < 45 ? 7.6 : n < 90 ? 5.8 : 4.8; };
  const cards = [];
  sc.panes.forEach(p => p.beats.forEach(b => {
    if (b.pre) return;
    if (b.typing) { cards.push({ t: b.t, html: `<div class="kc her t" data-in="${b.t}"%OUT%><div class="dots" style="--c:#fff"><i style="background:#FFD98A"></i><i style="background:#FFD98A"></i><i style="background:#FFD98A"></i></div></div>` }); return; }
    if (b.chip) { if (!sc.jump) cards.push({ t: b.t, html: `<div class="kc lab t" data-in="${b.t}"%OUT%><div class="txt">${b.chip}</div></div>` }); return; }
    const her = b.from === 'her';
    const tag = her ? `<div class="tag"><i>${s.av}</i>${p.group ? s.name : s.name}</div>` : `<div class="tag"><i>${b.from === 'other' ? b.who[0] : '✎'}</i>${b.from === 'other' ? b.who : ''}</div>`;
    const lines = b.lines ? `<div style="display:grid;gap:1cqw;font-size:4.6cqw">${lineHtml(b)}</div>` : '';
    const rx = b.rx ? `<span class="kstamp t" data-in="${b.rx.t}">${b.rx.e}</span>` : '';
    cards.push({ t: b.t, html: `<div class="kc ${her ? 'her' : 'me'} t" data-in="${b.t}"%OUT%>${tag}<div class="txt" style="font-size:${b.lines ? 6.4 : size(b.html)}cqw">${fmt(b.html)}</div>${lines}${rx}</div>` });
  }));
  if (sc.jump) { const j = sc.jump; cards.push({ t: j.t, html: `<div class="kc clk t" data-in="${j.t}"%OUT%><em>${j.label}</em><span class="t" data-in="${j.t}" data-out="${j.t + 1100}">${j.from}</span><span class="b2 t" data-in="${j.t + 1100}">${j.to}</span></div>` }); }
  cards.sort((a, b) => a.t - b.t);
  const caps = sc.panes.map((p, i, arr) => p.caption ? `<div class="kcap t" data-in="${p.t}"${outOf(arr, i)}>${p.caption}</div>` : '').join('');
  const html = cards.map((c, i) => c.html.replace('%OUT%', cards[i + 1] ? ` data-out="${cards[i + 1].t}"` : ` data-out="${sc.endAt}"`)).join('');
  return `<div class="stage kf" dir="${s.dir}" data-dur="${sc.dur}">${html}${caps}
    <div class="kc end t" data-in="${sc.endAt}"><div class="txt" style="font-size:${endSize(sc, 10)}cqw">${sc.end[0]}</div><div class="txt" style="font-size:${endSize(sc, 10)}cqw">${sc.end[1]}</div><small>${sc.end[2]}</small></div></div>`;
}

function shiftAll(sc, from, d){
  const f = t => t >= from ? t + d : t;
  sc.panes.forEach(p => { if (p.t >= from && !(from === 0 && p.t === 0 && d < 0)) p.t = f(p.t);
    p.beats.forEach(b => { b.t = f(b.t); if (b.out) b.out = f(b.out); if (b.rx) b.rx.t = f(b.rx.t); if (b.lines) b.lines.forEach(l => { l.t = f(l.t); }); }); });
  if (sc.jump) sc.jump.t = f(sc.jump.t);
  sc.endAt = f(sc.endAt); sc.dur += d;
}
const plain = h => h.replace(/<[^>]+>|\*/g, '');
function callTime(id, sc){
  const all = sc.panes.flatMap(p => p.beats).filter(b => !b.pre);
  if (id === 'v3' || id === 'v6') { const b = all.find(x => x.rx); return b.rx.t + 300; }
  if (id === 'v2') { const b = all.find(x => x.lines); return b.lines[b.lines.length - 1].t + 500; }
  const p = sc.panes[1]; return p.beats[p.beats.length - 1].t + 500;
}
function variantA(id, s, n, tr){
  const sc = SCRIPTS[id](s), V = s.V[id];
  if (n === 1) { sc.end = V.a1; return rA1(sc, s); }
  if (n === 2) {
    const HOOK = 2400; shiftAll(sc, 0, HOOK); sc.end = V.a2.end;
    return rA(sc, s, { variant: 2, hook: V.a2.hook, hookOut: HOOK, tr });
  }
  const typers = [];
  sc.panes.forEach((p, pi) => p.beats.forEach(b => { if (b.from === 'me' && !b.pre) typers.push({ b, pi }); }));
  typers.sort((x, y) => x.b.t - y.b.t);
  const segs = typers.map(({ b, pi }) => {
    const text = plain(b.html), dt = Math.min(1900, 450 + [...text].length * 24), start = b.t;
    shiftAll(sc, start, dt);
    return { pane: pi, start, end: b.t, text };
  });
  sc.end = V.a3.end;
  return rA(sc, s, { variant: 3, typers: segs, call: { t: callTime(id, sc), text: V.a3.call } });
}

/* ---------------- engine ---------------- */
const timers = new WeakMap();
const visible = new WeakSet();
function stop(stage){ (timers.get(stage) || []).forEach(clearTimeout); timers.set(stage, []); }
const SCROLLERS = '.wa-body,.col.g,.skcol';
// Screen-to-screen slides are computed per frame (rAF), not CSS keyframes: the frame-stepped
// renderer that makes the GIFs does not advance compositor animations, and this is exact in both.
const TWEEN_MS = 550;
const num = v => [parseFloat(v), String(v).replace(/^[-\d.]+/, '')];
function tween(el, spec, entering){
  const stage = el.closest('.stage'), gen = stage._gen, t0 = performance.now();
  const g = (k, d) => spec[k] === undefined ? d : spec[k];
  const [fx, ux] = num(g(entering ? 'fx' : 'tx', 0)), [fy, uy] = num(g(entering ? 'fy' : 'ty', 0));
  const sc = g(entering ? 'fs' : 'ts', 1), rot = parseFloat(g(entering ? 'fr' : 'tr', 0)), op = g(entering ? 'fo' : 'to', 1), br = g(entering ? 'fb' : 'tb', 1);
  const rad = parseFloat(g('frad', 0)), org = g(entering ? 'forg' : 'torg', '50% 50%');
  el.style.transformOrigin = org; if (spec.z) el.style.zIndex = spec.z;
  const paint = k => { // k = how far from the resting position: 1 at the far end, 0 at rest
    el.style.transform = `translate(${fx * k}${ux || '%'}, ${fy * k}${uy || '%'}) scale(${1 + (sc - 1) * k}) rotateY(${rot * k}deg)`;
    el.style.opacity = 1 + (op - 1) * k; el.style.filter = `brightness(${1 + (br - 1) * k})`;
    if (entering && rad) el.style.borderRadius = `${rad * k}cqw`;
  };
  const step = () => {
    if (stage._gen !== gen) return;
    // performance.now(), not the rAF timestamp: under the renderer's virtual clock the two differ
    const p = Math.max(0, Math.min(1, (performance.now() - t0) / TWEEN_MS)), e = 1 - Math.pow(1 - p, 3);
    paint(entering ? 1 - e : e);
    if (p < 1) requestAnimationFrame(step);
  };
  paint(entering ? 1 : 0); requestAnimationFrame(step);
}
function follow(e){
  const box = e.closest(SCROLLERS);
  if (box) requestAnimationFrame(() => box.scrollTo({ top: box.scrollHeight, behavior: 'smooth' }));
}
function run(stage){
  stop(stage);
  const list = [];
  const steps = (stage.dataset.steps || '').split(/\s+/).filter(Boolean).map(x => x.split(':'));
  stage.classList.add('reset');
  steps.forEach(([, c]) => stage.classList.remove(c));
  stage.querySelectorAll('.t').forEach(e => e.classList.remove('on', 'off'));
  stage._gen = (stage._gen || 0) + 1;
  stage.querySelectorAll('.pane').forEach(p => { p.style.transform = p.style.opacity = p.style.filter = p.style.zIndex = p.style.borderRadius = p.style.transformOrigin = ''; });
  stage.querySelectorAll(SCROLLERS).forEach(b => { b.scrollTop = 0; });
  stage.querySelectorAll('.typer').forEach(el => { el.textContent = ''; el.closest('.inbar').classList.remove('typing'); });
  void stage.offsetWidth;
  stage.classList.remove('reset');
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) { steps.forEach(([, c]) => stage.classList.add(c)); return; }
  stage.querySelectorAll('.typer').forEach(el => {
    const bar = el.closest('.inbar'), chars = [...el.dataset.text], a = +el.dataset.start, b = +el.dataset.end;
    const step = Math.max(18, (b - a - 250) / chars.length);
    list.push(setTimeout(() => bar.classList.add('typing'), a));
    chars.forEach((c, i) => list.push(setTimeout(() => { el.textContent += c; }, a + i * step)));
    list.push(setTimeout(() => { el.textContent = ''; bar.classList.remove('typing'); }, b));
  });
  stage.querySelectorAll('.t').forEach(e => {
    list.push(setTimeout(() => { e.classList.add('on'); follow(e); if (e.dataset.enter) tween(e, JSON.parse(e.dataset.enter), true); }, +e.dataset.in || 0));
    if (e.dataset.out) list.push(setTimeout(() => { e.classList.add('off'); if (e.dataset.leave) tween(e, JSON.parse(e.dataset.leave), false); }, +e.dataset.out));
  });
  steps.forEach(([ms, c]) => list.push(setTimeout(() => stage.classList.add(c), +ms)));
  list.push(setTimeout(() => visible.has(stage) ? run(stage) : stop(stage), +stage.dataset.dur || 10000));
  timers.set(stage, list);
}
const io = 'IntersectionObserver' in window ? new IntersectionObserver(entries => entries.forEach(en => {
  if (en.isIntersecting) { if (!visible.has(en.target)) { visible.add(en.target); run(en.target); } }
  else { visible.delete(en.target); }
}), { threshold: .25 }) : null;

  const trFigs = TR_CHOICES.map(([tr, name, note]) => `<figure>${skin(variantA('v5', s, 2, tr), 'v5')}<figcaption><div class="row"><b>${name}</b><button class="replay" type="button">↻ מההתחלה</button></div><span>${note}</span></figcaption></figure>`).join('');

  root.querySelectorAll('figure').forEach(f => {

    f.querySelector('.replay').addEventListener('click', () => run(st));

  });
}
